e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n\n---\n**GABARITO (não olhe antes)**\n\n1. was\n2. was written\n3. had arrived\n4. if/whether\n5. is\n6. know","d":"2027-01-05","k":"Guia detalhado"},{"n":359,"t":"quarta-feira, 06/01/2027 · Plano operacional","b":"**Semana 15/18 · Fase 5 — Performance** · faltam **23 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Customer Service & Sales\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Novos hoje (4):**\n   - **backorder** — pedido pendente (sem estoque) · *The item is on backorder.*\n   - **special offer** — oferta especial · *There is a special offer this week.*\n   - **sales representative** — representante de vendas · *A sales representative will call you.*\n   - **follow up on an order** — acompanhar um pedido · *I'm calling to follow up on an order.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A lecture about an experiment* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/lecture-about-experiment. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe a stressful situation and how you handled it.\"* — use pelo menos: **backorder** e **special offer**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **30/12/2026** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **04/01/2027**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2027-01-06","k":"Plano operacional"},{"n":360,"t":"quarta-feira, 06/01/2027 · Guia detalhado","b":"### Guia detalhado — 06/01/2027 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"Describe a good or bad customer service experience.\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **30/12/2026** e os da aula P1 de **04/01/2027**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (G42 estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P03 (schwa) (p. 105).","d":"2027-01-06","k":"Guia detalhado"},{"n":361,"t":"quinta-feira, 07/01/2027 · Plano operacional","b":"**Semana 15/18 · Fase 5 — Performance** · faltam **22 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Customer Service & Sales\n**Missão do dia:** Francês profundo: Voix passive et tournures impersonnelles\n**Tempo ativo:** 100 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 10 | F03 — vowels |\n| Gramática FR | 20 | Voix passive et tournures impersonnelles |\n| Expressions C1 | 10 | 4 expressões |\n| Production | 20 | Rédigez un communiqué interne de 8 lignes au passif et à l'i… |\n| Input C1 | 15 | TV5MONDE — Apprendre le français |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Novos hoje (4):**\n   - **track a package** — rastrear uma encomenda · *You can track your package online.*\n   - **shipping fee** — taxa de envio · *The shipping fee is five euros.*\n   - **apologize for the inconvenience** — pedir desculpas pelo transtorno · *We apologize for the inconvenience.*\n   - **resolve a problem** — resolver um problema · *We resolved the problem quickly.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What do you do to stay healthy?\"* — use pelo menos: **track a package** e **shipping fee**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**31/12/2026**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2027-01-07","k":"Plano operacional"},{"n":362,"t":"quinta-feira, 07/01/2027 · Guia detalhado","b":"### Guia detalhado — 07/01/2027 · Francês\n\n**1) Pronúncia (10')** — foco: F03 — vowels. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática (20')** — *Voix passive et tournures impersonnelles*\nRegra: Passif: être + participe passé (+ par). Impersonnel: il faut, il s'agit de, il arrive que, il est interdit de.\nExercícios:\n1. La direction a annulé la réunion.\n2. On construira un nouveau pont.\n3. Il ___ (falloir) réagir vite.\n4. Il ___ (s'agir) de convaincre les clients.\n5. Il ___ (arriver) que le train soit en retard.\n\n**3) Expressions C1 (10')** — leia, repita e escreva 1 frase própria com cada uma:\n- **il est à noter que** — note-se que · *Il est à noter que les prix ont baissé.*\n- **il ressort que** — depreende-se que · *Il ressort de l'étude que la demande baisse.*\n- **on constate que** — constata-se que · *On constate une hausse.*\n- **être tenu de** — ser obrigado a · *Les employés sont tenus de signaler.*\n\n**4) Production (20')** — Rédigez un communiqué interne de 8 lignes au passif et à l'impersonnel.\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (15')** — TV5MONDE — Apprendre le français: https://apprendre.tv5monde.com/en/collection-all\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. La réunion a été annulée par la direction.\n2. Un nouveau pont sera construit.\n3. faut\n4. s'agit\n5. arrive","d":"2027-01-07","k":"Guia detalhado"},{"n":363,"t":"sexta-feira, 08/01/2027 · Plano operacional","b":"**Semana 15/18 · Fase 5 — Performance** · faltam **21 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Customer Service & Sales\n**Missão do dia:** Aquecimento pré-Simulado 4\n**Tempo ativo:** 85 min · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈30 | Part 5+6: 46 itens (20 min) + Part 7 double: 10 itens (14 min) |\n| Revisão | 20 | Protocolo T32/T34 |\n| Log | 5 | Scoreboard |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Novos hoje (4):**\n   - **customer feedback** — opinião dos clientes · *Customer feedback helps us improve.*\n   - **give a discount** — dar desconto · *We give a discount to students.*\n   - **be on sale** — estar em promoção · *All shoes are on sale.*\n   - **damaged item** — item danificado · *Please return the damaged item.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A lecture about an experiment* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/lecture-about-experiment. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Talk about the environment in your city.\"* — use pelo menos: **customer feedback** e **give a discount**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**04/01/2027**) e Qua (**06/01/2027**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Customer Service & Sales*: https://www.ted.com/talks?q=Customer+Service+%26+Sales\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2027-01-08","k":"Plano operacional"},{"n":364,"t":"sexta-feira, 08/01/2027 · Guia detalhado","b":"### Guia detalhado — 08/01/2027 · TOEIC Reading oficial\n\n**Set do dia:** Part 5+6: 46 itens (20 min) + Part 7 double: 10 itens (14 min)\n**Fonte oficial:** App: teste semi-real nº 5 (seção Reading) (pp. 153–154)\n**Foco:** Rotina de tempo antes do domingo.\n\n**Passos**\n1. (5') Setup: celular no silêncio, cronômetro, folha de respostas; sem consultar nada durante o set.\n2. (≈30') Faça o set **cronometrado**. Marque com “?” os itens em que chutou. Anote o tempo por Part.\n3. (20') Revisão em 3 passadas: (1) erros com **evidência exata** (copie a frase do texto); (2) acertos por chute; (3) acertos lentos (>90 s). Classifique cada erro (G/V/P/I/A/T/S/L — T32).\n4. (5') Scoreboard (p. 161): acerto por Part, tempo, 3 causas principais.\n5. Crie **até 3 cards** (erros que se repetem) e volte para eles no domingo.\n\n**Regra:** não faça “só mais um set” hoje. A revisão é o treino.\n\n**Referência de estratégia desta semana:** T30, T26 (páginas 53–87).","d":"2027-01-08","k":"Guia detalhado"},{"n":365,"t":"sábado, 09/01/2027 · Sábado","b":"**Semana 15/18 · Fase 5 — Performance** · faltam **20 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Customer Service & Sales\n**Missão do dia:** Fixar G10 (Used to e hábitos passados)\n**Tempo ativo:** 55 min · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática B — G10 | 30 | Used to e hábitos passados |\n| Reparo guiado do Error Log | 25 | Top-3 padrões até aqui |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 04/01 e 06/01 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 09/01/2027\n\n**Gramática B — G10 (30')**\n1. (5') Leia G10 (p. 20) em voz alta. Exercício A (primeira exposição ao tópico: faça agora, com calma):\n1. She ___ work in Lyon, but now she lives in Paris.\n2. I'm not used to ___ (get up) early.\n3. Did you ___ smoke?\n4. He ___ (be) shy, but now he speaks well.\n5. We ___ meet every Friday (habit).\n6. This tool is used ___ (measure) temperature.\n2. (10') **Exercício B — corrija as frases**:\n1. ❌ *I used to working in sales.*\n2. ❌ *She didn't used to like coffee.*\n3. ❌ *I'm not used to work at night.*\n4. ❌ *We would live in Rome.*\n3. (10') **Produção:** Diga 3 coisas que você fazia antes e não faz mais.\n4. (5') Error Log: 1 regra por erro.\n\n**Reparo guiado (25')** — abra o Error Log: escolha os 3 padrões (causa G/V) que mais se repetem; refaça um exercício B do tópico correspondente; escreva 3 frases novas.\n\n---\n**GABARITO (não olhe antes)**\n\n**G10 — A**\n1. used to\n2. getting up\n3. use to\n4. used to be\n5. would\n6. to measure\n\n**G10 — B**\n1. ✅ I used to work in sales.\n2. ✅ She didn't use to like coffee.\n3. ✅ I'm not used to working at night.\n4. ✅ We used to live in Rome.","d":"2027-01-09","k":"Sábado"},{"n":366,"t":"domingo, 10/01/2027 · Domingo","b":"**Semana 15/18 · Fase 5 — Performance** · faltam **19 dias** para a prova\n**Missão do dia:** Simulado 4\n\n| Bloco | Min | O quê |\n|---|---|---|\n| Simulado 4 | 120 | Teste em condições reais nº 4 (TOEIC Test App) |\n| Registro | 15–30 | Score + Scoreboard |\n\n**Protocolo (T33):** 09:00 Listening 45' → Reading 75' (sem pausa) · Fonte: **Teste em condições reais nº 4 (TOEIC Test App)**.\n- Antes: sono, água, silêncio, folha de respostas, cronômetro, celular em modo avião.\n- Depois (30 min): score, acerto por Part, tempo por Part, 3 dúvidas.\n- Amanhã: revise só o essencial; a **terça** tem revisão completa (T34) e a **sexta** o reparo das Top-3 fraquezas.\n- Não estude gramática nova hoje.\n\n**Ponte com aulas antigas:** hoje não há revisão de aula: o foco é o simulado.\n**Passivo:** Série/filme com legenda em inglês (30 min, sem obrigação)\n\n**Checklist:** [ ] Simulado feito [ ] Registro [ ] Descanso","d":"2027-01-10","k":"Domingo"},{"n":367,"t":"segunda-feira, 11/01/2027 · Plano operacional","b":"**Semana 16/18 · Fase 5 — Performance** · faltam **18 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Finance & Purchasing\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Finance & Purchasing).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Novos hoje (4):**\n   - **payment terms** — condições de pagamento · *The payment terms are thirty days.*\n   - **purchase order** — pedido de compra · *Send the purchase order today.*\n   - **supplier** — fornecedor · *We changed our supplier.*\n   - **place a bulk order** — fazer um pedido em grande quantidade · *They placed a bulk order for paper.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A business interview* (B2 (reshadowing), link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/business-interview. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe your last presentation or interview.\"* — use pelo menos: **payment terms** e **purchase order**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **04/01/2027** (aula P1 anterior) e de **14/12/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2027-01-11","k":"Plano operacional"},{"n":368,"t":"segunda-feira, 11/01/2027 · Guia detalhado","b":"### Guia detalhado — 11/01/2027 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\npayment terms, purchase order, supplier, place a bulk order, negotiate a price, quotation, vendor, overdue, budget forecast, accounting department, expense report, reimbursement, tax, audit, annual report, fiscal year, quarterly earnings, cash flow, procurement, in installments\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **04/01/2027** e de **14/12/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Finance & Purchasing*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana ().\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **gramática** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2027-01-11","k":"Guia detalhado"},{"n":369,"t":"terça-feira, 12/01/2027 · Plano operacional","b":"**Semana 16/18 · Fase 5 — Performance** · faltam **17 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Finance & Purchasing\n**Missão do dia:** Reparar erros (tempos verbais) + revisar o Simulado 4\n**Tempo ativo:** 85 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki · Shadowing · Fala |\n| Gramática (reparo) | 35 | Refazer exercícios A de G07, G11, G12, G15 + causas |\n| Revisão do simulado | 25 | Protocolo T34 do Simulado 4 |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Novos hoje (4):**\n   - **negotiate a price** — negociar um preço · *We negotiated a lower price.*\n   - **quotation** — cotação · *Please send a quotation.*\n   - **vendor** — fornecedor / vendedor · *The vendor delivers on Tuesdays.*\n   - **overdue** — vencido / em atraso · *The invoice is overdue.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A business interview* (B2 (reshadowing), link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/business-interview. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What would you do with a scholarship abroad?\"* — use pelo menos: **negotiate a price** e **quotation**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**11/01/2027**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Revisão de simulado · [ ] Error Log","d":"2027-01-12","k":"Plano operacional"},{"n":370,"t":"terça-feira, 12/01/2027 · Guia detalhado","b":"### Guia detalhado — 12/01/2027\n**Dia de reparo (tempos verbais).** Se o seu Error Log já mostra padrões, priorize-os. Caso contrário, use estes tópicos:\n\n**G07 — Past Simple** (10 min): refaça o exercício A **sem olhar**; corrija e escreva a regra dos erros.\n1. We ___ (send) the invoice yesterday.\n2. She ___ (not/attend) the workshop.\n3. ___ you ___ (see) the email?\n4. They ___ (buy) new chairs last month.\n5. He ___ (study) in Lyon in 2019.\n6. The meeting ___ (begin) at nine.\n\n**G11 — Present Perfect: forma e usos** (10 min): refaça o exercício A **sem olhar**; corrija e escreva a regra dos erros.\n1. She ___ (work) here since 2018.\n2. We ___ (not/receive) the package yet.\n3. ___ you ever ___ (visit) London?\n4. He ___ (just/leave) the office.\n5. They ___ (be) partners for ten years.\n6. I ___ (write) three reports so far.\n\n**G12 — Present Perfect x Past Simple** (10 min): refaça o exercício A **sem olhar**; corrija e escreva a regra dos erros.\n1. I ___ (see) him yesterday.\n2. I ___ (see) him three times this week.\n3. She ___ (move) to Nantes in 2021.\n4. We ___ (finish) the report. Here it is!\n5. When ___ he ___ (join) the company?\n6. ___ you ___ (ever/try) this software?\n\n**G15 — Future: will, going to, present continuous** (10 min): refaça o exercício A **sem olhar**; corrija e escreva a regra dos erros.\n1. The phone's ringing. I ___ get it.\n2. We ___ launch the product in May (plan).\n3. I ___ (meet) the client at four (arranged).\n4. Look at the sky! It ___ rain.\n5. I promise I ___ call you tomorrow.\n6. She ___ (not/attend) the meeting; she has a flight.\n\n**Revisão do Simulado 4 (25'):**\n1. (8') Passada 1: refaça só os **erros**, achando a evidência exata (T34).\n2. (7') Passada 2: acertos por chute (marque e explique por que acertou).\n3. (5') Passada 3: acertos lentos (tempo > 90 s).\n4. (5') Escolha o **Top-3 de causas** (G/V/P/I/A/T/S/L) e escreva 3 regras/chunks. A sexta usa essas fraquezas.\nRegistre no Scoreboard (p. 161). Regras de decisão: Anexo D1 (p. 177).\n\n---\n**GABARITO (não olhe antes)**\n\n**G07**\n1. sent\n2. didn't attend\n3. Did ... see\n4. bought\n5. studied\n6. began\n\n**G11**\n1. has worked\n2. haven't received\n3. Have ... visited\n4. has just left\n5. have been\n6. have written\n\n**G12**\n1. saw\n2. have seen\n3. moved\n4. have finished\n5. did ... join\n6. Have ... ever tried\n\n**G15**\n1. 'll\n2. are going to\n3. am meeting\n4. is going to\n5. will\n6. isn't attending","d":"2027-01-12","k":"Guia detalhado"},{"n":371,"t":"quarta-feira, 13/01/2027 · Plano operacional","b":"**Semana 16/18 · Fase 5 — Performance** · faltam **16 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Finance & Purchasing\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Novos hoje (4):**\n   - **budget forecast** — previsão orçamentária · *The budget forecast is ready.*\n   - **accounting department** — departamento de contabilidade · *Ask the accounting department.*\n   - **expense report** — relatório de despesas · *Submit your expense report monthly.*\n   - **reimbursement** — reembolso · *Reimbursement takes ten days.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A business interview* (B2 (reshadowing), link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/business-interview. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Explain the difference between two concepts in your field.\"* — use pelo menos: **budget forecast** e **accounting department**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **06/01/2027** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **11/01/2027**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2027-01-13","k":"Plano operacional"},{"n":372,"t":"quarta-feira, 13/01/2027 · Guia detalhado","b":"### Guia detalhado — 13/01/2027 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"How would you negotiate a lower price?\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **06/01/2027** e os da aula P1 de **11/01/2027**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (— estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P04 (/ɪ/ vs /iː/) (p. 106).","d":"2027-01-13","k":"Guia detalhado"},{"n":373,"t":"quinta-feira, 14/01/2027 · Plano operacional","b":"**Semana 16/18 · Fase 5 — Performance** · faltam **15 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Finance & Purchasing\n**Missão do dia:** Francês profundo: Discours rapporté et concordance des temps\n**Tempo ativo:** 100 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 10 | F02 — enchaînements |\n| Gramática FR | 20 | Discours rapporté et concordance des temps |\n| Expressions C1 | 10 | 4 expressões |\n| Production | 20 | Rapportez un entretien ou un appel fictif en 10 lignes.… |\n| Input C1 | 15 | Easy French — episodes |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Novos hoje (4):**\n   - **tax** — imposto · *The price includes tax.*\n   - **audit** — auditoria · *The firm passed the audit.*\n   - **annual report** — relatório anual · *The annual report is online.*\n   - **fiscal year** — ano fiscal · *The fiscal year ends in March.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Talk about a mistake you learned from.\"* — use pelo menos: **tax** e **audit**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**07/01/2027**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2027-01-14","k":"Plano operacional"},{"n":374,"t":"quinta-feira, 14/01/2027 · Guia detalhado","b":"### Guia detalhado — 14/01/2027 · Francês\n\n**1) Pronúncia (10')** — foco: F02 — enchaînements. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática (20')** — *Discours rapporté et concordance des temps*\nRegra: Verbo introdutor no passado → recuo: présent→imparfait, futur→conditionnel, passé composé→plus-que-parfait; demain→le lendemain.\nExercícios:\n1. « Je viendrai demain. » → Il a dit qu'il ___ le lendemain.\n2. « Nous avons fini. » → Elle a dit qu'ils ___ fini.\n3. « Où habites-tu ? » → Il m'a demandé où ___.\n4. « Ferme la porte ! » → Elle m'a dit de ___ la porte.\n5. « Je suis fatigué. » → Il a dit qu'il ___ fatigué.\n\n**3) Expressions C1 (10')** — leia, repita e escreva 1 frase própria com cada uma:\n- **affirmer que** — afirmar que · *Il affirme que c'est vrai.*\n- **prétendre que** — alegar que · *Elle prétend qu'elle n'était pas là.*\n- **faire remarquer que** — fazer notar que · *Il a fait remarquer que le délai est court.*\n- **admettre que** — admitir que · *Elle admet qu'elle s'est trompée.*\n\n**4) Production (20')** — Rapportez un entretien ou un appel fictif en 10 lignes.\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (15')** — Easy French — episodes: https://www.easyfrench.fm/episodes\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. viendrait\n2. avaient\n3. j'habitais\n4. fermer\n5. était","d":"2027-01-14","k":"Guia detalhado"},{"n":375,"t":"sexta-feira, 15/01/2027 · Plano operacional","b":"**Semana 16/18 · Fase 5 — Performance** · faltam **14 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Finance & Purchasing\n**Missão do dia:** Reparo pós-Simulado 4\n**Tempo ativo:** 85 min · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈30 | 40 itens das Parts mais fracas do Simulado 4 (série temática do app) |\n| Revisão | 20 | Protocolo T32/T34 |\n| Log | 5 | Scoreboard |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Novos hoje (4):**\n   - **quarterly earnings** — lucros trimestrais · *Quarterly earnings rose by five percent.*\n   - **cash flow** — fluxo de caixa · *Cash flow is stable.*\n   - **procurement** — compras / aquisições · *Procurement approves all orders.*\n   - **in installments** — em parcelas · *You can pay in installments.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A business interview* (B2 (reshadowing), link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/business-interview. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Do you prefer email, calls or messages? Why?\"* — use pelo menos: **quarterly earnings** e **cash flow**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**11/01/2027**) e Qua (**13/01/2027**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Finance & Purchasing*: https://www.ted.com/talks?q=Finance+%26+Purchasing\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2027-01-15","k":"Plano operacional"},{"n":376,"t":"sexta-feira, 15/01/2027 · Guia detalhado","b":"### Guia detalhado — 15/01/2027 · TOEIC Reading oficial\n\n**Set do dia:** 40 itens das Parts mais fracas do Simulado 4 (série temática do app)\n**Fonte oficial:** App: série temática (pp. 153–154)\n**Foco:** Top-3 causas do Simulado 4; domingo: Reading final.\n\n**Passos**\n1. (5') Setup: celular no silêncio, cronômetro, folha de respostas; sem consultar nada durante o set.\n2. (≈30') Faça o set **cronometrado**. Marque com “?” os itens em que chutou. Anote o tempo por Part.\n3. (20') Revisão em 3 passadas: (1) erros com **evidência exata** (copie a frase do texto); (2) acertos por chute; (3) acertos lentos (>90 s). Classifique cada erro (G/V/P/I/A/T/S/L — T32).\n4. (5') Scoreboard (p. 161): acerto por Part, tempo, 3 causas principais.\n5. Crie **até 3 cards** (erros que se repetem) e volte para eles no domingo.\n\n**Regra:** não faça “só mais um set” hoje. A revisão é o treino.\n\n**Referência de estratégia desta semana:** T32, T34 (páginas 53–87).","d":"2027-01-15","k":"Guia detalhado"},{"n":377,"t":"sábado, 16/01/2027 · Sábado","b":"**Semana 16/18 · Fase 5 — Performance** · faltam **13 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Finance & Purchasing\n**Missão do dia:** Reparar word forms, preposições e advérbios + Listening oficial.\n**Tempo ativo:** 55 min · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática reparo | 30 | word forms, preposições e advérbios |\n| Listening oficial | 25 | Part 3 + Part 4 — 20 itens (app) |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 11/01 e 13/01 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 16/01/2027\n\n**G41 — Word families e derivation** (≈10'): refaça o exercício A **sem olhar**; explique cada erro; escreva a regra no Error Log.\n1. The company offers ___ (employ) to graduates.\n2. We need a ___ (rely) supplier.\n3. She answered ___ (polite).\n4. The ___ (decide) was difficult.\n5. This tool is very ___ (use).\n6. He is an ___ (experience) manager.\n\n**G39 — Prepositions de tempo, lugar e movimento** (≈10'): refaça o exercício A **sem olhar**; explique cada erro; escreva a regra no Error Log.\n1. The meeting is ___ Monday.\n2. ___ 9 a.m.\n3. She was born ___ 1995.\n4. Submit the form ___ Friday (prazo).\n5. We waited ___ noon (continuamente).\n6. He is responsible ___ sales.\n\n**G22 — Adverbs e adjective x adverb** (≈10'): refaça o exercício A **sem olhar**; explique cada erro; escreva a regra no Error Log.\n1. She speaks English very ___. (good/well)\n2. He drives ___. (careful/carefully)\n3. The plan seems ___. (good/well)\n4. Please answer ___. (quick/quickly)\n5. It's a ___ recommended hotel. (high/highly)\n6. He works ___ and gets tired. (hard/hardly)\n\n**Listening oficial (25')** — Part 3 + Part 4: 20 itens (app)\n- Fonte: Sample Test/App (pp. 153–154). Foco: Top-3 fraquezas de Listening do Simulado 4.\n1. (3') Preview: leia as perguntas/opções (Part 3–4) ou prepare-se para o formato (Part 1–2).\n2. (15') Faça o set sem pausar o áudio.\n3. (7') Revisão: para cada erro, ouça de novo com transcript; classifique a causa (L/A/V/I) no Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G41**\n1. employment\n2. reliable\n3. politely\n4. decision\n5. useful\n6. experienced\n\n**G39**\n1. on\n2. At\n3. in\n4. by\n5. until\n6. for\n\n**G22**\n1. well\n2. carefully\n3. good\n4. quickly\n5. highly\n6. hard","d":"2027-01-16","k":"Sábado"},{"n":378,"t":"domingo, 17/01/2027 · Domingo","b":"**Semana 16/18 · Fase 5 — Performance** · faltam **12 dias** para a prova\n**Missão do dia:** Reading final\n\n| Bloco | Min | O quê |\n|---|---|---|\n| Reading final | 75 | Teste em condições reais nº 5 — SÓ a seção Reading (75 min) |\n| Registro | 15–30 | Score + Scoreboard |\n\n**Protocolo:** Reading em condições reais (75 min) · Fonte: **Teste em condições reais nº 5 — SÓ a seção Reading (75 min)**.\n- Objetivo: confirmar ritmo por Part (T30), não mudar a estratégia.\n- Registre acerto por Part e tempo no Scoreboard.\n\n**Ponte com aulas antigas:** hoje não há revisão de aula: o foco é o simulado.\n**Passivo:** Série/filme com legenda em inglês (30 min, sem obrigação)\n\n**Checklist:** [ ] Simulado feito [ ] Registro [ ] Descanso","d":"2027-01-17","k":"Domingo"},{"n":379,"t":"segunda-feira, 18/01/2027 · Plano operacional","b":"**Semana 17/18 · Fase 5 — Performance** · faltam **11 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Technology & Projects\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Technology & Projects).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Novos hoje (4):**\n   - **project milestone** — marco do projeto · *The first project milestone is May 3.*\n   - **be on track** — estar no caminho certo · *The launch is on track.*\n   - **run into an issue** — encontrar um problema · *We ran into an issue with the server.*\n   - **provide an update** — fornecer uma atualização · *Please provide an update by noon.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A design presentation* (B2 (reshadowing), link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/design-presentation. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe a dream trip and how you would organize it.\"* — use pelo menos: **project milestone** e **be on track**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **11/01/2027** (aula P1 anterior) e de **21/12/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2027-01-18","k":"Plano operacional"},{"n":380,"t":"segunda-feira, 18/01/2027 · Guia detalhado","b":"### Guia detalhado — 18/01/2027 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\nproject milestone, be on track, run into an issue, provide an update, software update, install, back up files, log in, password-protected, technical support, upgrade, system failure, user-friendly, data security, run a test, launch date, project manager, feasibility study, implement, be up to date\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **11/01/2027** e de **21/12/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Technology & Projects*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana ().\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **gramática** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2027-01-18","k":"Guia detalhado"},{"n":381,"t":"terça-feira, 19/01/2027 · Plano operacional","b":"**Semana 17/18 · Fase 5 — Performance** · faltam **10 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Technology & Projects\n**Missão do dia:** Reparar erros (passiva, modais e gerúndio/infinitivo) + ler um texto\n**Tempo ativo:** 85 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki · Shadowing · Fala |\n| Gramática (reparo) | 35 | Refazer exercícios A de G29, G24, G27 + causas |\n| Leitura 1 | 25 | Texto BC + exercícios |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Novos hoje (4):**\n   - **software update** — atualização de software · *Install the software update tonight.*\n   - **install** — instalar · *Install the program on your laptop.*\n   - **back up files** — fazer backup de arquivos · *Back up files every day.*\n   - **log in** — fazer login · *Log in with your password.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A design presentation* (B2 (reshadowing), link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/design-presentation. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What is your biggest challenge in learning English?\"* — use pelo menos: **software update** e **install**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**18/01/2027**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Leitura · [ ] Error Log","d":"2027-01-19","k":"Plano operacional"},{"n":382,"t":"terça-feira, 19/01/2027 · Guia detalhado","b":"### Guia detalhado — 19/01/2027\n**Dia de reparo (passiva, modais e gerúndio/infinitivo).** Se o seu Error Log já mostra padrões, priorize-os. Caso contrário, use estes tópicos:\n\n**G29 — Passive voice: base** (10 min): refaça o exercício A **sem olhar**; corrija e escreva a regra dos erros.\n1. The invoices ___ (send) every Friday.\n2. The report ___ (write) by Ms. Lee.\n3. The office ___ (clean) at the moment.\n4. The order ___ (not/deliver) yet.\n5. New staff ___ (hire) next month.\n6. The meeting ___ (cancel).\n\n**G24 — Modals: ability, permission, advice** (10 min): refaça o exercício A **sem olhar**; corrija e escreva a regra dos erros.\n1. She ___ speak three languages. (can/cans)\n2. ___ I use your phone? (May/Do)\n3. You ___ see a doctor. (should/should to)\n4. He couldn't ___ the file. (open/opened)\n5. She ___ to help us. (is able)\n6. You ___ better leave now. (had/would)\n\n**G27 — Gerunds e infinitives** (10 min): refaça o exercício A **sem olhar**; corrija e escreva a regra dos erros.\n1. We decided ___ (hire) two people.\n2. She avoids ___ (talk) about money.\n3. I look forward to ___ (meet) you.\n4. He agreed ___ (help).\n5. Would you mind ___ (close) the door?\n6. They plan ___ (open) a new branch.\n\n**Leitura 1 (25'):**\n**Texto:** *An email from a friend* (B2, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b2/email-friend\n1. **Preparação (3')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (8')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (8')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (3')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n\n---\n**GABARITO (não olhe antes)**\n\n**G29**\n1. are sent\n2. was written\n3. is being cleaned\n4. hasn't been delivered\n5. will be hired\n6. was cancelled\n\n**G24**\n1. can\n2. May\n3. should\n4. open\n5. is able to\n6. had\n\n**G27**\n1. to hire\n2. talking\n3. meeting\n4. to help\n5. closing\n6. to open","d":"2027-01-19","k":"Guia detalhado"},{"n":383,"t":"quarta-feira, 20/01/2027 · Plano operacional","b":"**Semana 17/18 · Fase 5 — Performance** · faltam **9 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Technology & Projects\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Novos hoje (4):**\n   - **password-protected** — protegido por senha · *The file is password-protected.*\n   - **technical support** — suporte técnico · *Call technical support for help.*\n   - **upgrade** — atualizar / melhorar · *We will upgrade the system.*\n   - **system failure** — falha de sistema · *A system failure stopped production.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A design presentation* (B2 (reshadowing), link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/design-presentation. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe a trend you know (prices, technology, habits).\"* — use pelo menos: **password-protected** e **technical support**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **13/01/2027** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **18/01/2027**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2027-01-20","k":"Plano operacional"},{"n":384,"t":"quarta-feira, 20/01/2027 · Guia detalhado","b":"### Guia detalhado — 20/01/2027 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"Describe a project that went wrong and what you learned.\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **13/01/2027** e os da aula P1 de **18/01/2027**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (— estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P05 (/θ/ /ð/) (p. 107).","d":"2027-01-20","k":"Guia detalhado"},{"n":385,"t":"quinta-feira, 21/01/2027 · Plano operacional","b":"**Semana 17/18 · Fase 5 — Performance** · faltam **8 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Technology & Projects\n**Missão do dia:** Francês profundo: Gérondif, participe présent et proposition participiale\n**Tempo ativo:** 100 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 10 | F03 — vowels |\n| Gramática FR | 20 | Gérondif, participe présent et proposition participiale |\n| Expressions C1 | 10 | 4 expressões |\n| Production | 20 | Écrivez 8 phrases avec gérondif, participe présent et propos… |\n| Input C1 | 15 | RFI — Journal en français facile |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Novos hoje (4):**\n   - **user-friendly** — fácil de usar · *The app is very user-friendly.*\n   - **data security** — segurança de dados · *Data security is a top priority.*\n   - **run a test** — executar um teste · *Run a test before the launch.*\n   - **launch date** — data de lançamento · *The launch date is June 10.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Give a short opening for a team meeting.\"* — use pelo menos: **user-friendly** e **data security**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**14/01/2027**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2027-01-21","k":"Plano operacional"},{"n":386,"t":"quinta-feira, 21/01/2027 · Guia detalhado","b":"### Guia detalhado — 21/01/2027 · Francês\n\n**1) Pronúncia (10')** — foco: F03 — vowels. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática (20')** — *Gérondif, participe présent et proposition participiale*\nRegra: Gérondif: en + -ant (simultaneidade/modo). Participe présent: adjetivo/ação (étonnant). Proposition participiale: 'Ayant fini son rapport, elle est partie.'\nExercícios:\n1. Il travaille ___ (écouter) la radio.\n2. ___ (Ayant fini) son rapport, elle est partie.\n3. C'est un film ___ (étonner).\n4. Il s'est blessé ___ (jouer) au football.\n5. ___ (Connaître) le problème, il a réagi vite.\n\n**3) Expressions C1 (10')** — leia, repita e escreva 1 frase própria com cada uma:\n- **tout en + gérondif** — ao mesmo tempo que · *Il travaille tout en étudiant.*\n- **de façon à** — de modo a · *Il parle lentement de façon à être compris.*\n- **au lieu de** — em vez de · *Au lieu de partir, il est resté.*\n- **afin de** — a fim de · *Afin d'éviter les erreurs, relisez.*\n\n**4) Production (20')** — Écrivez 8 phrases avec gérondif, participe présent et proposition participiale.\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (15')** — RFI — Journal en français facile: https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. en écoutant\n2. Ayant fini\n3. étonnant\n4. en jouant\n5. Connaissant","d":"2027-01-21","k":"Guia detalhado"},{"n":387,"t":"sexta-feira, 22/01/2027 · Plano operacional","b":"**Semana 17/18 · Fase 5 — Performance** · faltam **7 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Technology & Projects\n**Missão do dia:** Timing final\n**Tempo ativo:** 85 min · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈30 | Part 7 triple: 15 itens (22 min) + Part 5: 30 itens (12 min) |\n| Revisão | 20 | Protocolo T32/T34 |\n| Log | 5 | Scoreboard |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Novos hoje (4):**\n   - **project manager** — gerente de projeto · *The project manager sent a report.*\n   - **feasibility study** — estudo de viabilidade · *A feasibility study is under way.*\n   - **implement** — implementar · *We will implement the plan in May.*\n   - **be up to date** — estar atualizado · *Keep your software up to date.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A design presentation* (B2 (reshadowing), link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/design-presentation. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Leave a voicemail to reschedule an appointment.\"* — use pelo menos: **project manager** e **feasibility study**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**18/01/2027**) e Qua (**20/01/2027**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Technology & Projects*: https://www.ted.com/talks?q=Technology+%26+Projects\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2027-01-22","k":"Plano operacional"},{"n":388,"t":"sexta-feira, 22/01/2027 · Guia detalhado","b":"### Guia detalhado — 22/01/2027 · TOEIC Reading oficial\n\n**Set do dia:** Part 7 triple: 15 itens (22 min) + Part 5: 30 itens (12 min)\n**Fonte oficial:** App: séries de Part 7 múltipla + Part 5 (pp. 153–154)\n**Foco:** Início do taper: volume menor, foco em ritmo.\n\n**Passos**\n1. (5') Setup: celular no silêncio, cronômetro, folha de respostas; sem consultar nada durante o set.\n2. (≈30') Faça o set **cronometrado**. Marque com “?” os itens em que chutou. Anote o tempo por Part.\n3. (20') Revisão em 3 passadas: (1) erros com **evidência exata** (copie a frase do texto); (2) acertos por chute; (3) acertos lentos (>90 s). Classifique cada erro (G/V/P/I/A/T/S/L — T32).\n4. (5') Scoreboard (p. 161): acerto por Part, tempo, 3 causas principais.\n5. Crie **até 3 cards** (erros que se repetem) e volte para eles no domingo.\n\n**Regra:** não faça “só mais um set” hoje. A revisão é o treino.\n\n**Referência de estratégia desta semana:** T27, T30 (páginas 53–87).","d":"2027-01-22","k":"Guia detalhado"},{"n":389,"t":"sábado, 23/01/2027 · Sábado","b":"**Semana 17/18 · Fase 5 — Performance** · faltam **6 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Technology & Projects\n**Missão do dia:** Reparar pronomes, determinantes e quantifiers + Listening oficial.\n**Tempo ativo:** 55 min · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática reparo | 30 | pronomes, determinantes e quantifiers |\n| Listening oficial | 25 | Part 2 (taper) — 15 itens (app) |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 18/01 e 20/01 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 23/01/2027\n\n**G38 — Pronouns e reference** (≈7'): refaça o exercício A **sem olhar**; explique cada erro; escreva a regra no Error Log.\n1. Is this bag ___? (your/yours)\n2. He taught ___ to code. (him/himself)\n3. They help ___ every day. (themselves/each other)\n4. The manager and ___ attended. (I/me)\n5. Please send it to John and ___. (I/me)\n6. This is ___ office; that one is ___. (my/mine)\n\n**G20 — Determiners e demonstratives** (≈7'): refaça o exercício A **sem olhar**; explique cada erro; escreva a regra no Error Log.\n1. ___ documents on my desk are urgent. (This/These)\n2. Each employee ___ a badge. (has/have)\n3. Would you like ___ cup of coffee? (another/other)\n4. ___ offers are good (os dois).\n5. I don't like this design. Show me ___ ones. (other/another)\n6. Every ___ counts. (vote/votes)\n\n**G19 — Quantifiers: much, many, few, little, some, any** (≈7'): refaça o exercício A **sem olhar**; explique cada erro; escreva a regra no Error Log.\n1. We don't have ___ time. (many/much)\n2. How ___ employees work here?\n3. I have ___ questions (alguns).\n4. There is ___ hope left (quase nenhuma).\n5. Do you have ___ ideas?\n6. She has ___ friends here; she feels alone.\n\n**G17 — Articles: a/an, the e zero article** (≈7'): refaça o exercício A **sem olhar**; explique cada erro; escreva a regra no Error Log.\n1. She works as ___ engineer.\n2. I bought ___ laptop. ___ laptop is very fast.\n3. ___ customers like discounts (geral).\n4. He is ___ best salesperson in the team.\n5. We waited for ___ hour.\n6. We stayed at ___ hotel near ___ airport.\n\n**Listening oficial (25')** — Part 2 (taper): 15 itens (app)\n- Fonte: Sample Test/App (pp. 153–154). Foco: Ritmo, sem cansaço.\n1. (3') Preview: leia as perguntas/opções (Part 3–4) ou prepare-se para o formato (Part 1–2).\n2. (15') Faça o set sem pausar o áudio.\n3. (7') Revisão: para cada erro, ouça de novo com transcript; classifique a causa (L/A/V/I) no Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G38**\n1. yours\n2. himself\n3. each other\n4. I\n5. me\n6. my / mine\n\n**G20**\n1. These\n2. has\n3. another\n4. Both\n5. other\n6. vote\n\n**G19**\n1. much\n2. many\n3. a few\n4. little\n5. any\n6. few\n\n**G17**\n1. an\n2. a / The\n3. (sem artigo)\n4. the\n5. an\n6. a / the","d":"2027-01-23","k":"Sábado"},{"n":390,"t":"domingo, 24/01/2027 · Domingo","b":"**Semana 17/18 · Fase 5 — Performance** · faltam **5 dias** para a prova\n**Missão do dia:** Reparar + ler 1 texto + reset\n**Tempo ativo:** 55 min\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática reparo | 20 | Error Log livre |\n| Leitura 2 | 20 | Texto BC |\n| Reset semanal | 15 | Quiz + Scoreboard + plano |\n\n### Ponte com aulas antigas\n- Class Log de **27/12/2026** (4 semanas atrás): leia 3 erros/chunks e use 1 hoje na fala do quiz.\n\n### Passivo (fora da conta)\nSérie/filme com legenda em inglês (30 min, sem obrigação)\n- Francês: innerFrench — 1 épisode (podcast): https://innerfrench.com/podcast/\n\n### Guia detalhado\n**Error Log livre (20')**: escolha os 3 padrões que mais se repetem; refaça 1 exercício B de cada; escreva 3 frases novas.\n**Leitura 2 (20'):**\n**Texto:** *A Plastic Ocean: a film review* (B2, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b2/plastic-ocean-film-review\n1. **Preparação (2')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (6')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (7')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (2')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n**Reset semanal (15')**\n1. (5') **Quiz dos 20 chunks da semana** — olhe só o português e diga o chunk: project milestone, be on track, run into an issue, provide an update, software update, install, back up files, log in, password-protected, technical support, upgrade, system failure, user-friendly, data security, run a test, launch date, project manager, feasibility study, implement, be up to date\n2. (5') Error Log: escolha 3 erros repetidos e reescreva a regra.\n3. (5') Scoreboard e planejamento: o que fazer na semana 18 (próxima)? Confira a agenda de aulas.\n\n---\n**GABARITO (não olhe antes)**\n\n(sem itens com gabarito hoje)","d":"2027-01-24","k":"Domingo"},{"n":391,"t":"segunda-feira, 25/01/2027 · Plano operacional","b":"**Semana 18/18 · Fase 5 — Performance** · faltam **4 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Exam Performance\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Exam Performance).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Revisão de hoje (15 itens — tema: revisão dos temas Customer Service & Sales · Finance & Purchasing · Technology & Projects), sem cards novos:**\n   - **handle a complaint** — lidar com uma reclamação · *She handled the complaint politely.*\n   - **issue a refund** — emitir um reembolso · *We will issue a refund today.*\n   - **place an order** — fazer um pedido · *You can place an order online.*\n   - **customer satisfaction** — satisfação do cliente · *Customer satisfaction is our priority.*\n   - **return policy** — política de devolução · *Check our return policy.*\n   - **warranty** — garantia · *The laptop has a two-year warranty.*\n   - **exchange a product** — trocar um produto · *Can I exchange this shirt?*\n   - **out of stock** — fora de estoque · *That size is out of stock.*\n   - **backorder** — pedido pendente (sem estoque) · *The item is on backorder.*\n   - **special offer** — oferta especial · *There is a special offer this week.*\n   - **sales representative** — representante de vendas · *A sales representative will call you.*\n   - **follow up on an order** — acompanhar um pedido · *I'm calling to follow up on an order.*\n   - **track a package** — rastrear uma encomenda · *You can track your package online.*\n   - **shipping fee** — taxa de envio · *The shipping fee is five euros.*\n   - **apologize for the inconvenience** — pedir desculpas pelo transtorno · *We apologize for the inconvenience.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A digital detox podcast* (B2 (reshadowing), link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/digital-detox-podcast. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Make a polite request to your boss.\"* — use pelo menos: **handle a complaint** e **issue a refund**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **18/01/2027** (aula P1 anterior) e de **28/12/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2027-01-25","k":"Plano operacional"},{"n":392,"t":"segunda-feira, 25/01/2027 · Guia detalhado","b":"### Guia detalhado — 25/01/2027 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\n(semana de revisão)\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **18/01/2027** e de **28/12/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Exam Performance*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana ().\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **gramática** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2027-01-25","k":"Guia detalhado"},{"n":393,"t":"terça-feira, 26/01/2027 · Plano operacional","b":"**Semana 18/18 · Fase 5 — Performance** · faltam **3 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Exam Performance\n**Missão do dia:** Manter contato sem gastar energia (semana da prova).\n**Tempo ativo:** 35 min · **Versão mínima:** Anki 10'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 15 | Anki (revisão) + Shadowing 7 + Fala |\n| Error Log leve | 20 | 3 padrões + 3 frases novas |\n| Descanso | — | Sono é treino |\n\n### Micro-blocos (15 min)\n**1) Anki — 8 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Revisão de hoje (15 itens — tema: revisão dos temas Customer Service & Sales · Finance & Purchasing · Technology & Projects), sem cards novos:**\n   - **resolve a problem** — resolver um problema · *We resolved the problem quickly.*\n   - **customer feedback** — opinião dos clientes · *Customer feedback helps us improve.*\n   - **give a discount** — dar desconto · *We give a discount to students.*\n   - **be on sale** — estar em promoção · *All shoes are on sale.*\n   - **damaged item** — item danificado · *Please return the damaged item.*\n   - **payment terms** — condições de pagamento · *The payment terms are thirty days.*\n   - **purchase order** — pedido de compra · *Send the purchase order today.*\n   - **supplier** — fornecedor · *We changed our supplier.*\n   - **place a bulk order** — fazer um pedido em grande quantidade · *They placed a bulk order for paper.*\n   - **negotiate a price** — negociar um preço · *We negotiated a lower price.*\n   - **quotation** — cotação · *Please send a quotation.*\n   - **vendor** — fornecedor / vendedor · *The vendor delivers on Tuesdays.*\n   - **overdue** — vencido / em atraso · *The invoice is overdue.*\n   - **budget forecast** — previsão orçamentária · *The budget forecast is ready.*\n   - **accounting department** — departamento de contabilidade · *Ask the accounting department.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 7 min.** Áudio da semana: *A digital detox podcast* (B2 (reshadowing), link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/digital-detox-podcast. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Give feedback to a colleague.\"* — use pelo menos: **resolve a problem** e **customer feedback**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**25/01/2027**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Error Log leve · [ ] Sono","d":"2027-01-26","k":"Plano operacional"},{"n":394,"t":"terça-feira, 26/01/2027 · Guia detalhado","b":"### Guia detalhado — 26/01/2027 · Semana da prova\n\n- **Error Log leve (20'):** releia os 10 últimos erros; para cada um diga a regra em voz alta. Nada de conteúdo novo.\n- **Estratégia (T30):** revise a p. 82 (timing) e a p. 87 (dia da prova).\n- **Logística:** confirme local, horário e documento. Prepare a mochila hoje.\n- **Sono:** ≥ 7 h nas 3 noites antes da prova.","d":"2027-01-26","k":"Guia detalhado"},{"n":395,"t":"quarta-feira, 27/01/2027 · Plano operacional","b":"**Semana 18/18 · Fase 5 — Performance** · faltam **2 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Exam Performance\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Revisão de hoje (15 itens — tema: revisão dos temas Customer Service & Sales · Finance & Purchasing · Technology & Projects), sem cards novos:**\n   - **expense report** — relatório de despesas · *Submit your expense report monthly.*\n   - **reimbursement** — reembolso · *Reimbursement takes ten days.*\n   - **tax** — imposto · *The price includes tax.*\n   - **audit** — auditoria · *The firm passed the audit.*\n   - **annual report** — relatório anual · *The annual report is online.*\n   - **fiscal year** — ano fiscal · *The fiscal year ends in March.*\n   - **quarterly earnings** — lucros trimestrais · *Quarterly earnings rose by five percent.*\n   - **cash flow** — fluxo de caixa · *Cash flow is stable.*\n   - **procurement** — compras / aquisições · *Procurement approves all orders.*\n   - **in installments** — em parcelas · *You can pay in installments.*\n   - **project milestone** — marco do projeto · *The first project milestone is May 3.*\n   - **be on track** — estar no caminho certo · *The launch is on track.*\n   - **run into an issue** — encontrar um problema · *We ran into an issue with the server.*\n   - **provide an update** — fornecer uma atualização · *Please provide an update by noon.*\n   - **software update** — atualização de software · *Install the software update tonight.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A digital detox podcast* (B2 (reshadowing), link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/digital-detox-podcast. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Explain a process step by step.\"* — use pelo menos: **expense report** e **reimbursement**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **20/01/2027** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **25/01/2027**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2027-01-27","k":"Plano operacional"},{"n":396,"t":"quarta-feira, 27/01/2027 · Guia detalhado","b":"### Guia detalhado — 27/01/2027 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"What is your plan for the day of the exam?\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **20/01/2027** e os da aula P1 de **25/01/2027**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (— estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P06 (final consonants) (p. 108).","d":"2027-01-27","k":"Guia detalhado"},{"n":397,"t":"quinta-feira, 28/01/2027 · Plano operacional","b":"**Semana 18/18 · Fase 5 — Performance** · faltam **1 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Exam Performance\n**Missão do dia:** Francês profundo: Semana da prova: manutenção leve e plano pós-TOEIC\n**Tempo ativo:** 55 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 5 | F02 — leve |\n| Gramática FR | 0 | Semana da prova: manutenção leve e plano pós-TOEIC |\n| Expressions C1 | 5 | 4 expressões |\n| Production | 10 | Faites le point : décrivez vos objectifs de français pour fé… |\n| Input C1 | 10 | innerFrench — podcast |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Revisão de hoje (15 itens — tema: revisão dos temas Customer Service & Sales · Finance & Purchasing · Technology & Projects), sem cards novos:**\n   - **install** — instalar · *Install the program on your laptop.*\n   - **back up files** — fazer backup de arquivos · *Back up files every day.*\n   - **log in** — fazer login · *Log in with your password.*\n   - **password-protected** — protegido por senha · *The file is password-protected.*\n   - **technical support** — suporte técnico · *Call technical support for help.*\n   - **upgrade** — atualizar / melhorar · *We will upgrade the system.*\n   - **system failure** — falha de sistema · *A system failure stopped production.*\n   - **user-friendly** — fácil de usar · *The app is very user-friendly.*\n   - **data security** — segurança de dados · *Data security is a top priority.*\n   - **run a test** — executar um teste · *Run a test before the launch.*\n   - **launch date** — data de lançamento · *The launch date is June 10.*\n   - **project manager** — gerente de projeto · *The project manager sent a report.*\n   - **feasibility study** — estudo de viabilidade · *A feasibility study is under way.*\n   - **implement** — implementar · *We will implement the plan in May.*\n   - **be up to date** — estar atualizado · *Keep your software up to date.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Talk about a teacher you admire.\"* — use pelo menos: **install** e **back up files**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**21/01/2027**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2027-01-28","k":"Plano operacional"},{"n":398,"t":"quinta-feira, 28/01/2027 · Guia detalhado","b":"### Guia detalhado — 28/01/2027 · Francês\n\n**1) Pronúncia (5')** — foco: F02 — leve. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática:** hoje não há conteúdo novo (semana da prova).\n\n**3) Expressions C1 (5')** — leia, repita e escreva 1 frase própria com cada uma:\n- **en définitive** — em suma · *En définitive, le plan est solide.*\n- **en somme** — em suma · *En somme, tout est prêt.*\n- **pour conclure** — para concluir · *Pour conclure, je remercie l'équipe.*\n- **à terme** — a prazo · *À terme, nous atteindrons l'objectif.*\n\n**4) Production (10')** — Faites le point : décrivez vos objectifs de français pour février–août (10 lignes).\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (10')** — innerFrench — podcast: https://innerfrench.com/podcast/\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. (conferir no seu caderno)","d":"2027-01-28","k":"Guia detalhado"},{"n":399,"t":"sexta-feira, 29/01/2027 · Plano operacional","b":"**Semana 18/18 · Fase 5 — Performance** · **DIA DA PROVA — TOEIC Listening & Reading (29/01/2027)**\n\n### Manhã\n- [ ] Documento exigido pelo centro · [ ] Chegar com antecedência · [ ] Comer algo familiar · [ ] Água · [ ] Relógio (se permitido)\n- 10 min de Anki leve (opcional) e mais nada.\n\n### Durante (T35)\n- **Listening:** leia a próxima pergunta durante as pausas; uma questão perdida não pode contaminar a seguinte.\n- **Reading:** ritmo ~ Part 5 ≈ 10–12 min · Part 6 ≈ 8 min · Part 7 ≈ 55 min. Não deixe nenhum item em branco.\n\n### Depois\n- Sem revisar. Descanse. Registre suas impressões no Scoreboard para o plano de francês (Anexo C).","d":"2027-01-29","k":"Plano operacional"},{"n":400,"t":"sexta-feira, 29/01/2027 · Guia detalhado","b":"### Guia detalhado — Dia da prova\n\n**Regras de ouro**\n1. Confie no seu processo: você treinou o formato oficial (Sample Test, app).\n2. Nunca chute “sem marcar”: **não há penalidade** por erro.\n3. Se travar em uma questão por mais de ~90 s, chute e siga.\n4. Mude resposta só se achar **evidência textual** contra a primeira.\n\n**Checklist mental Part 5:** (1) verbo? (2) sujeito? (3) classe da lacuna? (4) colocação? (5) sentido.\n**Checklist Part 7:** pergunta → evidência → confirmar → responder.\n\n**Depois da prova:** comemorar. O plano de francês C1 começa em fevereiro (Anexo C, p. 171).\n\nBoa prova.","d":"2027-01-29","k":"Guia detalhado"}],"meta":{"start":"2026-09-25","exam":"2027-01-29","w1":"2026-09-28","mocks":[{"d":"2026-10-18","name":"Simulado 1","src":"Teste em condições reais nº 1 (TOEIC Test App)"},{"d":"2026-11-15","name":"Simulado 2","src":"Teste em condições reais nº 2 (TOEIC Test App)"},{"d":"2026-12-13","name":"Simulado 3","src":"Teste em condições reais nº 3 (TOEIC Test App)"},{"d":"2027-01-10","name":"Simulado 4","src":"Teste em condições reais nº 4 (TOEIC Test App)"},{"d":"2027-01-17","name":"Reading final","src":"Teste em condições reais nº 5 — SÓ a seção Reading (75 min)"}],"hz":["2026-12-24","2026-12-25","2026-12-31","2027-01-01"]}}</script>

function parseTasks(b){
  const L=b.split('\n');let i=L.findIndex(l=>/^\|\s*Bloco\s*\|/.test(l));const t=[];
  if(i<0)return [{name:'Cumprir o dia',min:0,minTxt:'—',what:''}];
