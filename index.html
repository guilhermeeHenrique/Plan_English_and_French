 besoin, c'est du temps.*\n- **auquel** — ao qual · *Le projet auquel je participe est intéressant.*\n- **lequel** — o qual · *La raison pour laquelle il a démissionné est claire.*\n\n**4) Production (20')** — Présentez votre parcours en 8 phrases avec dont / où / lequel.\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (15')** — TV5MONDE — Apprendre le français: https://apprendre.tv5monde.com/en/collection-all\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. dont\n2. où\n3. qui\n4. sur lequel\n5. à qui","d":"2026-12-10","k":"Guia detalhado"},{"n":315,"t":"sexta-feira, 11/12/2026 · Plano operacional","b":"**Semana 11/18 · Fase 3 — Integração e velocidade** · faltam **49 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Travel & Logistics\n**Missão do dia:** Aquecimento pré-Simulado 3\n**Tempo ativo:** 85 min · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈30 | Mini-Reading: 56 itens em 30 min |\n| Revisão | 20 | Protocolo T32/T34 |\n| Log | 5 | Scoreboard |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **registration desk** — mesa de inscrição · *Collect your badge at the registration desk.*\n   - **venue** — local do evento · *The venue is near the station.*\n   - **keynote speaker** — palestrante principal · *The keynote speaker starts at nine.*\n   - **banquet** — banquete · *The banquet is on Saturday night.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Joining a gym* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/joining-gym. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What would you change in your city?\"* — use pelo menos: **registration desk** e **venue**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**07/12/2026**) e Qua (**09/12/2026**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Travel & Logistics*: https://www.ted.com/talks?q=Travel+%26+Logistics\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2026-12-11","k":"Plano operacional"},{"n":316,"t":"sexta-feira, 11/12/2026 · Guia detalhado","b":"### Guia detalhado — 11/12/2026 · TOEIC Reading oficial\n\n**Set do dia:** Mini-Reading: 56 itens em 30 min\n**Fonte oficial:** App: teste semi-real nº 4 (seção Reading) (pp. 153–154)\n**Foco:** Rotina de tempo antes do domingo.\n\n**Passos**\n1. (5') Setup: celular no silêncio, cronômetro, folha de respostas; sem consultar nada durante o set.\n2. (≈30') Faça o set **cronometrado**. Marque com “?” os itens em que chutou. Anote o tempo por Part.\n3. (20') Revisão em 3 passadas: (1) erros com **evidência exata** (copie a frase do texto); (2) acertos por chute; (3) acertos lentos (>90 s). Classifique cada erro (G/V/P/I/A/T/S/L — T32).\n4. (5') Scoreboard (p. 161): acerto por Part, tempo, 3 causas principais.\n5. Crie **até 3 cards** (erros que se repetem) e volte para eles no domingo.\n\n**Regra:** não faça “só mais um set” hoje. A revisão é o treino.\n\n**Referência de estratégia desta semana:** T30, T14 (páginas 53–87).","d":"2026-12-11","k":"Guia detalhado"},{"n":317,"t":"sábado, 12/12/2026 · Sábado","b":"**Semana 11/18 · Fase 3 — Integração e velocidade** · faltam **48 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Travel & Logistics\n**Missão do dia:** Fixar G32 (Relative clauses: non-defining) e G33 (Conditionals 0 e 1)\n**Tempo ativo:** 55 min · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática B — G32 | 30 | Relative clauses: non-defining |\n| Gramática C — G33 | 25 | Conditionals 0 e 1 |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 07/12 e 09/12 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 12/12/2026\n\n**Gramática B — G32 (30')**\n1. (5') Leia G32 (p. 42) em voz alta. Exercício A (primeira exposição ao tópico: faça agora, com calma):\n1. Ms. Kim, ___ manages the team, is away.\n2. The report, ___ is long, is due Friday.\n3. Paris, ___ I live, is expensive.\n4. He was late, ___ annoyed everyone.\n5. My boss, ___ wife is a doctor, is kind.\n6. Our CEO, ___ we admire, will speak.\n2. (10') **Exercício B — corrija as frases**:\n1. ❌ *My manager, that is tall, is here.*\n2. ❌ *London that is big is expensive.*\n3. ❌ *Paris where I live is expensive.*\n4. ❌ *He passed, that surprised me.*\n3. (10') **Produção:** Escreva 3 frases sobre pessoas/lugares com informação extra entre vírgulas.\n4. (5') Error Log: 1 regra por erro.\n\n**Gramática C — G33 (25')** — dia de simulado amanhã: gramática no sábado.\n1. (5') Leia G33 (p. 43).\n2. (10') Exercício A:\n1. If you heat water, it ___ (boil).\n2. If it ___ (rain) tomorrow, we'll stay.\n3. If she ___ (call), I'll tell her.\n4. We'll leave ___ he arrives soon. (unless/if)\n5. If I ___ (get) the job, I ___ (move) to Nantes.\n6. ___ you need help, call me. (If/Unless)\n3. (5') Exercício B:\n1. ❌ *If it will rain, we'll stay.*\n2. ❌ *If I will see him, I tell him.*\n3. ❌ *Unless you don't hurry, you'll miss it.*\n4. ❌ *If you will need help, call me.*\n4. (5') Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G32 — A**\n1. who\n2. which\n3. where\n4. which\n5. whose\n6. whom\n\n**G32 — B**\n1. ✅ My manager, who is tall, is here.\n2. ✅ London, which is big, is expensive.\n3. ✅ Paris, where I live, is expensive.\n4. ✅ He passed, which surprised me.\n\n**G33 — A**\n1. boils\n2. rains\n3. calls\n4. unless\n5. get / will move\n6. If\n\n**G33 — B**\n1. ✅ If it rains, we'll stay.\n2. ✅ If I see him, I'll tell him.\n3. ✅ Unless you hurry, you'll miss it.\n4. ✅ If you need help, call me.","d":"2026-12-12","k":"Sábado"},{"n":318,"t":"domingo, 13/12/2026 · Domingo","b":"**Semana 11/18 · Fase 3 — Integração e velocidade** · faltam **47 dias** para a prova\n**Missão do dia:** Simulado 3\n\n| Bloco | Min | O quê |\n|---|---|---|\n| Simulado 3 | 120 | Teste em condições reais nº 3 (TOEIC Test App) |\n| Registro | 15–30 | Score + Scoreboard |\n\n**Protocolo (T33):** 09:00 Listening 45' → Reading 75' (sem pausa) · Fonte: **Teste em condições reais nº 3 (TOEIC Test App)**.\n- Antes: sono, água, silêncio, folha de respostas, cronômetro, celular em modo avião.\n- Depois (30 min): score, acerto por Part, tempo por Part, 3 dúvidas.\n- Amanhã: revise só o essencial; a **terça** tem revisão completa (T34) e a **sexta** o reparo das Top-3 fraquezas.\n- Não estude gramática nova hoje.\n\n**Ponte com aulas antigas:** hoje não há revisão de aula: o foco é o simulado.\n**Passivo:** Série/filme com legenda em inglês (30 min, sem obrigação)\n\n**Checklist:** [ ] Simulado feito [ ] Registro [ ] Descanso","d":"2026-12-13","k":"Domingo"},{"n":319,"t":"segunda-feira, 14/12/2026 · Plano operacional","b":"**Semana 12/18 · Fase 4 — Transição de prova (festas)** · faltam **46 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** HR & Recruitment\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: HR & Recruitment).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 4' no deck *Legacy* + 6' no deck *Active*.\n**Novos hoje (4):**\n   - **apply for** — candidatar-se a · *Apply for the job before Friday.*\n   - **be qualified for** — ser qualificado para · *She is qualified for the post.*\n   - **be hired** — ser contratado · *He was hired last week.*\n   - **be available** — estar disponível · *I am available from Monday.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Office party planning* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/office-party-planning. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe a time you helped someone.\"* — use pelo menos: **apply for** e **be qualified for**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **07/12/2026** (aula P1 anterior) e de **16/11/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2026-12-14","k":"Plano operacional"},{"n":320,"t":"segunda-feira, 14/12/2026 · Guia detalhado","b":"### Guia detalhado — 14/12/2026 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\napply for, be qualified for, be hired, be available, submit a résumé, conduct an interview, job description, salary range, reference letter, onboarding, training program, performance review, promote, personnel, full-time position, part-time, employment contract, applicant, vacancy, staff turnover\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **07/12/2026** e de **16/11/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *HR & Recruitment*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana (G34).\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **G34** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2026-12-14","k":"Guia detalhado"},{"n":321,"t":"terça-feira, 15/12/2026 · Plano operacional","b":"**Semana 12/18 · Fase 4 — Transição de prova (festas)** · faltam **45 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** HR & Recruitment\n**Missão do dia:** Fixar G34 (Second conditional) + revisar o Simulado 3\n**Tempo ativo:** 85 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki · Shadowing · Fala |\n| Gramática A — G34 | 35 | Second conditional |\n| Revisão do simulado | 25 | Protocolo T34 do Simulado 3 |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 4' no deck *Legacy* + 6' no deck *Active*.\n**Novos hoje (4):**\n   - **submit a résumé** — enviar um currículo · *Submit a résumé and a cover letter.*\n   - **conduct an interview** — conduzir uma entrevista · *The manager will conduct an interview.*\n   - **job description** — descrição do cargo · *Read the job description carefully.*\n   - **salary range** — faixa salarial · *The salary range is listed online.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Office party planning* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/office-party-planning. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Which technology do you use every day, and why?\"* — use pelo menos: **submit a résumé** e **conduct an interview**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**14/12/2026**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Revisão de simulado · [ ] Error Log","d":"2026-12-15","k":"Plano operacional"},{"n":322,"t":"terça-feira, 15/12/2026 · Guia detalhado","b":"### Guia detalhado — 15/12/2026\n**Passo 1 — Recall da aula de ontem (3'):** abra o Class Log de **14/12/2026**; diga 3 erros/chunks.\n**Passo 2 — Estudo (12'):** leia **G34** neste documento (p. 44) e a página do British Council (procure “Second conditional” em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2). Explique cada regra em voz alta em 30 s.\nRegras-chave:\n- If + past simple, would + base: situação irreal/improvável no presente ou futuro: 'If I had more time, I would study more.'\n- Use 'were' para todas as pessoas em registro formal: 'If I were you, I'd ...'.\n- Pergunta: 'What would you do if you won?' could/might podem substituir would.\n**Onde você costuma errar:** Não use 'would' na cláusula if: 'If I HAD time' (não 'If I would have time').\n**Passo 3 — Exercício A (15'):** responda por escrito.\n1. If I ___ (have) more money, I ___ (buy) a car.\n2. If she ___ (be) here, she would help.\n3. What ___ you do if you lost your job?\n4. If I ___ (be) you, I'd call him.\n5. We ___ (travel) more if we had time.\n6. If he ___ (know) the answer, he would tell us.\n**Passo 4 — Correção (3'):** compare com o gabarito no fim da página; para cada erro escreva **1 regra** no Error Log.\n**Passo 5 — Produção (2'):** Diga 4 coisas que você faria se tivesse mais tempo/dinheiro.\n\n**Revisão do Simulado 3 (25'):**\n1. (8') Passada 1: refaça só os **erros**, achando a evidência exata (T34).\n2. (7') Passada 2: acertos por chute (marque e explique por que acertou).\n3. (5') Passada 3: acertos lentos (tempo > 90 s).\n4. (5') Escolha o **Top-3 de causas** (G/V/P/I/A/T/S/L) e escreva 3 regras/chunks. A sexta usa essas fraquezas.\nRegistre no Scoreboard (p. 161). Regras de decisão: Anexo D1 (p. 177).\n\n---\n**GABARITO (não olhe antes)**\n\n1. had / would buy\n2. were\n3. would\n4. were\n5. would travel\n6. knew","d":"2026-12-15","k":"Guia detalhado"},{"n":323,"t":"quarta-feira, 16/12/2026 · Plano operacional","b":"**Semana 12/18 · Fase 4 — Transição de prova (festas)** · faltam **44 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** HR & Recruitment\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 4' no deck *Legacy* + 6' no deck *Active*.\n**Novos hoje (4):**\n   - **reference letter** — carta de referência · *She asked for a reference letter.*\n   - **onboarding** — integração de novos funcionários · *Onboarding takes one week.*\n   - **training program** — programa de treinamento · *The training program starts in June.*\n   - **performance review** — avaliação de desempenho · *Your performance review is on Monday.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Office party planning* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/office-party-planning. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Tell a short story about a trip.\"* — use pelo menos: **reference letter** e **onboarding**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **09/12/2026** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **14/12/2026**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2026-12-16","k":"Plano operacional"},{"n":324,"t":"quarta-feira, 16/12/2026 · Guia detalhado","b":"### Guia detalhado — 16/12/2026 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"What makes a good candidate in an interview?\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **09/12/2026** e os da aula P1 de **14/12/2026**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (G34 estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P12 (thought groups) (p. 114).","d":"2026-12-16","k":"Guia detalhado"},{"n":325,"t":"quinta-feira, 17/12/2026 · Plano operacional","b":"**Semana 12/18 · Fase 4 — Transição de prova (festas)** · faltam **43 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** HR & Recruitment\n**Missão do dia:** Francês profundo: Nominalisation et mise en relief (C1)\n**Tempo ativo:** 100 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 10 | F02 — rhythm |\n| Gramática FR | 20 | Nominalisation et mise en relief (C1) |\n| Expressions C1 | 10 | 4 expressões |\n| Production | 20 | Reformulez 3 phrases verbales en style nominal et rédigez un… |\n| Input C1 | 15 | Easy French — episodes |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 4' no deck *Legacy* + 6' no deck *Active*.\n**Novos hoje (4):**\n   - **promote** — promover · *They promoted him to team leader.*\n   - **personnel** — pessoal / funcionários · *All personnel must wear badges.*\n   - **full-time position** — vaga em tempo integral · *It is a full-time position.*\n   - **part-time** — meio período · *She works part-time.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"How do you manage your time?\"* — use pelo menos: **promote** e **personnel**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**10/12/2026**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2026-12-17","k":"Plano operacional"},{"n":326,"t":"quinta-feira, 17/12/2026 · Guia detalhado","b":"### Guia detalhado — 17/12/2026 · Francês\n\n**1) Pronúncia (10')** — foco: F02 — rhythm. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática (20')** — *Nominalisation et mise en relief (C1)*\nRegra: Nominalização: verbo → nome ('Les prix augmentent' → 'L'augmentation des prix'). Mise en relief: c'est... qui/que.\nExercícios:\n1. Les prix augmentent.\n2. On a décidé de fermer l'usine.\n3. Les employés protestent.\n4. La ville se développe rapidement.\n5. On a réduit les coûts.\n\n**3) Expressions C1 (10')** — leia, repita e escreva 1 frase própria com cada uma:\n- **à cet égard** — a esse respeito · *À cet égard, la loi est claire.*\n- **en l'occurrence** — no caso · *En l'occurrence, le retard est justifié.*\n- **c'est la raison pour laquelle** — é a razão pela qual · *C'est la raison pour laquelle nous avons agi.*\n- **la prise de décision** — tomada de decisão · *La prise de décision est rapide.*\n\n**4) Production (20')** — Reformulez 3 phrases verbales en style nominal et rédigez un résumé de 100 mots.\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (15')** — Easy French — episodes: https://www.easyfrench.fm/episodes\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. L'augmentation des prix\n2. La décision de fermer l'usine\n3. La protestation des employés\n4. Le développement rapide de la ville\n5. La réduction des coûts","d":"2026-12-17","k":"Guia detalhado"},{"n":327,"t":"sexta-feira, 18/12/2026 · Plano operacional","b":"**Semana 12/18 · Fase 4 — Transição de prova (festas)** · faltam **42 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** HR & Recruitment\n**Missão do dia:** Reparo pós-Simulado 3\n**Tempo ativo:** 85 min · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈30 | 40 itens das 2 Parts mais fracas do Simulado 3 (série temática do app) |\n| Revisão | 20 | Protocolo T32/T34 |\n| Log | 5 | Scoreboard |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 4' no deck *Legacy* + 6' no deck *Active*.\n**Novos hoje (4):**\n   - **employment contract** — contrato de trabalho · *Sign the employment contract today.*\n   - **applicant** — candidato(a) · *Each applicant received an email.*\n   - **vacancy** — vaga · *There is a vacancy in accounting.*\n   - **staff turnover** — rotatividade de pessoal · *Staff turnover is low.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Office party planning* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/office-party-planning. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What are your goals for the next twelve months?\"* — use pelo menos: **employment contract** e **applicant**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**14/12/2026**) e Qua (**16/12/2026**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *HR & Recruitment*: https://www.ted.com/talks?q=HR+%26+Recruitment\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2026-12-18","k":"Plano operacional"},{"n":328,"t":"sexta-feira, 18/12/2026 · Guia detalhado","b":"### Guia detalhado — 18/12/2026 · TOEIC Reading oficial\n\n**Set do dia:** 40 itens das 2 Parts mais fracas do Simulado 3 (série temática do app)\n**Fonte oficial:** App: série temática (pp. 153–154)\n**Foco:** Top-3 causas do Simulado 3.\n\n**Passos**\n1. (5') Setup: celular no silêncio, cronômetro, folha de respostas; sem consultar nada durante o set.\n2. (≈30') Faça o set **cronometrado**. Marque com “?” os itens em que chutou. Anote o tempo por Part.\n3. (20') Revisão em 3 passadas: (1) erros com **evidência exata** (copie a frase do texto); (2) acertos por chute; (3) acertos lentos (>90 s). Classifique cada erro (G/V/P/I/A/T/S/L — T32).\n4. (5') Scoreboard (p. 161): acerto por Part, tempo, 3 causas principais.\n5. Crie **até 3 cards** (erros que se repetem) e volte para eles no domingo.\n\n**Regra:** não faça “só mais um set” hoje. A revisão é o treino.\n\n**Referência de estratégia desta semana:** T32, T34 (páginas 53–87).","d":"2026-12-18","k":"Guia detalhado"},{"n":329,"t":"sábado, 19/12/2026 · Sábado","b":"**Semana 12/18 · Fase 4 — Transição de prova (festas)** · faltam **41 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** HR & Recruitment\n**Missão do dia:** Fixar G35 (Third e mixed conditionals) e G36 (Reported speech)\n**Tempo ativo:** 55 min · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática B — G35 | 30 | Third e mixed conditionals |\n| Gramática C — G36 | 25 | Reported speech |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 14/12 e 16/12 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 19/12/2026\n\n**Gramática B — G35 (30')**\n1. (5') Leia G35 (p. 45) em voz alta. Exercício A (primeira exposição ao tópico: faça agora, com calma):\n1. If I ___ (leave) earlier, I wouldn't have missed the train.\n2. She would have passed if she ___ (study).\n3. If we ___ (take) the earlier flight, we would have arrived on time.\n4. If he had listened, he ___ (not/make) the mistake.\n5. If I had studied more, I ___ (have) a better job now.\n6. ___ you have helped if I had asked?\n2. (10') **Exercício B — corrija as frases**:\n1. ❌ *If I would have known, I would have called.*\n2. ❌ *If she had studied, she would passed.*\n3. ❌ *If we had left early, we didn't miss it.*\n4. ❌ *If I had known, I would call you.*\n3. (10') **Produção:** Conte 3 arrependimentos com 'If I had..., I would have...'.\n4. (5') Error Log: 1 regra por erro.\n\n**Gramática C — G36 (25')** — dia de simulado amanhã: gramática no sábado.\n1. (5') Leia G36 (p. 46).\n2. (10') Exercício A:\n1. 'I work in Lyon.' → She said she ___ in Lyon.\n2. 'I will call you.' → He said he ___ call me.\n3. 'We can help.' → They said they ___ help.\n4. 'Are you ready?' → She asked if I ___ ready.\n5. 'Send the file.' → He told me ___ the file.\n6. 'I have finished.' → She said she ___ finished.\n3. (5') Exercício B:\n1. ❌ *He said me that he was late.*\n2. ❌ *She asked me where do I live.*\n3. ❌ *He said he will come.*\n4. ❌ *They told to wait.*\n4. (5') Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G35 — A**\n1. had left\n2. had studied\n3. had taken\n4. wouldn't have made\n5. would have\n6. Would\n\n**G35 — B**\n1. ✅ If I had known, I would have called.\n2. ✅ If she had studied, she would have passed.\n3. ✅ If we had left early, we wouldn't have missed it.\n4. ✅ If I had known, I would have called you.\n\n**G36 — A**\n1. worked\n2. would\n3. could\n4. was\n5. to send\n6. had\n\n**G36 — B**\n1. ✅ He told me that he was late.\n2. ✅ She asked me where I lived.\n3. ✅ He said he would come.\n4. ✅ They told us to wait.","d":"2026-12-19","k":"Sábado"},{"n":330,"t":"domingo, 20/12/2026 · Domingo","b":"**Semana 12/18 · Fase 4 — Transição de prova (festas)** · faltam **40 dias** para a prova\n**Missão do dia:** Fixar G36 + ler 1 texto + reset\n**Tempo ativo:** 55 min\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática C — G36 | 20 | Reported speech |\n| Leitura 2 | 20 | Texto BC |\n| Reset semanal | 15 | Quiz + Scoreboard + plano |\n\n### Ponte com aulas antigas\n- Class Log de **22/11/2026** (4 semanas atrás): leia 3 erros/chunks e use 1 hoje na fala do quiz.\n\n### Passivo (fora da conta)\nSérie/filme com legenda em inglês (30 min, sem obrigação)\n- Francês: innerFrench — 1 épisode (podcast): https://innerfrench.com/podcast/\n\n### Guia detalhado\n**Gramática C — G36 (20')**\n1. (6') Leia G36 (p. 46) em voz alta.\n2. (10') Exercício A:\n1. 'I work in Lyon.' → She said she ___ in Lyon.\n2. 'I will call you.' → He said he ___ call me.\n3. 'We can help.' → They said they ___ help.\n4. 'Are you ready?' → She asked if I ___ ready.\n5. 'Send the file.' → He told me ___ the file.\n6. 'I have finished.' → She said she ___ finished.\n3. (4') Produção: Reporte 3 coisas que a professora disse na última aula.\n**Leitura 2 (20'):**\n**Texto:** *Why bridges collapse* (B2, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b2/why-bridges-collapse\n1. **Preparação (2')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (6')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (7')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (2')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n**Reset semanal (15')**\n1. (5') **Quiz dos 20 chunks da semana** — olhe só o português e diga o chunk: apply for, be qualified for, be hired, be available, submit a résumé, conduct an interview, job description, salary range, reference letter, onboarding, training program, performance review, promote, personnel, full-time position, part-time, employment contract, applicant, vacancy, staff turnover\n2. (5') Error Log: escolha 3 erros repetidos e reescreva a regra.\n3. (5') Scoreboard e planejamento: o que fazer na semana 13 (próxima)? Confira a agenda de aulas.\n\n---\n**GABARITO (não olhe antes)**\n\n1. worked\n2. would\n3. could\n4. was\n5. to send\n6. had","d":"2026-12-20","k":"Domingo"},{"n":331,"t":"segunda-feira, 21/12/2026 · Plano operacional","b":"**Semana 13/18 · Fase 4 — Transição de prova (festas)** · faltam **39 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Festas — revisão leve 1\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Festas — revisão leve 1).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 4' no deck *Legacy* + 6' no deck *Active*.\n**Revisão de hoje (12 itens — tema: revisão dos temas Environment · Leaders and Thinkers · Well-being), sem cards novos:**\n   - **be made of** — ser feito de · *The bottle is made of glass.*\n   - **be designed to** — ser projetado para · *The device is designed to save energy.*\n   - **be used for** — ser usado para · *This room is used for meetings.*\n   - **be caused by** — ser causado por · *The delay was caused by fog.*\n   - **reduce waste** — reduzir o desperdício · *We reduce waste in the kitchen.*\n   - **recycle materials** — reciclar materiais · *The factory recycles materials.*\n   - **renewable energy** — energia renovável · *The firm invests in renewable energy.*\n   - **energy-efficient** — eficiente em energia · *We bought energy-efficient lamps.*\n   - **carbon emissions** — emissões de carbono · *The plant cut carbon emissions.*\n   - **environmentally friendly** — ecologicamente correto · *The packaging is environmentally friendly.*\n   - **raise concern about** — levantar preocupação sobre · *Residents raised concern about noise.*\n   - **sustainable** — sustentável · *We use sustainable materials.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Talking about rumours* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/talking-about-rumours. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe a study tool or app you like.\"* — use pelo menos: **be made of** e **be designed to**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **14/12/2026** (aula P1 anterior) e de **23/11/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2026-12-21","k":"Plano operacional"},{"n":332,"t":"segunda-feira, 21/12/2026 · Guia detalhado","b":"### Guia detalhado — 21/12/2026 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\n(semana de revisão)\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **14/12/2026** e de **23/11/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Festas — revisão leve 1*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana (G37).\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **G37** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2026-12-21","k":"Guia detalhado"},{"n":333,"t":"terça-feira, 22/12/2026 · Plano operacional","b":"**Semana 13/18 · Fase 4 — Transição de prova (festas)** · faltam **38 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Festas — revisão leve 1\n**Missão do dia:** Fixar G37 (Indirect questions)\n**Tempo ativo:** 45 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 15 | Anki · Shadowing · Fala |\n| Gramática A — G37 | 30 | Indirect questions |\n\n### Micro-blocos (15 min)\n**1) Anki — 8 min.** Revisões vencidas: 4' no deck *Legacy* + 6' no deck *Active*.\n**Revisão de hoje (12 itens — tema: revisão dos temas Environment · Leaders and Thinkers · Well-being), sem cards novos:**\n   - **natural resources** — recursos naturais · *The country has many natural resources.*\n   - **dispose of** — descartar · *Dispose of batteries properly.*\n   - **be harmful to** — ser prejudicial a · *Smoke is harmful to health.*\n   - **protect the environment** — proteger o meio ambiente · *We must protect the environment.*\n   - **switch to** — mudar para · *The office switched to LED lights.*\n   - **have an impact on** — ter impacto sobre · *Traffic has an impact on air quality.*\n   - **comply with regulations** — cumprir regulamentos · *Factories must comply with regulations.*\n   - **conserve energy** — conservar energia · *Turn off lights to conserve energy.*\n   - **come up with** — ter (uma ideia) · *She came up with a great plan.*\n   - **point out** — apontar · *He pointed out the risks.*\n   - **be known for** — ser conhecido por · *The firm is known for quality.*\n   - **play a role** — ter um papel · *Sales play a role in growth.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 7 min.** Áudio da semana: *Talking about rumours* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/talking-about-rumours. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Give advice to a new colleague or student.\"* — use pelo menos: **natural resources** e **dispose of**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**21/12/2026**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Leitura · [ ] Error Log","d":"2026-12-22","k":"Plano operacional"},{"n":334,"t":"terça-feira, 22/12/2026 · Guia detalhado","b":"### Guia detalhado — 22/12/2026\n**Passo 1 — Recall da aula de ontem (3'):** abra o Class Log de **21/12/2026**; diga 3 erros/chunks.\n**Passo 2 — Estudo (12'):** leia **G37** neste documento (p. 47) e a página do British Council (procure “Indirect questions” em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2). Explique cada regra em voz alta em 30 s.\nRegras-chave:\n- Depois de 'Could you tell me', 'Do you know', 'I wonder', 'I'd like to know' a ordem é AFIRMATIVA (sem inversão, sem do/does): 'Could you tell me where the office is?'\n- Sem palavra Wh-: use if/whether: 'I wonder if he is coming.'\n**Onde você costuma errar:** Português mantém a ordem; inglês NÃO inverte: 'Do you know where he works?' (não 'where does he work').\n**Passo 3 — Exercício A (12'):** responda por escrito.\n1. Could you tell me where ___? (is the bank / the bank is)\n2. Do you know what time ___? (does it start / it starts)\n3. I wonder ___ he is coming. (if/that)\n4. Can you tell me how much ___? (it costs / does it cost)\n5. I'd like to know ___ she called. (why/because)\n6. Do you know whether ___ open? (they're / are they)\n**Passo 4 — Correção (3'):** compare com o gabarito no fim da página; para cada erro escreva **1 regra** no Error Log.\n**Passo 5 — Produção (2'):** Reescreva 4 perguntas diretas como indiretas.\n\n---\n**GABARITO (não olhe antes)**\n\n1. the bank is\n2. it starts\n3. if\n4. it costs\n5. why\n6. they're","d":"2026-12-22","k":"Guia detalhado"},{"n":335,"t":"quarta-feira, 23/12/2026 · Plano operacional","b":"**Semana 13/18 · Fase 4 — Transição de prova (festas)** · faltam **37 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Festas — revisão leve 1\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 4' no deck *Legacy* + 6' no deck *Active*.\n**Revisão de hoje (12 itens — tema: revisão dos temas Environment · Leaders and Thinkers · Well-being), sem cards novos:**\n   - **take responsibility for** — assumir responsabilidade por · *He took responsibility for the error.*\n   - **make a decision** — tomar uma decisão · *We must make a decision today.*\n   - **set an example** — dar exemplo · *Managers should set an example.*\n   - **inspire** — inspirar · *Her speech inspired the team.*\n   - **motivate** — motivar · *Praise can motivate staff.*\n   - **be respected by** — ser respeitado por · *She is respected by her colleagues.*\n   - **give credit to** — dar crédito a · *Give credit to the whole team.*\n   - **have a vision** — ter uma visão · *The CEO has a clear vision.*\n   - **take the initiative** — tomar a iniciativa · *He took the initiative to help.*\n   - **encourage** — incentivar · *We encourage new ideas.*\n   - **be open to** — estar aberto a · *Are you open to feedback?*\n   - **bring up an issue** — levantar um problema · *She brought up an issue at the meeting.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Talking about rumours* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/talking-about-rumours. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Make a polite complaint about a service.\"* — use pelo menos: **take responsibility for** e **make a decision**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **16/12/2026** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **21/12/2026**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2026-12-23","k":"Plano operacional"},{"n":336,"t":"quarta-feira, 23/12/2026 · Guia detalhado","b":"### Guia detalhado — 23/12/2026 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"Tell me about your year in five sentences.\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **16/12/2026** e os da aula P1 de **21/12/2026**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (G37 estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P01 (word stress) (p. 103).","d":"2026-12-23","k":"Guia detalhado"},{"n":337,"t":"quinta-feira, 24/12/2026 · Plano operacional","b":"**Semana 13/18 · Fase 4 — Transição de prova (festas)** · faltam **36 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Festas — revisão leve 1\n**Missão do dia:** Dia livre: 0 minutos obrigatórios.\n**Tempo ativo:** 0 (opcional 15) · **Versão mínima:** 0\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Nada obrigatório | 0 | Descanse |\n| Opcional | 15 | Anki 8 min + escuta de francês (RFI) 7 min |\n\n### Passivo (fora da conta)\n- TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n- RFI: https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Nada (está tudo certo)","d":"2026-12-24","k":"Plano operacional"},{"n":338,"t":"quinta-feira, 24/12/2026 · Guia detalhado","b":"### Guia detalhado — 24/12/2026 · Dia livre\n\nHoje 0 minutos é o correto. Se quiser, escolha **uma** opção leve:\n1. Anki: 8 min de revisão.\n2. Ouvir 1 episódio de RFI ou innerFrench.\n3. Ler em voz alta 5 frases do exercício de francês da semana (p. de referência F02).\n\nSem compensar depois. A quinta-feira de francês retoma normalmente na próxima semana.","d":"2026-12-24","k":"Guia detalhado"},{"n":339,"t":"sexta-feira, 25/12/2026 · Plano operacional","b":"**Semana 13/18 · Fase 4 — Transição de prova (festas)** · faltam **35 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Festas — revisão leve 1\n**Missão do dia:** Natal — opcional\n**Tempo ativo:** opcional (0 permitido) · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 15 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈8 | Opcional: 20 itens de Part 5 (8 min) — 0 min é permitido |\n| Revisão | 0 | Protocolo T32/T34 |\n| Log | 0 | Scoreboard |\n\n### Micro-blocos (15 min)\n**1) Anki — 8 min.** Revisões vencidas: 4' no deck *Legacy* + 6' no deck *Active*.\n**Revisão de hoje (12 itens — tema: revisão dos temas Environment · Leaders and Thinkers · Well-being), sem cards novos:**\n   - **sick leave** — licença médica · *He is on sick leave.*\n   - **paid vacation** — férias remuneradas · *Staff get twenty days of paid vacation.*\n   - **flexible hours** — horário flexível · *We offer flexible hours.*\n   - **work from home** — trabalhar de casa · *I work from home on Fridays.*\n   - **burnout** — esgotamento · *Long hours can lead to burnout.*\n   - **take a break** — fazer uma pausa · *Let's take a break.*\n   - **be under pressure** — estar sob pressão · *She is under pressure to deliver.*\n   - **benefits package** — pacote de benefícios · *The benefits package is generous.*\n   - **ergonomic** — ergonômico · *We bought ergonomic chairs.*\n   - **regular checkup** — exame de rotina · *Have a regular checkup every year.*\n   - **be in good health** — estar com boa saúde · *He is in good health.*\n   - **a healthy lifestyle** — um estilo de vida saudável · *A healthy lifestyle boosts energy.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 7 min.** Áudio da semana: *Talking about rumours* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/talking-about-rumours. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Compare two options you had to choose between.\"* — use pelo menos: **sick leave** e **paid vacation**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**21/12/2026**) e Qua (**23/12/2026**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Festas — revisão leve 1*: https://www.ted.com/talks?q=Festas+%E2%80%94+revis%C3%A3o+leve+1\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2026-12-25","k":"Plano operacional"},{"n":340,"t":"sexta-feira, 25/12/2026 · Guia detalhado","b":"### Guia detalhado — 25/12/2026 · Dia livre\n\nHoje **0 minutos é o correto**. Se sentir vontade, escolha **uma** opção leve:\n1. 15 itens de Part 5 do app (6 min) — sem revisar.\n2. Anki 8 min.\n3. Ouvir 1 episódio do passivo.\n\nNada disso é obrigatório. Sem culpa; sem “compensar”. Na próxima terça retome o plano normal.\n\n**Checklist de retomada (segunda):** [ ] Class Log em dia · [ ] Anki < 100 revisões · [ ] Sono normal.","d":"2026-12-25","k":"Guia detalhado"},{"n":341,"t":"sábado, 26/12/2026 · Sábado","b":"**Semana 13/18 · Fase 4 — Transição de prova (festas)** · faltam **34 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Festas — revisão leve 1\n**Missão do dia:** Fixar G38 (Pronouns e reference) + Listening oficial\n**Tempo ativo:** opcional · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática B — G38 | 30 | Pronouns e reference |\n| Listening oficial | 25 | Part 2 (opcional) — 15 itens (app) — 0 min é permitido |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 21/12 e 23/12 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 26/12/2026\n\n**Gramática B — G38 (30')**\n1. (5') Leia G38 (p. 48) em voz alta. Exercício A (primeira exposição ao tópico: faça agora, com calma):\n1. Is this bag ___? (your/yours)\n2. He taught ___ to code. (him/himself)\n3. They help ___ every day. (themselves/each other)\n4. The manager and ___ attended. (I/me)\n5. Please send it to John and ___. (I/me)\n6. This is ___ office; that one is ___. (my/mine)\n2. (10') **Exercício B — corrija as frases**:\n1. ❌ *She introduced her.*\n2. ❌ *Between you and I*\n3. ❌ *This pen is my.*\n4. ❌ *He cut him with the knife.*\n3. (10') **Produção:** Descreva o que você e um colega fazem um pelo outro (each other).\n4. (5') Error Log: 1 regra por erro.\n\n**Listening oficial (25')** — Part 2 (opcional): 15 itens (app) — 0 min é permitido\n- Fonte: Sample Test/App (pp. 153–154). Foco: Manter contato.\n1. (3') Preview: leia as perguntas/opções (Part 3–4) ou prepare-se para o formato (Part 1–2).\n2. (15') Faça o set sem pausar o áudio.\n3. (7') Revisão: para cada erro, ouça de novo com transcript; classifique a causa (L/A/V/I) no Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G38 — A**\n1. yours\n2. himself\n3. each other\n4. I\n5. me\n6. my / mine\n\n**G38 — B**\n1. ✅ She introduced herself.\n2. ✅ Between you and me\n3. ✅ This pen is mine.\n4. ✅ He cut himself.","d":"2026-12-26","k":"Sábado"},{"n":342,"t":"domingo, 27/12/2026 · Domingo","b":"**Semana 13/18 · Fase 4 — Transição de prova (festas)** · faltam **33 dias** para a prova\n**Missão do dia:** Reparar + reset\n**Tempo ativo:** 30 min\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Reset semanal | 15 | Quiz + Scoreboard + plano |\n\n### Ponte com aulas antigas\n- Class Log de **29/11/2026** (4 semanas atrás): leia 3 erros/chunks e use 1 hoje na fala do quiz.\n\n### Passivo (fora da conta)\nSérie/filme com legenda em inglês (30 min, sem obrigação)\n- Francês: innerFrench — 1 épisode (podcast): https://innerfrench.com/podcast/\n\n### Guia detalhado\n**Reset semanal (15')**\n1. (5') **Quiz dos 20 chunks da semana** — olhe só o português e diga o chunk: (semana de revisão: use o Anki)\n2. (5') Error Log: escolha 3 erros repetidos e reescreva a regra.\n3. (5') Scoreboard e planejamento: o que fazer na semana 14 (próxima)? Confira a agenda de aulas.\n\n---\n**GABARITO (não olhe antes)**\n\n(sem itens com gabarito hoje)","d":"2026-12-27","k":"Domingo"},{"n":343,"t":"segunda-feira, 28/12/2026 · Plano operacional","b":"**Semana 14/18 · Fase 4 — Transição de prova (festas)** · faltam **32 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Festas — revisão leve 2\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Festas — revisão leve 2).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 4' no deck *Legacy* + 6' no deck *Active*.\n**Revisão de hoje (12 itens — tema: revisão dos temas Travel & Logistics · HR & Recruitment · Being Effective), sem cards novos:**\n   - **check in** — fazer check-in · *Please check in two hours early.*\n   - **board a flight** — embarcar em um voo · *Passengers may board the flight now.*\n   - **be delayed** — estar atrasado · *The train was delayed by an hour.*\n   - **be scheduled to depart** — estar programado para partir · *The bus is scheduled to depart at noon.*\n   - **make a reservation** — fazer uma reserva · *I made a reservation for two.*\n   - **book a flight** — reservar um voo · *She booked a flight to Lyon.*\n   - **boarding pass** — cartão de embarque · *Show your boarding pass at the gate.*\n   - **luggage allowance** — franquia de bagagem · *The luggage allowance is 23 kilos.*\n   - **layover** — escala · *We have a two-hour layover in Rome.*\n   - **itinerary** — itinerário · *Here is your itinerary.*\n   - **reserve a room** — reservar um quarto · *I'd like to reserve a room for Friday.*\n   - **check out** — fazer check-out · *Guests must check out by eleven.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Getting advice* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/getting-advice. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe a brand you admire and explain why.\"* — use pelo menos: **check in** e **board a flight**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **21/12/2026** (aula P1 anterior) e de **30/11/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2026-12-28","k":"Plano operacional"},{"n":344,"t":"segunda-feira, 28/12/2026 · Guia detalhado","b":"### Guia detalhado — 28/12/2026 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\n(semana de revisão)\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **21/12/2026** e de **30/11/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Festas — revisão leve 2*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana (G39).\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **G39** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2026-12-28","k":"Guia detalhado"},{"n":345,"t":"terça-feira, 29/12/2026 · Plano operacional","b":"**Semana 14/18 · Fase 4 — Transição de prova (festas)** · faltam **31 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Festas — revisão leve 2\n**Missão do dia:** Fixar G39 (Prepositions de tempo, lugar e movimento)\n**Tempo ativo:** 45 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 15 | Anki · Shadowing · Fala |\n| Gramática A — G39 | 30 | Prepositions de tempo, lugar e movimento |\n\n### Micro-blocos (15 min)\n**1) Anki — 8 min.** Revisões vencidas: 4' no deck *Legacy* + 6' no deck *Active*.\n**Revisão de hoje (12 itens — tema: revisão dos temas Travel & Logistics · HR & Recruitment · Being Effective), sem cards novos:**\n   - **front desk** — recepção · *Please ask at the front desk.*\n   - **complimentary breakfast** — café da manhã cortesia · *A complimentary breakfast is served daily.*\n   - **conference room** — sala de conferência · *The conference room seats twenty.*\n   - **catering** — serviço de buffet · *The catering was excellent.*\n   - **registration desk** — mesa de inscrição · *Collect your badge at the registration desk.*\n   - **venue** — local do evento · *The venue is near the station.*\n   - **keynote speaker** — palestrante principal · *The keynote speaker starts at nine.*\n   - **banquet** — banquete · *The banquet is on Saturday night.*\n   - **apply for** — candidatar-se a · *Apply for the job before Friday.*\n   - **be qualified for** — ser qualificado para · *She is qualified for the post.*\n   - **be hired** — ser contratado · *He was hired last week.*\n   - **be available** — estar disponível · *I am available from Monday.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 7 min.** Áudio da semana: *Getting advice* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/getting-advice. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What makes a good presentation?\"* — use pelo menos: **front desk** e **complimentary breakfast**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**28/12/2026**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Leitura · [ ] Error Log","d":"2026-12-29","k":"Plano operacional"},{"n":346,"t":"terça-feira, 29/12/2026 · Guia detalhado","b":"### Guia detalhado — 29/12/2026\n**Passo 1 — Recall da aula de ontem (3'):** abra o Class Log de **28/12/2026**; diga 3 erros/chunks.\n**Passo 2 — Estudo (12'):** leia **G39** neste documento (p. 49) e a página do British Council (procure “Prepositions” em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2). Explique cada regra em voz alta em 30 s.\nRegras-chave:\n- Tempo: at (hora, night), on (dia/data), in (mês/ano/estação/parte do dia); for (duração), since (início), during (dentro de), by (até essa data), until (continuamente até).\n- Lugar: at (ponto), in (espaço fechado), on (superfície). Movimento: to, into, out of, through, across.\n- Colocações: depend ON, interested IN, responsible FOR, different FROM, look FOR, wait FOR, apply FOR, arrive AT/IN.\n**Onde você costuma errar:** 'Depende de' → 'depends ON'; 'interessado em' → 'interested IN'. Memorize por bloco.\n**Passo 3 — Exercício A (12'):** responda por escrito.\n1. The meeting is ___ Monday.\n2. ___ 9 a.m.\n3. She was born ___ 1995.\n4. Submit the form ___ Friday (prazo).\n5. We waited ___ noon (continuamente).\n6. He is responsible ___ sales.\n**Passo 4 — Correção (3'):** compare com o gabarito no fim da página; para cada erro escreva **1 regra** no Error Log.\n**Passo 5 — Produção (2'):** Escreva 6 frases com in/on/at (tempo) sobre sua agenda desta semana.\n\n---\n**GABARITO (não olhe antes)**\n\n1. on\n2. At\n3. in\n4. by\n5. until\n6. for","d":"2026-12-29","k":"Guia detalhado"},{"n":347,"t":"quarta-feira, 30/12/2026 · Plano operacional","b":"**Semana 14/18 · Fase 4 — Transição de prova (festas)** · faltam **30 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Festas — revisão leve 2\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 4' no deck *Legacy* + 6' no deck *Active*.\n**Revisão de hoje (12 itens — tema: revisão dos temas Travel & Logistics · HR & Recruitment · Being Effective), sem cards novos:**\n   - **submit a résumé** — enviar um currículo · *Submit a résumé and a cover letter.*\n   - **conduct an interview** — conduzir uma entrevista · *The manager will conduct an interview.*\n   - **job description** — descrição do cargo · *Read the job description carefully.*\n   - **salary range** — faixa salarial · *The salary range is listed online.*\n   - **reference letter** — carta de referência · *She asked for a reference letter.*\n   - **onboarding** — integração de novos funcionários · *Onboarding takes one week.*\n   - **training program** — programa de treinamento · *The training program starts in June.*\n   - **performance review** — avaliação de desempenho · *Your performance review is on Monday.*\n   - **promote** — promover · *They promoted him to team leader.*\n   - **personnel** — pessoal / funcionários · *All personnel must wear badges.*\n   - **full-time position** — vaga em tempo integral · *It is a full-time position.*\n   - **part-time** — meio período · *She works part-time.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Getting advice* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/getting-advice. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Explain how to make your favorite dish.\"* — use pelo menos: **submit a résumé** e **conduct an interview**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **23/12/2026** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **28/12/2026**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2026-12-30","k":"Plano operacional"},{"n":348,"t":"quarta-feira, 30/12/2026 · Guia detalhado","b":"### Guia detalhado — 30/12/2026 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"Tell me about your year in five sentences.\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **23/12/2026** e os da aula P1 de **28/12/2026**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (G39 estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P02 (sentence stress) (p. 104).","d":"2026-12-30","k":"Guia detalhado"},{"n":349,"t":"quinta-feira, 31/12/2026 · Plano operacional","b":"**Semana 14/18 · Fase 4 — Transição de prova (festas)** · faltam **29 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Festas — revisão leve 2\n**Missão do dia:** Dia livre: 0 minutos obrigatórios.\n**Tempo ativo:** 0 (opcional 15) · **Versão mínima:** 0\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Nada obrigatório | 0 | Descanse |\n| Opcional | 15 | Anki 8 min + escuta de francês (RFI) 7 min |\n\n### Passivo (fora da conta)\n- TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n- RFI: https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Nada (está tudo certo)","d":"2026-12-31","k":"Plano operacional"},{"n":350,"t":"quinta-feira, 31/12/2026 · Guia detalhado","b":"### Guia detalhado — 31/12/2026 · Dia livre\n\nHoje 0 minutos é o correto. Se quiser, escolha **uma** opção leve:\n1. Anki: 8 min de revisão.\n2. Ouvir 1 episódio de RFI ou innerFrench.\n3. Ler em voz alta 5 frases do exercício de francês da semana (p. de referência F02).\n\nSem compensar depois. A quinta-feira de francês retoma normalmente na próxima semana.","d":"2026-12-31","k":"Guia detalhado"},{"n":351,"t":"sexta-feira, 01/01/2027 · Plano operacional","b":"**Semana 14/18 · Fase 4 — Transição de prova (festas)** · faltam **28 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Festas — revisão leve 2\n**Missão do dia:** Ano-Novo — opcional\n**Tempo ativo:** opcional (0 permitido) · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 15 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈8 | Opcional: 15 itens de Part 5 (6 min) — 0 min é permitido |\n| Revisão | 0 | Protocolo T32/T34 |\n| Log | 0 | Scoreboard |\n\n### Micro-blocos (15 min)\n**1) Anki — 8 min.** Revisões vencidas: 4' no deck *Legacy* + 6' no deck *Active*.\n**Revisão de hoje (12 itens — tema: revisão dos temas Travel & Logistics · HR & Recruitment · Being Effective), sem cards novos:**\n   - **make the most of** — aproveitar ao máximo · *Make the most of the workshop.*\n   - **keep track of** — acompanhar / manter registro · *Keep track of every expense.*\n   - **be on top of** — estar em dia com · *She is on top of her work.*\n   - **delegate a task** — delegar uma tarefa · *He delegated the task to Mia.*\n   - **time management** — gestão de tempo · *Time management is a key skill.*\n   - **stay organized** — manter-se organizado · *Use a planner to stay organized.*\n   - **be productive** — ser produtivo · *I'm more productive in the morning.*\n   - **run smoothly** — funcionar sem problemas · *The event ran smoothly.*\n   - **deal with a backlog** — lidar com um acúmulo · *We must deal with the backlog of orders.*\n   - **double-check** — conferir duas vezes · *Double-check the address.*\n   - **follow the procedure** — seguir o procedimento · *Please follow the procedure exactly.*\n   - **meet a requirement** — atender a um requisito · *The product meets every requirement.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 7 min.** Áudio da semana: *Getting advice* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/getting-advice. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Summarize the last film or series you watched.\"* — use pelo menos: **make the most of** e **keep track of**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**28/12/2026**) e Qua (**30/12/2026**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Festas — revisão leve 2*: https://www.ted.com/talks?q=Festas+%E2%80%94+revis%C3%A3o+leve+2\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2027-01-01","k":"Plano operacional"},{"n":352,"t":"sexta-feira, 01/01/2027 · Guia detalhado","b":"### Guia detalhado — 01/01/2027 · Dia livre\n\nHoje **0 minutos é o correto**. Se sentir vontade, escolha **uma** opção leve:\n1. 15 itens de Part 5 do app (6 min) — sem revisar.\n2. Anki 8 min.\n3. Ouvir 1 episódio do passivo.\n\nNada disso é obrigatório. Sem culpa; sem “compensar”. Na próxima terça retome o plano normal.\n\n**Checklist de retomada (segunda):** [ ] Class Log em dia · [ ] Anki < 100 revisões · [ ] Sono normal.","d":"2027-01-01","k":"Guia detalhado"},{"n":353,"t":"sábado, 02/01/2027 · Sábado","b":"**Semana 14/18 · Fase 4 — Transição de prova (festas)** · faltam **27 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Festas — revisão leve 2\n**Missão do dia:** Fixar G40 (Conjunctions e discourse markers) + Listening oficial\n**Tempo ativo:** opcional · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática B — G40 | 30 | Conjunctions e discourse markers |\n| Listening oficial | 25 | Part 2 (opcional) — 15 itens (app) — 0 min é permitido |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 28/12 e 30/12 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 02/01/2027\n\n**Gramática B — G40 (30')**\n1. (5') Leia G40 (p. 50) em voz alta. Exercício A (primeira exposição ao tópico: faça agora, com calma):\n1. ___ it was raining, we went out. (Although/Despite)\n2. ___ the rain, we went out.\n3. I was tired; ___, I finished. (however/because)\n4. He studied ___ pass the exam. (in order to/so)\n5. She is ___ smart ___ hard-working.\n6. The price rose; ___, sales fell. (therefore/although)\n2. (10') **Exercício B — corrija as frases**:\n1. ❌ *Despite it was late, we stayed.*\n2. ❌ *Although of the noise, he worked.*\n3. ❌ *I was hungry, but so I ate.*\n4. ❌ *Both she or he came.*\n3. (10') **Produção:** Escreva um parágrafo de 5 frases ligando ideias com however/therefore/although.\n4. (5') Error Log: 1 regra por erro.\n\n**Listening oficial (25')** — Part 2 (opcional): 15 itens (app) — 0 min é permitido\n- Fonte: Sample Test/App (pp. 153–154). Foco: Manter contato.\n1. (3') Preview: leia as perguntas/opções (Part 3–4) ou prepare-se para o formato (Part 1–2).\n2. (15') Faça o set sem pausar o áudio.\n3. (7') Revisão: para cada erro, ouça de novo com transcript; classifique a causa (L/A/V/I) no Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G40 — A**\n1. Although\n2. Despite\n3. however\n4. in order to\n5. both ... and\n6. therefore\n\n**G40 — B**\n1. ✅ Although it was late, we stayed.\n2. ✅ Despite the noise, he worked.\n3. ✅ I was hungry, so I ate.\n4. ✅ Both she and he came.","d":"2027-01-02","k":"Sábado"},{"n":354,"t":"domingo, 03/01/2027 · Domingo","b":"**Semana 14/18 · Fase 4 — Transição de prova (festas)** · faltam **26 dias** para a prova\n**Missão do dia:** Reparar + reset\n**Tempo ativo:** 30 min\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Reset semanal | 15 | Quiz + Scoreboard + plano |\n\n### Ponte com aulas antigas\n- Class Log de **06/12/2026** (4 semanas atrás): leia 3 erros/chunks e use 1 hoje na fala do quiz.\n\n### Passivo (fora da conta)\nSérie/filme com legenda em inglês (30 min, sem obrigação)\n- Francês: innerFrench — 1 épisode (podcast): https://innerfrench.com/podcast/\n\n### Guia detalhado\n**Reset semanal (15')**\n1. (5') **Quiz dos 20 chunks da semana** — olhe só o português e diga o chunk: (semana de revisão: use o Anki)\n2. (5') Error Log: escolha 3 erros repetidos e reescreva a regra.\n3. (5') Scoreboard e planejamento: o que fazer na semana 15 (próxima)? Confira a agenda de aulas.\n\n---\n**GABARITO (não olhe antes)**\n\n(sem itens com gabarito hoje)","d":"2027-01-03","k":"Domingo"},{"n":355,"t":"segunda-feira, 04/01/2027 · Plano operacional","b":"**Semana 15/18 · Fase 5 — Performance** · faltam **25 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Customer Service & Sales\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Customer Service & Sales).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Novos hoje (4):**\n   - **handle a complaint** — lidar com uma reclamação · *She handled the complaint politely.*\n   - **issue a refund** — emitir um reembolso · *We will issue a refund today.*\n   - **place an order** — fazer um pedido · *You can place an order online.*\n   - **customer satisfaction** — satisfação do cliente · *Customer satisfaction is our priority.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A lecture about an experiment* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/lecture-about-experiment. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"How has technology changed your field?\"* — use pelo menos: **handle a complaint** e **issue a refund**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **28/12/2026** (aula P1 anterior) e de **07/12/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2027-01-04","k":"Plano operacional"},{"n":356,"t":"segunda-feira, 04/01/2027 · Guia detalhado","b":"### Guia detalhado — 04/01/2027 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\nhandle a complaint, issue a refund, place an order, customer satisfaction, return policy, warranty, exchange a product, out of stock, backorder, special offer, sales representative, follow up on an order, track a package, shipping fee, apologize for the inconvenience, resolve a problem, customer feedback, give a discount, be on sale, damaged item\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **28/12/2026** e de **07/12/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Customer Service & Sales*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana (G42).\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **G42** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2027-01-04","k":"Guia detalhado"},{"n":357,"t":"terça-feira, 05/01/2027 · Plano operacional","b":"**Semana 15/18 · Fase 5 — Performance** · faltam **24 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Customer Service & Sales\n**Missão do dia:** Fixar G42 (B2 consolidation: complex sentences e error-driven grammar) + ler um texto\n**Tempo ativo:** 85 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki · Shadowing · Fala |\n| Gramática A — G42 | 35 | B2 consolidation: complex sentences e error-driven grammar |\n| Leitura 1 | 25 | Texto BC + exercícios |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 3' no deck *Legacy* + 7' no deck *Active*.\n**Novos hoje (4):**\n   - **return policy** — política de devolução · *Check our return policy.*\n   - **warranty** — garantia · *The laptop has a two-year warranty.*\n   - **exchange a product** — trocar um produto · *Can I exchange this shirt?*\n   - **out of stock** — fora de estoque · *That size is out of stock.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A lecture about an experiment* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/lecture-about-experiment. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Which skills matter most in your career?\"* — use pelo menos: **return policy** e **warranty**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**04/01/2027**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Leitura · [ ] Error Log","d":"2027-01-05","k":"Plano operacional"},{"n":358,"t":"terça-feira, 05/01/2027 · Guia detalhado","b":"### Guia detalhado — 05/01/2027\n**Passo 1 — Recall da aula de ontem (3'):** abra o Class Log de **04/01/2027**; diga 3 erros/chunks.\n**Passo 2 — Estudo (12'):** leia **G42** neste documento (p. 52) e a página do British Council (procure “Complex sentences” em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2). Explique cada regra em voz alta em 30 s.\nRegras-chave:\n- Combine orações: subordinadas (although, because), relativas, condicionais, passiva, reported speech. Ex.: 'Although the project was delayed, the team, which had worked overtime, delivered the report that the client had requested.'\n- Estratégia Part 5 em 5 passos: (1) ache o verbo; (2) ache o sujeito; (3) classifique a lacuna (substantivo/verbo/adj/adv); (4) teste colocação; (5) confirme sentido.\n- Error-driven: abra seu Error Log e liste os 5 padrões que mais se repetem; refaça o exercício B do tópico correspondente.\n**Onde você costuma errar:** Frases longas em português viram várias curtas em inglês; treine conectores para juntar sem traduzir palavra por palavra.\n**Passo 3 — Exercício A (15'):** responda por escrito.\n1. Although the meeting ___ (be) long, everyone stayed.\n2. The report, which ___ (write) by Ms. Lee, is ready.\n3. If she ___ (arrive) earlier, she would have met him.\n4. He asked me ___ I could help.\n5. The number of applicants ___ (be) high this year.\n6. Neither the manager nor the employees ___ (know) the answer.\n**Passo 4 — Correção (3'):** compare com o gabarito no fim da página; para cada erro escreva **1 regra** no Error Log.\n**Passo 5 — Produção (2'):** Escreva 3 frases longas (25+ palavras) combinando 3 estruturas.\n\n**Leitura 1 (25'):**\n**Texto:** *The Buy Nothing movement* (B2, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b2/buy-nothing-movement\n1. **Preparação (3')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (8')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (8')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (3')** — escolha 5 chunks úteis
