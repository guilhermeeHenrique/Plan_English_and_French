Gramática A — G22 | 35 | Adverbs e adjective x adverb |\n| Revisão do simulado | 25 | Protocolo T34 do Simulado 2 |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **reduce waste** — reduzir o desperdício · *We reduce waste in the kitchen.*\n   - **recycle materials** — reciclar materiais · *The factory recycles materials.*\n   - **renewable energy** — energia renovável · *The firm invests in renewable energy.*\n   - **energy-efficient** — eficiente em energia · *We bought energy-efficient lamps.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Business news* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/business-news. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Give a short opening for a team meeting.\"* — use pelo menos: **reduce waste** e **recycle materials**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**16/11/2026**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Revisão de simulado · [ ] Error Log","d":"2026-11-17","k":"Plano operacional"},{"n":274,"t":"terça-feira, 17/11/2026 · Guia detalhado","b":"### Guia detalhado — 17/11/2026\n**Passo 1 — Recall da aula de ontem (3'):** abra o Class Log de **16/11/2026**; diga 3 erros/chunks.\n**Passo 2 — Estudo (12'):** leia **G22** neste documento (p. 32) e a página do British Council (procure “Adverbs” em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2). Explique cada regra em voz alta em 30 s.\nRegras-chave:\n- Adjetivo descreve substantivo; advérbio descreve verbo, adjetivo ou outro advérbio: 'She speaks clearly.'\n- Formação: adjetivo + -ly (quick→quickly, careful→carefully). Irregulares: good→well, fast→fast, hard→hard (hardly = quase não), late→late (lately = recentemente).\n- Depois de be/seem/look/feel/sound use ADJETIVO: 'The plan looks good.'\n**Onde você costuma errar:** 'Ela fala bem' → 'She speaks WELL' (não 'good').\n**Passo 3 — Exercício A (15'):** responda por escrito.\n1. She speaks English very ___. (good/well)\n2. He drives ___. (careful/carefully)\n3. The plan seems ___. (good/well)\n4. Please answer ___. (quick/quickly)\n5. It's a ___ recommended hotel. (high/highly)\n6. He works ___ and gets tired. (hard/hardly)\n**Passo 4 — Correção (3'):** compare com o gabarito no fim da página; para cada erro escreva **1 regra** no Error Log.\n**Passo 5 — Produção (2'):** Descreva como você faz 3 tarefas usando advérbios (carefully, quickly, well).\n\n**Revisão do Simulado 2 (25'):**\n1. (8') Passada 1: refaça só os **erros**, achando a evidência exata (T34).\n2. (7') Passada 2: acertos por chute (marque e explique por que acertou).\n3. (5') Passada 3: acertos lentos (tempo > 90 s).\n4. (5') Escolha o **Top-3 de causas** (G/V/P/I/A/T/S/L) e escreva 3 regras/chunks. A sexta usa essas fraquezas.\nRegistre no Scoreboard (p. 161). Regras de decisão: Anexo D1 (p. 177).\n\n---\n**GABARITO (não olhe antes)**\n\n1. well\n2. carefully\n3. good\n4. quickly\n5. highly\n6. hard","d":"2026-11-17","k":"Guia detalhado"},{"n":275,"t":"quarta-feira, 18/11/2026 · Plano operacional","b":"**Semana 8/18 · Fase 3 — Integração e velocidade** · faltam **72 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Environment\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **carbon emissions** — emissões de carbono · *The plant cut carbon emissions.*\n   - **environmentally friendly** — ecologicamente correto · *The packaging is environmentally friendly.*\n   - **raise concern about** — levantar preocupação sobre · *Residents raised concern about noise.*\n   - **sustainable** — sustentável · *We use sustainable materials.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Business news* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/business-news. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Leave a voicemail to reschedule an appointment.\"* — use pelo menos: **carbon emissions** e **environmentally friendly**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **11/11/2026** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **16/11/2026**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2026-11-18","k":"Plano operacional"},{"n":276,"t":"quarta-feira, 18/11/2026 · Guia detalhado","b":"### Guia detalhado — 18/11/2026 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"What can companies do to protect the environment?\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **11/11/2026** e os da aula P1 de **16/11/2026**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (G22 estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P08 (-s) (p. 110).","d":"2026-11-18","k":"Guia detalhado"},{"n":277,"t":"quinta-feira, 19/11/2026 · Plano operacional","b":"**Semana 8/18 · Fase 3 — Integração e velocidade** · faltam **71 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Environment\n**Missão do dia:** Francês profundo: Subjonctif × indicatif (emplois)\n**Tempo ativo:** 100 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 10 | F03 — vowels |\n| Gramática FR | 20 | Subjonctif × indicatif (emplois) |\n| Expressions C1 | 10 | 4 expressões |\n| Production | 20 | Exprimez votre opinion sur le télétravail en alternant indic… |\n| Input C1 | 15 | Easy French — episodes |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **natural resources** — recursos naturais · *The country has many natural resources.*\n   - **dispose of** — descartar · *Dispose of batteries properly.*\n   - **be harmful to** — ser prejudicial a · *Smoke is harmful to health.*\n   - **protect the environment** — proteger o meio ambiente · *We must protect the environment.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Make a polite request to your boss.\"* — use pelo menos: **natural resources** e **dispose of**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**12/11/2026**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2026-11-19","k":"Plano operacional"},{"n":278,"t":"quinta-feira, 19/11/2026 · Guia detalhado","b":"### Guia detalhado — 19/11/2026 · Francês\n\n**1) Pronúncia (10')** — foco: F03 — vowels. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática (20')** — *Subjonctif × indicatif (emplois)*\nRegra: Subjonctif após vontade, sentimento, dúvida, necessidade e 'penser que' NEGATIVO. Indicatif após penser/croire/il est probable/après que (norma).\nExercícios:\n1. Je pense qu'il ___ (avoir) raison.\n2. Je ne pense pas qu'il ___ (avoir) raison.\n3. Je suis content que tu ___ (pouvoir) venir.\n4. Après que nous ___ (finir), nous partirons.\n5. Il est probable qu'elle ___ (venir).\n\n**3) Expressions C1 (10')** — leia, repita e escreva 1 frase própria com cada uma:\n- **il s'avère que** — verifica-se que · *Il s'avère que le rapport contient des erreurs.*\n- **il s'agit de** — trata-se de · *Il s'agit de convaincre les clients.*\n- **mettre l'accent sur** — dar ênfase a · *Le rapport met l'accent sur la qualité.*\n- **soulever une question** — levantar uma questão · *Cette étude soulève une question importante.*\n\n**4) Production (20')** — Exprimez votre opinion sur le télétravail en alternant indicatif et subjonctif (8 phrases).\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (15')** — Easy French — episodes: https://www.easyfrench.fm/episodes\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. a\n2. ait\n3. puisses\n4. aurons fini\n5. viendra","d":"2026-11-19","k":"Guia detalhado"},{"n":279,"t":"sexta-feira, 20/11/2026 · Plano operacional","b":"**Semana 8/18 · Fase 3 — Integração e velocidade** · faltam **70 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Environment\n**Missão do dia:** Reparo pós-Simulado 2\n**Tempo ativo:** 85 min · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈30 | 30 itens da Part mais fraca do Simulado 2 (série temática do app) |\n| Revisão | 20 | Protocolo T32/T34 |\n| Log | 5 | Scoreboard |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **switch to** — mudar para · *The office switched to LED lights.*\n   - **have an impact on** — ter impacto sobre · *Traffic has an impact on air quality.*\n   - **comply with regulations** — cumprir regulamentos · *Factories must comply with regulations.*\n   - **conserve energy** — conservar energia · *Turn off lights to conserve energy.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Business news* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/business-news. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Give feedback to a colleague.\"* — use pelo menos: **switch to** e **have an impact on**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**16/11/2026**) e Qua (**18/11/2026**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Environment*: https://www.ted.com/talks?q=Environment\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2026-11-20","k":"Plano operacional"},{"n":280,"t":"sexta-feira, 20/11/2026 · Guia detalhado","b":"### Guia detalhado — 20/11/2026 · TOEIC Reading oficial\n\n**Set do dia:** 30 itens da Part mais fraca do Simulado 2 (série temática do app)\n**Fonte oficial:** App: série temática da Part fraca (pp. 153–154)\n**Foco:** Top-3 causas do Simulado 2.\n\n**Passos**\n1. (5') Setup: celular no silêncio, cronômetro, folha de respostas; sem consultar nada durante o set.\n2. (≈30') Faça o set **cronometrado**. Marque com “?” os itens em que chutou. Anote o tempo por Part.\n3. (20') Revisão em 3 passadas: (1) erros com **evidência exata** (copie a frase do texto); (2) acertos por chute; (3) acertos lentos (>90 s). Classifique cada erro (G/V/P/I/A/T/S/L — T32).\n4. (5') Scoreboard (p. 161): acerto por Part, tempo, 3 causas principais.\n5. Crie **até 3 cards** (erros que se repetem) e volte para eles no domingo.\n\n**Regra:** não faça “só mais um set” hoje. A revisão é o treino.\n\n**Referência de estratégia desta semana:** T32, T34 (páginas 53–87).","d":"2026-11-20","k":"Guia detalhado"},{"n":281,"t":"sábado, 21/11/2026 · Sábado","b":"**Semana 8/18 · Fase 3 — Integração e velocidade** · faltam **69 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Environment\n**Missão do dia:** Fixar G23 (Comparatives e superlatives) e G24 (Modals: ability, permission, advice)\n**Tempo ativo:** 55 min · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática B — G23 | 30 | Comparatives e superlatives |\n| Gramática C — G24 | 25 | Modals: ability, permission, advice |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 16/11 e 18/11 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 21/11/2026\n\n**Gramática B — G23 (30')**\n1. (5') Leia G23 (p. 33) em voz alta. Exercício A (primeira exposição ao tópico: faça agora, com calma):\n1. This route is ___ than that one. (short)\n2. It's the ___ hotel in town. (expensive)\n3. Her English is ___ than mine. (good)\n4. He is not as ___ as his brother. (tall)\n5. The ___ we work, the ___ we finish. (hard/soon)\n6. That was the ___ meeting ever. (bad)\n2. (10') **Exercício B — corrija as frases**:\n1. ❌ *She is more taller than me.*\n2. ❌ *This is the most cheap option.*\n3. ❌ *He is more good than me.*\n4. ❌ *It's as bigger as ours.*\n3. (10') **Produção:** Compare 2 fornecedores/lojas e escolha 'the best' com 3 razões.\n4. (5') Error Log: 1 regra por erro.\n\n**Gramática C — G24 (25')** — dia de simulado amanhã: gramática no sábado.\n1. (5') Leia G24 (p. 34).\n2. (10') Exercício A:\n1. She ___ speak three languages. (can/cans)\n2. ___ I use your phone? (May/Do)\n3. You ___ see a doctor. (should/should to)\n4. He couldn't ___ the file. (open/opened)\n5. She ___ to help us. (is able)\n6. You ___ better leave now. (had/would)\n3. (5') Exercício B:\n1. ❌ *He can to swim.*\n2. ❌ *She cans speak Chinese.*\n3. ❌ *You should to rest.*\n4. ❌ *I didn't could go.*\n4. (5') Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G23 — A**\n1. shorter\n2. most expensive\n3. better\n4. tall\n5. harder / sooner\n6. worst\n\n**G23 — B**\n1. ✅ She is taller than me.\n2. ✅ This is the cheapest option.\n3. ✅ He is better than me.\n4. ✅ It's as big as ours.\n\n**G24 — A**\n1. can\n2. May\n3. should\n4. open\n5. is able to\n6. had\n\n**G24 — B**\n1. ✅ He can swim.\n2. ✅ She can speak Chinese.\n3. ✅ You should rest.\n4. ✅ I couldn't go.","d":"2026-11-21","k":"Sábado"},{"n":282,"t":"domingo, 22/11/2026 · Domingo","b":"**Semana 8/18 · Fase 3 — Integração e velocidade** · faltam **68 dias** para a prova\n**Missão do dia:** Fixar G24 + ler 1 texto + reset\n**Tempo ativo:** 55 min\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática C — G24 | 20 | Modals: ability, permission, advice |\n| Leitura 2 | 20 | Texto BC |\n| Reset semanal | 15 | Quiz + Scoreboard + plano |\n\n### Ponte com aulas antigas\n- Class Log de **25/10/2026** (4 semanas atrás): leia 3 erros/chunks e use 1 hoje na fala do quiz.\n\n### Passivo (fora da conta)\nSérie/filme com legenda em inglês (30 min, sem obrigação)\n- Francês: innerFrench — 1 épisode (podcast): https://innerfrench.com/podcast/\n\n### Guia detalhado\n**Gramática C — G24 (20')**\n1. (6') Leia G24 (p. 34) em voz alta.\n2. (10') Exercício A:\n1. She ___ speak three languages. (can/cans)\n2. ___ I use your phone? (May/Do)\n3. You ___ see a doctor. (should/should to)\n4. He couldn't ___ the file. (open/opened)\n5. She ___ to help us. (is able)\n6. You ___ better leave now. (had/would)\n3. (4') Produção: Dê 3 conselhos a alguém que vai fazer o TOEIC (should/had better).\n**Leitura 2 (20'):**\n**Texto:** *The legend of fairies* (B1, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b1/legend-fairies\n1. **Preparação (2')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (6')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (7')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (2')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n**Reset semanal (15')**\n1. (5') **Quiz dos 20 chunks da semana** — olhe só o português e diga o chunk: be made of, be designed to, be used for, be caused by, reduce waste, recycle materials, renewable energy, energy-efficient, carbon emissions, environmentally friendly, raise concern about, sustainable, natural resources, dispose of, be harmful to, protect the environment, switch to, have an impact on, comply with regulations, conserve energy\n2. (5') Error Log: escolha 3 erros repetidos e reescreva a regra.\n3. (5') Scoreboard e planejamento: o que fazer na semana 9 (próxima)? Confira a agenda de aulas.\n\n---\n**GABARITO (não olhe antes)**\n\n1. can\n2. May\n3. should\n4. open\n5. is able to\n6. had","d":"2026-11-22","k":"Domingo"},{"n":283,"t":"segunda-feira, 23/11/2026 · Plano operacional","b":"**Semana 9/18 · Fase 3 — Integração e velocidade** · faltam **67 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Leaders and Thinkers\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Leaders and Thinkers).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **come up with** — ter (uma ideia) · *She came up with a great plan.*\n   - **point out** — apontar · *He pointed out the risks.*\n   - **be known for** — ser conhecido por · *The firm is known for quality.*\n   - **play a role** — ter um papel · *Sales play a role in growth.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Creating a study group* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/creating-study-group. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Explain a process step by step.\"* — use pelo menos: **come up with** e **point out**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **16/11/2026** (aula P1 anterior) e de **26/10/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2026-11-23","k":"Plano operacional"},{"n":284,"t":"segunda-feira, 23/11/2026 · Guia detalhado","b":"### Guia detalhado — 23/11/2026 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\ncome up with, point out, be known for, play a role, take responsibility for, make a decision, set an example, inspire, motivate, be respected by, give credit to, have a vision, take the initiative, encourage, be open to, bring up an issue, raise a question, build trust, lead by example, think critically\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **16/11/2026** e de **26/10/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Leaders and Thinkers*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana (G25).\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **G25** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2026-11-23","k":"Guia detalhado"},{"n":285,"t":"terça-feira, 24/11/2026 · Plano operacional","b":"**Semana 9/18 · Fase 3 — Integração e velocidade** · faltam **66 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Leaders and Thinkers\n**Missão do dia:** Fixar G25 (Modals: obligation e necessity) + ler um texto\n**Tempo ativo:** 85 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki · Shadowing · Fala |\n| Gramática A — G25 | 35 | Modals: obligation e necessity |\n| Leitura 1 | 25 | Texto BC + exercícios |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **take responsibility for** — assumir responsabilidade por · *He took responsibility for the error.*\n   - **make a decision** — tomar uma decisão · *We must make a decision today.*\n   - **set an example** — dar exemplo · *Managers should set an example.*\n   - **inspire** — inspirar · *Her speech inspired the team.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Creating a study group* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/creating-study-group. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Talk about a teacher you admire.\"* — use pelo menos: **take responsibility for** e **make a decision**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**23/11/2026**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Leitura · [ ] Error Log","d":"2026-11-24","k":"Plano operacional"},{"n":286,"t":"terça-feira, 24/11/2026 · Guia detalhado","b":"### Guia detalhado — 24/11/2026\n**Passo 1 — Recall da aula de ontem (3'):** abra o Class Log de **23/11/2026**; diga 3 erros/chunks.\n**Passo 2 — Estudo (12'):** leia **G25** neste documento (p. 35) e a página do British Council (procure “Modal verbs: must / have to” em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2). Explique cada regra em voz alta em 30 s.\nRegras-chave:\n- must = obrigação forte/interna; have to = obrigação externa (regra); need to = necessário.\n- mustn't = PROIBIDO; don't have to = NÃO é necessário; needn't = não precisa.\n- Passado: had to (must não tem passado).\n**Onde você costuma errar:** 'Não precisa' ≠ 'proibido': 'You don't have to come' (opcional) × 'You mustn't park here' (proibido).\n**Passo 3 — Exercício A (15'):** responda por escrito.\n1. Employees ___ wear badges (regra).\n2. You ___ park here. It's forbidden.\n3. You ___ come early; it's optional.\n4. She ___ work late yesterday.\n5. Do we ___ sign this?\n6. I ___ call my boss now.\n**Passo 4 — Correção (3'):** compare com o gabarito no fim da página; para cada erro escreva **1 regra** no Error Log.\n**Passo 5 — Produção (2'):** Liste 3 regras do seu local de estudo/trabalho (must / mustn't / don't have to).\n\n**Leitura 1 (25'):**\n**Texto:** *Work–life balance* (B2, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b2/work-life-balance\n1. **Preparação (3')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (8')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (8')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (3')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n\n---\n**GABARITO (não olhe antes)**\n\n1. must / have to\n2. mustn't\n3. don't have to\n4. had to\n5. have to\n6. must / need to","d":"2026-11-24","k":"Guia detalhado"},{"n":287,"t":"quarta-feira, 25/11/2026 · Plano operacional","b":"**Semana 9/18 · Fase 3 — Integração e velocidade** · faltam **65 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Leaders and Thinkers\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **motivate** — motivar · *Praise can motivate staff.*\n   - **be respected by** — ser respeitado por · *She is respected by her colleagues.*\n   - **give credit to** — dar crédito a · *Give credit to the whole team.*\n   - **have a vision** — ter uma visão · *The CEO has a clear vision.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Creating a study group* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/creating-study-group. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What are the benefits of teamwork?\"* — use pelo menos: **motivate** e **be respected by**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **18/11/2026** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **23/11/2026**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2026-11-25","k":"Plano operacional"},{"n":288,"t":"quarta-feira, 25/11/2026 · Guia detalhado","b":"### Guia detalhado — 25/11/2026 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"Who is a leader you admire, and why?\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **18/11/2026** e os da aula P1 de **23/11/2026**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (G25 estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P09 (linking) (p. 111).","d":"2026-11-25","k":"Guia detalhado"},{"n":289,"t":"quinta-feira, 26/11/2026 · Plano operacional","b":"**Semana 9/18 · Fase 3 — Integração e velocidade** · faltam **64 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Leaders and Thinkers\n**Missão do dia:** Francês profundo: Connecteurs : cause et conséquence (F14)\n**Tempo ativo:** 100 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 10 | F02 — enchaînements |\n| Gramática FR | 20 | Connecteurs : cause et conséquence (F14) |\n| Expressions C1 | 10 | 4 expressões |\n| Production | 20 | Rédigez un paragraphe cause/conséquence sur un phénomène soc… |\n| Input C1 | 15 | RFI — Journal en français facile |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **take the initiative** — tomar a iniciativa · *He took the initiative to help.*\n   - **encourage** — incentivar · *We encourage new ideas.*\n   - **be open to** — estar aberto a · *Are you open to feedback?*\n   - **bring up an issue** — levantar um problema · *She brought up an issue at the meeting.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"How would you cut costs in a small company?\"* — use pelo menos: **take the initiative** e **encourage**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**19/11/2026**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2026-11-26","k":"Plano operacional"},{"n":290,"t":"quinta-feira, 26/11/2026 · Guia detalhado","b":"### Guia detalhado — 26/11/2026 · Francês\n\n**1) Pronúncia (10')** — foco: F02 — enchaînements. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática (20')** — *Connecteurs : cause et conséquence (F14)*\nRegra: Cause: parce que, car, puisque, grâce à (positivo), à cause de (negativo). Conséquência: donc, par conséquent, si bien que, tellement/si ... que.\nExercícios:\n1. Il est en retard ___ le train a été annulé. (à cause de / parce que)\n2. ___ la grève, le train est annulé. (Grâce à / À cause de)\n3. Il a beaucoup travaillé, ___ il a réussi. (donc / car)\n4. Il était ___ fatigué ___ il s'est endormi.\n5. ___ tu es là, aide-moi. (Puisque / Parce que)\n\n**3) Expressions C1 (10')** — leia, repita e escreva 1 frase própria com cada uma:\n- **étant donné que** — dado que · *Étant donné que le budget est limité, nous attendrons.*\n- **du fait que** — pelo fato de · *Du fait que le prix a baissé, les ventes montent.*\n- **c'est pourquoi** — é por isso que · *C'est pourquoi nous avons décidé de reporter.*\n- **par conséquent** — por conseguinte · *Par conséquent, la réunion est annulée.*\n\n**4) Production (20')** — Rédigez un paragraphe cause/conséquence sur un phénomène social (10 lignes).\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (15')** — RFI — Journal en français facile: https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. parce que\n2. À cause de\n3. donc\n4. si ... qu'\n5. Puisque","d":"2026-11-26","k":"Guia detalhado"},{"n":291,"t":"sexta-feira, 27/11/2026 · Plano operacional","b":"**Semana 9/18 · Fase 3 — Integração e velocidade** · faltam **63 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Leaders and Thinkers\n**Missão do dia:** Part 7 triple + Part 5\n**Tempo ativo:** 85 min · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈30 | Part 7 triple: 15 itens (22 min) + Part 5: 10 itens (4 min) |\n| Revisão | 20 | Protocolo T32/T34 |\n| Log | 5 | Scoreboard |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **raise a question** — levantar uma questão · *Let me raise a question about costs.*\n   - **build trust** — construir confiança · *Honest talk builds trust.*\n   - **lead by example** — liderar pelo exemplo · *Good leaders lead by example.*\n   - **think critically** — pensar criticamente · *Students learn to think critically.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Creating a study group* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/creating-study-group. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Summarize this week's reading in sixty seconds.\"* — use pelo menos: **raise a question** e **build trust**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**23/11/2026**) e Qua (**25/11/2026**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Leaders and Thinkers*: https://www.ted.com/talks?q=Leaders+and+Thinkers\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2026-11-27","k":"Plano operacional"},{"n":292,"t":"sexta-feira, 27/11/2026 · Guia detalhado","b":"### Guia detalhado — 27/11/2026 · TOEIC Reading oficial\n\n**Set do dia:** Part 7 triple: 15 itens (22 min) + Part 5: 10 itens (4 min)\n**Fonte oficial:** App: séries de Part 7 múltipla + Part 5 (pp. 153–154)\n**Foco:** Cruzar informações entre textos.\n\n**Passos**\n1. (5') Setup: celular no silêncio, cronômetro, folha de respostas; sem consultar nada durante o set.\n2. (≈30') Faça o set **cronometrado**. Marque com “?” os itens em que chutou. Anote o tempo por Part.\n3. (20') Revisão em 3 passadas: (1) erros com **evidência exata** (copie a frase do texto); (2) acertos por chute; (3) acertos lentos (>90 s). Classifique cada erro (G/V/P/I/A/T/S/L — T32).\n4. (5') Scoreboard (p. 161): acerto por Part, tempo, 3 causas principais.\n5. Crie **até 3 cards** (erros que se repetem) e volte para eles no domingo.\n\n**Regra:** não faça “só mais um set” hoje. A revisão é o treino.\n\n**Referência de estratégia desta semana:** T27, T29 (páginas 53–87).","d":"2026-11-27","k":"Guia detalhado"},{"n":293,"t":"sábado, 28/11/2026 · Sábado","b":"**Semana 9/18 · Fase 3 — Integração e velocidade** · faltam **62 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Leaders and Thinkers\n**Missão do dia:** Fixar G26 (Modals: possibility e deduction) e G27 (Gerunds e infinitives)\n**Tempo ativo:** 55 min · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática B — G26 | 30 | Modals: possibility e deduction |\n| Gramática C — G27 | 25 | Gerunds e infinitives |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 23/11 e 25/11 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 28/11/2026\n\n**Gramática B — G26 (30')**\n1. (5') Leia G26 (p. 36) em voz alta. Exercício A (primeira exposição ao tópico: faça agora, com calma):\n1. He isn't answering. He ___ be busy. (may/should)\n2. She has worked for 12 hours. She ___ be exhausted.\n3. That ___ be true; it's impossible.\n4. The package ___ have arrived yet. (might not/can)\n5. He ___ have forgotten the meeting.\n6. It ___ rain later. (could/must)\n2. (10') **Exercício B — corrija as frases**:\n1. ❌ *He must to be at home.*\n2. ❌ *She can be late. (possível)*\n3. ❌ *They must has left.*\n4. ❌ *That mustn't be true.*\n3. (10') **Produção:** Dê 3 deduções sobre uma pessoa (chegou cansada, sem casaco...) usando must/might/can't.\n4. (5') Error Log: 1 regra por erro.\n\n**Gramática C — G27 (25')** — dia de simulado amanhã: gramática no sábado.\n1. (5') Leia G27 (p. 37).\n2. (10') Exercício A:\n1. We decided ___ (hire) two people.\n2. She avoids ___ (talk) about money.\n3. I look forward to ___ (meet) you.\n4. He agreed ___ (help).\n5. Would you mind ___ (close) the door?\n6. They plan ___ (open) a new branch.\n3. (5') Exercício B:\n1. ❌ *She enjoys to work here.*\n2. ❌ *He wants finishing early.*\n3. ❌ *I look forward to meet you.*\n4. ❌ *They suggested to postpone it.*\n4. (5') Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G26 — A**\n1. may\n2. must\n3. can't\n4. might not\n5. must\n6. could\n\n**G26 — B**\n1. ✅ He must be at home.\n2. ✅ She might/could be late.\n3. ✅ They must have left.\n4. ✅ That can't be true.\n\n**G27 — A**\n1. to hire\n2. talking\n3. meeting\n4. to help\n5. closing\n6. to open\n\n**G27 — B**\n1. ✅ She enjoys working here.\n2. ✅ He wants to finish early.\n3. ✅ I look forward to meeting you.\n4. ✅ They suggested postponing it.","d":"2026-11-28","k":"Sábado"},{"n":294,"t":"domingo, 29/11/2026 · Domingo","b":"**Semana 9/18 · Fase 3 — Integração e velocidade** · faltam **61 dias** para a prova\n**Missão do dia:** Fixar G27 + ler 1 texto + reset\n**Tempo ativo:** 55 min\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática C — G27 | 20 | Gerunds e infinitives |\n| Leitura 2 | 20 | Texto BC |\n| Reset semanal | 15 | Quiz + Scoreboard + plano |\n\n### Ponte com aulas antigas\n- Class Log de **01/11/2026** (4 semanas atrás): leia 3 erros/chunks e use 1 hoje na fala do quiz.\n\n### Passivo (fora da conta)\nSérie/filme com legenda em inglês (30 min, sem obrigação)\n- Francês: innerFrench — 1 épisode (podcast): https://innerfrench.com/podcast/\n\n### Guia detalhado\n**Gramática C — G27 (20')**\n1. (6') Leia G27 (p. 37) em voz alta.\n2. (10') Exercício A:\n1. We decided ___ (hire) two people.\n2. She avoids ___ (talk) about money.\n3. I look forward to ___ (meet) you.\n4. He agreed ___ (help).\n5. Would you mind ___ (close) the door?\n6. They plan ___ (open) a new branch.\n3. (4') Produção: Complete: 'I enjoy... / I want to... / I look forward to...' (2 finais cada).\n**Leitura 2 (20'):**\n**Texto:** *Instant messages* (B2, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b2/instant-messages\n1. **Preparação (2')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (6')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (7')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (2')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n**Reset semanal (15')**\n1. (5') **Quiz dos 20 chunks da semana** — olhe só o português e diga o chunk: come up with, point out, be known for, play a role, take responsibility for, make a decision, set an example, inspire, motivate, be respected by, give credit to, have a vision, take the initiative, encourage, be open to, bring up an issue, raise a question, build trust, lead by example, think critically\n2. (5') Error Log: escolha 3 erros repetidos e reescreva a regra.\n3. (5') Scoreboard e planejamento: o que fazer na semana 10 (próxima)? Confira a agenda de aulas.\n\n---\n**GABARITO (não olhe antes)**\n\n1. to hire\n2. talking\n3. meeting\n4. to help\n5. closing\n6. to open","d":"2026-11-29","k":"Domingo"},{"n":295,"t":"segunda-feira, 30/11/2026 · Plano operacional","b":"**Semana 10/18 · Fase 3 — Integração e velocidade** · faltam **60 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Well-being\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Well-being).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **take care of** — cuidar de · *Take care of your health.*\n   - **cope with** — lidar com / suportar · *How do you cope with stress?*\n   - **find a balance** — encontrar equilíbrio · *Try to find a balance between work and rest.*\n   - **get enough rest** — descansar o suficiente · *You need to get enough rest.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Film reviews* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/film-reviews. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe your typical morning routine.\"* — use pelo menos: **take care of** e **cope with**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **23/11/2026** (aula P1 anterior) e de **02/11/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2026-11-30","k":"Plano operacional"},{"n":296,"t":"segunda-feira, 30/11/2026 · Guia detalhado","b":"### Guia detalhado — 30/11/2026 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\ntake care of, cope with, find a balance, get enough rest, suffer from, stay in shape, reduce stress, health insurance, sick leave, paid vacation, flexible hours, work from home, burnout, take a break, be under pressure, benefits package, ergonomic, regular checkup, be in good health, a healthy lifestyle\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **23/11/2026** e de **02/11/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Well-being*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana (G28).\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **G28** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2026-11-30","k":"Guia detalhado"},{"n":297,"t":"terça-feira, 01/12/2026 · Plano operacional","b":"**Semana 10/18 · Fase 3 — Integração e velocidade** · faltam **59 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Well-being\n**Missão do dia:** Fixar G28 (Verb patterns e complementos) + ler um texto\n**Tempo ativo:** 85 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki · Shadowing · Fala |\n| Gramática A — G28 | 35 | Verb patterns e complementos |\n| Leitura 1 | 25 | Texto BC + exercícios |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **suffer from** — sofrer de · *Many workers suffer from stress.*\n   - **stay in shape** — manter a forma · *She runs to stay in shape.*\n   - **reduce stress** — reduzir o estresse · *Breaks help reduce stress.*\n   - **health insurance** — seguro de saúde · *The firm provides health insurance.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Film reviews* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/film-reviews. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Tell me about a project you are proud of.\"* — use pelo menos: **suffer from** e **stay in shape**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**30/11/2026**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Leitura · [ ] Error Log","d":"2026-12-01","k":"Plano operacional"},{"n":298,"t":"terça-feira, 01/12/2026 · Guia detalhado","b":"### Guia detalhado — 01/12/2026\n**Passo 1 — Recall da aula de ontem (3'):** abra o Class Log de **30/11/2026**; diga 3 erros/chunks.\n**Passo 2 — Estudo (12'):** leia **G28** neste documento (p. 38) e a página do British Council (procure “Verb patterns” em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2). Explique cada regra em voz alta em 30 s.\nRegras-chave:\n- verbo + objeto + to: want/ask/tell/allow/expect/remind/advise someone TO do.\n- make/let + objeto + base (sem to): 'She let me leave.'\n- say/think/believe/suggest + (that) + oração.\n**Onde você costuma errar:** 'Ele me explicou' ✗ 'explained me' → 'explained it to me'.\n**Passo 3 — Exercício A (15'):** responda por escrito.\n1. The manager asked me ___ (send) the file.\n2. She let us ___ (leave) early.\n3. He explained the plan ___ me.\n4. They allowed employees ___ (work) from home.\n5. I suggest ___ we postpone.\n6. She reminded him ___ (call) the client.\n**Passo 4 — Correção (3'):** compare com o gabarito no fim da página; para cada erro escreva **1 regra** no Error Log.\n**Passo 5 — Produção (2'):** Escreva 4 frases com ask/tell/allow/remind + pessoa + to.\n\n**Leitura 1 (25'):**\n**Texto:** *Cultural expectations and leadership* (B2, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b2/cultural-expectations-leadership\n1. **Preparação (3')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (8')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (8')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (3')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n\n---\n**GABARITO (não olhe antes)**\n\n1. to send\n2. leave\n3. to\n4. to work\n5. that\n6. to call","d":"2026-12-01","k":"Guia detalhado"},{"n":299,"t":"quarta-feira, 02/12/2026 · Plano operacional","b":"**Semana 10/18 · Fase 3 — Integração e velocidade** · faltam **58 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Well-being\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **sick leave** — licença médica · *He is on sick leave.*\n   - **paid vacation** — férias remuneradas · *Staff get twenty days of paid vacation.*\n   - **flexible hours** — horário flexível · *We offer flexible hours.*\n   - **work from home** — trabalhar de casa · *I work from home on Fridays.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Film reviews* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/film-reviews. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What are the pros and cons of working from home?\"* — use pelo menos: **sick leave** e **paid vacation**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **25/11/2026** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **30/11/2026**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2026-12-02","k":"Plano operacional"},{"n":300,"t":"quarta-feira, 02/12/2026 · Guia detalhado","b":"### Guia detalhado — 02/12/2026 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"How do you deal with stress?\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **25/11/2026** e os da aula P1 de **30/11/2026**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (G28 estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P10 (weak forms) (p. 112).","d":"2026-12-02","k":"Guia detalhado"},{"n":301,"t":"quinta-feira, 03/12/2026 · Plano operacional","b":"**Semana 10/18 · Fase 3 — Integração e velocidade** · faltam **57 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Well-being\n**Missão do dia:** Francês profundo: Opposition et concession\n**Tempo ativo:** 100 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 10 | F04 — nasals |\n| Gramática FR | 20 | Opposition et concession |\n| Expressions C1 | 10 | 4 expressões |\n| Production | 20 | Rédigez un paragraphe nuancé « pour et contre » (10 lignes) … |\n| Input C1 | 15 | innerFrench — podcast |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **burnout** — esgotamento · *Long hours can lead to burnout.*\n   - **take a break** — fazer uma pausa · *Let's take a break.*\n   - **be under pressure** — estar sob pressão · *She is under pressure to deliver.*\n   - **benefits package** — pacote de benefícios · *The benefits package is generous.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe a problem you solved recently.\"* — use pelo menos: **burnout** e **take a break**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**26/11/2026**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2026-12-03","k":"Plano operacional"},{"n":302,"t":"quinta-feira, 03/12/2026 · Guia detalhado","b":"### Guia detalhado — 03/12/2026 · Francês\n\n**1) Pronúncia (10')** — foco: F04 — nasals. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática (20')** — *Opposition et concession*\nRegra: bien que/quoique + subjonctif; malgré/en dépit de + nome; pourtant/cependant/néanmoins (frases); alors que/tandis que (contraste); en revanche.\nExercícios:\n1. ___ il pleuve, nous sortons.\n2. ___ la pluie, nous sortons.\n3. Il est jeune ; ___, il est très expérimenté.\n4. Elle aime la ville, ___ lui préfère la campagne.\n5. Le prix est élevé ; ___, la qualité est excellente.\n\n**3) Expressions C1 (10')** — leia, repita e escreva 1 frase própria com cada uma:\n- **certes… mais** — é verdade… mas · *Certes, c'est cher, mais c'est fiable.*\n- **néanmoins** — não obstante · *Néanmoins, il faut rester prudent.*\n- **il n'en reste pas moins que** — ainda assim permanece que · *Il n'en reste pas moins que le risque existe.*\n- **aussi bien… que** — tanto… quanto · *Aussi bien les élèves que les profs sont concernés.*\n\n**4) Production (20')** — Rédigez un paragraphe nuancé « pour et contre » (10 lignes) avec 3 concessions.\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (15')** — innerFrench — podcast: https://innerfrench.com/podcast/\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. Bien qu'\n2. Malgré\n3. pourtant / cependant\n4. alors que / tandis que\n5. en revanche","d":"2026-12-03","k":"Guia detalhado"},{"n":303,"t":"sexta-feira, 04/12/2026 · Plano operacional","b":"**Semana 10/18 · Fase 3 — Integração e velocidade** · faltam **56 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Well-being\n**Missão do dia:** Part 7 intensivo\n**Tempo ativo:** 85 min · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈30 | Part 7 single: 29 itens em 30 min (cronometrado) |\n| Revisão | 20 | Protocolo T32/T34 |\n| Log | 5 | Scoreboard |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **ergonomic** — ergonômico · *We bought ergonomic chairs.*\n   - **regular checkup** — exame de rotina · *Have a regular checkup every year.*\n   - **be in good health** — estar com boa saúde · *He is in good health.*\n   - **a healthy lifestyle** — um estilo de vida saudável · *A healthy lifestyle boosts energy.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Film reviews* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/film-reviews. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What does a good manager do?\"* — use pelo menos: **ergonomic** e **regular checkup**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**30/11/2026**) e Qua (**02/12/2026**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Well-being*: https://www.ted.com/talks?q=Well-being\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2026-12-04","k":"Plano operacional"},{"n":304,"t":"sexta-feira, 04/12/2026 · Guia detalhado","b":"### Guia detalhado — 04/12/2026 · TOEIC Reading oficial\n\n**Set do dia:** Part 7 single: 29 itens em 30 min (cronometrado)\n**Fonte oficial:** App: teste semi-real nº 3 (Part 7) (pp. 153–154)\n**Foco:** Ritmo de ~1 min por item.\n\n**Passos**\n1. (5') Setup: celular no silêncio, cronômetro, folha de respostas; sem consultar nada durante o set.\n2. (≈30') Faça o set **cronometrado**. Marque com “?” os itens em que chutou. Anote o tempo por Part.\n3. (20') Revisão em 3 passadas: (1) erros com **evidência exata** (copie a frase do texto); (2) acertos por chute; (3) acertos lentos (>90 s). Classifique cada erro (G/V/P/I/A/T/S/L — T32).\n4. (5') Scoreboard (p. 161): acerto por Part, tempo, 3 causas principais.\n5. Crie **até 3 cards** (erros que se repetem) e volte para eles no domingo.\n\n**Regra:** não faça “só mais um set” hoje. A revisão é o treino.\n\n**Referência de estratégia desta semana:** T22, T29 (páginas 53–87).","d":"2026-12-04","k":"Guia detalhado"},{"n":305,"t":"sábado, 05/12/2026 · Sábado","b":"**Semana 10/18 · Fase 3 — Integração e velocidade** · faltam **55 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Well-being\n**Missão do dia:** Fixar G29 (Passive voice: base) e G30 (Passive voice: advanced e reporting)\n**Tempo ativo:** 55 min · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática B — G29 | 30 | Passive voice: base |\n| Gramática C — G30 | 25 | Passive voice: advanced e reporting |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 30/11 e 02/12 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 05/12/2026\n\n**Gramática B — G29 (30')**\n1. (5') Leia G29 (p. 39) em voz alta. Exercício A (primeira exposição ao tópico: faça agora, com calma):\n1. The invoices ___ (send) every Friday.\n2. The report ___ (write) by Ms. Lee.\n3. The office ___ (clean) at the moment.\n4. The order ___ (not/deliver) yet.\n5. New staff ___ (hire) next month.\n6. The meeting ___ (cancel).\n2. (10') **Exercício B — corrija as frases**:\n1. ❌ *The problem was happened yesterday.*\n2. ❌ *The report is write by Tom.*\n3. ❌ *The package has delivered.*\n4. ❌ *The office is cleaning every day.*\n3. (10') **Produção:** Transforme 4 frases ativas do seu dia em passivas.\n4. (5') Error Log: 1 regra por erro.\n\n**Gramática C — G30 (25')** — dia de simulado amanhã: gramática no sábado.\n1. (5') Leia G30 (p. 40).\n2. (10') Exercício A:\n1. The form must ___ (sign) by the manager.\n2. He ___ (give) a new laptop.\n3. It is ___ (believe) that prices will rise.\n4. The company is said ___ (plan) a merger.\n5. We had the office ___ (paint).\n6. The files can ___ (find) online.\n3. (5') Exercício B:\n1. ❌ *The form must signed.*\n2. ❌ *They gave me be a badge.*\n3. ❌ *We had repaired the printer (mandamos alguém).*\n4. ❌ *It says that he is rich.*\n4. (5') Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G29 — A**\n1. are sent\n2. was written\n3. is being cleaned\n4. hasn't been delivered\n5. will be hired\n6. was cancelled\n\n**G29 — B**\n1. ✅ The problem happened yesterday.\n2. ✅ The report is written by Tom.\n3. ✅ The package has been delivered.\n4. ✅ The office is cleaned every day.\n\n**G30 — A**\n1. be signed\n2. was given\n3. believed\n4. to be planning\n5. painted\n6. be found\n\n**G30 — B**\n1. ✅ The form must be signed.\n2. ✅ I was given a badge.\n3. ✅ We had the printer repaired.\n4. ✅ He is said to be rich.","d":"2026-12-05","k":"Sábado"},{"n":306,"t":"domingo, 06/12/2026 · Domingo","b":"**Semana 10/18 · Fase 3 — Integração e velocidade** · faltam **54 dias** para a prova\n**Missão do dia:** Fixar G30 + ler 1 texto + reset\n**Tempo ativo:** 55 min\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática C — G30 | 20 | Passive voice: advanced e reporting |\n| Leitura 2 | 20 | Texto BC |\n| Reset semanal | 15 | Quiz + Scoreboard + plano |\n\n### Ponte com aulas antigas\n- Class Log de **08/11/2026** (4 semanas atrás): leia 3 erros/chunks e use 1 hoje na fala do quiz.\n\n### Passivo (fora da conta)\nSérie/filme com legenda em inglês (30 min, sem obrigação)\n- Francês: innerFrench — 1 épisode (podcast): https://innerfrench.com/podcast/\n\n### Guia detalhado\n**Gramática C — G30 (20')**\n1. (6') Leia G30 (p. 40) em voz alta.\n2. (10') Exercício A:\n1. The form must ___ (sign) by the manager.\n2. He ___ (give) a new laptop.\n3. It is ___ (believe) that prices will rise.\n4. The company is said ___ (plan) a merger.\n5. We had the office ___ (paint).\n6. The files can ___ (find) online.\n3. (4') Produção: Escreva 3 avisos de escritório com 'must be' e 'are required to'.\n**Leitura 2 (20'):**\n**Texto:** *Millennials in the workplace* (B2, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b2/millennials-workplace\n1. **Preparação (2')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (6')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (7')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (2')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n**Reset semanal (15')**\n1. (5') **Quiz dos 20 chunks da semana** — olhe só o português e diga o chunk: take care of, cope with, find a balance, get enough rest, suffer from, stay in shape, reduce stress, health insurance, sick leave, paid vacation, flexible hours, work from home, burnout, take a break, be under pressure, benefits package, ergonomic, regular checkup, be in good health, a healthy lifestyle\n2. (5') Error Log: escolha 3 erros repetidos e reescreva a regra.\n3. (5') Scoreboard e planejamento: o que fazer na semana 11 (próxima)? Confira a agenda de aulas.\n\n---\n**GABARITO (não olhe antes)**\n\n1. be signed\n2. was given\n3. believed\n4. to be planning\n5. painted\n6. be found","d":"2026-12-06","k":"Domingo"},{"n":307,"t":"segunda-feira, 07/12/2026 · Plano operacional","b":"**Semana 11/18 · Fase 3 — Integração e velocidade** · faltam **53 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Travel & Logistics\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Travel & Logistics).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **check in** — fazer check-in · *Please check in two hours early.*\n   - **board a flight** — embarcar em um voo · *Passengers may board the flight now.*\n   - **be delayed** — estar atrasado · *The train was delayed by an hour.*\n   - **be scheduled to depart** — estar programado para partir · *The bus is scheduled to depart at noon.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Joining a gym* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/joining-gym. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Explain your studies to someone who knows nothing about them.\"* — use pelo menos: **check in** e **board a flight**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **30/11/2026** (aula P1 anterior) e de **09/11/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2026-12-07","k":"Plano operacional"},{"n":308,"t":"segunda-feira, 07/12/2026 · Guia detalhado","b":"### Guia detalhado — 07/12/2026 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\ncheck in, board a flight, be delayed, be scheduled to depart, make a reservation, book a flight, boarding pass, luggage allowance, layover, itinerary, reserve a room, check out, front desk, complimentary breakfast, conference room, catering, registration desk, venue, keynote speaker, banquet\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **30/11/2026** e de **09/11/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Travel & Logistics*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana (G31).\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **G31** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2026-12-07","k":"Guia detalhado"},{"n":309,"t":"terça-feira, 08/12/2026 · Plano operacional","b":"**Semana 11/18 · Fase 3 — Integração e velocidade** · faltam **52 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Travel & Logistics\n**Missão do dia:** Fixar G31 (Relative clauses: defining) + ler um texto\n**Tempo ativo:** 85 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki · Shadowing · Fala |\n| Gramática A — G31 | 35 | Relative clauses: defining |\n| Leitura 1 | 25 | Texto BC + exercícios |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **make a reservation** — fazer uma reserva · *I made a reservation for two.*\n   - **book a flight** — reservar um voo · *She booked a flight to Lyon.*\n   - **boarding pass** — cartão de embarque · *Show your boarding pass at the gate.*\n   - **luggage allowance** — franquia de bagagem · *The luggage allowance is 23 kilos.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Joining a gym* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/joining-gym. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe your ideal workplace.\"* — use pelo menos: **make a reservation** e **book a flight**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**07/12/2026**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Leitura · [ ] Error Log","d":"2026-12-08","k":"Plano operacional"},{"n":310,"t":"terça-feira, 08/12/2026 · Guia detalhado","b":"### Guia detalhado — 08/12/2026\n**Passo 1 — Recall da aula de ontem (3'):** abra o Class Log de **07/12/2026**; diga 3 erros/chunks.\n**Passo 2 — Estudo (12'):** leia **G31** neste documento (p. 41) e a página do British Council (procure “Relative clauses: defining” em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2). Explique cada regra em voz alta em 30 s.\nRegras-chave:\n- who (pessoas) · which (coisas) · that (pessoas/coisas) · whose (posse) · where (lugar) · when (tempo).\n- Sem vírgulas: informação essencial: 'The man who called is here.'\n- Pronome objeto pode ser omitido: 'The report (that) I wrote is ready.'\n**Onde você costuma errar:** Não use 'what' como relativo: 'the report THAT I wrote' (não 'what').\n**Passo 3 — Exercício A (15'):** responda por escrito.\n1. The employee ___ called you is my boss. (who/which)\n2. This is the file ___ I need. (which/where)\n3. That's the woman ___ car was stolen.\n4. The office ___ we met is closed. (where/who)\n5. Is this the report ___ you were looking for?\n6. The day ___ we met was rainy.\n**Passo 4 — Correção (3'):** compare com o gabarito no fim da página; para cada erro escreva **1 regra** no Error Log.\n**Passo 5 — Produção (2'):** Defina 4 coisas do seu trabalho/faculdade com relativas ('A manager is a person who...').\n\n**Leitura 1 (25'):**\n**Texto:** *The sharing economy* (B2, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b2/sharing-economy\n1. **Preparação (3')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (8')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (8')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (3')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n\n---\n**GABARITO (não olhe antes)**\n\n1. who\n2. which\n3. whose\n4. where\n5. that/which (ou omitido)\n6. when/that","d":"2026-12-08","k":"Guia detalhado"},{"n":311,"t":"quarta-feira, 09/12/2026 · Plano operacional","b":"**Semana 11/18 · Fase 3 — Integração e velocidade** · faltam **51 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Travel & Logistics\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **layover** — escala · *We have a two-hour layover in Rome.*\n   - **itinerary** — itinerário · *Here is your itinerary.*\n   - **reserve a room** — reservar um quarto · *I'd like to reserve a room for Friday.*\n   - **check out** — fazer check-out · *Guests must check out by eleven.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Joining a gym* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/joining-gym. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Talk about a decision you had to make quickly.\"* — use pelo menos: **layover** e **itinerary**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **02/12/2026** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **07/12/2026**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2026-12-09","k":"Plano operacional"},{"n":312,"t":"quarta-feira, 09/12/2026 · Guia detalhado","b":"### Guia detalhado — 09/12/2026 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"Describe a difficult trip or a delayed flight.\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **02/12/2026** e os da aula P1 de **07/12/2026**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (G31 estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P11 (intonation) (p. 113).","d":"2026-12-09","k":"Guia detalhado"},{"n":313,"t":"quinta-feira, 10/12/2026 · Plano operacional","b":"**Semana 11/18 · Fase 3 — Integração e velocidade** · faltam **50 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Travel & Logistics\n**Missão do dia:** Francês profundo: Pronoms relatifs : qui, que, dont, où, lequel\n**Tempo ativo:** 100 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 10 | F03 — vowels |\n| Gramática FR | 20 | Pronoms relatifs : qui, que, dont, où, lequel |\n| Expressions C1 | 10 | 4 expressões |\n| Production | 20 | Présentez votre parcours en 8 phrases avec dont / où / leque… |\n| Input C1 | 15 | TV5MONDE — Apprendre le français |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **front desk** — recepção · *Please ask at the front desk.*\n   - **complimentary breakfast** — café da manhã cortesia · *A complimentary breakfast is served daily.*\n   - **conference room** — sala de conferência · *The conference room seats twenty.*\n   - **catering** — serviço de buffet · *The catering was excellent.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"How do you prepare for an important meeting?\"* — use pelo menos: **front desk** e **complimentary breakfast**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**03/12/2026**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2026-12-10","k":"Plano operacional"},{"n":314,"t":"quinta-feira, 10/12/2026 · Guia detalhado","b":"### Guia detalhado — 10/12/2026 · Francês\n\n**1) Pronúncia (10')** — foco: F03 — vowels. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática (20')** — *Pronoms relatifs : qui, que, dont, où, lequel*\nRegra: qui (sujeito), que (objeto), dont (de + ...), où (lugar/tempo), preposição + lequel (sur lequel, à qui para pessoas).\nExercícios:\n1. Voici le dossier ___ je t'ai parlé.\n2. La ville ___ j'habite est belle.\n3. C'est le collègue ___ travaille avec moi.\n4. Le projet ___ nous travaillons est important.\n5. La personne ___ j'ai écrit n'a pas répondu.\n\n**3) Expressions C1 (10')** — leia, repita e escreva 1 frase própria com cada uma:\n- **dont** — de que / cujo · *Le problème dont on parle est grave.*\n- **ce dont** — aquilo de que · *Ce dont j'ai
