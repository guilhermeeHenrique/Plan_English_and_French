ar o Top-3 de causas do Simulado 1.\n\n**Passos**\n1. (5') Setup: celular no silêncio, cronômetro, folha de respostas; sem consultar nada durante o set.\n2. (≈30') Faça o set **cronometrado**. Marque com “?” os itens em que chutou. Anote o tempo por Part.\n3. (20') Revisão em 3 passadas: (1) erros com **evidência exata** (copie a frase do texto); (2) acertos por chute; (3) acertos lentos (>90 s). Classifique cada erro (G/V/P/I/A/T/S/L — T32).\n4. (5') Scoreboard (p. 161): acerto por Part, tempo, 3 causas principais.\n5. Crie **até 3 cards** (erros que se repetem) e volte para eles no domingo.\n\n**Regra:** não faça “só mais um set” hoje. A revisão é o treino.\n\n**Referência de estratégia desta semana:** T32, T34 (páginas 53–87).","d":"2026-10-23","k":"Guia detalhado"},{"n":233,"t":"sábado, 24/10/2026 · Sábado","b":"**Semana 4/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **97 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Communication\n**Missão do dia:** Fixar G11 (Present Perfect: forma e usos) e G12 (Present Perfect x Past Simple)\n**Tempo ativo:** 55 min · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática B — G11 | 30 | Present Perfect: forma e usos |\n| Gramática C — G12 | 25 | Present Perfect x Past Simple |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 19/10 e 21/10 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 24/10/2026\n\n**Gramática B — G11 (30')**\n1. (5') Leia G11 (p. 21) em voz alta. Exercício A (primeira exposição ao tópico: faça agora, com calma):\n1. She ___ (work) here since 2018.\n2. We ___ (not/receive) the package yet.\n3. ___ you ever ___ (visit) London?\n4. He ___ (just/leave) the office.\n5. They ___ (be) partners for ten years.\n6. I ___ (write) three reports so far.\n2. (10') **Exercício B — corrija as frases**:\n1. ❌ *I live here since 2019.*\n2. ❌ *She has went home.*\n3. ❌ *Have you saw the memo?*\n4. ❌ *We didn't receive it yet.*\n3. (10') **Produção:** Diga 3 experiências profissionais/acadêmicas suas com 'I have...'.\n4. (5') Error Log: 1 regra por erro.\n\n**Gramática C — G12 (25')** — dia de simulado amanhã: gramática no sábado.\n1. (5') Leia G12 (p. 22).\n2. (10') Exercício A:\n1. I ___ (see) him yesterday.\n2. I ___ (see) him three times this week.\n3. She ___ (move) to Nantes in 2021.\n4. We ___ (finish) the report. Here it is!\n5. When ___ he ___ (join) the company?\n6. ___ you ___ (ever/try) this software?\n3. (5') Exercício B:\n1. ❌ *I have met her last year.*\n2. ❌ *Did you ever been to Rome?*\n3. ❌ *She has left at noon.*\n4. ❌ *We have finished it two hours ago.*\n4. (5') Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G11 — A**\n1. has worked\n2. haven't received\n3. Have ... visited\n4. has just left\n5. have been\n6. have written\n\n**G11 — B**\n1. ✅ I have lived here since 2019.\n2. ✅ She has gone home.\n3. ✅ Have you seen the memo?\n4. ✅ We haven't received it yet.\n\n**G12 — A**\n1. saw\n2. have seen\n3. moved\n4. have finished\n5. did ... join\n6. Have ... ever tried\n\n**G12 — B**\n1. ✅ I met her last year.\n2. ✅ Have you ever been to Rome?\n3. ✅ She left at noon.\n4. ✅ We finished it two hours ago.","d":"2026-10-24","k":"Sábado"},{"n":234,"t":"domingo, 25/10/2026 · Domingo","b":"**Semana 4/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **96 dias** para a prova\n**Missão do dia:** Fixar G12 + ler 1 texto + reset\n**Tempo ativo:** 55 min\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática C — G12 | 20 | Present Perfect x Past Simple |\n| Leitura 2 | 20 | Texto BC |\n| Reset semanal | 15 | Quiz + Scoreboard + plano |\n\n### Ponte com aulas antigas\n- Class Log de **27/09/2026** (4 semanas atrás): leia 3 erros/chunks e use 1 hoje na fala do quiz.\n\n### Passivo (fora da conta)\nSérie/filme com legenda em inglês (30 min, sem obrigação)\n- Francês: innerFrench — 1 épisode (podcast): https://innerfrench.com/podcast/\n\n### Guia detalhado\n**Gramática C — G12 (20')**\n1. (6') Leia G12 (p. 22) em voz alta.\n2. (10') Exercício A:\n1. I ___ (see) him yesterday.\n2. I ___ (see) him three times this week.\n3. She ___ (move) to Nantes in 2021.\n4. We ___ (finish) the report. Here it is!\n5. When ___ he ___ (join) the company?\n6. ___ you ___ (ever/try) this software?\n3. (4') Produção: Responda: 'Have you ever...?' (3 perguntas) e dê detalhes no passado.\n**Leitura 2 (20'):**\n**Texto:** *A flyer for a gym* (B1, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b1/flyer-gym\n1. **Preparação (2')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (6')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (7')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (2')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n**Reset semanal (15')**\n1. (5') **Quiz dos 20 chunks da semana** — olhe só o português e diga o chunk: get in touch, clarify a point, get the message across, follow up, reply to, forward an email, attach a file, leave a voicemail, put someone on hold, return a call, misunderstand, keep in touch, give feedback, draw attention to, point out, make a suggestion, confirm receipt, distribute, announce, inform someone of\n2. (5') Error Log: escolha 3 erros repetidos e reescreva a regra.\n3. (5') Scoreboard e planejamento: o que fazer na semana 5 (próxima)? Confira a agenda de aulas.\n\n---\n**GABARITO (não olhe antes)**\n\n1. saw\n2. have seen\n3. moved\n4. have finished\n5. did ... join\n6. Have ... ever tried","d":"2026-10-25","k":"Domingo"},{"n":235,"t":"segunda-feira, 26/10/2026 · Plano operacional","b":"**Semana 5/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **95 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Experience\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Experience).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **have experience in** — ter experiência em · *He has experience in sales.*\n   - **be familiar with** — estar familiarizado com · *Are you familiar with this software?*\n   - **learn from** — aprender com · *We learn from our mistakes.*\n   - **turn out** — acabar sendo / revelar-se · *The meeting turned out to be useful.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A design presentation* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/design-presentation. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What makes a good presentation?\"* — use pelo menos: **have experience in** e **be familiar with**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **19/10/2026** (aula P1 anterior) e de **28/09/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2026-10-26","k":"Plano operacional"},{"n":236,"t":"segunda-feira, 26/10/2026 · Guia detalhado","b":"### Guia detalhado — 26/10/2026 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\nhave experience in, be familiar with, learn from, turn out, qualification, résumé, apply for a position, job opening, candidate, job interview, reference, skills, training session, probation period, be qualified for, hire, recruit, be promoted, resign, retire\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **19/10/2026** e de **28/09/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Experience*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana (G13).\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **G13** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2026-10-26","k":"Guia detalhado"},{"n":237,"t":"terça-feira, 27/10/2026 · Plano operacional","b":"**Semana 5/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **94 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Experience\n**Missão do dia:** Fixar G13 (Since, for, already, yet, just) + ler um texto\n**Tempo ativo:** 85 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki · Shadowing · Fala |\n| Gramática A — G13 | 35 | Since, for, already, yet, just |\n| Leitura 1 | 25 | Texto BC + exercícios |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **qualification** — qualificação · *She has the right qualifications.*\n   - **résumé** — currículo · *Please send your résumé by Friday.*\n   - **apply for a position** — candidatar-se a uma vaga · *He applied for a position in finance.*\n   - **job opening** — vaga de emprego · *There is a job opening in marketing.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A design presentation* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/design-presentation. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Explain how to make your favorite dish.\"* — use pelo menos: **qualification** e **résumé**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**26/10/2026**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Leitura · [ ] Error Log","d":"2026-10-27","k":"Plano operacional"},{"n":238,"t":"terça-feira, 27/10/2026 · Guia detalhado","b":"### Guia detalhado — 27/10/2026\n**Passo 1 — Recall da aula de ontem (3'):** abra o Class Log de **26/10/2026**; diga 3 erros/chunks.\n**Passo 2 — Estudo (12'):** leia **G13** neste documento (p. 23) e a página do British Council (procure “Present perfect: since / for / already / yet” em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2). Explique cada regra em voz alta em 30 s.\nRegras-chave:\n- since + ponto no tempo (since 2019, since Monday); for + duração (for three years).\n- already = já (afirmativa): 'We have already sent it.'; yet = ainda (negativa e pergunta, fim da frase): 'Have you finished yet?'; just = acabou de.\n- Posição: have already/just + particípio; yet no fim.\n**Onde você costuma errar:** 'Há dois anos' → 'for two years' (nunca 'since two years').\n**Passo 3 — Exercício A (15'):** responda por escrito.\n1. She has worked here ___ 2020.\n2. He has lived here ___ five years.\n3. We haven't heard from them ___.\n4. I have ___ sent the file.\n5. The meeting has ___ started.\n6. Have you finished ___?\n**Passo 4 — Correção (3'):** compare com o gabarito no fim da página; para cada erro escreva **1 regra** no Error Log.\n**Passo 5 — Produção (2'):** Diga há quanto tempo você estuda inglês (for) e desde quando (since).\n\n**Leitura 1 (25'):**\n**Texto:** *Digital habits across generations* (B1, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b1/digital-habits-across-generations\n1. **Preparação (3')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (8')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (8')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (3')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n\n---\n**GABARITO (não olhe antes)**\n\n1. since\n2. for\n3. yet\n4. already\n5. just\n6. yet","d":"2026-10-27","k":"Guia detalhado"},{"n":239,"t":"quarta-feira, 28/10/2026 · Plano operacional","b":"**Semana 5/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **93 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Experience\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **candidate** — candidato · *The best candidate starts on Monday.*\n   - **job interview** — entrevista de emprego · *I have a job interview tomorrow.*\n   - **reference** — referência (profissional) · *She gave two references.*\n   - **skills** — habilidades · *Good communication skills are essential.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A design presentation* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/design-presentation. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Summarize the last film or series you watched.\"* — use pelo menos: **candidate** e **job interview**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **21/10/2026** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **26/10/2026**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2026-10-28","k":"Plano operacional"},{"n":240,"t":"quarta-feira, 28/10/2026 · Guia detalhado","b":"### Guia detalhado — 28/10/2026 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"Describe a job or study experience that taught you a lot.\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **21/10/2026** e os da aula P1 de **26/10/2026**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (G13 estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P05 (/θ/ /ð/) (p. 107).","d":"2026-10-28","k":"Guia detalhado"},{"n":241,"t":"quinta-feira, 29/10/2026 · Plano operacional","b":"**Semana 5/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **92 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Experience\n**Missão do dia:** Francês profundo: Conditionnel présent et passé (F06)\n**Tempo ativo:** 100 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 10 | F03 — /ø/ x /œ/ |\n| Gramática FR | 20 | Conditionnel présent et passé (F06) |\n| Expressions C1 | 10 | 4 expressões |\n| Production | 20 | Écrivez un mail poli (conditionnel de politesse) pour demand… |\n| Input C1 | 15 | RFI — Journal en français facile |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **training session** — sessão de treinamento · *The training session lasts two hours.*\n   - **probation period** — período de experiência · *The probation period is three months.*\n   - **be qualified for** — ser qualificado para · *He is qualified for the role.*\n   - **hire** — contratar · *We plan to hire two engineers.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"How has technology changed your field?\"* — use pelo menos: **training session** e **probation period**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**22/10/2026**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2026-10-29","k":"Plano operacional"},{"n":242,"t":"quinta-feira, 29/10/2026 · Guia detalhado","b":"### Guia detalhado — 29/10/2026 · Francês\n\n**1) Pronúncia (10')** — foco: F03 — /ø/ x /œ/. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática (20')** — *Conditionnel présent et passé (F06)*\nRegra: Présent: politesse/hipótese ('Je voudrais...'). Passé (aurait + particípio): arrependimento/reprovação ('Tu aurais dû nous prévenir'). Base: futur simple + terminações de imparfait.\nExercícios:\n1. Je ___ (vouloir) un rendez-vous.\n2. À ta place, je ___ (partir) maintenant.\n3. Il ___ (falloir) prévenir le client.\n4. Nous ___ (pouvoir) reporter la réunion.\n5. Tu ___ (devoir) nous prévenir.\n\n**3) Expressions C1 (10')** — leia, repita e escreva 1 frase própria com cada uma:\n- **dans l'hypothèse où** — na hipótese de · *Dans l'hypothèse où il pleuvrait, nous annulerions.*\n- **à condition que** — com a condição de que (+subj.) · *Je viens, à condition que tu conduises.*\n- **à moins que** — a menos que (+subj.) · *Nous sortons, à moins qu'il pleuve.*\n- **au cas où** — caso · *Prends un parapluie au cas où il pleuvrait.*\n\n**4) Production (20')** — Écrivez un mail poli (conditionnel de politesse) pour demander un changement de rendez-vous (8 lignes).\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (15')** — RFI — Journal en français facile: https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. voudrais\n2. partirais\n3. faudrait\n4. pourrions\n5. aurais dû","d":"2026-10-29","k":"Guia detalhado"},{"n":243,"t":"sexta-feira, 30/10/2026 · Plano operacional","b":"**Semana 5/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **91 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Experience\n**Missão do dia:** Word form + tempos verbais\n**Tempo ativo:** 85 min · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈30 | Part 5 (30 itens, 12 min) + Part 6 (16 itens, 8 min) + 10 min de folga para revisão rápida |\n| Revisão | 20 | Protocolo T32/T34 |\n| Log | 5 | Scoreboard |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **recruit** — recrutar · *The firm recruits graduates every year.*\n   - **be promoted** — ser promovido · *She was promoted to manager.*\n   - **resign** — pedir demissão · *He resigned last month.*\n   - **retire** — aposentar-se · *She retires next year.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A design presentation* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/design-presentation. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Which skills matter most in your career?\"* — use pelo menos: **recruit** e **be promoted**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**26/10/2026**) e Qua (**28/10/2026**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Experience*: https://www.ted.com/talks?q=Experience\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2026-10-30","k":"Plano operacional"},{"n":244,"t":"sexta-feira, 30/10/2026 · Guia detalhado","b":"### Guia detalhado — 30/10/2026 · TOEIC Reading oficial\n\n**Set do dia:** Part 5 (30 itens, 12 min) + Part 6 (16 itens, 8 min) + 10 min de folga para revisão rápida\n**Fonte oficial:** App: séries 'Sentence completion' e 'Text completion' (pp. 153–154)\n**Foco:** G41 e tempos verbais.\n\n**Passos**\n1. (5') Setup: celular no silêncio, cronômetro, folha de respostas; sem consultar nada durante o set.\n2. (≈30') Faça o set **cronometrado**. Marque com “?” os itens em que chutou. Anote o tempo por Part.\n3. (20') Revisão em 3 passadas: (1) erros com **evidência exata** (copie a frase do texto); (2) acertos por chute; (3) acertos lentos (>90 s). Classifique cada erro (G/V/P/I/A/T/S/L — T32).\n4. (5') Scoreboard (p. 161): acerto por Part, tempo, 3 causas principais.\n5. Crie **até 3 cards** (erros que se repetem) e volte para eles no domingo.\n\n**Regra:** não faça “só mais um set” hoje. A revisão é o treino.\n\n**Referência de estratégia desta semana:** T14, T15, T20 (páginas 53–87).","d":"2026-10-30","k":"Guia detalhado"},{"n":245,"t":"sábado, 31/10/2026 · Sábado","b":"**Semana 5/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **90 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Experience\n**Missão do dia:** Fixar G14 (Present Perfect Continuous) e G15 (Future: will, going to, present continuous)\n**Tempo ativo:** 55 min · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática B — G14 | 30 | Present Perfect Continuous |\n| Gramática C — G15 | 25 | Future: will, going to, present continuous |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 26/10 e 28/10 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 31/10/2026\n\n**Gramática B — G14 (30')**\n1. (5') Leia G14 (p. 24) em voz alta. Exercício A (primeira exposição ao tópico: faça agora, com calma):\n1. She ___ (work) here since March.\n2. How long ___ you ___ (wait)?\n3. It ___ (rain) all day.\n4. I ___ (know) him for ten years.\n5. They ___ (negotiate) for weeks.\n6. He's tired because he ___ (run).\n2. (10') **Exercício B — corrija as frases**:\n1. ❌ *I am waiting since ten.*\n2. ❌ *She has been knowing him for years.*\n3. ❌ *How long do you work here?*\n4. ❌ *We have been finish the report.*\n3. (10') **Produção:** Diga o que você tem feito ultimamente (3 frases com 'have been -ing').\n4. (5') Error Log: 1 regra por erro.\n\n**Gramática C — G15 (25')** — dia de simulado amanhã: gramática no sábado.\n1. (5') Leia G15 (p. 25).\n2. (10') Exercício A:\n1. The phone's ringing. I ___ get it.\n2. We ___ launch the product in May (plan).\n3. I ___ (meet) the client at four (arranged).\n4. Look at the sky! It ___ rain.\n5. I promise I ___ call you tomorrow.\n6. She ___ (not/attend) the meeting; she has a flight.\n3. (5') Exercício B:\n1. ❌ *I will to send it.*\n2. ❌ *It will rains tomorrow.*\n3. ❌ *We will going to hire two people.*\n4. ❌ *Tomorrow I visit the client (combinado).*\n4. (5') Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G14 — A**\n1. has been working\n2. have ... been waiting\n3. has been raining\n4. have known\n5. have been negotiating\n6. has been running\n\n**G14 — B**\n1. ✅ I have been waiting since ten.\n2. ✅ She has known him for years.\n3. ✅ How long have you been working here?\n4. ✅ We have finished the report.\n\n**G15 — A**\n1. 'll\n2. are going to\n3. am meeting\n4. is going to\n5. will\n6. isn't attending\n\n**G15 — B**\n1. ✅ I will send it.\n2. ✅ It will rain tomorrow.\n3. ✅ We are going to hire two people.\n4. ✅ Tomorrow I'm visiting the client.","d":"2026-10-31","k":"Sábado"},{"n":246,"t":"domingo, 01/11/2026 · Domingo","b":"**Semana 5/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **89 dias** para a prova\n**Missão do dia:** Fixar G15 + ler 1 texto + reset\n**Tempo ativo:** 55 min\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática C — G15 | 20 | Future: will, going to, present continuous |\n| Leitura 2 | 20 | Texto BC |\n| Reset semanal | 15 | Quiz + Scoreboard + plano |\n\n### Ponte com aulas antigas\n- Class Log de **04/10/2026** (4 semanas atrás): leia 3 erros/chunks e use 1 hoje na fala do quiz.\n\n### Passivo (fora da conta)\nSérie/filme com legenda em inglês (30 min, sem obrigação)\n- Francês: innerFrench — 1 épisode (podcast): https://innerfrench.com/podcast/\n\n### Guia detalhado\n**Gramática C — G15 (20')**\n1. (6') Leia G15 (p. 25) em voz alta.\n2. (10') Exercício A:\n1. The phone's ringing. I ___ get it.\n2. We ___ launch the product in May (plan).\n3. I ___ (meet) the client at four (arranged).\n4. Look at the sky! It ___ rain.\n5. I promise I ___ call you tomorrow.\n6. She ___ (not/attend) the meeting; she has a flight.\n3. (4') Produção: Fale 3 planos seus para dezembro (going to) e 2 compromissos combinados (PC).\n**Leitura 2 (20'):**\n**Texto:** *How to spot fake news* (B1, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b1/how-spot-fake-news\n1. **Preparação (2')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (6')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (7')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (2')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n**Reset semanal (15')**\n1. (5') **Quiz dos 20 chunks da semana** — olhe só o português e diga o chunk: have experience in, be familiar with, learn from, turn out, qualification, résumé, apply for a position, job opening, candidate, job interview, reference, skills, training session, probation period, be qualified for, hire, recruit, be promoted, resign, retire\n2. (5') Error Log: escolha 3 erros repetidos e reescreva a regra.\n3. (5') Scoreboard e planejamento: o que fazer na semana 6 (próxima)? Confira a agenda de aulas.\n\n---\n**GABARITO (não olhe antes)**\n\n1. 'll\n2. are going to\n3. am meeting\n4. is going to\n5. will\n6. isn't attending","d":"2026-11-01","k":"Domingo"},{"n":247,"t":"segunda-feira, 02/11/2026 · Plano operacional","b":"**Semana 6/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **88 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Seeing the Future\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Seeing the Future).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **be likely to** — ser provável que · *Prices are likely to rise.*\n   - **be expected to** — espera-se que · *The plane is expected to land at six.*\n   - **in the long run** — a longo prazo · *In the long run, solar power is cheaper.*\n   - **predict that** — prever que · *Experts predict that sales will grow.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A digital detox podcast* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/digital-detox-podcast. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe a stressful situation and how you handled it.\"* — use pelo menos: **be likely to** e **be expected to**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **26/10/2026** (aula P1 anterior) e de **05/10/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2026-11-02","k":"Plano operacional"},{"n":248,"t":"segunda-feira, 02/11/2026 · Guia detalhado","b":"### Guia detalhado — 02/11/2026 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\nbe likely to, be expected to, in the long run, predict that, plan ahead, look forward to, be scheduled to, be about to, take place, come into effect, by the end of, in the near future, be due to, make arrangements, allow enough time, postpone, reschedule, be subject to change, as soon as, on the horizon\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **26/10/2026** e de **05/10/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Seeing the Future*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana (G16).\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **G16** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2026-11-02","k":"Guia detalhado"},{"n":249,"t":"terça-feira, 03/11/2026 · Plano operacional","b":"**Semana 6/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **87 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Seeing the Future\n**Missão do dia:** Fixar G16 (Future time clauses) + ler um texto\n**Tempo ativo:** 85 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki · Shadowing · Fala |\n| Gramática A — G16 | 35 | Future time clauses |\n| Leitura 1 | 25 | Texto BC + exercícios |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **plan ahead** — planejar com antecedência · *It's wise to plan ahead.*\n   - **look forward to** — aguardar com expectativa · *I look forward to meeting you.*\n   - **be scheduled to** — estar programado para · *The talk is scheduled to start at nine.*\n   - **be about to** — estar prestes a · *The show is about to begin.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A digital detox podcast* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/digital-detox-podcast. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What do you do to stay healthy?\"* — use pelo menos: **plan ahead** e **look forward to**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**02/11/2026**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Leitura · [ ] Error Log","d":"2026-11-03","k":"Plano operacional"},{"n":250,"t":"terça-feira, 03/11/2026 · Guia detalhado","b":"### Guia detalhado — 03/11/2026\n**Passo 1 — Recall da aula de ontem (3'):** abra o Class Log de **02/11/2026**; diga 3 erros/chunks.\n**Passo 2 — Estudo (12'):** leia **G16** neste documento (p. 26) e a página do British Council (procure “Future time clauses” em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2). Explique cada regra em voz alta em 30 s.\nRegras-chave:\n- Depois de when, as soon as, before, after, until, once, by the time o verbo fica no PRESENTE (simples ou perfect), mesmo com sentido de futuro: 'I'll call you when I arrive.'\n- Presente perfeito destaca a conclusão: 'I'll call as soon as I have finished.'\n- Nunca use will dentro da oração de tempo.\n**Onde você costuma errar:** O subjuntivo futuro do português ('quando eu chegar') vira presente simples em inglês.\n**Passo 3 — Exercício A (15'):** responda por escrito.\n1. I'll call you when I ___ (arrive).\n2. We'll start as soon as everyone ___ (come).\n3. She'll leave after she ___ (finish) the report.\n4. Please wait until the manager ___ (be) ready.\n5. Before you ___ (go), lock the door.\n6. I'll send it once I ___ (get) the approval.\n**Passo 4 — Correção (3'):** compare com o gabarito no fim da página; para cada erro escreva **1 regra** no Error Log.\n**Passo 5 — Produção (2'):** Complete: 'When I finish this plan, I will...' (5 finais diferentes).\n\n**Leitura 1 (25'):**\n**Texto:** *Robot teachers* (B1, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b1/robot-teachers\n1. **Preparação (3')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (8')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (8')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (3')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n\n---\n**GABARITO (não olhe antes)**\n\n1. arrive\n2. comes\n3. finishes\n4. is\n5. go\n6. get","d":"2026-11-03","k":"Guia detalhado"},{"n":251,"t":"quarta-feira, 04/11/2026 · Plano operacional","b":"**Semana 6/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **86 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Seeing the Future\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **take place** — acontecer · *The event will take place in June.*\n   - **come into effect** — entrar em vigor · *The new rule comes into effect on May 1.*\n   - **by the end of** — até o final de · *Finish it by the end of the week.*\n   - **in the near future** — em um futuro próximo · *We will expand in the near future.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A digital detox podcast* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/digital-detox-podcast. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Talk about the environment in your city.\"* — use pelo menos: **take place** e **come into effect**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **28/10/2026** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **02/11/2026**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2026-11-04","k":"Plano operacional"},{"n":252,"t":"quarta-feira, 04/11/2026 · Guia detalhado","b":"### Guia detalhado — 04/11/2026 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"Where do you see yourself in five years?\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **28/10/2026** e os da aula P1 de **02/11/2026**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (G16 estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P06 (final consonants) (p. 108).","d":"2026-11-04","k":"Guia detalhado"},{"n":253,"t":"quinta-feira, 05/11/2026 · Plano operacional","b":"**Semana 6/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **85 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Seeing the Future\n**Missão do dia:** Francês profundo: Hypothèse : si + présent / imparfait / plus-que-parfait\n**Tempo ativo:** 100 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 10 | F02 — liaisons obligatoires |\n| Gramática FR | 20 | Hypothèse : si + présent / imparfait / plus-que-parfait |\n| Expressions C1 | 10 | 4 expressões |\n| Production | 20 | Décrivez 5 hypothèses sur votre avenir professionnel (les 3 … |\n| Input C1 | 15 | innerFrench — podcast |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **be due to** — estar previsto para · *The report is due to arrive on Monday.*\n   - **make arrangements** — fazer os preparativos · *I'll make arrangements for the trip.*\n   - **allow enough time** — reservar tempo suficiente · *Allow enough time for security checks.*\n   - **postpone** — adiar · *They postponed the meeting to Friday.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe your last presentation or interview.\"* — use pelo menos: **be due to** e **make arrangements**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**29/10/2026**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2026-11-05","k":"Plano operacional"},{"n":254,"t":"quinta-feira, 05/11/2026 · Guia detalhado","b":"### Guia detalhado — 05/11/2026 · Francês\n\n**1) Pronúncia (10')** — foco: F02 — liaisons obligatoires. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática (20')** — *Hypothèse : si + présent / imparfait / plus-que-parfait*\nRegra: si + présent → futur; si + imparfait → conditionnel présent; si + plus-que-parfait → conditionnel passé. Nunca 'si' + futuro/condicional.\nExercícios:\n1. Si tu viens, nous ___ (partir) ensemble.\n2. Si j'avais plus de temps, je ___ (voyager) plus.\n3. S'il ___ (étudier), il aurait réussi.\n4. Si elle ___ (savoir), elle nous aurait prévenus.\n5. Nous ___ (ne pas/perdre) le contrat si nous avions répondu plus vite.\n\n**3) Expressions C1 (10')** — leia, repita e escreva 1 frase própria com cada uma:\n- **en dépit de** — apesar de · *En dépit du froid, ils sont sortis.*\n- **quoique** — embora (+subj.) · *Quoiqu'il soit jeune, il est expérimenté.*\n- **quelle que soit** — qualquer que seja · *Quelle que soit ta décision, je te soutiens.*\n- **tout de même** — ainda assim · *C'est cher ; je l'achète tout de même.*\n\n**4) Production (20')** — Décrivez 5 hypothèses sur votre avenir professionnel (les 3 types de « si »).\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (15')** — innerFrench — podcast: https://innerfrench.com/podcast/\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. partirons\n2. voyagerais\n3. avait étudié\n4. avait su\n5. n'aurions pas perdu","d":"2026-11-05","k":"Guia detalhado"},{"n":255,"t":"sexta-feira, 06/11/2026 · Plano operacional","b":"**Semana 6/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **84 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Seeing the Future\n**Missão do dia:** Part 7 — passagens únicas e duplas\n**Tempo ativo:** 85 min · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈30 | Part 7 single: 14 itens (16 min) + double: 10 itens (14 min) |\n| Revisão | 20 | Protocolo T32/T34 |\n| Log | 5 | Scoreboard |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **reschedule** — reagendar · *Can we reschedule the call?*\n   - **be subject to change** — estar sujeito a alteração · *Prices are subject to change.*\n   - **as soon as** — assim que · *Call me as soon as you arrive.*\n   - **on the horizon** — no horizonte · *New changes are on the horizon.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A digital detox podcast* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/digital-detox-podcast. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What would you do with a scholarship abroad?\"* — use pelo menos: **reschedule** e **be subject to change**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**02/11/2026**) e Qua (**04/11/2026**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Seeing the Future*: https://www.ted.com/talks?q=Seeing+the+Future\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2026-11-06","k":"Plano operacional"},{"n":256,"t":"sexta-feira, 06/11/2026 · Guia detalhado","b":"### Guia detalhado — 06/11/2026 · TOEIC Reading oficial\n\n**Set do dia:** Part 7 single: 14 itens (16 min) + double: 10 itens (14 min)\n**Fonte oficial:** App: série 'Reading comprehension' (pp. 153–154)\n**Foco:** Localizar evidência antes de responder.\n\n**Passos**\n1. (5') Setup: celular no silêncio, cronômetro, folha de respostas; sem consultar nada durante o set.\n2. (≈30') Faça o set **cronometrado**. Marque com “?” os itens em que chutou. Anote o tempo por Part.\n3. (20') Revisão em 3 passadas: (1) erros com **evidência exata** (copie a frase do texto); (2) acertos por chute; (3) acertos lentos (>90 s). Classifique cada erro (G/V/P/I/A/T/S/L — T32).\n4. (5') Scoreboard (p. 161): acerto por Part, tempo, 3 causas principais.\n5. Crie **até 3 cards** (erros que se repetem) e volte para eles no domingo.\n\n**Regra:** não faça “só mais um set” hoje. A revisão é o treino.\n\n**Referência de estratégia desta semana:** T22, T26 (páginas 53–87).","d":"2026-11-06","k":"Guia detalhado"},{"n":257,"t":"sábado, 07/11/2026 · Sábado","b":"**Semana 6/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **83 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Seeing the Future\n**Missão do dia:** Fixar G17 (Articles: a/an, the e zero article) e G18 (Countable x uncountable nouns)\n**Tempo ativo:** 55 min · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática B — G17 | 30 | Articles: a/an, the e zero article |\n| Gramática C — G18 | 25 | Countable x uncountable nouns |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 02/11 e 04/11 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 07/11/2026\n\n**Gramática B — G17 (30')**\n1. (5') Leia G17 (p. 27) em voz alta. Exercício A (primeira exposição ao tópico: faça agora, com calma):\n1. She works as ___ engineer.\n2. I bought ___ laptop. ___ laptop is very fast.\n3. ___ customers like discounts (geral).\n4. He is ___ best salesperson in the team.\n5. We waited for ___ hour.\n6. We stayed at ___ hotel near ___ airport.\n2. (10') **Exercício B — corrija as frases**:\n1. ❌ *She is engineer.*\n2. ❌ *The customers like discounts (em geral).*\n3. ❌ *It was a hour ago.*\n4. ❌ *I have a good news.*\n3. (10') **Produção:** Descreva seu escritório/sala de aula: primeira menção com a/an, depois com the.\n4. (5') Error Log: 1 regra por erro.\n\n**Gramática C — G18 (25')** — dia de simulado amanhã: gramática no sábado.\n1. (5') Leia G18 (p. 28).\n2. (10') Exercício A:\n1. We need more ___ (equipment/equipments).\n2. The news ___ good. (is/are)\n3. Can you give me some ___? (advice/advices)\n4. How ___ luggage do you have? (much/many)\n5. There are too many ___ in this room. (chairs/furniture)\n6. I'd like a piece of ___. (informations/information)\n3. (5') Exercício B:\n1. ❌ *She gave me many informations.*\n2. ❌ *The equipments are new.*\n3. ❌ *I need an advice.*\n4. ❌ *The news are bad.*\n4. (5') Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G17 — A**\n1. an\n2. a / The\n3. (sem artigo)\n4. the\n5. an\n6. a / the\n\n**G17 — B**\n1. ✅ She is an engineer.\n2. ✅ Customers like discounts.\n3. ✅ It was an hour ago.\n4. ✅ I have some good news.\n\n**G18 — A**\n1. equipment\n2. is\n3. advice\n4. much\n5. chairs\n6. information\n\n**G18 — B**\n1. ✅ She gave me a lot of information.\n2. ✅ The equipment is new.\n3. ✅ I need some advice.\n4. ✅ The news is bad.","d":"2026-11-07","k":"Sábado"},{"n":258,"t":"domingo, 08/11/2026 · Domingo","b":"**Semana 6/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **82 dias** para a prova\n**Missão do dia:** Fixar G18 + ler 1 texto + reset\n**Tempo ativo:** 55 min\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática C — G18 | 20 | Countable x uncountable nouns |\n| Leitura 2 | 20 | Texto BC |\n| Reset semanal | 15 | Quiz + Scoreboard + plano |\n\n### Ponte com aulas antigas\n- Class Log de **11/10/2026** (4 semanas atrás): leia 3 erros/chunks e use 1 hoje na fala do quiz.\n\n### Passivo (fora da conta)\nSérie/filme com legenda em inglês (30 min, sem obrigação)\n- Francês: innerFrench — 1 épisode (podcast): https://innerfrench.com/podcast/\n\n### Guia detalhado\n**Gramática C — G18 (20')**\n1. (6') Leia G18 (p. 28) em voz alta.\n2. (10') Exercício A:\n1. We need more ___ (equipment/equipments).\n2. The news ___ good. (is/are)\n3. Can you give me some ___? (advice/advices)\n4. How ___ luggage do you have? (much/many)\n5. There are too many ___ in this room. (chairs/furniture)\n6. I'd like a piece of ___. (informations/information)\n3. (4') Produção: Dê 3 conselhos (advice) a um colega novo usando 'a piece of advice'.\n**Leitura 2 (20'):**\n**Texto:** *Encyclopedia entry* (B1, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b1/encyclopedia-entry\n1. **Preparação (2')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (6')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (7')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (2')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n**Reset semanal (15')**\n1. (5') **Quiz dos 20 chunks da semana** — olhe só o português e diga o chunk: be likely to, be expected to, in the long run, predict that, plan ahead, look forward to, be scheduled to, be about to, take place, come into effect, by the end of, in the near future, be due to, make arrangements, allow enough time, postpone, reschedule, be subject to change, as soon as, on the horizon\n2. (5') Error Log: escolha 3 erros repetidos e reescreva a regra.\n3. (5') Scoreboard e planejamento: o que fazer na semana 7 (próxima)? Confira a agenda de aulas.\n\n---\n**GABARITO (não olhe antes)**\n\n1. equipment\n2. is\n3. advice\n4. much\n5. chairs\n6. information","d":"2026-11-08","k":"Domingo"},{"n":259,"t":"segunda-feira, 09/11/2026 · Plano operacional","b":"**Semana 7/18 · Fase 3 — Integração e velocidade** · faltam **81 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Being Effective\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Being Effective).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **get things done** — fazer as coisas · *She always gets things done.*\n   - **save time** — economizar tempo · *This tool saves time.*\n   - **waste time** — perder tempo · *Don't waste time on small details.*\n   - **focus on** — concentrar-se em · *Focus on the main task.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A talk about motivation* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/talk-about-motivation. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Explain the difference between two concepts in your field.\"* — use pelo menos: **get things done** e **save time**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **02/11/2026** (aula P1 anterior) e de **12/10/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2026-11-09","k":"Plano operacional"},{"n":260,"t":"segunda-feira, 09/11/2026 · Guia detalhado","b":"### Guia detalhado — 09/11/2026 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\nget things done, save time, waste time, focus on, prioritize, be efficient, streamline a process, cut down on, make the most of, keep track of, be on top of, delegate a task, time management, stay organized, be productive, run smoothly, deal with a backlog, double-check, follow the procedure, meet a requirement\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **02/11/2026** e de **12/10/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Being Effective*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana (G19).\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **G19** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2026-11-09","k":"Guia detalhado"},{"n":261,"t":"terça-feira, 10/11/2026 · Plano operacional","b":"**Semana 7/18 · Fase 3 — Integração e velocidade** · faltam **80 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Being Effective\n**Missão do dia:** Fixar G19 (Quantifiers: much, many, few, little, some, any) + ler um texto\n**Tempo ativo:** 85 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki · Shadowing · Fala |\n| Gramática A — G19 | 35 | Quantifiers: much, many, few, little, some, any |\n| Leitura 1 | 25 | Texto BC + exercícios |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **prioritize** — priorizar · *We need to prioritize urgent orders.*\n   - **be efficient** — ser eficiente · *The new system is more efficient.*\n   - **streamline a process** — simplificar um processo · *We streamlined the ordering process.*\n   - **cut down on** — reduzir · *We cut down on paper use.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A talk about motivation* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/talk-about-motivation. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Talk about a mistake you learned from.\"* — use pelo menos: **prioritize** e **be efficient**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**09/11/2026**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Leitura · [ ] Error Log","d":"2026-11-10","k":"Plano operacional"},{"n":262,"t":"terça-feira, 10/11/2026 · Guia detalhado","b":"### Guia detalhado — 10/11/2026\n**Passo 1 — Recall da aula de ontem (3'):** abra o Class Log de **09/11/2026**; diga 3 erros/chunks.\n**Passo 2 — Estudo (12'):** leia **G19** neste documento (p. 29) e a página do British Council (procure “Quantifiers” em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2). Explique cada regra em voz alta em 30 s.\nRegras-chave:\n- many + contável plural; much + incontável (negativa/pergunta); a lot of serve para ambos em afirmativas.\n- a few/a little = alguns/um pouco (positivo); few/little = poucos/quase nenhum (negativo).\n- some (afirmativa, ofertas) · any (negativa, pergunta): 'Do you have any questions?'\n**Onde você costuma errar:** 'Tenho poucos amigos' (sentindo falta) = 'I have few friends'; 'alguns amigos' = 'a few friends'.\n**Passo 3 — Exercício A (15'):** responda por escrito.\n1. We don't have ___ time. (many/much)\n2. How ___ employees work here?\n3. I have ___ questions (alguns).\n4. There is ___ hope left (quase nenhuma).\n5. Do you have ___ ideas?\n6. She has ___ friends here; she feels alone.\n**Passo 4 — Correção (3'):** compare com o gabarito no fim da página; para cada erro escreva **1 regra** no Error Log.\n**Passo 5 — Produção (2'):** Responda usando much/many: 'How much time / How many meetings do you have this week?'\n\n**Leitura 1 (25'):**\n**Texto:** *The Martian: a book review* (B1, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b1/martian-book-review\n1. **Preparação (3')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (8')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (8')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (3')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n\n---\n**GABARITO (não olhe antes)**\n\n1. much\n2. many\n3. a few\n4. little\n5. any\n6. few","d":"2026-11-10","k":"Guia detalhado"},{"n":263,"t":"quarta-feira, 11/11/2026 · Plano operacional","b":"**Semana 7/18 · Fase 3 — Integração e velocidade** · faltam **79 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Being Effective\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **make the most of** — aproveitar ao máximo · *Make the most of the workshop.*\n   - **keep track of** — acompanhar / manter registro · *Keep track of every expense.*\n   - **be on top of** — estar em dia com · *She is on top of her work.*\n   - **delegate a task** — delegar uma tarefa · *He delegated the task to Mia.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A talk about motivation* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/talk-about-motivation. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Do you prefer email, calls or messages? Why?\"* — use pelo menos: **make the most of** e **keep track of**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **04/11/2026** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **09/11/2026**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2026-11-11","k":"Plano operacional"},{"n":264,"t":"quarta-feira, 11/11/2026 · Guia detalhado","b":"### Guia detalhado — 11/11/2026 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"How do you stay productive when you are tired?\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **04/11/2026** e os da aula P1 de **09/11/2026**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (G19 estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P07 (-ed) (p. 109).","d":"2026-11-11","k":"Guia detalhado"},{"n":265,"t":"quinta-feira, 12/11/2026 · Plano operacional","b":"**Semana 7/18 · Fase 3 — Integração e velocidade** · faltam **78 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Being Effective\n**Missão do dia:** Francês profundo: Subjonctif présent : formation (F09)\n**Tempo ativo:** 100 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 10 | F04 — nasales et R |\n| Gramática FR | 20 | Subjonctif présent : formation (F09) |\n| Expressions C1 | 10 | 4 expressões |\n| Production | 20 | Donnez 6 conseils à un étudiant avec « il faut que ».… |\n| Input C1 | 15 | TV5MONDE — Apprendre le français |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **time management** — gestão de tempo · *Time management is a key skill.*\n   - **stay organized** — manter-se organizado · *Use a planner to stay organized.*\n   - **be productive** — ser produtivo · *I'm more productive in the morning.*\n   - **run smoothly** — funcionar sem problemas · *The event ran smoothly.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe a dream trip and how you would organize it.\"* — use pelo menos: **time management** e **stay organized**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**05/11/2026**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2026-11-12","k":"Plano operacional"},{"n":266,"t":"quinta-feira, 12/11/2026 · Guia detalhado","b":"### Guia detalhado — 12/11/2026 · Francês\n\n**1) Pronúncia (10')** — foco: F04 — nasales et R. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática (20')** — *Subjonctif présent : formation (F09)*\nRegra: Formação: radical de 'ils' do presente + e, es, e, ions, iez, ent. Irregulares: être (sois), avoir (aie), aller (aille), faire (fasse), pouvoir (puisse), savoir (sache), vouloir (veuille).\nExercícios:\n1. Il faut que tu ___ (faire) ce rapport.\n2. Je veux qu'il ___ (venir).\n3. Il est nécessaire que nous ___ (être) à l'heure.\n4. Bien qu'elle ___ (avoir) peu de temps, elle vient.\n5. Il faut que vous ___ (aller) à la réunion.\n\n**3) Expressions C1 (10')** — leia, repita e escreva 1 frase própria com cada uma:\n- **de plus en plus** — cada vez mais · *Les prix augmentent de plus en plus.*\n- **à long terme** — a longo prazo · *À long terme, c'est rentable.*\n- **dans l'ensemble** — no conjunto · *Dans l'ensemble, le bilan est positif.*\n- **en revanche** — em compensação · *Il est lent ; en revanche, il est précis.*\n\n**4) Production (20')** — Donnez 6 conseils à un étudiant avec « il faut que ».\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (15')** — TV5MONDE — Apprendre le français: https://apprendre.tv5monde.com/en/collection-all\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. fasses\n2. vienne\n3. soyons\n4. ait\n5. alliez","d":"2026-11-12","k":"Guia detalhado"},{"n":267,"t":"sexta-feira, 13/11/2026 · Plano operacional","b":"**Semana 7/18 · Fase 3 — Integração e velocidade** · faltam **77 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Being Effective\n**Missão do dia:** Aquecimento pré-Simulado 2\n**Tempo ativo:** 85 min · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈30 | Mini-Reading: 56 itens em 30 min |\n| Revisão | 20 | Protocolo T32/T34 |\n| Log | 5 | Scoreboard |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **deal with a backlog** — lidar com um acúmulo · *We must deal with the backlog of orders.*\n   - **double-check** — conferir duas vezes · *Double-check the address.*\n   - **follow the procedure** — seguir o procedimento · *Please follow the procedure exactly.*\n   - **meet a requirement** — atender a um requisito · *The product meets every requirement.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A talk about motivation* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/talk-about-motivation. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What is your biggest challenge in learning English?\"* — use pelo menos: **deal with a backlog** e **double-check**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**09/11/2026**) e Qua (**11/11/2026**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Being Effective*: https://www.ted.com/talks?q=Being+Effective\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2026-11-13","k":"Plano operacional"},{"n":268,"t":"sexta-feira, 13/11/2026 · Guia detalhado","b":"### Guia detalhado — 13/11/2026 · TOEIC Reading oficial\n\n**Set do dia:** Mini-Reading: 56 itens em 30 min\n**Fonte oficial:** App: teste semi-real nº 2 (seção Reading) (pp. 153–154)\n**Foco:** Rotina de tempo antes do domingo.\n\n**Passos**\n1. (5') Setup: celular no silêncio, cronômetro, folha de respostas; sem consultar nada durante o set.\n2. (≈30') Faça o set **cronometrado**. Marque com “?” os itens em que chutou. Anote o tempo por Part.\n3. (20') Revisão em 3 passadas: (1) erros com **evidência exata** (copie a frase do texto); (2) acertos por chute; (3) acertos lentos (>90 s). Classifique cada erro (G/V/P/I/A/T/S/L — T32).\n4. (5') Scoreboard (p. 161): acerto por Part, tempo, 3 causas principais.\n5. Crie **até 3 cards** (erros que se repetem) e volte para eles no domingo.\n\n**Regra:** não faça “só mais um set” hoje. A revisão é o treino.\n\n**Referência de estratégia desta semana:** T30, T14 (páginas 53–87).","d":"2026-11-13","k":"Guia detalhado"},{"n":269,"t":"sábado, 14/11/2026 · Sábado","b":"**Semana 7/18 · Fase 3 — Integração e velocidade** · faltam **76 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Being Effective\n**Missão do dia:** Fixar G20 (Determiners e demonstratives) e G21 (Adjectives: posição e ordem)\n**Tempo ativo:** 55 min · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática B — G20 | 30 | Determiners e demonstratives |\n| Gramática C — G21 | 25 | Adjectives: posição e ordem |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 09/11 e 11/11 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 14/11/2026\n\n**Gramática B — G20 (30')**\n1. (5') Leia G20 (p. 30) em voz alta. Exercício A (primeira exposição ao tópico: faça agora, com calma):\n1. ___ documents on my desk are urgent. (This/These)\n2. Each employee ___ a badge. (has/have)\n3. Would you like ___ cup of coffee? (another/other)\n4. ___ offers are good (os dois).\n5. I don't like this design. Show me ___ ones. (other/another)\n6. Every ___ counts. (vote/votes)\n2. (10') **Exercício B — corrija as frases**:\n1. ❌ *Each of the employee has a locker.*\n2. ❌ *Another options are available.*\n3. ❌ *These file is missing.*\n4. ❌ *Every customers is welcome.*\n3. (10') **Produção:** Compare duas coisas do seu escritório usando this/that e these/those.\n4. (5') Error Log: 1 regra por erro.\n\n**Gramática C — G21 (25')** — dia de simulado amanhã: gramática no sábado.\n1. (5') Leia G21 (p. 31).\n2. (10') Exercício A:\n1. The results were ___. (surprised/surprising)\n2. I'm ___ in the offer. (interested/interesting)\n3. a ___ meeting room (new large / large new)\n4. She bought a ___ bag. (leather black / black leather)\n5. It was a very ___ day. (tiring/tired)\n6. two ___ engineers (talented/talenteds)\n3. (5') Exercício B:\n1. ❌ *She has two blues folders.*\n2. ❌ *I am boring in meetings.*\n3. ❌ *a wooden old table*\n4. ❌ *The film was very excited.*\n4. (5') Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G20 — A**\n1. These\n2. has\n3. another\n4. Both\n5. other\n6. vote\n\n**G20 — B**\n1. ✅ Each of the employees has a locker.\n2. ✅ Other options are available.\n3. ✅ This file is missing.\n4. ✅ Every customer is welcome.\n\n**G21 — A**\n1. surprising\n2. interested\n3. large new\n4. black leather\n5. tiring\n6. talented\n\n**G21 — B**\n1. ✅ She has two blue folders.\n2. ✅ I am bored in meetings.\n3. ✅ an old wooden table\n4. ✅ The film was very exciting.","d":"2026-11-14","k":"Sábado"},{"n":270,"t":"domingo, 15/11/2026 · Domingo","b":"**Semana 7/18 · Fase 3 — Integração e velocidade** · faltam **75 dias** para a prova\n**Missão do dia:** Simulado 2\n\n| Bloco | Min | O quê |\n|---|---|---|\n| Simulado 2 | 120 | Teste em condições reais nº 2 (TOEIC Test App) |\n| Registro | 15–30 | Score + Scoreboard |\n\n**Protocolo (T33):** 09:00 Listening 45' → Reading 75' (sem pausa) · Fonte: **Teste em condições reais nº 2 (TOEIC Test App)**.\n- Antes: sono, água, silêncio, folha de respostas, cronômetro, celular em modo avião.\n- Depois (30 min): score, acerto por Part, tempo por Part, 3 dúvidas.\n- Amanhã: revise só o essencial; a **terça** tem revisão completa (T34) e a **sexta** o reparo das Top-3 fraquezas.\n- Não estude gramática nova hoje.\n\n**Ponte com aulas antigas:** hoje não há revisão de aula: o foco é o simulado.\n**Passivo:** Série/filme com legenda em inglês (30 min, sem obrigação)\n\n**Checklist:** [ ] Simulado feito [ ] Registro [ ] Descanso","d":"2026-11-15","k":"Domingo"},{"n":271,"t":"segunda-feira, 16/11/2026 · Plano operacional","b":"**Semana 8/18 · Fase 3 — Integração e velocidade** · faltam **74 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Environment\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Environment).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 5' no deck *Legacy* + 5' no deck *Active*.\n**Novos hoje (4):**\n   - **be made of** — ser feito de · *The bottle is made of glass.*\n   - **be designed to** — ser projetado para · *The device is designed to save energy.*\n   - **be used for** — ser usado para · *This room is used for meetings.*\n   - **be caused by** — ser causado por · *The delay was caused by fog.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Business news* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/business-news. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe a trend you know (prices, technology, habits).\"* — use pelo menos: **be made of** e **be designed to**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **09/11/2026** (aula P1 anterior) e de **19/10/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2026-11-16","k":"Plano operacional"},{"n":272,"t":"segunda-feira, 16/11/2026 · Guia detalhado","b":"### Guia detalhado — 16/11/2026 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\nbe made of, be designed to, be used for, be caused by, reduce waste, recycle materials, renewable energy, energy-efficient, carbon emissions, environmentally friendly, raise concern about, sustainable, natural resources, dispose of, be harmful to, protect the environment, switch to, have an impact on, comply with regulations, conserve energy\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **09/11/2026** e de **19/10/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Environment*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana (G22).\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **G22** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2026-11-16","k":"Guia detalhado"},{"n":273,"t":"terça-feira, 17/11/2026 · Plano operacional","b":"**Semana 8/18 · Fase 3 — Integração e velocidade** · faltam **73 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Environment\n**Missão do dia:** Fixar G22 (Adverbs e adjective x adverb) + revisar o Simulado 2\n**Tempo ativo:** 85 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki · Shadowing · Fala |\n|
