/* ---------- markdown ---------- */
function inl(s,ctx){
  const st=[];s=esc(s);
  s=s.replace(/`([^`]+)`/g,(m,c)=>{st.push('<code>'+c+'</code>');return '\u0001'+(st.length-1)+'\u0002'});
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
  s=s.replace(/(https?:\/\/[^\s<)|]+[^\s<).,;:|])/g,(u)=>{const t=u.replace(/^https?:\/\/(www\.)?/,'');const short=t.length>46?t.slice(0,30)+'…'+t.slice(-12):t;return '<a class="lk" href="'+u+'" target="_blank" rel="noopener" title="'+u+'">'+short+'</a>'});
  s=s.replace(/\[( |x)\]/g,(m,c)=>{const id=(ctx&&ctx.pid||'p')+'#'+(ctx.n++);return '<input type="checkbox" class="chk cb" data-cb="'+id+'"'+((c==='x'||S.checks[id])?' checked':'')+'>'});
  return s.replace(/\u0001(\d+)\u0002/g,(m,i)=>st[+i]);
}
function md(src,ctx){
  ctx=ctx||{pid:'x',n:0};ctx.n=ctx.n||0;
  const L=src.replace(/\r/g,'').split('\n');const out=[];let i=0;
  const blockStart=l=>/^(#{1,6}\s|---+$|\||>|```|\s*([-*]|\d+\.)\s)/.test(l);
  while(i<L.length){
    const l=L[i];
    if(/^```/.test(l)){const buf=[];i++;while(i<L.length&&!/^```/.test(L[i]))buf.push(L[i++]);i++;out.push('<pre><button class="btn sm" data-copy>Copiar</button><code>'+esc(buf.join('\n'))+'</code></pre>');continue}
    if(/^\s*$/.test(l)){i++;continue}
    let m=l.match(/^(#{1,6})\s+(.*)$/);
    if(m){const lv=Math.min(4,Math.max(2,m[1].length));out.push('<h'+lv+'>'+inl(m[2],ctx)+'</h'+lv+'>');i++;continue}
    if(/^---+$/.test(l)){out.push('<hr>');i++;continue}
    if(/^\|/.test(l)){
      const rows=[];while(i<L.length&&/^\|/.test(L[i]))rows.push(L[i++]);
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(rows[0]);const body=rows.slice(2).map(cells);
      out.push('<div class="tw2"><table><thead><tr>'+head.map(c=>'<th>'+inl(c,ctx)+'</th>').join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c,ctx)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue}
    if(/^>/.test(l)){const buf=[];while(i<L.length&&/^>/.test(L[i]))buf.push(L[i++].replace(/^>\s?/,''));out.push('<blockquote>'+buf.map(x=>inl(x,ctx)).join('<br>')+'</blockquote>');continue}
    if(/^\s*([-*]|\d+\.)\s/.test(l)){
      const buf=[];
      while(i<L.length&&/^\s*([-*]|\d+\.)\s/.test(L[i])){
        const mm=L[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);const lvl=Math.min(2,Math.floor(mm[1].length/2));
        buf.push('<div class="li n'+lvl+'"><span class="m">'+(/^\d/.test(mm[2])?esc(mm[2]):'•')+'</span><span>'+inl(mm[3],ctx)+'</span></div>');i++;
      }
      out.push('<div class="ls">'+buf.join('')+'</div>');continue}
    const buf=[];while(i<L.length&&!/^\s*$/.test(L[i])&&(buf.length===0||!blockStart(L[i])))buf.push(L[i++]);
    out.push(buf.length===1?'<p>'+inl(buf[0],ctx)+'</p>':'<div class="lns">'+buf.map(x=>'<div class="ln">'+inl(x,ctx)+'</div>').join('')+'</div>');
  }
  return out.join('');
}
function renderPage(p){
  const ctx={pid:'p'+p.n,n:0};
  const m=p.b.match(/\n---\n\*\*GABARITO[^\n]*\n/);
  if(!m)return '<div class="md">'+md(p.b,ctx)+'</div>';
  const idx=m.index;const head=p.b.slice(0,idx),tail=p.b.slice(idx+m[0].length);
  return '<div class="md">'+md(head,ctx)+'<details class="ans"><summary>Mostrar gabarito (tente antes de abrir)</summary>'+md(tail,ctx)+'</details></div>';
}

const tmFmt=s=>p2(Math.floor(s/60))+':'+p2(s%60);
function tmTick(){
  if(!TM.run)return;TM.left--;

  else document.title=tmFmt(TM.left)+' · '+docTitle;
  tmPaint();
}
function tmPaint(){const w=$('#fw');if(!w)return;w.classList.toggle('on',TM.total>0);$('#fwT',w).textContent=tmFmt(TM.left);$('#fwL',w).textContent=TM.label;$('#fwP',w).innerHTML=ic(TM.run?'pause':'play','sm');const b=$('#tmBig');if(b)b.textContent=tmFmt(TM.left)}
function tmStart(min,label){clearInterval(TM.int);TM.total=TM.left=min*60;TM.label=label;TM.run=true;TM.int=setInterval(tmTick,1000);tmPaint()}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext;const a=new A();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime);o.start();o.stop(a.currentTime+.7)}catch(e){}}
let MR=null,MCH=[];
async function recToggle(){
  if(SP.rec&&MR){MR.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});MR=new MediaRecorder(st);MCH=[];MR.ondataavailable=e=>MCH.push(e.data);MR.onstop=()=>{st.getTracks().forEach(t=>t.stop());if(SP.url)URL.revokeObjectURL(SP.url);SP.url=URL.createObjectURL(new Blob(MCH,{type:MR.mimeType||'audio/webm'}));SP.rec=false;render(true)};MR.start();SP.rec=true;render(true)}
  catch(e){toast('Microfone indisponível. Abra o arquivo por um navegador com permissão de áudio.')}
}

function scoreChart(){
  const W=640,H=230,pl=44,pr=14,pt=14,pb=28;const pts=S.scores.slice().sort((a,b)=>a.d<b.d?-1:1).map(s=>({d:s.d,v:s.l+s.r}));
  const lo=Math.min(500,...pts.map(p=>p.v-40)),hi=990;const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));const x=i=>pts.length<2?(W/2):(pl+(W-pl-pr)*i/(pts.length-1));
  let g='';[lo,Math.round((lo+hi)/2/10)*10,850,990].forEach(v=>{g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="rgba(147,166,191,.2)" '+(v===850?'stroke-dasharray="6 5" stroke="#4fd08a"':'')+'/><text x="6" y="'+(y(v)+4)+'" fill="#93a6bf" font-size="11">'+v+'</text>'});
  const line=pts.length>1?'<polyline fill="none" stroke="#5b9bff" stroke-width="3" points="'+pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')+'"/>':'';
  const dots=pts.map((p,i)=>'<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="5" fill="#38d6c4"/><text x="'+x(i)+'" y="'+(y(p.v)-10)+'" text-anchor="middle" fill="currentColor" font-size="12" font-weight="700">'+p.v+'</text><text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" fill="#93a6bf" font-size="11">'+fSh(p.d)+'</text>').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+g+'<text x="'+(W-pr)+'" y="'+(y(850)-6)+'" text-anchor="end" fill="#4fd08a" font-size="11">meta 850</text>'+line+dots+'</svg>'+(pts.length?'':'<p class="muted small" style="text-align:center;margin:0">Os pontos aparecem aqui após o Simulado 1.</p>');
}

/* ---------- progresso ---------- */
V.progresso=()=>{

/* ---------- busca ---------- */
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const IDX=PAGES.map(p=>norm(p.t+'\n'+p.b));
V.busca=(a)=>{
  const q=(a[0]||'').trim();let res='';
  if(q.length>1){
    const terms=norm(q).split(/\s+/).filter(Boolean);const hits=[];
    IDX.forEach((s,i)=>{if(terms.every(t=>s.indexOf(t)>=0)){const p=PAGES[i];const tt=norm(p.t);let sc=0;terms.forEach(t=>{if(tt.indexOf(t)>=0)sc+=5;sc+=Math.min(5,s.split(t).length-1)});hits.push({p:p,s:sc,at:s.indexOf(terms[0])})}});
    hits.sort((x,y)=>y.s-x.s);
    const hl=t=>{let h=esc(t);terms.forEach(x=>{try{h=h.replace(new RegExp('('+x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<span class="hl">$1</span>')}catch(e){}});return h};
    res='<p class="muted small">'+hits.length+' página(s) encontradas'+(hits.length>40?' (mostrando 40)':'')+'</p><div class="card list" style="padding:6px">'+hits.slice(0,40).map(h=>{const b=h.p.b.replace(/[#*`|]/g,' ').replace(/\s+/g,' ');const at=Math.max(0,h.at-50);return '<a href="#/pagina/'+h.p.n+'"><b>'+h.p.n+'</b><span><span style="font-weight:650">'+hl(h.p.t)+'</span><br><span class="muted small">…'+hl(b.slice(at,at+150))+'…</span></span></a>'}).join('')+'</div>';
  }else res='<div class="empty">Digite ao menos 2 letras. Ex.: <a href="#/busca/present%20perfect">present perfect</a> · <a href="#/busca/Part%205">Part 5</a> · <a href="#/busca/subjonctif">subjonctif</a></div>';
  return '<h2 class="pgtitle">Busca</h2><p class="muted" style="margin:0 0 14px">Pesquisa em todas as 400 páginas (sem diferenciar acentos).</p><input type="text" id="q" value="'+esc(q)+'" placeholder="O que você procura?" autocomplete="off" style="font-size:16px;padding:14px 16px;margin-bottom:16px">'+res;
};

  if(t.id==='fwR'){TM.left=TM.total;tmPaint();return}
  if(t.id==='fwX'){clearInterval(TM.int);TM.run=false;TM.total=TM.left=0;document.title=docTitle;tmPaint();return}
  if(t.dataset.focus){const a=t.dataset.focus.split('|');tmStart(+a[0],a[1]||'Foco');toast('Cronômetro: '+a[0]+' min');return}
  if(t.hasAttribute('data-copy')){const c=t.parentElement.querySelector('code').textContent;(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast('Copiado')).catch(()=>toast('Selecione e copie manualmente'));return}
  if(t.dataset.doneday){const d=t.dataset.doneday;DAYS[d].tasks.forEach((x,i)=>S.tasks[tk(d,i)]=true);save();render(true);toast('Dia concluído. Bom trabalho!');return}
  if(t.dataset.fl){const k=t.dataset.fl,d=flDeck(),c=d[Math.min(FL.i,d.length-1)];
    if(k==='flip'){FL.show=!FL.show}else if(k==='yes'&&c){S.known[c.id]=true;save();FL.show=false;if(FL.only){FL.i=Math.min(FL.i,Math.max(0,flDeck().length-1))}else FL.i=(FL.i+1)%Math.max(1,d.length)}
    else if(k==='no'&&c){delete S.known[c.id];save();FL.show=false;FL.i=(FL.i+1)%Math.max(1,d.length)}else if(k==='skip'){FL.show=false;FL.i=(FL.i+1)%Math.max(1,d.length)}
    if(k!=='tag'&&k!=='only')render(true);return}
  if(t.dataset.sp==='next'){SP.i=(SP.i+1)%PROMPTS.length;if(SP.url){URL.revokeObjectURL(SP.url);SP.url=null}render(true);return}
  if(t.dataset.sp==='rec'){recToggle();return}
  if(t.dataset.anki==='dl'){const b=new Blob([csvAll()],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='anki_chunks_toeic.csv';a.click();return}
  if(t.dataset.anki==='cp'){(navigator.clipboard?navigator.clipboard.writeText(csvAll()):Promise.reject()).then(()=>toast('CSV copiado')).catch(()=>toast('Use “Baixar CSV”'));return}
  if(t.dataset.add==='err'){const v=id=>$('#'+id).value.trim();if(!v('e_txt')){toast('Escreva o erro');return}S.errors.unshift({d:fSh(nowIso()),src:v('e_src'),txt:v('e_txt'),cau:$('#e_cau').value,rule:v('e_rule')});save();render(true);return}
  if(t.dataset.add==='cls'){const v=id=>$('#'+id).value.trim();S.classes.push({d:$('#c_d').value||nowIso(),p:$('#c_p').value,t:v('c_t'),e:v('c_e'),c:v('c_c'),q:v('c_q')});save();render(true);toast('Aula salva');return}
  if(t.dataset.add==='score'){const l=+$('#s_l').value,r=+$('#s_r').value;if(!(l>=0&&l<=495&&r>=0&&r<=495&&(l||r))){toast('Informe Listening e Reading entre 0 e 495');return}S.scores.push({n:$('#s_n').value,d:$('#s_d').value||nowIso(),l:l,r:r});save();render(true);return}
  if(t.dataset.del){const a=t.dataset.del.split('|'),i=+a[1];({err:S.errors,cls:S.classes,score:S.scores})[a[0]].splice(i,1);save();render(true);return}
  if(t.dataset.setClear){S.settings.sim='';save();render(true);return}
  if(t.dataset.data==='exp'){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='plano_mestre_backup_'+iso(new Date())+'.json';a.click();return}
  if(t.dataset.data==='rst'){if(confirm('Apagar todo o progresso, registros e anotações deste navegador?')){S=clone(DEF);save();applyTheme();render(true);toast('Progresso apagado')}return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.task){S.tasks[t.dataset.task]=t.checked;save();render(true);return}
  if(t.dataset.cb){S.checks[t.dataset.cb]=t.checked;save();return}
  if(t.dataset.fl==='tag'){FL.tag=t.value;FL.i=0;FL.show=false;render(true);return}
  if(t.dataset.fl==='only'){FL.only=t.checked;FL.i=0;FL.show=false;render(true);return}
  if(t.dataset.set){const k=t.dataset.set;S.settings[k]=k==='font'?+t.value:t.value;save();applyTheme();render(true);return}
  if(t.dataset.data==='imp'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);S=Object.assign(clone(DEF),o);S.settings=Object.assign({},DEF.settings,o.settings||{});save();applyTheme();render(true);toast('Backup importado')}catch(x){toast('Arquivo inválido')}};r.readAsText(f)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.note){S.notes[t.dataset.note]=t.value;save();return}
  if(t.id==='q'){clearTimeout(input.t);input.t=setTimeout(()=>{const v=t.value.trim();const h='#/busca/'+encodeURIComponent(v);if(location.hash!==h){history.replaceState(null,'',h);render(true);const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}},260)}
});
function input(){}
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(e.key==='/'){e.preventDefault();go('busca')}
  const r=route();if(r.p==='dia'||r.p==='hoje'){const d=r.p==='dia'?(r.a[0]||planDay(nowIso())):planDay(nowIso());const i=DAYLIST.indexOf(d);
    if(e.key==='ArrowLeft'&&DAYLIST[i-1])go('dia/'+DAYLIST[i-1]);if(e.key==='ArrowRight'&&DAYLIST[i+1])go('dia/'+DAYLIST[i+1])}
});
window.addEventListener('hashchange',()=>render(false));

/* ---------- init ---------- */
function init(){
  $('#navBox').innerHTML=NAV.map(g=>'<h6>'+g[0]+'</h6>'+g[1].map(x=>'<a href="#/'+x[0]+'" data-k="'+x[0]+'">'+ic(x[2])+'<span>'+x[1]+'</span></a>').join('')).join('');
  $('#tabBox').innerHTML=TABS.map(x=>'<a href="#/'+x[0]+'" data-k="'+x[0]+'">'+ic(x[2])+'<span>'+x[1]+'</span></a>').join('');
  $('#menuBtn').innerHTML=ic('menu');$('#themeBtn').innerHTML=ic('moon');$('#srchBtn').innerHTML=ic('search');
  $('#fwR').innerHTML=ic('refresh','sm');$('#fwX').innerHTML=ic('x','sm');
  $('#srchBtn').addEventListener('click',()=>go('busca'));
  applyTheme();render(false);
}
window.__plan={PAGES:PAGES,DAYS:DAYS,S:()=>S};
init();
})();

</script>
</body>
</html>
