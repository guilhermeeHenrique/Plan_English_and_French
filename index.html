re **“Indirect questions”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Depois de 'Could you tell me', 'Do you know', 'I wonder', 'I'd like to know' a ordem é AFIRMATIVA (sem inversão, sem do/does): 'Could you tell me where the office is?'\n- Sem palavra Wh-: use if/whether: 'I wonder if he is coming.'\n\n### Interferência do português (onde você costuma errar)\n- Português mantém a ordem; inglês NÃO inverte: 'Do you know where he works?' (não 'where does he work').\n\n### Como cai no TOEIC\n- Part 2/3: recepção, pedidos de informação — 'Could you tell me where...?' aparece em conversas de atendimento.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":48,"t":"G38 — Pronouns e reference","b":"**Quando você estuda:** Sáb 26/12 (exercício B)\n**Onde aprofundar (British Council):** procure **“Pronouns”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Sujeito (I, he), objeto (me, him), possessivo adjetivo (my) × pronome (mine), reflexivo (myself).\n- Reflexivo só quando sujeito = objeto: 'She introduced herself.' each other = recíproco.\n- Após preposição/verbo, pronome de OBJETO: 'between you and me', 'send it to John and me'.\n- it = coisa/clima/tempo; referência clara: evite 'they/it' ambíguos.\n\n### Interferência do português (onde você costuma errar)\n- 'Ela se chama Ana' → 'Her name is Ana' (sem reflexivo). 'Nos ajudamos' → 'We help each other'.\n\n### Como cai no TOEIC\n- Part 5: mine/yours/theirs (pronome) × my/your/their (adjetivo antes de substantivo); himself/themselves em ênfase.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":49,"t":"G39 — Prepositions de tempo, lugar e movimento","b":"**Quando você estuda:** Ter 29/12 (estudo+exercício A)\n**Onde aprofundar (British Council):** procure **“Prepositions”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Tempo: at (hora, night), on (dia/data), in (mês/ano/estação/parte do dia); for (duração), since (início), during (dentro de), by (até essa data), until (continuamente até).\n- Lugar: at (ponto), in (espaço fechado), on (superfície). Movimento: to, into, out of, through, across.\n- Colocações: depend ON, interested IN, responsible FOR, different FROM, look FOR, wait FOR, apply FOR, arrive AT/IN.\n\n### Interferência do português (onde você costuma errar)\n- 'Depende de' → 'depends ON'; 'interessado em' → 'interested IN'. Memorize por bloco.\n\n### Como cai no TOEIC\n- Part 5 (alta frequência): by × until, during × for, between × among; preposição após adjetivo/verbo.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":50,"t":"G40 — Conjunctions e discourse markers","b":"**Quando você estuda:** Sáb 02/01 (exercício B)\n**Onde aprofundar (British Council):** procure **“Conjunctions and linking words”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- and, but, or, so, because. although/though/even though + oração (contraste); despite/in spite of + substantivo/gerúndio.\n- however, therefore, moreover, furthermore, nevertheless, otherwise: ligam frases (vírgula depois).\n- while/whereas (contraste), in order to/so that (finalidade), either...or, neither...nor, both...and.\n\n### Interferência do português (onde você costuma errar)\n- 'Apesar de' → 'despite + substantivo' OU 'although + oração' (não 'despite that...' informal).\n\n### Como cai no TOEIC\n- Part 6 (coesão): escolher 'However/Therefore/In addition' pela relação entre as frases, não pela tradução.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":51,"t":"G41 — Word families e derivation","b":"**Quando você estuda:** Ter 20/10 (estudo+exercício A)\n**Onde aprofundar (British Council):** procure **“Word formation”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Mesma raiz, classes diferentes: employ (verbo), employee/employer/employment (substantivo), employable (adjetivo).\n- Sufixos de substantivo: -tion, -ment, -ness, -ity, -er/-or, -ance/-ence. De adjetivo: -able, -ful, -less, -ive, -al, -ous. De advérbio: -ly.\n- Prefixos: un-, in-/im-, dis-, re-.\n- Pela POSIÇÃO: depois de artigo/adjetivo → substantivo; antes de substantivo → adjetivo; antes de verbo/adjetivo → advérbio; depois de to/modal → verbo.\n\n### Interferência do português (onde você costuma errar)\n- Português tem famílias parecidas (aplicar–aplicação); o risco é escolher a classe pela tradução, não pela posição.\n\n### Como cai no TOEIC\n- É o tipo mais frequente de Part 5 (word form): 'The (manage / management / manager) team...' → resolva pela posição.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":52,"t":"G42 — B2 consolidation: complex sentences e error-driven grammar","b":"**Quando você estuda:** Ter 05/01 (estudo+exercício A)\n**Onde aprofundar (British Council):** procure **“Complex sentences”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Combine orações: subordinadas (although, because), relativas, condicionais, passiva, reported speech. Ex.: 'Although the project was delayed, the team, which had worked overtime, delivered the report that the client had requested.'\n- Estratégia Part 5 em 5 passos: (1) ache o verbo; (2) ache o sujeito; (3) classifique a lacuna (substantivo/verbo/adj/adv); (4) teste colocação; (5) confirme sentido.\n- Error-driven: abra seu Error Log e liste os 5 padrões que mais se repetem; refaça o exercício B do tópico correspondente.\n\n### Interferência do português (onde você costuma errar)\n- Frases longas em português viram várias curtas em inglês; treine conectores para juntar sem traduzir palavra por palavra.\n\n### Como cai no TOEIC\n- Part 6/7: períodos longos com relativas e passivas — ache o sujeito e o verbo principal antes de ler o resto.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":53,"t":"T01 — Arquitetura do TOEIC L&R","b":"- **200 itens em 2 horas**: Listening 45 min (100 itens) e Reading 75 min (100 itens). Cada seção vale 5–495; total 10–990.\n- **Listening:** Part 1 (6 fotos) · Part 2 (25 pergunta-resposta) · Part 3 (39 itens, 13 conversas) · Part 4 (30 itens, 10 falas).\n- **Reading:** Part 5 (30 frases incompletas) · Part 6 (16 itens, 4 textos) · Part 7 (54 itens: 29 passagem única, 10 dupla, 15 tripla).\n- Não há desconto por erro: **nunca deixe questão em branco**.\n- Seu ponto de partida (relatório de 26/03/2026): Listening 355, Reading 260. Meta: ~425 + ~425.","d":null,"k":"ref"},{"n":54,"t":"T02 — Score, baseline e meta 850","b":"- A ETS trata os níveis do CEFR como referência: Reading B2 ≈ 385+, Listening B2 ≈ 400+. Para 850 você precisa ser B2 nas duas seções.\n- Ruído de medição: ~25 pontos por seção; diferença entre duas provas tem erro de ~35 por seção. Não reaja a variações menores que ~35–50.\n- **Diagnóstico por Part** (sem simulado completo até 18/10): sextas de outubro medem Part 5, 6 e 7; sábados medem Parts 1–4. Registre acerto por Part no Scoreboard (p. 161).\n- Regra do plano: decidir por **padrão de erro** (causa por Part), não por sensação.","d":null,"k":"ref"},{"n":55,"t":"T03 — Part 1 - actions e positions","b":"- 6 fotos; 4 frases por foto, ouvidas uma vez. Escolha a que descreve a foto.\n- **Antes do áudio:** identifique pessoas, ação (verbo -ing), objetos e lugar. **Durante:** elimine a frase com objeto que não está na foto, ação errada ou tempo errado.\n- Armadilhas: palavra parecida (sea/see), objeto correto com ação errada, descrever intenção/estado em vez do que se vê.\n- Treino: 6 fotos/sessão + descrever cada foto em 1 frase antes de ouvir.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":56,"t":"T04 — Part 1 - passive e prepositions","b":"- Fotos de objetos/paisagens usam passiva e presente contínuo passivo: 'Boxes **are stacked** on shelves', 'A lamp **is being installed**'.\n- Preposições de lugar: on, in, next to, behind, in front of, along, beside, across.\n- Armadilha: 'is being + particípio' descreve ação em curso; 'is/are + particípio' descreve estado.\n- Treino: descreva 5 fotos de escritório/ruas com 2 frases (uma ativa, uma passiva).\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":57,"t":"T05 — Part 2 - WH questions","b":"- 25 itens: uma pergunta + 3 respostas, sem texto. **As primeiras 2–3 palavras definem a resposta possível.**\n- who → pessoa/cargo · when → tempo · where → lugar · why → motivo · how → modo/quantidade · what/which → escolha.\n- Armadilhas: repetir a palavra da pergunta, som parecido, responder com WH errado (perguntou 'where', respondeu 'when').\n- Treino: ouvir só o início e prever o tipo de resposta; depois ouvir as 3 opções.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":58,"t":"T06 — Part 2 - yes/no e indirect answers","b":"- Perguntas sim/não muitas vezes têm resposta INDIRETA: 'Did you send the file?' → 'I'll do it after lunch.'\n- Tag questions, perguntas de alternativa ('tea or coffee?') → 'Either is fine.'\n- Afirmações no lugar de pergunta: 'The printer is broken.' → 'I'll call the technician.'\n- Armadilha: procurar 'yes/no' literal. Procure a resposta que faz sentido na situação.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":59,"t":"T07 — Part 2 - requests, offers, suggestions","b":"- 'Could you...?' → 'Sure, no problem.' · 'Would you like...?' → 'That would be great.' · 'Why don't we...?' → 'Good idea.'\n- Recusas educadas: 'I'm afraid I can't.' Sugestões: 'How about...?' 'Let's...'\n- Armadilha: resposta que repete o verbo mas muda o sentido (pedido de ajuda → resposta sobre outro assunto).\n- Treino: crie 3 respostas possíveis para cada modelo (aceitar, recusar, adiar).\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":60,"t":"T08 — Part 3 - preview e contexto","b":"- 39 itens em 13 conversas (2 ou 3 falantes). Há pausas curtas entre as perguntas: **use-as para ler a próxima pergunta e opções.**\n- Antes de a conversa começar, leia as 3 perguntas: elas dizem quem, onde e o quê.\n- Ordem das respostas costuma seguir a ordem das perguntas.\n- Treino: 5 conversas por sessão, primeiro só com preview (sem áudio) para prever o tema.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":61,"t":"T09 — Part 3 - purpose, problem, next action","b":"- **Propósito:** aparece nas 2 primeiras falas. **Problema:** no meio ('the printer isn't working'). **Próxima ação:** perto do fim ('I'll call them now').\n- Perguntas: 'Why is the man calling?', 'What is the problem?', 'What will the woman probably do next?'\n- Armadilha: escolher a ação que foi MENCIONADA, e não a ação que será FEITA a seguir.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":62,"t":"T10 — Part 3 - inference e gráficos","b":"- Itens com gráfico/tabela: leia o gráfico ANTES do áudio; a resposta costuma combinar o que é dito com um dado visual (a fala corrige ou complementa o gráfico).\n- Itens de intenção: 'What does the man mean when he says, \"I'll see what I can do\"?' — responda pelo contexto, não pelo sentido literal.\n- Treino: em cada conversa, escreva 1 inferência que não foi dita literalmente.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":63,"t":"T11 — Part 4 - talks: estrutura","b":"- 30 itens em 10 falas (1 falante): anúncios, recados, propagandas, tours, notícias, reuniões.\n- Estrutura típica: **quem fala + tema → detalhes → pedido/próximo passo.**\n- Leia as 3 perguntas antes: 'Who is the speaker?', 'What is being advertised?', 'What are listeners asked to do?'\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":64,"t":"T12 — Part 4 - announcements e messages","b":"- Recado de voz: 'This is X from Y calling about Z; please call back at...'. Anúncios: aeroporto, loja, empresa ('Attention, shoppers...').\n- Propaganda: produto → benefício → oferta → prazo/contato.\n- Armadilha: horários e números ('at 3, not 5') — anote números enquanto ouve.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":65,"t":"T13 — Part 4 - inference e visual information","b":"- Mesma técnica de T10: gráfico primeiro; depois cruze com o áudio.\n- Inferência: 'What is implied about the store?' — a resposta é consequência do que foi dito.\n- Treino: registre no Error Log se o erro foi de detalhe (L), inferência (I) ou atenção (A).\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":66,"t":"T14 — Part 5 - word classes","b":"- **Word form** é o tipo mais frequente. Resolva pela POSIÇÃO: depois de artigo/adjetivo → substantivo; antes de substantivo → adjetivo; antes de verbo/adjetivo → advérbio; depois de to/modal → verbo.\n- Meta de tempo (a calibrar com simulados): ~20–25 s por item.\n- Base: G41. Treine 10 itens de word form por sessão e escreva a família completa das palavras erradas.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":67,"t":"T15 — Part 5 - verb forms","b":"- Itens de tempo verbal, concordância sujeito-verbo, voz ativa/passiva, -ing × to, forma base após modais.\n- Marcadores: since/for → present perfect; ago/yesterday → past; by the time/when + presente → futuro.\n- Passiva: se há objeto depois da lacuna → ativa; se não há e o sujeito recebe a ação → passiva. Base: G07–G16, G27–G30.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":68,"t":"T16 — Part 5 - agreement e countability","b":"- Singular/plural: each/every/one of + singular; 'the number of' + singular; 'a number of' + plural.\n- Incontáveis: equipment, information, feedback, staff (coletivo), software → verbo singular, sem plural.\n- Base: G17–G20.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":69,"t":"T17 — Part 5 - pronouns e determiners","b":"- Escolha entre sujeito/objeto/possessivo/reflexivo: 'The manager introduced HERSELF.'\n- Determinantes: another/other/others, each other, both/either/neither, whose × who's.\n- Base: G20, G38.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":70,"t":"T18 — Part 5 - prepositions e conjunctions","b":"- by × until (prazo × continuidade), during × for, between × among, since × for.\n- Conjunções: although/despite, because/because of, whether/if, not only... but also, so that.\n- Base: G39–G40. Memorize por blocos (depend on, be responsible for, in charge of).\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":71,"t":"T19 — Part 5 - vocabulary e collocations","b":"- Quatro palavras da mesma classe; só uma combina com o resto da frase (collocation): conduct a survey, raise a concern, submit a request, attend a meeting.\n- Estratégia: leia a frase toda, elimine pela colocação, confirme pelo sentido.\n- Use o vocabulário semanal (Anki) como base; cada erro vira card de colocação.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":72,"t":"T20 — Part 6 - grammar em texto","b":"- 4 textos (email, aviso, artigo, memo) × 4 itens. Gramática em contexto: tempo verbal coerente com o texto, conectores, pronomes.\n- Leia a frase anterior e a posterior antes de escolher.\n- Meta de tempo: ~8 min no bloco todo.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":73,"t":"T21 — Part 6 - cohesion e sentence insertion","b":"- 1 item por texto pede a frase que falta. Procure: referência de pronome (it/they/this), conectores (However, In addition), sequência de tempo.\n- Teste cada opção nas duas posições (antes/depois). A resposta certa liga a frase anterior à seguinte.\n- Armadilha: frase correta gramaticalmente, mas com o assunto errado.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":74,"t":"T22 — Part 7 - single passages","b":"- 29 itens em textos únicos: e-mail, memo, artigo, aviso, formulário, anúncio, chat online, mensagens de texto.\n- Tipos de pergunta: propósito, detalhe, NOT, inferência, vocabulário em contexto, inserção de frase, intenção do falante.\n- Método: leia a pergunta → localize a evidência → confirme → responda. Não leia o texto inteiro antes de olhar as perguntas se estiver sem tempo.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":75,"t":"T23 — Part 7 - emails e messages","b":"- Remetente, destinatário e propósito estão nas 2 primeiras linhas. Depois: pedidos, prazos, anexos, próximos passos.\n- Perguntas 'What is suggested/indicated/implied?' exigem paráfrase: procure a ideia, não a palavra.\n- Base de vocabulário: semanas 4 (Communication) e 13 (Customer Service).\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":76,"t":"T24 — Part 7 - notices, ads e schedules","b":"- Leia por âncoras: datas, preços, condições, exceções (except, only, not eligible).\n- Tabelas/agendas: localize a linha certa antes de ler o resto.\n- Armadilha: uma resposta certa para outro dia/pessoa/produto.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":77,"t":"T25 — Part 7 - articles e forms","b":"- Artigos: ideia principal no 1º parágrafo; cada parágrafo tem uma função.\n- Formulários/faturas: campos, itens, totais, datas; pergunte 'qual campo responde a isto?'.\n- Inserção de frase: teste coesão como em T21.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":78,"t":"T26 — Part 7 - double passages","b":"- 10 itens em 2 conjuntos (2 textos + 5 perguntas cada). Pelo menos 1 pergunta por conjunto exige cruzar os dois textos.\n- Método: identifique o tipo de cada texto, resolva as perguntas de um texto só, depois a pergunta cruzada.\n- Meta: ~7 min por conjunto após adaptação.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":79,"t":"T27 — Part 7 - triple passages","b":"- 15 itens em 3 conjuntos (3 textos + 5 perguntas). Comece pela pergunta cruzada mais fácil de localizar.\n- Faça um mapa mental: texto A (o quê), B (quando/onde), C (exceção/mudança).\n- Meta: ~9–10 min por conjunto após adaptação.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":80,"t":"T28 — Paraphrase engine","b":"- O TOEIC repete a MESMA ideia com outras palavras: postpone → move to a later date; employee → staff member; reduce costs → save money.\n- Treino: para cada erro importante, escreva 2 paráfrases do trecho certo.\n- Registre pares no Anki como card de produção ('Diga de outra forma: ...').\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":81,"t":"T29 — Scanning x reading","b":"- Scanning: buscar nome/número/data. Reading: entender relação entre ideias. Decida antes de começar qual usar.\n- Perguntas de detalhe → scanning; propósito/inferência → leitura do trecho central.\n- Evite ler o texto inteiro linha por linha em toda pergunta.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":82,"t":"T30 — Timing do Reading","b":"- Referência inicial (calibrar com simulados): Part 5 ≈ 10–12 min, Part 6 ≈ 8 min, Part 7 ≈ 55 min (total 75 min).\n- Regra: se uma questão passar de ~90 s, marque, chute e siga. Reserve 2 min para preencher todas.\n- Treino: sextas cronometradas; registre tempo por Part no Scoreboard.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":83,"t":"T31 — Distractors: anatomia do erro","b":"- Tipos: (1) repetição de palavra do texto; (2) som parecido; (3) informação certa para outra pergunta; (4) opostos/extremos; (5) tempo, pessoa ou lugar errado.\n- Ao errar, nomeie o tipo de distrator. Isso treina o olho para a próxima vez.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":84,"t":"T32 — Error taxonomy","b":"- Classifique cada erro: **G** gramática · **V** vocabulário/colocação · **P** paráfrase · **I** inferência · **A** atenção · **T** tempo · **S** estratégia · **L** detalhe de áudio.\n- Só 1 regra/chunk transferível por erro. Erros repetidos 2× na semana entram no Error Log (p. 158).\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":85,"t":"T33 — Full mock protocol","b":"- 200 itens em 2 h sem pausas, ambiente silencioso, marcação em folha de respostas.\n- Material: teste em condições reais do TOEIC Test App (premium) — não use questões geradas por IA.\n- Depois: 20–30 min de pausa. No mesmo dia só anote score/estimativa, acerto por Part e tempo do Reading.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":86,"t":"T34 — Mock review protocol","b":"- 3 passadas: (1) erros com evidência exata; (2) acertos por chute; (3) acertos lentos.\n- Escolha o Top-3 de causas (T32) e crie 3 regras/chunks. Reteste os erros 3 dias depois.\n- A sexta da semana seguinte usa as Top-3 fraquezas como conteúdo.\n**Fonte oficial para treinar esta parte:** Sample Test da ETS (grátis) e séries por Part do TOEIC Test App (premium) — ver pp. 153–154.","d":null,"k":"ref"},{"n":87,"t":"T35 — Test-day protocol","b":"- Documento exigido pelo centro, chegada com antecedência, comer algo familiar, dormir bem.\n- Listening: leia a próxima pergunta durante as pausas; uma questão perdida não pode contaminar a seguinte.\n- Reading: proteja tempo para Part 7; preencha tudo; mude resposta só com motivo textual.","d":null,"k":"ref"},{"n":88,"t":"V01 — Sistema de vocabulário","b":"- **20 chunks por semana** (340 no plano: 17 listas), **4 por dia útil** no Anki. Chunks > palavras soltas: você aprende com verbo + preposição + colocação.\n- Cada chunk tem tradução e frase-exemplo. Anexo A (pp. 163–168) traz **tudo já em CSV** para importar.\n- **Ciclo do chunk:** dia 1 ver (Anki) → dia 2 usar na fala (5') → dia 7 no quiz de domingo → dia 28 na ponte de 4 semanas.\n- Critério de aprendido: você consegue **usar** o chunk numa frase própria, não só reconhecê-lo.","d":null,"k":"ref"},{"n":89,"t":"V02 — Deck Legacy × Active","b":"- **Legacy:** seus cards antigos. **Active:** chunks novos do plano. Não misture os decks.\n- Legacy diminui com o tempo (Fase 1: 7'; Fase 5: 3'). Se o Legacy estiver muito pesado, limite novos cards antigos a 5/dia e apague os que você não reconhece mais como úteis.","d":null,"k":"ref"},{"n":90,"t":"V03 — Cards de produção","b":"- Cards Basic: Frente = tradução em português; Verso = chunk + frase. Quando acertar, diga a frase em voz alta.\n- 1 vez por semana (domingo), transforme 3 chunks em cards de **cloze** com sua própria frase.","d":null,"k":"ref"},{"n":91,"t":"V04 — Colocações","b":"- TOEIC Part 5 mede colocação: *conduct a survey, raise a concern, submit a request, attend a meeting, meet a deadline*.\n- Sempre estude verbo + substantivo + preposição juntos.","d":null,"k":"ref"},{"n":92,"t":"V05 — Revisão espaçada e limites","b":"- Máximo **4 novos/dia** (seg–sex). Revisões vencidas: pare aos 10 minutos.\n- Sem acumular: se passar de 100 revisões vencidas, suspenda os novos até zerar.\n- Não faça “maratona de cards” no fim de semana.","d":null,"k":"ref"},{"n":93,"t":"V06 — Glossário: Work & office","b":"**Working Life** (W0a)\n| Chunk | Tradução | Exemplo |\n|---|---|---|\n| be responsible for | ser responsável por | She is responsible for the budget. |\n| be in charge of | estar encarregado de | Who is in charge of this project? |\n| deal with | lidar com | I deal with customer complaints. |\n| report to | responder/reportar-se a | He reports to the sales director. |\n| meet a deadline | cumprir um prazo | We must meet the deadline on Friday. |\n| hold a meeting | realizar uma reunião | We will hold a meeting at ten. |\n| take minutes | fazer a ata | Ana took minutes during the meeting. |\n| give a presentation | fazer uma apresentação | He gave a presentation to the board. |\n| schedule an appointment | marcar um compromisso | Please schedule an appointment with Mr. Lee. |\n| be running late | estar atrasado | I'm running late, so start without me. |\n| work overtime | fazer hora extra | They worked overtime to finish the order. |\n| take a day off | tirar um dia de folga | She took a day off to travel. |\n| call in sick | avisar que está doente | He called in sick this morning. |\n| fill in for someone | substituir alguém | Can you fill in for me on Monday? |\n| keep someone posted | manter alguém informado | Keep me posted on the results. |\n| workload | carga de trabalho | Her workload increased this quarter. |\n| on behalf of | em nome de | I am writing on behalf of the team. |\n| get in touch with | entrar em contato com | Please get in touch with HR. |\n| be off to a good start | começar bem | The project is off to a good start. |\n| stay on schedule | manter-se no cronograma | We need to stay on schedule. |\n\n**Success** (W2)\n| Chunk | Tradução | Exemplo |\n|---|---|---|\n| achieve a goal | alcançar uma meta | She achieved her sales goal. |\n| make progress | progredir | We are making progress on the report. |\n| succeed in | ter sucesso em | He succeeded in closing the deal. |\n| be proud of | ter orgulho de | I'm proud of my team. |\n| set a target | definir uma meta | Set a target for each month. |\n| reach a milestone | atingir um marco | The project reached a major milestone. |\n| meet expectations | atender às expectativas | The results met expectations. |\n| exceed expectations | superar as expectativas | Sales exceeded expectations. |\n| perform well | ter bom desempenho | The new staff perform well. |\n| earn a promotion | conquistar uma promoção | She earned a promotion last year. |\n| gain experience | ganhar experiência | Interns gain experience quickly. |\n| take the lead | assumir a liderança | He took the lead on the project. |\n| overcome a challenge | superar um desafio | We overcame a big challenge. |\n| rely on | contar com | We rely on our suppliers. |\n| be committed to | ser comprometido com | The firm is committed to quality. |\n| recognize an achievement | reconhecer uma conquista | They recognized her achievement. |\n| make an effort | fazer um esforço | Please make an effort to be on time. |\n| lead to | levar a | Good planning leads to success. |\n| pay off | dar resultado | Her hard work paid off. |\n| a great deal of | muito(a) | It takes a great deal of time. |\n\n**Leaders and Thinkers** (W9)\n| Chunk | Tradução | Exemplo |\n|---|---|---|\n| come up with | ter (uma ideia) | She came up with a great plan. |\n| point out | apontar | He pointed out the  to Mia. |\n| time management | gestão de tempo | Time management is a key skill. |\n| stay organized | manter-se organizado | Use a planner to stay organized. |\n| be productive | ser produtivo | I'm more productive in the morning. |\n| run smoothly | funcionar sem problemas | The event ran smoothly. |\n| deal with a backlog | lidar com um acúmulo | We must deal with the backlog of orders. |\n| double-check | conferir duas vezes | Double-check the address. |\n| follow the procedure | seguir o procedimento | Please follow the procedure exactly. |\n| meet a requirement | atender a um requisito | The product meets every requirement. |\n\n**Environment** (W8)\n| Chunk | Tradução | Exemplo |\n|---|---|---|\n| be made of | ser feito de | The bottle is made of glass. |\n| be designed to | ser projetado para | The device is designed to save energy. |\n| be used for | ser usado para | This room is used for meetings. |\n| be caused by | ser causado por | The delay was caused by fog. |\n| reduce waste | reduzir o desperdício | We reduce waste in the kitchen. |\n| recycle materials | reciclar materiais | The factory recycles materials. |\n| renewable energy | energia renovável | The firm invests in renewable energy. |\n| energy-efficient | eficiente em energia | We bought energy-efficient lamps. |\n| carbon emissions | emissões de carbono | The plant cut carbon emissions. |\n| environmentally friendly | ecologicamente correto | The packaging is environmentally friendly. |\n| raise concern about | levantar preocupação sobre | Residents raised concern about noise. |\n| sustainable | sustentável | We use sustainable materials. |\n| natural resources | recursos naturais | The country has many natural resources. |\n| dispose of | descartar | Dispose of batteries properly. |\n| be harmful to | ser prejudicial a | Smoke is harmful to health. |\n| protect the environment | proteger o meio ambiente | We must protect the environment. |\n| switch to | mudar para | The office switched to LED lights. |\n| have an impact on | ter impacto sobre | Traffic has an impact on air quality. |\n| comply with regulations | cumprir regulamentos | Factories must comply with regulations. |\n| conserve energy | conservar energia | Turn off lights to conserve energy. |","d":null,"k":"ref"},{"n":101,"t":"V14 — Glossário: Technology & projects","b":"**Technology & Projects** (W15)\n| Chunk | Tradução | Exemplo |\n|---|---|---|\n| project milestone | marco do projeto | The first project milestone is May 3. |\n| be on track | estar no caminho certo | The launch is on track. |\n| run into an issue | encontrar um problema | We ran into an issue with the server. |\n| provide an update | fornecer uma atualização | Please provide an update by noon. |\n| software update | atualização de software | Install the software update tonight. |\n| install | instalar | Install the program on your laptop. |\n| back up files | fazer backup de arquivos | Back up files every day. |\n| log in | fazer login | Log in with your password. |\n| password-protected | protegido por senha | The file is password-protected. |\n| technical support | suporte técnico | Call technical support for help. |\n| upgrade | atualizar / melhorar | We will upgrade the system. |\n| system failure | falha de sistema | A system failure stopped production. |\n| user-friendly | fácil de usar | The app is very user-friendly. |\n| data security | segurança de dados | Data security is a top priority. |\n| run a test | executar um teste | Run a test before the launch. |\n| launch date | data de lançamento | The launch date is June 10. |\n| project manager | gerente de projeto | The project manager sent a report. |\n| feasibility study | estudo de viabilidade | A feasibility study is under way. |\n| implement | implementar | We will implement the plan in May. |\n| be up to date | estar atualizado | Keep your software up to date. |","d":null,"k":"ref"},{"n":102,"t":"V15 — Triagem final de vocabulário (janeiro)","b":"- Nas semanas 13–14 (festas) e 18 (prova) você **não** aprende itens novos: só revisa.\n- Triagem: das 340 entradas, marque no Anki como “difícil” os itens que você errou 3+ vezes; esses vão para o quiz de domingo e para a leitura.\n- Regra: dormir bem vale mais que 10 cards na véspera da prova.","d":null,"k":"ref"},{"n":103,"t":"P01 — EN — word stress","b":"- Substantivos/adjetivos de 2 sílabas: acento na 1ª (**MAN**ager, **EM**ployee em 3ª: employ-**EE**). Sufixos -tion/-sion/-ic/-ity puxam o acento (infor-**MA**-tion, e-co-**NO**-mic, oppor-**TU**-nity).\n- Treino (10 min): 10 palavras da semana → marque a sílaba forte → diga 3× exagerando → grave 1×.\n\n**Treino:** 10 min (Qua) — veja o dia no calendário para o foco da semana.","d":null,"k":"ref"},{"n":104,"t":"P02 — EN — sentence stress","b":"- Palavras de conteúdo (substantivo, verbo, adjetivo, advérbio) têm força; palavras de função (a, of, to, the) ficam fracas.\n- 'I'd **LIKE** to **SCHED**ule a **MEET**ing.' Bata o ritmo na mesa e encaixe as palavras.\n\n**Treino:** 10 min (Qua) — veja o dia no calendário para o foco da semana.","d":null,"k":"ref"},{"n":105,"t":"P03 — EN — schwa /ə/","b":"- O som mais comum do inglês, em sílabas fracas: **a**bout, prob**le**m, comp**a**ny, nat**io**nal, sup**po**rt.\n- Reduza vogais não acentuadas: não diga 'com-PA-ny' com 'a' aberto.\n\n**Treino:** 10 min (Qua) — veja o dia no calendário para o foco da semana.","d":null,"k":"ref"},{"n":106,"t":"P04 — EN — /ɪ/ x /iː/","b":"- ship/sheep · live/leave · sit/seat · fill/feel · bit/beat. /ɪ/ é curto e relaxado; /iː/ é longo e tenso.\n- Treino: 5 pares mínimos, 3 frases: 'Please **fill** the form / Do you **feel** well?'\n\n**Treino:** 10 min (Qua) — veja o dia no calendário para o foco da semana.","d":null,"k":"ref"},{"n":107,"t":"P05 — EN — /θ/ e /ð/","b":"- think, thank, three, through / the, this, that, other. Língua entre os dentes; não troque por /t/, /f/, /d/.\n- Frase: 'Thank you for the third **th**ing on the list.'\n\n**Treino:** 10 min (Qua) — veja o dia no calendário para o foco da semana.","d":null,"k":"ref"},{"n":108,"t":"P06 — EN — final consonants","b":"- Falantes de português tendem a acrescentar vogal no fim ('work-i', 'bus-i'). Termine a palavra na consoante: work, hard, next week.\n- Treino: 'hard work', 'next week', 'good deal' — sem vogal extra.\n\n**Treino:** 10 min (Qua) — veja o dia no calendário para o foco da semana.","d":null,"k":"ref"},{"n":109,"t":"P07 — EN — -ed endings","b":"- /t/ depois de som surdo (worked, stopped, watched); /d/ depois de som sonoro (played, cleaned, called); /ɪd/ depois de t/d (wanted, needed, decided).\n- Treino: 15 verbos da semana agrupados em 3 colunas.\n\n**Treino:** 10 min (Qua) — veja o dia no calendário para o foco da semana.","d":null,"k":"ref"},{"n":110,"t":"P08 — EN — plural/3rd person -s","b":"- /s/ (works, meetings), /z/ (plans, needs), /ɪz/ depois de s/z/ʃ/tʃ/dʒ (uses, watches, manages).\n- Não omita o -s da 3ª pessoa: he **works**, she **manages**.\n\n**Treino:** 10 min (Qua) — veja o dia no calendário para o foco da semana.","d":null,"k":"ref"},{"n":111,"t":"P09 — EN — linking","b":"- Consoante final + vogal inicial se ligam: pick_it_up, an_apple, check_in.\n- Treino: 5 phrasal verbs da semana ligados em ritmo contínuo.\n\n**Treino:** 10 min (Qua) — veja o dia no calendário para o foco da semana.","d":null,"k":"ref"},{"n":112,"t":"P10 — EN — weak forms","b":"- to /tə/, for /fə/, and /ən/, can /kən/ (fraco) × can't /kænt/ (forte). 'I can do it' /aɪ kən duː ɪt/.\n- Ouça diferenças entre 'I can go' e 'I can't go' — é armadilha comum de Listening.\n\n**Treino:** 10 min (Qua) — veja o dia no calendário para o foco da semana.","d":null,"k":"ref"},{"n":113,"t":"P11 — EN — intonation","b":"- Afirmativas e Wh-: descem no fim. Sim/não: sobem. Listas: sobe, sobe, desce.\n- Pedidos corteses: 'Could you help me?' com subida suave.\n\n**Treino:** 10 min (Qua) — veja o dia no calendário para o foco da semana.","d":null,"k":"ref"},{"n":114,"t":"P12 — EN — thought groups e shadowing","b":"- Divida o áudio em grupos de sentido (3–7 palavras) e imite pausas e melodia. Shadowing: fale junto com o áudio, ligeiramente atrasado.\n- Método de 10 min: ouvir 2× → transcript → shadowing 3× → corrigir 2–3 trechos → gravar.\n\n**Treino:** 10 min (Qua) — veja o dia no calendário para o foco da semana.","d":null,"k":"ref"},{"n":115,"t":"P13 — FR — liaison e enchaînement","b":"- Liaisons obrigatórias: les_amis, vous_avez, un_ami. Proibidas: et elle, un homme_/ (sem liaison).\n- Enchaînement consonantique: 'il a' /i-la/, 'elle est' /ɛ-lɛ/.\n\n**Treino:** 10 min (Qua) — veja o dia no calendário para o foco da semana.","d":null,"k":"ref"},{"n":116,"t":"P14 — FR — /y/ x /u/ e vogais anteriores","b":"- /y/ (tu, rue, dessus) com lábios arredondados e língua para frente; /u/ (tout, roue, dessous) mais atrás. /ø/ (deux) × /œ/ (peur).\n- Pares mínimos: tu/tout, rue/roue, dessus/dessous.\n\n**Treino:** 10 min (Qua) — veja o dia no calendário para o foco da semana.","d":null,"k":"ref"},{"n":117,"t":"P15 — FR — nasais, ritmo e R","b":"- Nasais: on /ɔ̃/, an/en /ɑ̃/, in /ɛ̃/, un /œ̃/. Não pronuncie o 'n' final.\n- Ritmo: francês é silábico — sílabas de duração parecida; acento no fim do grupo rítmico. R uvular suave.\n\n**Treino:** 10 min (Qua) — veja o dia no calendário para o foco da semana.","d":null,"k":"ref"},{"n":118,"t":"L01 — Three-pass listening","b":"1) Sem transcript: ideia principal · 2) Com perguntas/transcript: detalhes · 3) Sem transcript: reescuta e shadowing curto.\n- Não pause a cada palavra na 1ª escuta. Extraia no máximo 3 itens novos.","d":null,"k":"ref"},{"n":119,"t":"L02 — Listening sem tradução mental","b":"- Treine capturar intenção e blocos, não converter cada palavra para português.\n- Exercício: depois de ouvir 30 s, diga em inglês 1 frase sobre o que entendeu.","d":null,"k":"ref"},{"n":120,"t":"L03 — Transcript como ferramenta","b":"- Use transcript para descobrir 'som esperado × som real'. Marque 3 trechos onde você não reconheceu palavras que conhecia.\n- Depois volte ao áudio SEM transcript.","d":null,"k":"ref"},{"n":121,"t":"L04 — Dictation microscópica","b":"- Ditado de 10–20 s: 3 escutas, escreva, compare, escreva o erro. Foco em palavras de função e terminações (-ed, -s).","d":null,"k":"ref"},{"n":122,"t":"L05 — TOEIC x real English","b":"- TOEIC: fala clara, situações de trabalho, sotaques variados (americano, britânico, canadense, australiano). Real English: ruído, gírias, fala rápida.\n- Trate os dois como treinos diferentes; não chame o TOEIC de 'inglês real' completo.","d":null,"k":"ref"},{"n":123,"t":"L06 — Escada para filmes","b":"- Degraus: (1) legenda EN em 5 min de cena; (2) 5 min sem legenda + reveja com legenda; (3) episódio curto com legenda EN; (4) trecho sem legenda 10–15 min.\n- Não transforme lazer em dever: só 10–15 min por semana viram estudo ativo.","d":null,"k":"ref"},{"n":124,"t":"L07 — Accent diversity","b":"- Alterne áudios de sotaques diferentes. Anote 3 sons que mudam (t/d, r final, vogal de 'can't').","d":null,"k":"ref"},{"n":125,"t":"L08 — Fast speech","b":"- Reduções: gonna, wanna, 'd, 've. Reescute em velocidade 0,75× depois 1×.","d":null,"k":"ref"},{"n":126,"t":"L09 — Active video sem destruir o lazer","b":"- Escolha 1 vídeo/semana para estudo ativo (tema da semana). O resto: passivo.","d":null,"k":"ref"},{"n":127,"t":"L10 — Listening progress metric","b":"- Registre: nº de escutas necessárias, uso de transcript (sim/não), detalhes perdidos. Objetivo: entender na 1ª escuta com transcript só para conferir.","d":null,"k":"ref"},{"n":128,"t":"R01 — READ FLOW","b":"- 20–30 min de texto confortável (~90% conhecido); máx. 2–3 consultas; termine com resumo de 2 frases em inglês.","d":null,"k":"ref"},{"n":129,"t":"R02 — READ DEEP","b":"- Análise: marque estruturas, conectores, paráfrases; 5 palavras/chunks para o Anki; releia em voz alta um parágrafo.","d":null,"k":"ref"},{"n":130,"t":"R03 — Reading speed sem skimming cego","b":"- Cronometre 200–300 palavras; registre tempo e acerto de 3 perguntas. Objetivo: entender mais em menos tempo, sem 'pular' ideias.","d":null,"k":"ref"},{"n":131,"t":"R04 — Paraphrase recognition","b":"- Após ler, reescreva a ideia com outras palavras. Depois compare com a pergunta do exercício.","d":null,"k":"ref"},{"n":132,"t":"R05 — Inference","b":"- Pergunte: 'o que o texto sugere sem dizer?'. Só aceite a inferência se houver uma pista textual.","d":null,"k":"ref"},{"n":133,"t":"R06 — Email e workplace texts","b":"- Reconheça remetente, propósito, pedido, prazo. Vocabulário: attach, forward, confirm, follow up.","d":null,"k":"ref"},{"n":134,"t":"R07 — Technical reading","b":"- Textos técnicos (engenharia, TI): procure definições, causas e consequências; crie glossário de 5 termos por texto.","d":null,"k":"ref"},{"n":135,"t":"R08 — B1 -> B2 bridge","b":"- Suba de nível quando entender ≥90% do B1 em 2 textos seguidos. No B2, aceite 80–85% e releia.","d":null,"k":"ref"},{"n":136,"t":"R09 — Part 7 multi-passage reading","b":"- Etiquete cada texto (tipo, data, remetente). Faça mapa de conexões antes de responder.","d":null,"k":"ref"},{"n":137,"t":"R10 — Reading progress metric","b":"- Acompanhe: acerto + tempo + tipo de erro (T32). Meta: compreender melhor em menos tempo.","d":null,"k":"ref"},{"n":138,"t":"F01 — Diagnóstico de pronúncia FR","b":"- Grave 60 s lendo um texto curto em francês. Marque: /y/ × /u/, nasais, liaisons, R. Salve o áudio como baseline (compare em janeiro e em fevereiro).","d":null,"k":"ref"},{"n":139,"t":"F02 — Liaison e enchaînement","b":"- Liaisons obrigatórias (les amis, vous avez), proibidas (et elle). Enchaînement: il_a, elle_est. Treino: 5 frases da semana em voz alta, sem pausas entre palavras ligadas. Ver P13.","d":null,"k":"ref"},{"n":140,"t":"F03 — Voyelles: /y/, /u/, /ø/, /œ/","b":"- Pares: tu/tout, rue/roue, deux/peur. Treino: 10 pares mínimos + 3 frases. Ver P14.","d":null,"k":"ref"},{"n":141,"t":"F04 — Nasales e R","b":"- on, an/en, in, un sem pronunciar o n final; R uvular suave. Ver P15.","d":null,"k":"ref"},{"n":142,"t":"F05 — Passé composé × imparfait","b":"- PC = evento; imparfait = fundo/hábito/descrição. Verbos com être + pronominais. Concordância do particípio com être e COD anteposto.","d":null,"k":"ref"},{"n":143,"t":"F06 — Conditionnel","b":"- Formação: futuro + terminações do imparfait. Uso: polidez, hipótese, arrependimento (passé), fato não confirmado (jornalismo).","d":null,"k":"ref"},{"n":144,"t":"F07 — Pronoms y/en/COD/COI","b":"- Posição e ordem dos pronomes; imperativo afirmativo com hífen. Erros típicos de brasileiros: esquecer o pronome, colocar depois do verbo.","d":null,"k":"ref"},{"n":145,"t":"F08 — Prépositions e verbes","b":"- penser à, rêver de, s'intéresser à, dépendre de, participer à, réussir à/réussir un examen. Falsos amigos: assister (assistir a = être présent), actuellement, éventuellement.","d":null,"k":"ref"},{"n":146,"t":"F09 — Subjonctif","b":"- Gatilhos: falloir que, vouloir que, avoir peur que, douter que, bien que, pour que. Não use após 'penser que' afirmativo.","d":null,"k":"ref"},{"n":147,"t":"F10 — Écrit professionnel FR","b":"- Fórmulas: 'Je vous prie de...', 'Veuillez agréer...', 'Suite à votre message...'. Estrutura: objeto → contexto → pedido → fecho.","d":null,"k":"ref"},{"n":148,"t":"F11 — Compréhension orale rapide","b":"- 1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); 3ª: reformular em 3 frases. Fontes: RFI Journal en français facile, innerFrench, TV5MONDE.","d":null,"k":"ref"},{"n":149,"t":"F12 — Précision lexicale","b":"- Não use 'chose' e 'faire' por tudo: substitua por verbos precisos (réaliser, effectuer, mener). Registre: familiar, courant, soutenu.","d":null,"k":"ref"},{"n":150,"t":"F13 — Reformulation","b":"- Reformular = dizer a mesma ideia com outras palavras: sinônimos, mudança de classe (nominalisation), voz passiva, inversão.","d":null,"k":"ref"},{"n":151,"t":"F14 — Argumentation C1","b":"- Estrutura: introdução (problématique) → tese → 2–3 argumentos + exemplos → contra-argumento → conclusão. Conectores por função.","d":null,"k":"ref"},{"n":152,"t":"F15 — Ponte para o DALF C1 (fev–ago/2027)","b":"- Ver Anexo C (pp. 171–176): roteiro mensal, provas e simulados sob condições reais.","d":null,"k":"ref"},{"n":153,"t":"Recursos oficiais TOEIC","b":"**Regra:** perguntas no formato TOEIC — **somente** material oficial da ETS.\n\n| Recurso | Uso no plano | Link |\n|---|---|---|\n| Sample Test (PDF + áudio) | Diagnóstico por Part nas sextas/sábados de outubro | https://www.ets.org/content/dam/ets-org/fr/pdfs/toeic/toeic-listening-and-reading-sample-test.pdf |\n| Página oficial de preparação | Formato, dicas, materiais | https://www.ets.org/toeic/test-takers/prepare.html |\n| Sobre o Listening & Reading | Estrutura do exame | https://www.ets.org/toeic/about/listening-reading.html |\n| TOEIC Test App (ETS Global) | Séries por Part, testes semi-reais e testes em condições reais | https://www.etsglobal.org/fr/en/content/toeic-test-application |\n| Página de preparação ETS Global | Comparativo de produtos oficiais | https://www.etsglobal.org/fr/en/landing-page/preparation-for-the-toeic-test |\n| Mapeamento TOEIC × CEFR | Referência dos níveis | https://www.ets.org/pdfs/toeic/toeic-mapping-cefr-reference.pdf |\n\n**Confirme na Semana 0** o que o seu plano do app inclui (versão grátis vs. premium) e anote em “Fila de práticas”. Os testes em condições reais viram os Simulados 1–5.","d":null,"k":"ref"},{"n":154,"t":"Fila de práticas oficiais (como usar cada uma)","b":"| Material | Onde entra | Quantidade planejada |\n|---|---|---|\n| Sample Test (grátis) | Ter/Sex/Sáb das semanas 1–2 (Parts 5, 6, 7 e 2–3) | 1 teste (200 itens), fatiado |\n| App — séries temáticas por Part | Sextas e sábados das semanas 4–17 | por Part fraca |\n| App — testes semi-reais nº 1–5 | Sextas “Aquecimento” (seção Reading) e Part 7 intensivo | 5 |\n| App — testes em condições reais nº 1–5 | Simulados 1–4 (18/10, 15/11, 13/12, 10/01) + Reading final (17/01) | 5 |\n\n**Regra de ouro:** não refazer o mesmo item cedo demais; a revisão está no Error Log, não nas questões.","d":null,"k":"ref"},{"n":155,"t":"Leitura e listening British Council (lista completa com links)","b":"**Leitura B1 e B2 (25 textos, confirmados no índice do site em 24/09/2026):**\n\n| # | Nível | Título | Link |\n|---|---|---|---|\n| 1 | B1 | A conference programme | https://learnenglish.britishcouncil.org/free-resources/reading/b1/conference-programme |\n| 2 | B1 | An email request for help | https://learnenglish.britishcouncil.org/free-resources/reading/b1/email-request-help |\n| 3 | B1 | A travel guide | https://learnenglish.britishcouncil.org/free-resources/reading/b1/travel-guide |\n| 4 | B1 | Planning an event | https://learnenglish.britishcouncil.org/free-resources/reading/b1/planning-event |\n| 5 | B1 | Innovation in business | https://learnenglish.britishcouncil.org/free-resources/reading/b1/innovation-business |\n| 6 | B1 | Social media influencers | https://learnenglish.britishcouncil.org/free-resources/reading/b1/social-media-influencers |\n| 7 | B1 | A flyer for a gym | https://learnenglish.britishcouncil.org/free-resources/reading/b1/flyer-gym |\n| 8 | B1 | Digital habits across generations | https://learnenglish.britishcouncil.org/free-resources/reading/b1/digital-habits-across-generations |\n| 9 | B1 | How to spot fake news | https://learnenglish.britishcouncil.org/free-resources/reading/b1/how-spot-fake-news |\n| 10 | B1 | Robot teachers | https://learnenglish.britishcouncil.org/free-resources/reading/b1/robot-teachers |\n| 11 | B1 | Encyclopedia entry | https://learnenglish.britishcouncil.org/free-resources/reading/b1/encyclopedia-entry |\n| 12 | B1 | The Martian: a book review | https://learnenglish.britishcouncil.org/free-resources/reading/b1/martian-book-review |\n| 13 | B1 | The legend of fairies | https://learnenglish.britishcouncil.org/free-resources/reading/b1/legend-fairies |\n| 14 | B2 | Work–life :** https://learnenglish.britishcouncil.org/free-resources/business/english-emails · https://learnenglish.britishcouncil.org/business-english/business-magazine · Vocabulário B1–B2: https://learnenglish.britishcouncil.org/free-resources/vocabulary/b1-b2\n\nNota: páginas de índice podem mudar; se um link falhar, use a busca do site com o título indicado na página do dia.","d":null,"k":"ref"},{"n":157,"t":"Class Log — modelo","b":"| Data | Professora | Unidade/tema | 3 erros | 3 chunks | 1 dúvida | Virou card? |\n|---|---|---|---|---|---|---|\n| dd/mm | P1/P2 | ex.: Money | | | | |\n\n**Como preencher em 3 min:** escreva primeiro os 3 erros (frase errada → frase certa), depois 3 chunks, depois 1 dúvida para a próxima aula. Reabrir por data quando a página do dia mandar.","d":null,"k":"ref"},{"n":158,"t":"Error Log — modelo","b":"| Data | Fonte (Part/aula) | Frase/erro | Causa (G/V/P/I/A/T/S/L) | Regra ou chunk certo | Reteste (3 dias) |\n|---|---|---|---|---|---|\n\n**Regras:** 1 regra transferível por erro; erros repetidos 2× na semana recebem um card no Anki; reteste em 3 dias.","d":null,"k":"ref"},{"n":159,"t":"Anki — configuração","b":"1. Instale o Anki: https://apps.ankiweb.net/\n2. Crie 2 decks: **Legacy** e **Active**.\n3. Importe o CSV do Anexo A: Arquivo → Importar → separador **ponto e vírgula** → tipo de nota **Básico** → deck **Active**.\n4. Limites: novos/dia = 4 (Active); revisões: pare aos 10 min.\n5. Tag padrão: `toeic_<semana>_<tema>`.","d":null,"k":"ref"},{"n":160,"t":"Protocolo de simulado — folha","b":"- **Antes:** sono, água, silêncio, celular em modo avião, folha de respostas, cronômetro.\n- **Durante:** Listening 45' seguidos, depois Reading 75' seguidos. Sem pausas extras.\n- **Depois (até 30 min):** anote score, acerto por Part, tempo por Part, 3 dúvidas, humor/energia.\n- **No dia seguinte:** revisão em 3 passadas (T34). **Sexta seguinte:** reparo das Top-3 fraquezas.","d":null,"k":"ref"},{"n":161,"t":"Scoreboard — modelo","b":"| Semana | P1 | s week's reading in sixty seconds.","d":null,"k":"ref"},{"n":171,"t":"Anexo C1 — Roteiro FR: visão geral e exame","b":"### Anexo C — Roteiro de francês para o C1 (fevereiro → agosto/2027)\n\n**Ponto de partida:** francês em nível B2 estimado (confirme com um teste diagnóstico em fevereiro). **Meta:** C1 (DALF C1) até agosto/2027. Data e local da prova: confirme no site oficial do exame (France Éducation international / centro credenciado) e reserve a inscrição até **fevereiro**.\n\n**Estrutura do exame (confirme no site oficial):** quatro provas — compréhension de l'oral, compréhension des écrits, production écrite (synthèse + essai argumenté) e production orale (exposé + débat). Cada prova vale 25 pontos; há nota mínima por prova.\n\n**Carga sugerida após o TOEIC:** 6–8 h/semana (o inglês cai para manutenção de ~2 h/semana).","d":null,"k":"ref"},{"n":172,"t":"Anexo C2 — Fevereiro: diagnóstico e base C1","b":"- **Semana 1:** prova-modelo completa sob tempo (compréhension orale + écrite + production écrite); registre nota por prova.\n- **Semana 2:** lista das 10 maiores fraquezas; inscrição no exame; escolher a professora/tutor de francês.\n- **Semanas 3–4:** rotina fixa: 3 áudios/semana (RFI, TV5) com notas; 2 textos longos/semana; 1 production écrite curta.\n- **Passivo diário:** RFI Journal en français facile.","d":null,"k":"ref"},{"n":173,"t":"Anexo C3 — Março e abril: compreensão","b":"- Compréhension orale: 3 áudios/semana de 3–5 min; 3 escutas (tema → notas → reformulação).\n- Compréhension écrite: 2 textos longos/semana; resumo de 100 palavras em francês.\n- Vocabulário: 20 expressões/semana (Anexo F como base) em Anki FR.\n- Produção: 1 texto argumentativo/semana com correção.","d":null,"k":"ref"},{"n":174,"t":"Anexo C4 — Maio e junho: produção escrita","b":"- 1 synthèse (resumo de 2–3 documentos) + 1 essai argumenté por semana, com correção.\n- Banco de conectores por função (causa, concessão, oposição, ilustração, conclusão).\n- Reescrita: refazer o mesmo texto com 3 conectores mais precisos.","d":null,"k":"ref"},{"n":175,"t":"Anexo C5 — Junho e julho: produção oral e simulados","b":"- 2 exposés gravados por semana (3–4 min) sobre temas atuais; feedback de professora.\n- 1 simulado completo a cada 2 semanas; comparar por prova.\n- Debate: 20 min/semana com professora, discutindo um tema.","d":null,"k":"ref"},{"n":176,"t":"Anexo C6 — Agosto: polimento e prova","b":"- 2 simulados completos, revisão de erros, revisão de conectores.\n- Descanso 48 h antes; documentos e local da prova conferidos.\n- Decisão de data: se a nota de simulado ficar abaixo do necessário em junho, considerar sessão seguinte.\n\n**Semana-tipo:** Seg 60' compréhension orale · Ter 60' compréhension écrite · Qua 60' grammaire/lexique · Qui 75' production écrite · Sex 45' production orale · Sáb 90' simulado parcial · Dom 30' revisão.","d":null,"k":"ref"},{"n":177,"t":"Anexo D1 — Regras de decisão do TOEIC (após cada simulado)","b":"1. **Simulado 1 (18/10):** compare com 615. Se Reading < 330 → sexta 75'; se Listening < 380 → sábado 40'.\n2. **Simulado 2 (15/11):** esperado ~700–780. Menos que +35 vs. Simulado 1 → revisar causas: G (gramática) → aumentar drills de sáb; V → 6 chunks/dia por 2 semanas; T (tempo) → sextas cronometradas.\n3. **Simulado 3 (13/12):** se < 760 → avaliar segunda data de prova (fevereiro/março) como rede de segurança e comunicar ao interessado na exigência.\n4. **Simulado 4 (10/01):** se ≥ 820 → manter; 780–820 → foco na seção mais fraca; < 780 → considerar segunda data.\n5. **Reading final (17/01):** só confirmar ritmo; não alterar estratégia.","d":null,"k":"ref"},{"n":178,"t":"Anexo D2 — Contingência","b":"- **Se faltar 1 semana inteira:** retome na semana seguinte no ponto em que parou; não comprima gramática.\n- **Se o app/premium não estiver disponível:** use o Sample Test (1 teste) e páginas de exemplo da ETS (https://www.ets.org/toeic/test-takers/prepare.html); avise-me para ajustarmos as sextas.\n- **Se aula da professora for cancelada:** faça o Class Log “sem aula”: revise o tema e grave 5 min de fala.\n- **Se sentir exaustão:** versão mínima por 3 dias (p. 6).\n- **Segunda data de prova:** verifique no site da ETS/centro as datas de fevereiro e março com antecedência.","d":null,"k":"ref"},{"n":179,"t":"Anexo E1 — Checklist da Semana 0 (25–27/09)","b":"- [ ] Ler as pp. 2–10 (15 min).\n- [ ] Abrir o TOEIC Test App e confirmar o que está incluído; abrir o Sample Test PDF e testar o áudio.\n- [ ] Criar decks Legacy/Active e importar o Anexo A.\n- [ ] Criar Class Log e Error Log (pp. 157–158).\n- [ ] Anotar aulas 14/09–24/09 no Class Log (só 3 erros/chunks cada).\n- [ ] Testar links da p. 155 e 156.\n- [ ] Definir horários fixos: micro (25') e bloco principal.\n- [ ] Definir o horário dos Simulados (domingo 09h, 2 h seguidas).","d":null,"k":"ref"},{"n":180,"t":"Anexo E2 — Verificação de links","b":"**Confirmados por mim em 24/09/2026 (apareceram nos índices do site):** todos os links da p. 155 de leitura B1/B2 e listening B2 (British Council).\n\n**Não reabertos hoje (vindos do plano anterior ou de índices):** ETS (sample test, preparação), ETS Global (app), RFI, innerFrench, Easy French, TV5MONDE, BBC, VOA, TED, YouTube.\n\n**Como verificar em 2 min:** abra cada link na Semana 0; se algum falhar, use a busca do site com o título indicado. Este documento cita o título de cada item para facilitar.","d":null,"k":"ref"},{"n":181,"t":"Anexo F1 — Expressões C1 em francês (semanas 1–9)","b":"| Semana | Expressão | Sentido | Exemplo |\n|---|---|---|---|\n| 1 | en effet | de fato | Il est en retard ; en effet, le train a été annulé. |\n| 1 | d'ailleurs | aliás | Il est compétent ; d'ailleurs, il parle trois langues. |\n| 1 | par ailleurs | além disso | Par ailleurs, le budget a augmenté. |\n| 1 | dans la mesure où | na medida em que | Dans la mesure où le délai est court, il faut agir vite. |\n| 2 | à l'origine | na origem | À l'origine, le projet visait les étudiants. |\n| 2 | en ce qui concerne | no que diz respeito a | En ce qui concerne le budget, tout est prêt. |\n| 2 | au fil du temps | ao longo do tempo | Au fil du temps, les habitudes changent. |\n| 2 | tenir compte de | levar em conta | Il faut tenir compte des retards. |\n| 3 | s'agissant de | tratando-se de | S'agissant de la sécurité, aucun risque. |\n| 3 | il convient de | convém | Il convient de vérifier les données. |\n| 3 | faire preuve de | demonstrar | Elle a fait preuve de courage. |\n| 3 | mettre en œuvre | implementar | Nous allons mettre en œuvre le plan. |\n| 4 | à mon sens | na minha opinião | À mon sens, ce choix est risqué. |\n| 4 | il me semble que | parece-me que | Il me semble que le prix est élevé. |\n| 4 | force est de constater que | é forçoso constatar que | Force est de constater que les ventes baissent. |\n| 4 | en tout état de cause | em qualquer caso | En tout état de cause, nous devons décider. |\n| 5 | dans l'hypothèse où | na hipótese de | Dans l'hypothèse où il pleuvrait, nous annulerions. |\n| 5 | à condition que | com a condição de que (+subj.) | Je viens, à condition que tu conduises. |\n| 5 | à moins que | a menos que (+subj.) | Nous sortons, à moins qu'il pleuve. |\n| 5 | au cas où | caso | Prends un parapluie au cas où il pleuvrait. |\n| 6 | en dépit de | apesar de | En dépit du froid, ils sont sortis. |\n| 6 | quoique | embora (+subj.) | Quoiqu'il soit jeune, il est expérimenté. |\n| 6 | quelle que soit | qualquer que seja | Quelle que soit ta décision, je te soutiens. |\n| 6 | tout de même | ainda assim | C'est cher ; je l'achète tout de même. |\n| 7 | de plus en plus | cada vez mais | Les prix augmentent de plus en plus. |\n| 7 | à long terme | a longo prazo | À long terme, c'est rentable. |\n| 7 | dans l'ensemble | no conjunto | Dans l'ensemble, le bilan est positif. |\n| 7 | en revanche | em compensação | Il est lent ; en revanche, il est précis. |\n| 8 | il s'avère que | verifica-se que | Il s'avère que le rapport contient des erreurs. |\n| 8 | il s'agit de | trata-se de | Il s'agit de convaincre les clients. |\n| 8 | mettre l'accent sur | dar ênfase a | Le rapport met l'accent sur la qualité. |\n| 8 | soulever une question | levantar uma questão | Cette étude soulève une question importante. |\n| 9 | étant donné que | dado que | Étant donné que le budget est limité, nous attendrons. |\n| 9 | du fait que | pelo fato de | Du fait que le prix a baissé, les ventes montent. |\n| 9 | c'est pourquoi | é por isso que | C'est pourquoi nous avons décidé de reporter. |\n| 9 | par conséquent | por conseguinte | Par conséquent, la réunion est annulée. |","d":null,"k":"ref"},{"n":182,"t":"Anexo F2 — Expressões C1 em francês (semanas 10–18)","b":"| Semana | Expressão | Sentido | Exemplo |\n|---|---|---|---|\n| 10 | certes… mais | é verdade… mas | Certes, c'est cher, mais c'est fiable. |\n| 10 | néanmoins | não obstante | Néanmoins, il faut rester prudent. |\n| 10 | il n'en reste pas moins que | ainda assim permanece que | Il n'en reste pas moins que le risque existe. |\n| 10 | aussi bien… que | tanto… quanto | Aussi bien les élèves que les profs sont concernés. |\n| 11 | dont | de que / cujo | Le problème dont on parle est grave. |\n| 11 | ce dont | aquilo de que | Ce dont j'ai besoin, c'est du temps. |\n| 11 | auquel | ao qual | Le projet auquel je participe est intéressant. |\n| 11 | lequel | o qual | La raison pour laquelle il a démissionné est claire. |\n| 12 | à cet égard | a esse respeito | À cet égard, la loi est claire. |\n| 12 | en l'occurrence | no caso | En l'occurrence, le retard est justifié. |\n| 12 | c'est la raison pour laquelle | é a razão pela qual | C'est la raison pour laquelle nous avons agi. |\n| 12 | la prise de décision | tomada de decisão | La prise de décision est rapide. |\n| 13 | se rendre compte de | perceber | Je me rends compte de mon erreur. |\n| 13 | avoir besoin de | precisar de | J'ai besoin de repos. |\n| 13 | profiter de | aproveitar | Profitez des fêtes ! |\n| 13 | se reposer | descansar | Il se repose ce week-end. |\n| 14 | faire le point | fazer um balanço | Faisons le point sur l'année. |\n| 14 | prendre du recul | tomar distância | Il faut prendre du recul. |\n| 14 | s'améliorer | melhorar | Mon français s'améliore. |\n| 14 | viser | visar | Je vise le C1 en août. |\n| 15 | il est à noter que | note-se que | Il est à noter que les prix ont baissé. |\n| 15 | il ressort que | depreende-se que | Il ressort de l'étude que la demande baisse. |\n| 15 | on constate que | constata-se que | On constate une hausse. |\n| 15 | être tenu de | ser obrigado a | Les employés sont tenus de signaler. |\n| 16 | affirmer que | afirmar que | Il affirme que c'est vrai. |\n| 16 | prétendre que | alegar que | Elle prétend qu'elle n'était pas là. |\n| 16 | faire remarquer que | fazer notar que | Il a fait remarquer que le délai est court. |\n| 16 | admettre que | admitir que | Elle admet qu'elle s'est trompée. |\n| 17 | tout en + gérondif | ao mesmo tempo que | Il travaille tout en étudiant. |\n| 17 | de façon à | de modo a | Il parle lentement de façon à être compris. |\n| 17 | au lieu de | em vez de | Au lieu de partir, il est resté. |\n| 17 | afin de | a fim de | Afin d'éviter les erreurs, relisez. |\n| 18 | en définitive | em suma | En définitive, le plan est solide. |\n| 18 | en somme | em suma | En somme, tout est prêt. |\n| 18 | pour conclure | para concluir | Pour conclure, je remercie l'équipe. |\n| 18 | à terme | a prazo | À terme, nous atteindrons l'objectif. |","d":null,"k":"ref"},{"n":183,"t":"sexta-feira, 25/09/2026 · Plano operacional","b":"**Semana 0/18 · Fase 1 — Fundação e reativação** · faltam **126 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Semana 0\n**Missão do dia:** Montar o sistema e recuperar o que ficou (dia de transição).\n**Tempo ativo:** 45 min · **Versão mínima:** Setup 20' + Anki 10'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Anki (recuperação) | 10 | Importar CSV e revisar Working Life (itens 1–10) |\n| Setup do sistema | 35 | Checklist Semana 0 (Anexo E1) |\n\n### Anki — 10 min\nImporte o Anexo A (pp. 163–168) e revise **Working Life** (itens 1–10):\n- **be responsible for** — ser responsável por · *She is responsible for the budget.*\n- **be in charge of** — estar encarregado de · *Who is in charge of this project?*\n- **deal with** — lidar com · *I deal with customer complaints.*\n- **report to** — responder/reportar-se a · *He reports to the sales director.*\n- **meet a deadline** — cumprir um prazo · *We must meet the deadline on Friday.*\n- **hold a meeting** — realizar uma reunião · *We will hold a meeting at ten.*\n- **take minutes** — fazer a ata · *Ana took minutes during the meeting.*\n- **give a presentation** — fazer uma apresentação · *He gave a presentation to the board.*\n- **schedule an appointment** — marcar um compromisso · *Please schedule an appointment with Mr. Lee.*\n- **be running late** — estar atrasado · *I'm running late, so start without me.*\n\n### Ponte com o plano antigo\n- Hoje é a 12ª dia depois do início do plano antigo (14/09). Marque o que você já fez: G01 [ ] G02 [ ] G03 [ ] G04 [ ] G05 [ ].\n- Se você já fez G01–G03, a Semana 1 (G01–G03) vira **revisão rápida**: só o exercício A.\n\n### Passivo\n- TED — 1 talk (≤12 min) sobre Money: https://www.ted.com/talks?q=Money\n\n### Checklist\n- [ ] Anki · [ ] Setup (Anexo E1) · [ ] Class Log recuperado (só 3 itens por aula)","d":"2026-09-25","k":"Plano operacional"},{"n":184,"t":"sexta-feira, 25/09/2026 · Guia detalhado","b":"### Guia detalhado — 25/09/2026 · Setup\n\n1. (5') Leia pp. 2–10.\n2. (8') Abra o TOEIC Test App (https://www.etsglobal.org/fr/en/content/toeic-test-application) e o Sample Test PDF (https://www.ets.org/content/dam/ets-org/fr/pdfs/toeic/toeic-listening-and-reading-sample-test.pdf); confirme o que está incluído e teste o áudio.\n3. (7') Crie os decks *Legacy* e *Active* (p. 159) e importe o CSV.\n4. (5') Crie Class Log e Error Log (pp. 157–158).\n5. (5') Defina horários: micro (25') e bloco principal.\n6. (5') Anote suas aulas de 14/09–24/09 no Class Log (3 erros/chunks por aula).\n\n**Segunda 28/09 é a Semana 1.**","d":"2026-09-25","k":"Guia detalhado"},{"n":185,"t":"sábado, 26/09/2026 · Sábado — semana 0","b":"**Semana 0/18 · Fase 1 — Fundação e reativação** · faltam **125 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Semana 0\n**Missão do dia:** Recuperar vocabulário/aulas e testar shadowing.\n**Tempo ativo:** 50 min · **Versão mínima:** Anki 10' + Class Log 10'\n\n| Bloco | Min | O quê |\n|---|---|---|\n| Anki recuperação | 15 | Working Life 11–20 + Trends 1–10 (revisão, sem cards novos) |\n| Class Log | 20 | Recuperar aulas 14–25/09 (3 erros/chunks por aula) |\n| Shadowing teste | 15 | Trecho do áudio da Semana 1 |\n\n**Working Life 11–20:**\n- **work overtime** — fazer hora extra · *They worked overtime to finish the order.*\n- **take a day off** — tirar um dia de folga · *She took a day off to travel.*\n- **call in sick** — avisar que está doente · *He called in sick this morning.*\n- **fill in for someone** — substituir alguém · *Can you fill in for me on Monday?*\n- **keep someone posted** — manter alguém informado · *Keep me posted on the results.*\n- **workload** — carga de trabalho · *Her workload increased this quarter.*\n- **on behalf of** — em nome de · *I am writing on behalf of the team.*\n- **get in touch with** — entrar em contato com · *Please get in touch with HR.*\n- **be off to a good start** — começar bem · *The project is off to a good start.*\n- **stay on schedule** — manter-se no cronograma · *We need to stay on schedule.*\n**Trends 1–10:**\n- **increase steadily** — aumentar de forma constante · *Sales increased steadily last year.*\n- **decrease sharply** — cair bruscamente · *Prices decreased sharply in May.*\n- **remain stable** — permanecer estável · *The number of clients remained stable.*\n- **fluctuate** — oscilar · *Fuel prices fluctuate every week.*\n- **reach a peak** — atingir um pico · *Demand reached a peak in July.*\n- **a slight drop** — uma leve queda · *There was a slight drop in profits.*\n- **be on the rise** — estar em alta · *Online shopping is on the rise.*\n- **keep up with** — acompanhar · *We must keep up with new technology.*\n- **become more common** — tornar-se mais comum · *Remote work has become more common.*\n- **be likely to** — ser provável que · *Sales are likely to grow.*\n\n**Shadowing teste (15'):** *A phone call from a customer* (B1): https://learnenglish.britishcouncil.org/free-resources/listening/b1 — ouça 2×, transcreva 1 frase e imite 3×.\n\n**Ponte:** abra seu caderno/Keynote da última aula P1 e P2; escolha os 3 erros mais importantes.\n\n**Passivo:** BBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n\n**Checklist:** [ ] Anki [ ] Class Log [ ] Shadowing","d":"2026-09-26","k":"Sábado — semana 0"},{"n":186,"t":"domingo, 27/09/2026 · Domingo — semana 0","b":"**Semana 0/18 · Fase 1 — Fundação e reativação** · faltam **124 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Semana 0\n**Missão do dia:** Ler o primeiro texto e planejar a Semana 1.\n**Tempo ativo:** 45 min · **Versão mínima:** Leitura 25' + planejamento 10'\n\n| Bloco | Min | O quê |\n|---|---|---|\n| Leitura | 25 | Texto BC B1 (calibração) |\n| Reset | 20 | Plano da Semana 1 + Scoreboard |\n\n**Leitura (25'):**\n**Texto:** *A conference programme* (B1, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b1/conference-programme\n1. **Preparação (3')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (8')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (8')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (3')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n\n**Reset (20')**\n1. (5') Reveja o Error Log recuperado ontem; escolha 3 padrões.\n2. (5') Leia a p. 11 (G01) e a p. 12 (G02): é o que você estuda na Semana 1.\n3. (5') Confirme sua agenda de segunda (aula P1) e quarta (aula P2).\n4. (5') Preencha o Scoreboard com “Semana 0”.\n\n**Ponte:** Class Log de **30/08/2026** (aula anterior ao plano — use seu caderno/Keynote mais recente): leia 3 erros.\n\n**Passivo:** Série/filme com legenda em inglês (30 min, sem obrigação)\n**Checklist:** [ ] Leitura [ ] Reset [ ] Descanso","d":"2026-09-27","k":"Domingo — semana 0"},{"n":187,"t":"segunda-feira, 28/09/2026 · Plano operacional","b":"**Semana 1/18 · Fase 1 — Fundação e reativação** · faltam **123 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Money\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Money).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 7' no deck *Legacy* + 3' no deck *Active*.\n**Novos hoje (4):**\n   - **afford to** — ter condições de · *We can't afford to hire more staff.*\n   - **pay for** — pagar por · *Who will pay for the tickets?*\n   - **save money** — economizar dinheiro · *Buying online saves money.*\n   - **spend money on** — gastar dinheiro com · *We spend money on training.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A phone call from a customer* (B1, índice B1 — procure o título): https://learnenglish.britishcouncil.org/free-resources/listening/b1. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe your typical morning routine.\"* — use pelo menos: **afford to** e **pay for**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **21/09/2026** (aula P1 anterior) e de **31/08/2026** (aula anterior ao plano — use seu caderno/Keynote mais recente) (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2026-09-28","k":"Plano operacional"},{"n":188,"t":"segunda-feira, 28/09/2026 · Guia detalhado","b":"### Guia detalhado — 28/09/2026 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\nafford to, pay for, save money, spend money on, be worth, at a reasonable price, make a payment, due date, outstanding balance, issue an invoice, receive a refund, be charged for, cover the cost of, stay within budget, cut costs, raise funds, make a profit, take out a loan, exchange rate, billing statement\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **21/09/2026** e de **31/08/2026** (aula anterior ao plano — use seu caderno/Keynote mais recente); leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Money*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana (G01).\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **G01** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2026-09-28","k":"Guia detalhado"},{"n":189,"t":"terça-feira, 29/09/2026 · Plano operacional","b":"**Semana 1/18 · Fase 1 — Fundação e reativação** · faltam **122 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Money\n**Missão do dia:** Fixar G01 (Sentence architecture: subject, verb, object/complement) + ler um texto\n**Tempo ativo:** 85 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki · Shadowing · Fala |\n| Gramática A — G01 | 35 | Sentence architecture: subject, verb, object/complement |\n| Leitura 1 | 25 | Texto BC + exercícios |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 7' no deck *Legacy* + 3' no deck *Active*.\n**Novos hoje (4):**\n   - **be worth** — valer · *The upgrade is worth the price.*\n   - **at a reasonable price** — a um preço razoável · *They sell good chairs at a reasonable price.*\n   - **make a payment** — efetuar um pagamento · *You can make a payment online.*\n   - **due date** — data de vencimento · *The due date is May 5.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A phone call from a customer* (B1, índice B1 — procure o título): https://learnenglish.britishcouncil.org/free-resources/listening/b1. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Tell me about a project you are proud of.\"* — use pelo menos: **be worth** e **at a reasonable price**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**28/09/2026**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Leitura · [ ] Error Log","d":"2026-09-29","k":"Plano operacional"},{"n":190,"t":"terça-feira, 29/09/2026 · Guia detalhado","b":"### Guia detalhado — 29/09/2026\n**Passo 1 — Recall da aula de ontem (3'):** abra o Class Log de **28/09/2026**; diga 3 erros/chunks.\n**Passo 2 — Estudo (12'):** leia **G01** neste documento (p. 11) e a página do British Council (procure “Sentence structure / Word order” em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2). Explique cada regra em voz alta em 30 s.\nRegras-chave:\n- Toda oração precisa de sujeito + verbo. Em inglês o sujeito NÃO pode ser omitido: 'Is important' ✗ → 'It is important' ✓.\n- Ordem básica: S + V + O (She sends reports) · S + V + complemento (He is tired) · S + V + O + lugar/tempo (We met clients on Monday).\n- Verbo transitivo pede objeto (make a decision); intransitivo não (arrive, happen, exist); de ligação (be, become, seem) pede adjetivo/substantivo.\n**Onde você costuma errar:** Em português o sujeito some ('Chegou ontem'). Em inglês: 'It arrived yesterday.'\n**Passo 3 — Exercício A (15'):** responda por escrito.\n1. ___ is important to check the figures. (It/There)\n2. There ___ two meetings today. (is/are)\n3. Ordene: emails / always / she / checks\n4. Qual verbo pede objeto: arrive ou make?\n5. Corrija: 'Is a problem with the printer.'\n6. Sujeito de 'The list of new clients is ready'\n**Passo 4 — Correção (3'):** compare com o gabarito no fim da página; para cada erro escreva **1 regra** no Er
