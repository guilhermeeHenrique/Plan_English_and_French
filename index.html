ror Log.\n**Passo 5 — Produção (2'):** Escreva 3 frases S–V–O sobre seu dia na faculdade.\n\n**Leitura 1 (25'):**\n**Texto:** *An email request for help* (B1, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b1/email-request-help\n1. **Preparação (3')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (8')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (8')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (3')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n\n---\n**GABARITO (não olhe antes)**\n\n1. It\n2. are\n3. She always checks emails.\n4. make\n5. There is a problem with the printer.\n6. The list (por isso 'is')","d":"2026-09-29","k":"Guia detalhado"},{"n":191,"t":"quarta-feira, 30/09/2026 · Plano operacional","b":"**Semana 1/18 · Fase 1 — Fundação e reativação** · faltam **121 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Money\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 7' no deck *Legacy* + 3' no deck *Active*.\n**Novos hoje (4):**\n   - **outstanding balance** — saldo em aberto · *Please pay the outstanding balance.*\n   - **issue an invoice** — emitir uma fatura · *We will issue an invoice today.*\n   - **receive a refund** — receber reembolso · *She received a refund within a week.*\n   - **be charged for** — ser cobrado por · *You will be charged for late delivery.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A phone call from a customer* (B1, índice B1 — procure o título): https://learnenglish.britishcouncil.org/free-resources/listening/b1. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What are the pros and cons of working from home?\"* — use pelo menos: **outstanding balance** e **issue an invoice**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **23/09/2026** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **28/09/2026**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2026-09-30","k":"Plano operacional"},{"n":192,"t":"quarta-feira, 30/09/2026 · Guia detalhado","b":"### Guia detalhado — 30/09/2026 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"How do you manage your money each month?\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **23/09/2026** e os da aula P1 de **28/09/2026**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (G01 estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P01 (word stress) (p. 103).","d":"2026-09-30","k":"Guia detalhado"},{"n":193,"t":"quinta-feira, 01/10/2026 · Plano operacional","b":"**Semana 1/18 · Fase 1 — Fundação e reativação** · faltam **120 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Money\n**Missão do dia:** Francês profundo: Passé composé × imparfait (F05)\n**Tempo ativo:** 100 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 10 | F02 / P13 — liaison et enchaînement |\n| Gramática FR | 20 | Passé composé × imparfait (F05) |\n| Expressions C1 | 10 | 4 expressões |\n| Production | 20 | Racontez en 8–10 phrases un souvenir professionnel ou scolai… |\n| Input C1 | 15 | RFI — Journal en français facile |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 7' no deck *Legacy* + 3' no deck *Active*.\n**Novos hoje (4):**\n   - **cover the cost of** — cobrir o custo de · *The company covers the cost of travel.*\n   - **stay within budget** — ficar dentro do orçamento · *We must stay within budget.*\n   - **cut costs** — cortar custos · *The firm cut costs by ten percent.*\n   - **raise funds** — levantar fundos · *They raised funds for the new lab.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe a problem you solved recently.\"* — use pelo menos: **cover the cost of** e **stay within budget**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**24/09/2026**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2026-10-01","k":"Plano operacional"},{"n":194,"t":"quinta-feira, 01/10/2026 · Guia detalhado","b":"### Guia detalhado — 01/10/2026 · Francês\n\n**1) Pronúncia (10')** — foco: F02 / P13 — liaison et enchaînement. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática (20')** — *Passé composé × imparfait (F05)*\nRegra: PC = ação concluída/evento; imparfait = hábito, descrição, ação em curso. Verbos com être: aller, venir, arriver, partir, entrer, sortir, naître, mourir, rester, tomber, monter, descendre, retourner, passer + pronominais.\nExercícios:\n1. Hier, il ___ (pleuvoir) quand je ___ (sortir).\n2. Quand j'étais petit, nous ___ (aller) à la mer chaque été.\n3. Elle ___ (finir) son rapport à 18 h.\n4. Il ___ (faire) beau et les gens ___ (se promener).\n5. Soudain, le téléphone ___ (sonner).\n\n**3) Expressions C1 (10')** — leia, repita e escreva 1 frase própria com cada uma:\n- **en effet** — de fato · *Il est en retard ; en effet, le train a été annulé.*\n- **d'ailleurs** — aliás · *Il est compétent ; d'ailleurs, il parle trois langues.*\n- **par ailleurs** — além disso · *Par ailleurs, le budget a augmenté.*\n- **dans la mesure où** — na medida em que · *Dans la mesure où le délai est court, il faut agir vite.*\n\n**4) Production (20')** — Racontez en 8–10 phrases un souvenir professionnel ou scolaire (passé composé + imparfait).\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (15')** — RFI — Journal en français facile: https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. pleuvait / suis sorti(e)\n2. allions\n3. a fini\n4. faisait / se promenaient\n5. a sonné","d":"2026-10-01","k":"Guia detalhado"},{"n":195,"t":"sexta-feira, 02/10/2026 · Plano operacional","b":"**Semana 1/18 · Fase 1 — Fundação e reativação** · faltam **119 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Money\n**Missão do dia:** Diagnóstico Reading A\n**Tempo ativo:** 85 min · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈30 | Part 5 (30 itens, 12 min) + Part 6 (16 itens, 8 min) |\n| Revisão | 20 | Protocolo T32/T34 |\n| Log | 5 | Scoreboard |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 7' no deck *Legacy* + 3' no deck *Active*.\n**Novos hoje (4):**\n   - **make a profit** — ter lucro · *The shop made a profit this year.*\n   - **take out a loan** — fazer um empréstimo · *He took out a loan to buy a car.*\n   - **exchange rate** — taxa de câmbio · *The exchange rate changes daily.*\n   - **billing statement** — extrato de cobrança · *Check your billing statement carefully.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A phone call from a customer* (B1, índice B1 — procure o título): https://learnenglish.britishcouncil.org/free-resources/listening/b1. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What does a good manager do?\"* — use pelo menos: **make a profit** e **take out a loan**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**28/09/2026**) e Qua (**30/09/2026**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Money*: https://www.ted.com/talks?q=Money\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2026-10-02","k":"Plano operacional"},{"n":196,"t":"sexta-feira, 02/10/2026 · Guia detalhado","b":"### Guia detalhado — 02/10/2026 · TOEIC Reading oficial\n\n**Set do dia:** Part 5 (30 itens, 12 min) + Part 6 (16 itens, 8 min)\n**Fonte oficial:** Sample Test ETS (grátis) (pp. 153–154)\n**Foco:** Mapear causas de erro; NÃO ajustar meta ainda.\n\n**Passos**\n1. (5') Setup: celular no silêncio, cronômetro, folha de respostas; sem consultar nada durante o set.\n2. (≈30') Faça o set **cronometrado**. Marque com “?” os itens em que chutou. Anote o tempo por Part.\n3. (20') Revisão em 3 passadas: (1) erros com **evidência exata** (copie a frase do texto); (2) acertos por chute; (3) acertos lentos (>90 s). Classifique cada erro (G/V/P/I/A/T/S/L — T32).\n4. (5') Scoreboard (p. 161): acerto por Part, tempo, 3 causas principais.\n5. Crie **até 3 cards** (erros que se repetem) e volte para eles no domingo.\n\n**Regra:** não faça “só mais um set” hoje. A revisão é o treino.\n\n**Referência de estratégia desta semana:** T14, T15, T20 (páginas 53–87).","d":"2026-10-02","k":"Guia detalhado"},{"n":197,"t":"sábado, 03/10/2026 · Sábado","b":"**Semana 1/18 · Fase 1 — Fundação e reativação** · faltam **118 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Money\n**Missão do dia:** Fixar G02 (Be, have e do como verbos e auxiliares) e G03 (Present Simple)\n**Tempo ativo:** 55 min · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática B — G02 | 30 | Be, have e do como verbos e auxiliares |\n| Gramática C — G03 | 25 | Present Simple |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 28/09 e 30/09 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 03/10/2026\n\n**Gramática B — G02 (30')**\n1. (5') Leia G02 (p. 12) em voz alta. Exercício A (primeira exposição ao tópico: faça agora, com calma):\n1. She ___ 25 years old. (has/is)\n2. ___ he work on Saturdays? (Does/Is)\n3. They ___ finished the report. (are/have)\n4. He doesn't ___ the answer. (know/knows)\n5. We ___ a meeting at 3 p.m. (are/have)\n6. ___ you ready for the demo? (Do/Are)\n2. (10') **Exercício B — corrija as frases**:\n1. ❌ *She have a new job.*\n2. ❌ *Do you be busy today?*\n3. ❌ *He don't like coffee.*\n4. ❌ *I have hungry.*\n3. (10') **Produção:** Diga 3 frases com 'have' lexical sobre sua semana. · Faça 3 perguntas com 'Do/Does' para um colega de trabalho.\n4. (5') Error Log: 1 regra por erro.\n\n**Gramática C — G03 (25')** — dia de simulado amanhã: gramática no sábado.\n1. (5') Leia G03 (p. 13).\n2. (10') Exercício A:\n1. Ms. Lee ___ (work) in finance.\n2. The bank ___ (open) at nine.\n3. He ___ (not/like) long meetings.\n4. ___ the train ___ (leave) at six?\n5. She ___ (study) French at night.\n6. Every employee ___ (receive) a badge.\n3. (5') Exercício B:\n1. ❌ *She work in Paris.*\n2. ❌ *He don't know the price.*\n3. ❌ *Does she works here?*\n4. ❌ *My boss always is late.*\n4. (5') Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G02 — A**\n1. is\n2. Does\n3. have\n4. know\n5. have\n6. Are\n\n**G02 — B**\n1. ✅ She has a new job.\n2. ✅ Are you busy today?\n3. ✅ He doesn't like coffee.\n4. ✅ I am hungry.\n\n**G03 — A**\n1. works\n2. opens\n3. doesn't like\n4. Does ... leave\n5. studies\n6. receives\n\n**G03 — B**\n1. ✅ She works in Paris.\n2. ✅ He doesn't know the price.\n3. ✅ Does she work here?\n4. ✅ My boss is always late.","d":"2026-10-03","k":"Sábado"},{"n":198,"t":"domingo, 04/10/2026 · Domingo","b":"**Semana 1/18 · Fase 1 — Fundação e reativação** · faltam **117 dias** para a prova\n**Missão do dia:** Fixar G03 + ler 1 texto + reset\n**Tempo ativo:** 55 min\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática C — G03 | 20 | Present Simple |\n| Leitura 2 | 20 | Texto BC |\n| Reset semanal | 15 | Quiz + Scoreboard + plano |\n\n### Ponte com aulas antigas\n- Class Log de **06/09/2026** (aula anterior ao plano — use seu caderno/Keynote mais recente) (4 semanas atrás): leia 3 erros/chunks e use 1 hoje na fala do quiz.\n\n### Passivo (fora da conta)\nSérie/filme com legenda em inglês (30 min, sem obrigação)\n- Francês: innerFrench — 1 épisode (podcast): https://innerfrench.com/podcast/\n\n### Guia detalhado\n**Gramática C — G03 (20')**\n1. (6') Leia G03 (p. 13) em voz alta.\n2. (10') Exercício A:\n1. Ms. Lee ___ (work) in finance.\n2. The bank ___ (open) at nine.\n3. He ___ (not/like) long meetings.\n4. ___ the train ___ (leave) at six?\n5. She ___ (study) French at night.\n6. Every employee ___ (receive) a badge.\n3. (4') Produção: Descreva sua rotina de segunda-feira em 5 frases.\n**Leitura 2 (20'):**\n**Texto:** *A travel guide* (B1, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b1/travel-guide\n1. **Preparação (2')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (6')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (7')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (2')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n**Reset semanal (15')**\n1. (5') **Quiz dos 20 chunks da semana** — olhe só o português e diga o chunk: afford to, pay for, save money, spend money on, be worth, at a reasonable price, make a payment, due date, outstanding balance, issue an invoice, receive a refund, be charged for, cover the cost of, stay within budget, cut costs, raise funds, make a profit, take out a loan, exchange rate, billing statement\n2. (5') Error Log: escolha 3 erros repetidos e reescreva a regra.\n3. (5') Scoreboard e planejamento: o que fazer na semana 2 (próxima)? Confira a agenda de aulas.\n\n---\n**GABARITO (não olhe antes)**\n\n1. works\n2. opens\n3. doesn't like\n4. Does ... leave\n5. studies\n6. receives","d":"2026-10-04","k":"Domingo"},{"n":199,"t":"segunda-feira, 05/10/2026 · Plano operacional","b":"**Semana 2/18 · Fase 1 — Fundação e reativação** · faltam **116 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Success\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Success).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 7' no deck *Legacy* + 3' no deck *Active*.\n**Novos hoje (4):**\n   - **achieve a goal** — alcançar uma meta · *She achieved her sales goal.*\n   - **make progress** — progredir · *We are making progress on the report.*\n   - **succeed in** — ter sucesso em · *He succeeded in closing the deal.*\n   - **be proud of** — ter orgulho de · *I'm proud of my team.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Making a decision* (B1, índice B1 — procure o título): https://learnenglish.britishcouncil.org/free-resources/listening/b1. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Explain your studies to someone who knows nothing about them.\"* — use pelo menos: **achieve a goal** e **make progress**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **28/09/2026** (aula P1 anterior) e de **07/09/2026** (aula anterior ao plano — use seu caderno/Keynote mais recente) (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2026-10-05","k":"Plano operacional"},{"n":200,"t":"segunda-feira, 05/10/2026 · Guia detalhado","b":"### Guia detalhado — 05/10/2026 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\nachieve a goal, make progress, succeed in, be proud of, set a target, reach a milestone, meet expectations, exceed expectations, perform well, earn a promotion, gain experience, take the lead, overcome a challenge, rely on, be committed to, recognize an achievement, make an effort, lead to, pay off, a great deal of\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **28/09/2026** e de **07/09/2026** (aula anterior ao plano — use seu caderno/Keynote mais recente); leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Success*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana (G04).\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **G04** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2026-10-05","k":"Guia detalhado"},{"n":201,"t":"terça-feira, 06/10/2026 · Plano operacional","b":"**Semana 2/18 · Fase 1 — Fundação e reativação** · faltam **115 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Success\n**Missão do dia:** Fixar G04 (Present Continuous) + ler um texto\n**Tempo ativo:** 85 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki · Shadowing · Fala |\n| Gramática A — G04 | 35 | Present Continuous |\n| Leitura 1 | 25 | Texto BC + exercícios |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 7' no deck *Legacy* + 3' no deck *Active*.\n**Novos hoje (4):**\n   - **set a target** — definir uma meta · *Set a target for each month.*\n   - **reach a milestone** — atingir um marco · *The project reached a major milestone.*\n   - **meet expectations** — atender às expectativas · *The results met expectations.*\n   - **exceed expectations** — superar as expectativas · *Sales exceeded expectations.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Making a decision* (B1, índice B1 — procure o título): https://learnenglish.britishcouncil.org/free-resources/listening/b1. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe your ideal workplace.\"* — use pelo menos: **set a target** e **reach a milestone**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**05/10/2026**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Leitura · [ ] Error Log","d":"2026-10-06","k":"Plano operacional"},{"n":202,"t":"terça-feira, 06/10/2026 · Guia detalhado","b":"### Guia detalhado — 06/10/2026\n**Passo 1 — Recall da aula de ontem (3'):** abra o Class Log de **05/10/2026**; diga 3 erros/chunks.\n**Passo 2 — Estudo (12'):** leia **G04** neste documento (p. 14) e a página do British Council (procure “Present continuous” em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2). Explique cada regra em voz alta em 30 s.\nRegras-chave:\n- be + verbo-ing. Usos: ação agora (It is raining), situação temporária (I'm working from home this week), arranjo futuro combinado (We're meeting on Friday).\n- Ortografia: run→running, write→writing, lie→lying, plan→planning.\n- Verbos de estado (know, want, need, like, love, understand) normalmente NÃO usam -ing.\n**Onde você costuma errar:** Português usa 'estou fazendo' de forma mais ampla; em inglês, duração longa usa Present Perfect ('I've been working here for two years').\n**Passo 3 — Exercício A (15'):** responda por escrito.\n1. Look! It ___ (rain).\n2. We ___ (meet) the client tomorrow at ten (combinado).\n3. She ___ (not/attend) the meeting today.\n4. ___ they ___ (wait) outside?\n5. He ___ (run) the new software this week.\n6. The team ___ (prepare) the slides at the moment.\n**Passo 4 — Correção (3'):** compare com o gabarito no fim da página; para cada erro escreva **1 regra** no Error Log.\n**Passo 5 — Produção (2'):** Diga o que você está fazendo agora e o que está fazendo esta semana.\n\n**Leitura 1 (25'):**\n**Texto:** *Planning an event* (B1, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b1/planning-event\n1. **Preparação (3')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (8')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (8')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (3')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n\n---\n**GABARITO (não olhe antes)**\n\n1. is raining\n2. are meeting\n3. isn't attending\n4. Are ... waiting\n5. is running\n6. is preparing","d":"2026-10-06","k":"Guia detalhado"},{"n":203,"t":"quarta-feira, 07/10/2026 · Plano operacional","b":"**Semana 2/18 · Fase 1 — Fundação e reativação** · faltam **114 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Success\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 7' no deck *Legacy* + 3' no deck *Active*.\n**Novos hoje (4):**\n   - **perform well** — ter bom desempenho · *The new staff perform well.*\n   - **earn a promotion** — conquistar uma promoção · *She earned a promotion last year.*\n   - **gain experience** — ganhar experiência · *Interns gain experience quickly.*\n   - **take the lead** — assumir a liderança · *He took the lead on the project.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Making a decision* (B1, índice B1 — procure o título): https://learnenglish.britishcouncil.org/free-resources/listening/b1. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Talk about a decision you had to make quickly.\"* — use pelo menos: **perform well** e **earn a promotion**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **30/09/2026** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **05/10/2026**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2026-10-07","k":"Plano operacional"},{"n":204,"t":"quarta-feira, 07/10/2026 · Guia detalhado","b":"### Guia detalhado — 07/10/2026 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"What does success mean to you at work?\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **30/09/2026** e os da aula P1 de **05/10/2026**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (G04 estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P02 (sentence stress) (p. 104).","d":"2026-10-07","k":"Guia detalhado"},{"n":205,"t":"quinta-feira, 08/10/2026 · Plano operacional","b":"**Semana 2/18 · Fase 1 — Fundação e reativação** · faltam **113 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Success\n**Missão do dia:** Francês profundo: Plus-que-parfait et concordance\n**Tempo ativo:** 100 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 10 | F03 / P14 — /y/ x /u/ |\n| Gramática FR | 20 | Plus-que-parfait et concordance |\n| Expressions C1 | 10 | 4 expressões |\n| Production | 20 | Racontez un incident en précisant ce qui s'était passé avant… |\n| Input C1 | 15 | innerFrench — podcast |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 7' no deck *Legacy* + 3' no deck *Active*.\n**Novos hoje (4):**\n   - **overcome a challenge** — superar um desafio · *We overcame a big challenge.*\n   - **rely on** — contar com · *We rely on our suppliers.*\n   - **be committed to** — ser comprometido com · *The firm is committed to quality.*\n   - **recognize an achievement** — reconhecer uma conquista · *They recognized her achievement.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"How do you prepare for an important meeting?\"* — use pelo menos: **overcome a challenge** e **rely on**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**01/10/2026**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2026-10-08","k":"Plano operacional"},{"n":206,"t":"quinta-feira, 08/10/2026 · Guia detalhado","b":"### Guia detalhado — 08/10/2026 · Francês\n\n**1) Pronúncia (10')** — foco: F03 / P14 — /y/ x /u/. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática (20')** — *Plus-que-parfait et concordance*\nRegra: Plus-que-parfait = auxiliar no imparfait + particípio: ação anterior a outra ação passada. 'Quand je suis arrivé, il était déjà parti.'\nExercícios:\n1. Quand nous ___ (arriver), la réunion ___ (déjà/commencer).\n2. Il m'a dit qu'il ___ (oublier) son badge.\n3. Elle ___ (ne pas/recevoir) le mail, donc elle n'a pas répondu.\n4. Je ne savais pas qu'elle ___ (démissionner).\n5. Ils ___ (finir) avant mon arrivée.\n\n**3) Expressions C1 (10')** — leia, repita e escreva 1 frase própria com cada uma:\n- **à l'origine** — na origem · *À l'origine, le projet visait les étudiants.*\n- **en ce qui concerne** — no que diz respeito a · *En ce qui concerne le budget, tout est prêt.*\n- **au fil du temps** — ao longo do tempo · *Au fil du temps, les habitudes changent.*\n- **tenir compte de** — levar em conta · *Il faut tenir compte des retards.*\n\n**4) Production (20')** — Racontez un incident en précisant ce qui s'était passé avant (8 phrases).\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (15')** — innerFrench — podcast: https://innerfrench.com/podcast/\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. sommes arrivés / avait déjà commencé\n2. avait oublié\n3. n'avait pas reçu\n4. avait démissionné\n5. avaient fini","d":"2026-10-08","k":"Guia detalhado"},{"n":207,"t":"sexta-feira, 09/10/2026 · Plano operacional","b":"**Semana 2/18 · Fase 1 — Fundação e reativação** · faltam **112 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Success\n**Missão do dia:** Diagnóstico Reading B\n**Tempo ativo:** 85 min · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈30 | Part 7 passagens únicas (primeiros 15 itens, 18 min) + 10 itens de Part 5 (word form, 4 min) |\n| Revisão | 20 | Protocolo T32/T34 |\n| Log | 5 | Scoreboard |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 7' no deck *Legacy* + 3' no deck *Active*.\n**Novos hoje (4):**\n   - **make an effort** — fazer um esforço · *Please make an effort to be on time.*\n   - **lead to** — levar a · *Good planning leads to success.*\n   - **pay off** — dar resultado · *Her hard work paid off.*\n   - **a great deal of** — muito(a) · *It takes a great deal of time.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Making a decision* (B1, índice B1 — procure o título): https://learnenglish.britishcouncil.org/free-resources/listening/b1. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What would you change in your city?\"* — use pelo menos: **make an effort** e **lead to**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**05/10/2026**) e Qua (**07/10/2026**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Success*: https://www.ted.com/talks?q=Success\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2026-10-09","k":"Plano operacional"},{"n":208,"t":"sexta-feira, 09/10/2026 · Guia detalhado","b":"### Guia detalhado — 09/10/2026 · TOEIC Reading oficial\n\n**Set do dia:** Part 7 passagens únicas (primeiros 15 itens, 18 min) + 10 itens de Part 5 (word form, 4 min)\n**Fonte oficial:** Sample Test ETS + série 'Sentence completion' do app (pp. 153–154)\n**Foco:** Medir tempo por item em Part 7.\n\n**Passos**\n1. (5') Setup: celular no silêncio, cronômetro, folha de respostas; sem consultar nada durante o set.\n2. (≈30') Faça o set **cronometrado**. Marque com “?” os itens em que chutou. Anote o tempo por Part.\n3. (20') Revisão em 3 passadas: (1) erros com **evidência exata** (copie a frase do texto); (2) acertos por chute; (3) acertos lentos (>90 s). Classifique cada erro (G/V/P/I/A/T/S/L — T32).\n4. (5') Scoreboard (p. 161): acerto por Part, tempo, 3 causas principais.\n5. Crie **até 3 cards** (erros que se repetem) e volte para eles no domingo.\n\n**Regra:** não faça “só mais um set” hoje. A revisão é o treino.\n\n**Referência de estratégia desta semana:** T22, T23, T30 (páginas 53–87).","d":"2026-10-09","k":"Guia detalhado"},{"n":209,"t":"sábado, 10/10/2026 · Sábado","b":"**Semana 2/18 · Fase 1 — Fundação e reativação** · faltam **111 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Success\n**Missão do dia:** Fixar G05 (Present Simple x Present Continuous) e G06 (Questions e negatives no presente)\n**Tempo ativo:** 55 min · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática B — G05 | 30 | Present Simple x Present Continuous |\n| Gramática C — G06 | 25 | Questions e negatives no presente |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 05/10 e 07/10 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 10/10/2026\n\n**Gramática B — G05 (30')**\n1. (5') Leia G05 (p. 15) em voz alta. Exercício A (primeira exposição ao tópico: faça agora, com calma):\n1. She usually ___ (take) the bus, but today she ___ (drive).\n2. I ___ (know) the answer.\n3. What ___ you ___ (do) at the moment?\n4. He ___ (need) a new laptop.\n5. Our sales ___ (grow) this quarter.\n6. The store ___ (close) at nine every day.\n2. (10') **Exercício B — corrija as frases**:\n1. ❌ *I am knowing him.*\n2. ❌ *She is having a car.*\n3. ❌ *He goes to the office now.*\n4. ❌ *We are liking the new design.*\n3. (10') **Produção:** Fale 3 hábitos seus (PS) e 3 coisas temporárias desta semana (PC).\n4. (5') Error Log: 1 regra por erro.\n\n**Gramática C — G06 (25')** — dia de simulado amanhã: gramática no sábado.\n1. (5') Leia G06 (p. 16).\n2. (10') Exercício A:\n1. Where ___ she work?\n2. ___ they need more time?\n3. Who ___ (manage) the team?\n4. He ___ (not/be) in the office today.\n5. How often ___ the printer break down?\n6. What time ___ the meeting start?\n3. (5') Exercício B:\n1. ❌ *Where he works?*\n2. ❌ *Who does manage the team?*\n3. ❌ *Does they need help?*\n4. ❌ *She not is here.*\n4. (5') Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G05 — A**\n1. takes / is driving\n2. know\n3. are ... doing\n4. needs\n5. are growing\n6. closes\n\n**G05 — B**\n1. ✅ I know him.\n2. ✅ She has a car.\n3. ✅ He is going to the office now.\n4. ✅ We like the new design.\n\n**G06 — A**\n1. does\n2. Do\n3. manages\n4. isn't\n5. does\n6. does\n\n**G06 — B**\n1. ✅ Where does he work?\n2. ✅ Who manages the team?\n3. ✅ Do they need help?\n4. ✅ She isn't here.","d":"2026-10-10","k":"Sábado"},{"n":210,"t":"domingo, 11/10/2026 · Domingo","b":"**Semana 2/18 · Fase 1 — Fundação e reativação** · faltam **110 dias** para a prova\n**Missão do dia:** Fixar G06 + ler 1 texto + reset\n**Tempo ativo:** 55 min\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática C — G06 | 20 | Questions e negatives no presente |\n| Leitura 2 | 20 | Texto BC |\n| Reset semanal | 15 | Quiz + Scoreboard + plano |\n\n### Ponte com aulas antigas\n- Class Log de **13/09/2026** (aula anterior ao plano — use seu caderno/Keynote mais recente) (4 semanas atrás): leia 3 erros/chunks e use 1 hoje na fala do quiz.\n\n### Passivo (fora da conta)\nSérie/filme com legenda em inglês (30 min, sem obrigação)\n- Francês: innerFrench — 1 épisode (podcast): https://innerfrench.com/podcast/\n\n### Guia detalhado\n**Gramática C — G06 (20')**\n1. (6') Leia G06 (p. 16) em voz alta.\n2. (10') Exercício A:\n1. Where ___ she work?\n2. ___ they need more time?\n3. Who ___ (manage) the team?\n4. He ___ (not/be) in the office today.\n5. How often ___ the printer break down?\n6. What time ___ the meeting start?\n3. (4') Produção: Faça 5 perguntas Wh- sobre a rotina de um colega.\n**Leitura 2 (20'):**\n**Texto:** *Innovation in business* (B1, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b1/innovation-business\n1. **Preparação (2')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (6')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (7')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (2')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n**Reset semanal (15')**\n1. (5') **Quiz dos 20 chunks da semana** — olhe só o português e diga o chunk: achieve a goal, make progress, succeed in, be proud of, set a target, reach a milestone, meet expectations, exceed expectations, perform well, earn a promotion, gain experience, take the lead, overcome a challenge, rely on, be committed to, recognize an achievement, make an effort, lead to, pay off, a great deal of\n2. (5') Error Log: escolha 3 erros repetidos e reescreva a regra.\n3. (5') Scoreboard e planejamento: o que fazer na semana 3 (próxima)? Confira a agenda de aulas.\n\n---\n**GABARITO (não olhe antes)**\n\n1. does\n2. Do\n3. manages\n4. isn't\n5. does\n6. does","d":"2026-10-11","k":"Domingo"},{"n":211,"t":"segunda-feira, 12/10/2026 · Plano operacional","b":"**Semana 3/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **109 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Marketing\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Marketing).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **target audience** — público-alvo · *Our target audience is young adults.*\n   - **launch a product** — lançar um produto · *We will launch a product in March.*\n   - **raise awareness** — aumentar a conscientização · *The campaign raised awareness of the brand.*\n   - **promote a service** — divulgar um serviço · *They promote the service on social media.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Work-life balance* (B1, índice B1 — procure o título): https://learnenglish.britishcouncil.org/free-resources/listening/b1. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe a time you helped someone.\"* — use pelo menos: **target audience** e **launch a product**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **05/10/2026** (aula P1 anterior) e de **14/09/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2026-10-12","k":"Plano operacional"},{"n":212,"t":"segunda-feira, 12/10/2026 · Guia detalhado","b":"### Guia detalhado — 12/10/2026 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\ntarget audience, launch a product, raise awareness, promote a service, advertising campaign, brand image, customer base, market research, word of mouth, free sample, limited-time offer, press release, competitive advantage, loyalty program, reach customers, take advantage of, promotional material, be aimed at, endorse a product, increase sales\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **05/10/2026** e de **14/09/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Marketing*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana (G07).\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **G07** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2026-10-12","k":"Guia detalhado"},{"n":213,"t":"terça-feira, 13/10/2026 · Plano operacional","b":"**Semana 3/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **108 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Marketing\n**Missão do dia:** Fixar G07 (Past Simple) + ler um texto\n**Tempo ativo:** 85 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki · Shadowing · Fala |\n| Gramática A — G07 | 35 | Past Simple |\n| Leitura 1 | 25 | Texto BC + exercícios |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **advertising campaign** — campanha publicitária · *The advertising campaign starts Monday.*\n   - **brand image** — imagem de marca · *A good brand image builds trust.*\n   - **customer base** — base de clientes · *Our customer base is growing.*\n   - **market research** — pesquisa de mercado · *Market research shows strong demand.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Work-life balance* (B1, índice B1 — procure o título): https://learnenglish.britishcouncil.org/free-resources/listening/b1. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Which technology do you use every day, and why?\"* — use pelo menos: **advertising campaign** e **brand image**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**12/10/2026**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Leitura · [ ] Error Log","d":"2026-10-13","k":"Plano operacional"},{"n":214,"t":"terça-feira, 13/10/2026 · Guia detalhado","b":"### Guia detalhado — 13/10/2026\n**Passo 1 — Recall da aula de ontem (3'):** abra o Class Log de **12/10/2026**; diga 3 erros/chunks.\n**Passo 2 — Estudo (12'):** leia **G07** neste documento (p. 17) e a página do British Council (procure “Past simple” em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2). Explique cada regra em voz alta em 30 s.\nRegras-chave:\n- Ação concluída em tempo terminado: yesterday, last week, in 2019, two days ago.\n- Regulares: -ed (worked, studied, stopped). Irregulares que você precisa de cor: go–went, have–had, buy–bought, send–sent, meet–met, take–took, make–made, see–saw, begin–began, write–wrote, give–gave.\n- Negativa/pergunta: did + base: 'Did you send it?' · 'I didn't send it'.\n**Onde você costuma errar:** 'Did you went?' ✗ → 'Did you go?': depois de did o verbo volta à base.\n**Passo 3 — Exercício A (15'):** responda por escrito.\n1. We ___ (send) the invoice yesterday.\n2. She ___ (not/attend) the workshop.\n3. ___ you ___ (see) the email?\n4. They ___ (buy) new chairs last month.\n5. He ___ (study) in Lyon in 2019.\n6. The meeting ___ (begin) at nine.\n**Passo 4 — Correção (3'):** compare com o gabarito no fim da página; para cada erro escreva **1 regra** no Error Log.\n**Passo 5 — Produção (2'):** Conte o que você fez ontem em 5 frases.\n\n**Leitura 1 (25'):**\n**Texto:** *Social media influencers* (B1, British Council) — https://learnenglish.britishcouncil.org/free-resources/reading/b1/social-media-influencers\n1. **Preparação (3')** — leia só o título e faça 3 previsões (o que vai aparecer?). Faça a *preparation task* da própria página.\n2. **1ª leitura (8')** — cronometre; sem dicionário; sublinhe até 5 palavras/chunks desconhecidos.\n3. **Exercícios (8')** — faça os 2 exercícios da página (sem olhar o texto na 1ª tentativa).\n4. **Chunks (3')** — escolha 5 chunks úteis e anote no Error Log/Anki; diga 1 frase própria com cada um.\n5. **Resumo (2')** — 2 frases em inglês: *The text is about…* / *The main point is…*\nMeta: entender ≥80% na 1ª leitura; se <70%, releia no dia seguinte (5').\n\n---\n**GABARITO (não olhe antes)**\n\n1. sent\n2. didn't attend\n3. Did ... see\n4. bought\n5. studied\n6. began","d":"2026-10-13","k":"Guia detalhado"},{"n":215,"t":"quarta-feira, 14/10/2026 · Plano operacional","b":"**Semana 3/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **107 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Marketing\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **word of mouth** — boca a boca · *Word of mouth brings new clients.*\n   - **free sample** — amostra grátis · *Customers received a free sample.*\n   - **limited-time offer** — oferta por tempo limitado · *This is a limited-time offer.*\n   - **press release** — comunicado à imprensa · *We issued a press release today.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Work-life balance* (B1, índice B1 — procure o título): https://learnenglish.britishcouncil.org/free-resources/listening/b1. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Tell a short story about a trip.\"* — use pelo menos: **word of mouth** e **free sample**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **07/10/2026** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **12/10/2026**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2026-10-14","k":"Plano operacional"},{"n":216,"t":"quarta-feira, 14/10/2026 · Guia detalhado","b":"### Guia detalhado — 14/10/2026 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"Which ad or brand impressed you recently, and why?\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **07/10/2026** e os da aula P1 de **12/10/2026**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (G07 estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P03 (schwa) (p. 105).","d":"2026-10-14","k":"Guia detalhado"},{"n":217,"t":"quinta-feira, 15/10/2026 · Plano operacional","b":"**Semana 3/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **106 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Marketing\n**Missão do dia:** Francês profundo: Pronoms COD, COI, y, en (F07)\n**Tempo ativo:** 100 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 10 | F04 / P15 — voyelles nasales |\n| Gramática FR | 20 | Pronoms COD, COI, y, en (F07) |\n| Expressions C1 | 10 | 4 expressões |\n| Production | 20 | Répondez à 5 questions en remplaçant les compléments par y/e… |\n| Input C1 | 15 | TV5MONDE — Apprendre le français |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **competitive advantage** — vantagem competitiva · *Fast delivery is our competitive advantage.*\n   - **loyalty program** — programa de fidelidade · *Join our loyalty program for discounts.*\n   - **reach customers** — alcançar clientes · *Ads help us reach customers.*\n   - **take advantage of** — aproveitar · *Take advantage of the summer sale.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"How do you manage your time?\"* — use pelo menos: **competitive advantage** e **loyalty program**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**08/10/2026**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2026-10-15","k":"Plano operacional"},{"n":218,"t":"quinta-feira, 15/10/2026 · Guia detalhado","b":"### Guia detalhado — 15/10/2026 · Francês\n\n**1) Pronúncia (10')** — foco: F04 / P15 — voyelles nasales. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática (20')** — *Pronoms COD, COI, y, en (F07)*\nRegra: COD (le, la, les) · COI (lui, leur) · y = lugar/à+coisa · en = de+coisa/quantidade. Posição: antes do verbo (Je le vois; Je vais le voir).\nExercícios:\n1. Tu as vu le directeur ? Oui, je ___ ai vu.\n2. Il parle à ses collègues → Il ___ parle.\n3. Vous allez à Lyon ? Oui, nous ___ allons demain.\n4. Tu veux du café ? Oui, j'___ veux.\n5. Elle a téléphoné à Marc → Elle ___ a téléphoné.\n\n**3) Expressions C1 (10')** — leia, repita e escreva 1 frase própria com cada uma:\n- **s'agissant de** — tratando-se de · *S'agissant de la sécurité, aucun risque.*\n- **il convient de** — convém · *Il convient de vérifier les données.*\n- **faire preuve de** — demonstrar · *Elle a fait preuve de courage.*\n- **mettre en œuvre** — implementar · *Nous allons mettre en œuvre le plan.*\n\n**4) Production (20')** — Répondez à 5 questions en remplaçant les compléments par y/en/pronoms.\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (15')** — TV5MONDE — Apprendre le français: https://apprendre.tv5monde.com/en/collection-all\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. l'\n2. leur\n3. y\n4. en\n5. lui","d":"2026-10-15","k":"Guia detalhado"},{"n":219,"t":"sexta-feira, 16/10/2026 · Plano operacional","b":"**Semana 3/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **105 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Marketing\n**Missão do dia:** Aquecimento pré-simulado\n**Tempo ativo:** 85 min · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈30 | Mini-Reading: Part 5 (30) + Part 6 (16) + 10 itens de Part 7 = 56 itens em 30 min |\n| Revisão | 20 | Protocolo T32/T34 |\n| Log | 5 | Scoreboard |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **promotional material** — material promocional · *Please print the promotional material.*\n   - **be aimed at** — ser voltado para · *The ad is aimed at parents.*\n   - **endorse a product** — endossar um produto · *A famous athlete endorsed the product.*\n   - **increase sales** — aumentar as vendas · *The discount helped increase sales.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *Work-life balance* (B1, índice B1 — procure o título): https://learnenglish.britishcouncil.org/free-resources/listening/b1. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"What are your goals for the next twelve months?\"* — use pelo menos: **promotional material** e **be aimed at**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**12/10/2026**) e Qua (**14/10/2026**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Marketing*: https://www.ted.com/talks?q=Marketing\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2026-10-16","k":"Plano operacional"},{"n":220,"t":"sexta-feira, 16/10/2026 · Guia detalhado","b":"### Guia detalhado — 16/10/2026 · TOEIC Reading oficial\n\n**Set do dia:** Mini-Reading: Part 5 (30) + Part 6 (16) + 10 itens de Part 7 = 56 itens em 30 min\n**Fonte oficial:** App: teste semi-real nº 1 (seção Reading) (pp. 153–154)\n**Foco:** Rotina de tempo antes do simulado de domingo.\n\n**Passos**\n1. (5') Setup: celular no silêncio, cronômetro, folha de respostas; sem consultar nada durante o set.\n2. (≈30') Faça o set **cronometrado**. Marque com “?” os itens em que chutou. Anote o tempo por Part.\n3. (20') Revisão em 3 passadas: (1) erros com **evidência exata** (copie a frase do texto); (2) acertos por chute; (3) acertos lentos (>90 s). Classifique cada erro (G/V/P/I/A/T/S/L — T32).\n4. (5') Scoreboard (p. 161): acerto por Part, tempo, 3 causas principais.\n5. Crie **até 3 cards** (erros que se repetem) e volte para eles no domingo.\n\n**Regra:** não faça “só mais um set” hoje. A revisão é o treino.\n\n**Referência de estratégia desta semana:** T30, T14, T22 (páginas 53–87).","d":"2026-10-16","k":"Guia detalhado"},{"n":221,"t":"sábado, 17/10/2026 · Sábado","b":"**Semana 3/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **104 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Marketing\n**Missão do dia:** Fixar G08 (Past Continuous) e G09 (Past Simple x Past Continuous)\n**Tempo ativo:** 55 min · **Versão mínima:** Grammar B 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Gramática B — G08 | 30 | Past Continuous |\n| Gramática C — G09 | 25 | Past Simple x Past Continuous |\n\n### Ponte com aulas antigas\n- Class Log da semana: escolha **5** itens (erros/chunks) das aulas de 12/10 e 14/10 e use-os hoje nas frases de produção.\n\n### Passivo (fora da conta)\nBBC Learning English no YouTube — 1 vídeo curto: https://www.youtube.com/@bbclearningenglish\n- Francês: TV5MONDE — Apprendre le français (1 vidéo): https://apprendre.tv5monde.com/en/collection-all\n\n### Guia detalhado — 17/10/2026\n\n**Gramática B — G08 (30')**\n1. (5') Leia G08 (p. 18) em voz alta. Exercício A (primeira exposição ao tópico: faça agora, com calma):\n1. At nine, she ___ (write) a report.\n2. I ___ (leave) when the phone rang.\n3. They ___ (not/listen) to the speaker.\n4. What ___ you ___ (do) at 5 p.m.?\n5. While we ___ (wait), the lights went out.\n6. He ___ (drive) to work when he saw the accident.\n2. (10') **Exercício B — corrija as frases**:\n1. ❌ *I was work at nine.*\n2. ❌ *They was waiting outside.*\n3. ❌ *I was knowing the answer.*\n4. ❌ *When I arrived, he talked to a client.*\n3. (10') **Produção:** Conte o que você estava fazendo às 20h de ontem.\n4. (5') Error Log: 1 regra por erro.\n\n**Gramática C — G09 (25')** — dia de simulado amanhã: gramática no sábado.\n1. (5') Leia G09 (p. 19).\n2. (10') Exercício A:\n1. While she ___ (present), the projector ___ (stop).\n2. I ___ (see) him when I ___ (walk) to work.\n3. He ___ (break) his arm while he ___ (play) football.\n4. They ___ (have) dinner when the power ___ (go) out.\n5. We ___ (finish) the report at six.\n6. At 8 p.m. I ___ (still/work).\n3. (5') Exercício B:\n1. ❌ *When I was arriving, the meeting started.*\n2. ❌ *While I had lunch, he arrived.*\n3. ❌ *He was breaking his leg last year.*\n4. ❌ *I was seeing her yesterday.*\n4. (5') Error Log.\n\n---\n**GABARITO (não olhe antes)**\n\n**G08 — A**\n1. was writing\n2. was leaving\n3. weren't listening\n4. were ... doing\n5. were waiting\n6. was driving\n\n**G08 — B**\n1. ✅ I was working at nine.\n2. ✅ They were waiting outside.\n3. ✅ I knew the answer.\n4. ✅ When I arrived, he was talking to a client.\n\n**G09 — A**\n1. was presenting / stopped\n2. saw / was walking\n3. broke / was playing\n4. were having / went\n5. finished\n6. was still working\n\n**G09 — B**\n1. ✅ When I arrived, the meeting started.\n2. ✅ While I was having lunch, he arrived.\n3. ✅ He broke his leg last year.\n4. ✅ I saw her yesterday.","d":"2026-10-17","k":"Sábado"},{"n":222,"t":"domingo, 18/10/2026 · Domingo","b":"**Semana 3/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **103 dias** para a prova\n**Missão do dia:** Simulado 1\n\n| Bloco | Min | O quê |\n|---|---|---|\n| Simulado 1 | 120 | Teste em condições reais nº 1 (TOEIC Test App) |\n| Registro | 15–30 | Score + Scoreboard |\n\n**Protocolo (T33):** 09:00 Listening 45' → Reading 75' (sem pausa) · Fonte: **Teste em condições reais nº 1 (TOEIC Test App)**.\n- Antes: sono, água, silêncio, folha de respostas, cronômetro, celular em modo avião.\n- Depois (30 min): score, acerto por Part, tempo por Part, 3 dúvidas.\n- Amanhã: revise só o essencial; a **terça** tem revisão completa (T34) e a **sexta** o reparo das Top-3 fraquezas.\n- Não estude gramática nova hoje.\n\n**Ponte com aulas antigas:** hoje não há revisão de aula: o foco é o simulado.\n**Passivo:** Série/filme com legenda em inglês (30 min, sem obrigação)\n\n**Checklist:** [ ] Simulado feito [ ] Registro [ ] Descanso","d":"2026-10-18","k":"Domingo"},{"n":223,"t":"segunda-feira, 19/10/2026 · Plano operacional","b":"**Semana 4/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **102 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Communication\n**Missão do dia:** Preparar, assistir e capturar a aula P1 (tema: Communication).\n**Tempo ativo:** 115 min (aula 60) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Pré-aula | 15 | Class Log + preview do tema + 2 perguntas |\n| Aula P1 | 60 | Aula com a professora 1 |\n| Pós-aula | 15 | Class Log + 3 cards + gravação de 60 s |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **get in touch** — entrar em contato · *Get in touch if you need help.*\n   - **clarify a point** — esclarecer um ponto · *Could you clarify a point in the contract?*\n   - **get the message across** — passar a mensagem · *The video got the message across.*\n   - **follow up** — dar seguimento · *I'll follow up next week.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A business interview* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/business-interview. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Ouça o trecho 2× **sem transcript** e anote 3 trechos difíceis.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe a study tool or app you like.\"* — use pelo menos: **get in touch** e **clarify a point**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **12/10/2026** (aula P1 anterior) e de **21/09/2026** (4 semanas atrás).\n- Escolha 3 itens dessas aulas e use-os na aula de hoje.\n\n### Passivo (fora da conta)\n- BBC 6 Minute English (1 episódio, ~6 min): https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\n\n### Checklist\n- [ ] Anki 10' · [ ] Shadowing 10' · [ ] Fala 5' · [ ] Pré-aula 15' · [ ] Aula · [ ] Pós-aula 15'","d":"2026-10-19","k":"Plano operacional"},{"n":224,"t":"segunda-feira, 19/10/2026 · Guia detalhado","b":"### Guia detalhado — 19/10/2026 · Aula P1\n\n**Vocabulário da semana (20 chunks — veja na aula quais aparecem):**\nget in touch, clarify a point, get the message across, follow up, reply to, forward an email, attach a file, leave a voicemail, put someone on hold, return a call, misunderstand, keep in touch, give feedback, draw attention to, point out, make a suggestion, confirm receipt, distribute, announce, inform someone of\n\n**Pré-aula (15 min)**\n1. (5') Abra o Class Log de **12/10/2026** e de **21/09/2026**; leia 3 erros/chunks de cada.\n2. (5') Preview do tema *Communication*: leia em voz alta os 8 primeiros chunks da lista acima; escolha **2 chunks-alvo** para usar na aula.\n3. (5') Escreva **2 perguntas** para a professora (uma sobre gramática, uma sobre vocabulário do tema).\n\n**Durante a aula (60 min)**\n- Anote sem parar: 3 erros corrigidos (frase errada → certa), 3 chunks novos, 1 dúvida.\n- Meta de fala: use os 2 chunks-alvo e pelo menos 1 estrutura da gramática da semana (G41).\n- Não traduza mentalmente: se travar, diga com outras palavras.\n\n**Pós-aula (15 min)**\n1. (7') Class Log: data · tema · 3 erros · 3 chunks · 1 dúvida (modelo p. 157).\n2. (5') Crie **até 3 cards** no deck *Active* com os erros/chunks da aula (regra dos 3).\n3. (3') Grave 60 s resumindo a aula em inglês (*Today we talked about…*).\n\n**Ponte com esta semana:** amanhã (terça) você estuda **G41** — se a professora tocou nesse tema hoje, anote no Class Log.","d":"2026-10-19","k":"Guia detalhado"},{"n":225,"t":"terça-feira, 20/10/2026 · Plano operacional","b":"**Semana 4/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **101 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Communication\n**Missão do dia:** Fixar G41 (Word families e derivation) + revisar o Simulado 1\n**Tempo ativo:** 85 min · **Versão mínima:** Anki 10' + gramática 15'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki · Shadowing · Fala |\n| Gramática A — G41 | 35 | Word families e derivation |\n| Revisão do simulado | 25 | Protocolo T34 do Simulado 1 |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **reply to** — responder a · *Please reply to this email today.*\n   - **forward an email** — encaminhar um e-mail · *Please forward the email to Ms. Cho.*\n   - **attach a file** — anexar um arquivo · *I attached the file to my message.*\n   - **leave a voicemail** — deixar recado de voz · *She left a voicemail for the client.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A business interview* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/business-interview. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Abra o transcript e leia junto 2×; marque palavras reduzidas (to, for, and).\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Give advice to a new colleague or student.\"* — use pelo menos: **reply to** e **forward an email**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de ontem (**19/10/2026**). Diga em voz alta os 3 erros corrigidos.\n\n### Passivo (fora da conta)\n- BBC The English We Speak (2 episódios, ~3 min): https://www.bbc.co.uk/learningenglish/english/features/the-english-we-speak\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Gramática · [ ] Revisão de simulado · [ ] Error Log","d":"2026-10-20","k":"Plano operacional"},{"n":226,"t":"terça-feira, 20/10/2026 · Guia detalhado","b":"### Guia detalhado — 20/10/2026\n**Passo 1 — Recall da aula de ontem (3'):** abra o Class Log de **19/10/2026**; diga 3 erros/chunks.\n**Passo 2 — Estudo (12'):** leia **G41** neste documento (p. 51) e a página do British Council (procure “Word formation” em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2). Explique cada regra em voz alta em 30 s.\nRegras-chave:\n- Mesma raiz, classes diferentes: employ (verbo), employee/employer/employment (substantivo), employable (adjetivo).\n- Sufixos de substantivo: -tion, -ment, -ness, -ity, -er/-or, -ance/-ence. De adjetivo: -able, -ful, -less, -ive, -al, -ous. De advérbio: -ly.\n- Prefixos: un-, in-/im-, dis-, re-.\n**Onde você costuma errar:** Português tem famílias parecidas (aplicar–aplicação); o risco é escolher a classe pela tradução, não pela posição.\n**Passo 3 — Exercício A (15'):** responda por escrito.\n1. The company offers ___ (employ) to graduates.\n2. We need a ___ (rely) supplier.\n3. She answered ___ (polite).\n4. The ___ (decide) was difficult.\n5. This tool is very ___ (use).\n6. He is an ___ (experience) manager.\n**Passo 4 — Correção (3'):** compare com o gabarito no fim da página; para cada erro escreva **1 regra** no Error Log.\n**Passo 5 — Produção (2'):** Escolha 5 palavras da lista da semana e crie a família completa (verbo, substantivo, adjetivo, advérbio).\n\n**Revisão do Simulado 1 (25'):**\n1. (8') Passada 1: refaça só os **erros**, achando a evidência exata (T34).\n2. (7') Passada 2: acertos por chute (marque e explique por que acertou).\n3. (5') Passada 3: acertos lentos (tempo > 90 s).\n4. (5') Escolha o **Top-3 de causas** (G/V/P/I/A/T/S/L) e escreva 3 regras/chunks. A sexta usa essas fraquezas.\nRegistre no Scoreboard (p. 161). Regras de decisão: Anexo D1 (p. 177).\n\n---\n**GABARITO (não olhe antes)**\n\n1. employment\n2. reliable\n3. politely\n4. decision\n5. useful\n6. experienced","d":"2026-10-20","k":"Guia detalhado"},{"n":227,"t":"quarta-feira, 21/10/2026 · Plano operacional","b":"**Semana 4/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **100 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Communication\n**Missão do dia:** Aquecer, assistir e capturar a aula P2 (conversação).\n**Tempo ativo:** 100 min (aula 50) · **Versão mínima:** Micro 15' + Class Log 3'\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Aquecimento | 15 | Gravação + correção + erros da aula anterior |\n| Aula P2 | 50 | Aula com a professora 2 |\n| Pós-aula | 10 | Class Log + 1 chunk para amanhã |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **put someone on hold** — deixar alguém em espera · *The operator put me on hold.*\n   - **return a call** — retornar uma ligação · *Please return my call as soon as possible.*\n   - **misunderstand** — entender mal · *I think we misunderstood each other.*\n   - **keep in touch** — manter contato · *Let's keep in touch by email.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A business interview* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/business-interview. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Shadowing 3×: fale junto, no ritmo; use 0,8× se precisar.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Make a polite complaint about a service.\"* — use pelo menos: **put someone on hold** e **return a call**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Reabra o Class Log de **14/10/2026** (aula P2 anterior): 3 erros + 3 chunks.\n- Reveja também a aula P1 de **19/10/2026**.\n\n### Passivo (fora da conta)\n- VOA Learning English (1 notícia, nível intermediário): https://learningenglish.voanews.com/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Aquecimento · [ ] Aula P2 · [ ] Pós-aula","d":"2026-10-21","k":"Plano operacional"},{"n":228,"t":"quarta-feira, 21/10/2026 · Guia detalhado","b":"### Guia detalhado — 21/10/2026 · Aula P2\n\n**Aquecimento (15')**\n1. (5') Grave 90 s respondendo: *\"What is the best way to give bad news at work?\"* Use 3 chunks da semana.\n2. (5') Ouça e corrija **3 erros** de gramática (anote frase errada → certa).\n3. (5') Releia os 3 erros da aula P2 de **14/10/2026** e os da aula P1 de **19/10/2026**; escolha **1** para tentar acertar em aula.\n\n**Aula (50')**\n- Objetivo de fala: usar 2 chunks-alvo + 1 estrutura da gramática da semana (G41 estudada ontem).\n- Peça correção imediata de 1 estrutura por aula.\n\n**Pós-aula (10')**\n1. (7') Class Log (3 erros · 3 chunks · 1 dúvida).\n2. (3') Escolha **1 chunk** para usar amanhã na fala de 5 min.\n\n**Pronúncia da semana (opcional 5'):** treine 5 palavras da lista com P04 (/ɪ/ vs /iː/) (p. 106).","d":"2026-10-21","k":"Guia detalhado"},{"n":229,"t":"quinta-feira, 22/10/2026 · Plano operacional","b":"**Semana 4/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **99 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Communication\n**Missão do dia:** Francês profundo: Pronoms doubles et ordre\n**Tempo ativo:** 100 min · **Versão mínima:** Micro 15' + 20' de gramática FR\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing FR 10 · Fala 5 |\n| Pronúncia | 10 | F02 — enchaînement consonantique |\n| Gramática FR | 20 | Pronoms doubles et ordre |\n| Expressions C1 | 10 | 4 expressões |\n| Production | 20 | Rédigez un mail de 8 lignes à un collègue en utilisant 4 dou… |\n| Input C1 | 15 | Easy French — episodes |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **give feedback** — dar feedback · *The manager gave feedback on my report.*\n   - **draw attention to** — chamar a atenção para · *The chart draws attention to the drop.*\n   - **point out** — apontar · *She pointed out a mistake in the figures.*\n   - **make a suggestion** — fazer uma sugestão · *May I make a suggestion?*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing FR — 10 min.** Trecho de ~30 s do episódio do dia de RFI (https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/) ou TV5MONDE (https://apprendre.tv5monde.com/en/collection-all). Ouça 2×, leia a transcrição se houver, fale junto 3×, grave 1× e compare a nasal e o /y/.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Compare two options you had to choose between.\"* — use pelo menos: **give feedback** e **draw attention to**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Ponte FR: revise o Error Log FR da quinta anterior (**15/10/2026**).\n- Ponte com aulas de inglês: 1 chunk das aulas desta semana traduzido para francês (exercício de comparação).\n\n### Passivo (fora da conta)\n- RFI — Journal en français facile (~10 min): https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/\n\n### Checklist\n- [ ] Anki · [ ] Shadowing FR · [ ] Fala · [ ] Pronúncia · [ ] Gramática · [ ] Expressions · [ ] Production · [ ] Input","d":"2026-10-22","k":"Plano operacional"},{"n":230,"t":"quinta-feira, 22/10/2026 · Guia detalhado","b":"### Guia detalhado — 22/10/2026 · Francês\n\n**1) Pronúncia (10')** — foco: F02 — enchaînement consonantique. Leia 5 frases dos exercícios em voz alta, sem pausas entre palavras ligadas; grave 1×. Ver P/F pp. 115–117.\n\n**2) Gramática (20')** — *Pronoms doubles et ordre*\nRegra: Ordem: me/te/nous/vous → le/la/les → lui/leur → y → en. 'Il me le donne', 'Elle les leur envoie'. Imperativo afirmativo: 'Donne-le-moi'.\nExercícios:\n1. Il donne le dossier à Anna.\n2. Nous envoyons les factures aux clients.\n3. Tu me prêtes ton stylo ?\n4. Montre-moi les photos.\n5. Je n'ai pas parlé de ce problème à mon chef.\n\n**3) Expressions C1 (10')** — leia, repita e escreva 1 frase própria com cada uma:\n- **à mon sens** — na minha opinião · *À mon sens, ce choix est risqué.*\n- **il me semble que** — parece-me que · *Il me semble que le prix est élevé.*\n- **force est de constater que** — é forçoso constatar que · *Force est de constater que les ventes baissent.*\n- **en tout état de cause** — em qualquer caso · *En tout état de cause, nous devons décider.*\n\n**4) Production (20')** — Rédigez un mail de 8 lignes à un collègue en utilisant 4 doubles pronoms.\nChecklist: use ≥2 estruturas da gramática do dia · releia e corrija acentos e concordâncias · (opcional) peça correção com o prompt da p. 162.\n\n**5) Input C1 (15')** — Easy French — episodes: https://www.easyfrench.fm/episodes\n1ª escuta: tema; 2ª: notas (chiffres, noms, connecteurs); resumo em 3 frases; 3 mots nouveaux.\n\n\n---\n**GABARITO (não olhe antes)**\n\n1. Il le lui donne.\n2. Nous les leur envoyons.\n3. Tu me le prêtes ?\n4. Montre-les-moi.\n5. Je ne lui en ai pas parlé.","d":"2026-10-22","k":"Guia detalhado"},{"n":231,"t":"sexta-feira, 23/10/2026 · Plano operacional","b":"**Semana 4/18 · Fase 2 — Reading recovery & mecânica TOEIC** · faltam **98 dias** para a prova (29/01/2027)\n**Tema da semana (aulas e vocabulário):** Communication\n**Missão do dia:** Reparo pós-Simulado 1\n**Tempo ativo:** 85 min · **Versão mínima:** Micro 15' + Part 5 de 15 itens\n\n### Cronograma\n| Bloco | Min | O quê |\n|---|---|---|\n| Micro | 25 | Anki 10 · Shadowing 10 · Fala 5 |\n| Setup | 5 | Cronômetro, silêncio, folha de respostas |\n| Set principal | ≈30 | 30 itens da Part em que você teve pior acerto no Simulado 1 (série temática do app) |\n| Revisão | 20 | Protocolo T32/T34 |\n| Log | 5 | Scoreboard |\n\n### Micro-blocos (25 min)\n**1) Anki — 10 min.** Revisões vencidas: 6' no deck *Legacy* + 4' no deck *Active*.\n**Novos hoje (4):**\n   - **confirm receipt** — confirmar recebimento · *Please confirm receipt of this message.*\n   - **distribute** — distribuir · *We distributed the agenda yesterday.*\n   - **announce** — anunciar · *The firm announced a new policy.*\n   - **inform someone of** — informar alguém sobre · *We regret to inform you of a delay.*\n   Regra: acabou o tempo, pare. Não crie cards agora.\n\n**2) Shadowing — 10 min.** Áudio da semana: *A business interview* (B2, link direto): https://learnenglish.britishcouncil.org/free-resources/listening/b2/business-interview. Trecho de ~30 s (a primeira fala do áudio).\n   Hoje: Grave 1× seu shadowing e compare com o original; escolha 1 ajuste.\n\n**3) Fala — 5 min.** Grave 60–90 s: *\"Describe a brand you admire and explain why.\"* — use pelo menos: **confirm receipt** e **distribute**. Ouça 1× e corrija 1 frase.\n\n### Ponte com aulas antigas\n- Junte 3 erros/chunks das aulas de Seg (**19/10/2026**) e Qua (**21/10/2026**) e procure-os na leitura/questões de hoje.\n- Se aparecerem, marque no Error Log como *reconhecido*.\n\n### Passivo (fora da conta)\n- TED — 1 talk (≤12 min) sobre *Communication*: https://www.ted.com/talks?q=Communication\n\n### Checklist\n- [ ] Anki · [ ] Shadowing · [ ] Fala · [ ] Set oficial · [ ] Revisão de erros · [ ] Scoreboard","d":"2026-10-23","k":"Plano operacional"},{"n":232,"t":"sexta-feira, 23/10/2026 · Guia detalhado","b":"### Guia detalhado — 23/10/2026 · TOEIC Reading oficial\n\n**Set do dia:** 30 itens da Part em que você teve pior acerto no Simulado 1 (série temática do app)\n**Fonte oficial:** App: série temática da Part fraca (pp. 153–154)\n**Foco:** Us
