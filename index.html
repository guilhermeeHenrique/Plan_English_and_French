<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1220">
<meta name="color-scheme" content="dark light">

<title>Plano Mestre · TOEIC 850+</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b9bff'/%3E%3Ctext x='32' y='43' font-size='34' font-weight='900' text-anchor='middle' fill='%2306101c' font-family='Arial'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a1220;--bg2:#0d1829;--card:#111f33;--card2:#162a44;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --tx:#eef3fa;--mut:#93a6bf;--dim:#6b7f99;--acc:#5b9bff;--acc2:#38d6c4;--ok:#4fd08a;--warn:#ffbd59;--bad:#ff6b7a;--pur:#a78bfa;
  --r:18px;--rs:12px;--sh:0 18px 48px rgba(0,0,0,.35);--side:268px;--tab:66px;
  --font:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#f2f6fb;--bg2:#e9f0f8;--card:#ffffff;--card2:#f5f9fd;--line:rgba(12,36,64,.09);--line2:rgba(12,36,64,.17);
  --tx:#0f2036;--mut:#5b7089;--dim:#8497ad;--sh:0 14px 40px rgba(28,58,94,.12);color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px*var(--fs,1));scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--tx);line-height:1.5;
  background:radial-gradient(60rem 30rem at 95% -5%,rgba(91,155,255,.13),transparent 60%),radial-gradient(50rem 30rem at -5% 105%,rgba(56,214,196,.09),transparent 60%),var(--bg);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
::selection{background:rgba(91,155,255,.35)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(147,166,191,.28);border-radius:9px}
.ic{width:20px;height:20px;flex:none}.ic.sm{width:16px;height:16px}.ic.lg{width:26px;height:26px}

/* layout */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);z-index:40;display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(18px);border-right:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center;padding:22px 20px 14px}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:900;color:#06101c;background:linear-gradient(135deg,var(--acc2),var(--acc));box-shadow:0 10px 26px rgba(56,214,196,.2)}
.brand b{display:block;font-size:15px;letter-spacing:.01em}.brand small{color:var(--mut);font-size:12px}
.sb-count{margin:4px 16px 12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.sb-count .n{font-size:26px;font-weight:800;letter-spacing:-.02em}.sb-count .l{font-size:12px;color:var(--mut)}
.bar{height:6px;border-radius:9px;background:rgba(147,166,191,.16);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.nav{padding:4px 12px 20px;overflow:auto;flex:1}
.nav h6{margin:16px 10px 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:700}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--mut);font-weight:600;font-size:14px;text-decoration:none;transition:.15s}
.nav a:hover{background:var(--card);color:var(--tx)}
.nav a.on{background:linear-gradient(135deg,rgba(91,155,255,.18),rgba(56,214,196,.10));color:var(--tx);box-shadow:inset 0 0 0 1px rgba(91,155,255,.28)}
.main{margin-left:var(--side);min-height:100vh}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:18px;letter-spacing:-.01em}.top .sub{color:var(--mut);font-size:12.5px}
.top .sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--mut);transition:.15s}
.ib:hover{color:var(--tx);border-color:var(--line2)}
.only-m{display:none}
#view{padding:26px 28px 90px;max-width:1180px;margin:0 auto}
.tabbar{display:none}

/* primitives */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 1px 0 rgba(255,255,255,.02)}
.card.flat{box-shadow:none}
.card h3{margin:0 0 4px;font-size:15px}.card .h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.muted{color:var(--mut)}.small{font-size:12.5px}.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--acc2);font-weight:700;margin:0 0 6px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:1.55fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.gauto{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);font-weight:650;font-size:14px;cursor:pointer;text-decoration:none;color:var(--tx);transition:.15s}
.btn:hover{border-color:var(--acc);text-decoration:none}
.btn.pri{background:linear-gradient(135deg,var(--acc),#3f7bea);border-color:transparent;color:#fff;box-shadow:0 10px 24px rgba(63,123,234,.32)}
.btn.pri:hover{filter:brightness(1.08)}.btn.gh{background:transparent}.btn.sm{padding:7px 12px;font-size:13px}.btn.danger{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:650;background:rgba(91,155,255,.14);color:var(--acc)}
.pill.g{background:rgba(79,208,138,.14);color:var(--ok)}.pill.w{background:rgba(255,189,89,.15);color:var(--warn)}.pill.p{background:rgba(167,139,250,.16);color:var(--pur)}.pill.n{background:rgba(147,166,191,.14);color:var(--mut)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line2);background:var(--bg2);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,155,255,.18)}
textarea{min-height:90px;resize:vertical}label.f{display:block;font-size:12px;color:var(--mut);font-weight:650;margin:0 0 5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.crumb{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:13px;margin-bottom:14px}.crumb a{color:var(--mut)}
.pgtitle{margin:0 0 6px;font-size:26px;letter-spacing:-.02em;line-height:1.2}

/* hoje */
.hero{display:flex;gap:26px;align-items:center;justify-content:space-between;padding:26px;border-radius:22px;background:linear-gradient(135deg,rgba(91,155,255,.20),rgba(56,214,196,.10) 60%,transparent),var(--card);border:1px solid var(--line2);box-shadow:var(--sh)}
.hero h2{margin:0 0 12px;font-size:25px;letter-spacing:-.02em;line-height:1.25;max-width:640px}
.ring{position:relative;width:118px;height:118px;flex:none}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;letter-spacing:-.02em}
.banner{margin-bottom:16px;padding:12px 16px;border-radius:14px;border:1px solid rgba(255,189,89,.35);background:rgba(255,189,89,.10);color:var(--warn);font-size:14px}
.task{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card2);margin-bottom:10px;transition:.15s}
.task:hover{border-color:var(--line2)}
.task.done{opacity:.62}.task.done .tn{text-decoration:line-through}
.chk{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;transition:.15s;margin:0}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #06101c;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task .tb{flex:1;min-width:0}.tn{font-weight:700}.tw{color:var(--mut);font-size:13px}
.min{font-size:12px;font-weight:700;padding:4px 9px;border-radius:9px;background:rgba(147,166,191,.14);color:var(--mut);white-space:nowrap}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0;border-radius:12px;border:1px solid var(--line);background:var(--card2);text-decoration:none!important;color:var(--tx);position:relative;transition:.15s}
.dt:hover{border-color:var(--acc)}
.dt small{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}.dt b{font-size:15px}
.dt.today{box-shadow:0 0 0 2px var(--acc)}.dt.full{background:rgba(79,208,138,.16);border-color:rgba(79,208,138,.4)}.dt.part{background:rgba(255,189,89,.12)}
.dt.off{opacity:.35;pointer-events:none}
.dt .mk{position:absolute;top:3px;right:5px;font-size:9px;font-weight:800;color:var(--pur)}
.wk{margin-bottom:16px}.wk .strip{margin-top:12px}

/* reader */
.md h3{font-size:16px;margin:24px 0 10px;padding-left:12px;border-left:3px solid var(--acc)}
.md h2{font-size:19px;margin:26px 0 10px}.md h4{font-size:14.5px;margin:18px 0 8px}
.md p{margin:0 0 12px}.md .lns{margin:0 0 14px}.md .ln{margin:0 0 7px;padding:2px 0}.mi{display:none}.md strong{color:var(--tx)}.md em{color:var(--mut);font-style:italic}
.md hr{border:0;border-top:1px dashed var(--line2);margin:22px 0}
.md code{font-family:var(--mono);font-size:.88em;padding:2px 6px;border-radius:6px;background:rgba(147,166,191,.16)}
.md .li{display:flex;gap:10px;padding:3px 0}.md .li .m{color:var(--acc);font-weight:800;min-width:1.4em}.md .li.n1{margin-left:22px}.md .li.n2{margin-left:44px}
.md .tw2{overflow-x:auto;margin:10px 0 16px;border:1px solid var(--line);border-radius:12px}
.md table{border-collapse:collapse;width:100%;font-size:14px}.md th{background:var(--card2);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.md th,.md td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}.md tr:last-child td{border-bottom:0}
.md blockquote{margin:12px 0;padding:10px 14px;border-left:3px solid var(--warn);background:rgba(255,189,89,.08);border-radius:0 12px 12px 0}
.md pre{position:relative;margin:12px 0;padding:14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);overflow:auto;max-height:420px}
.md pre code{background:none;padding:0;font-size:12.5px;white-space:pre}
.md pre button{position:sticky;float:right;top:0}
.md a.lk{word-break:break-all;display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:8px;background:rgba(91,155,255,.12);font-size:.9em}
.md .cb{width:18px;height:18px;border-radius:6px;vertical-align:-3px;margin:0 4px 0 2px}
details.ans{margin-top:22px;border:1px dashed var(--line2);border-radius:14px;padding:4px 16px;background:rgba(79,208,138,.05)}
details.ans summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--ok)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:13px;background:var(--card);border:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs a{padding:8px 16px;border-radius:10px;font-weight:650;font-size:14px;color:var(--mut);text-decoration:none}.tabs a.on{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}

/* biblioteca */
.sec{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none!important;color:var(--tx);transition:.15s}
.sec:hover{border-color:var(--acc);transform:translateY(-2px)}.sec .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(91,155,255,.14);color:var(--acc)}
.sec b{font-size:15px}.sec span{font-size:12.5px;color:var(--mut)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.chip{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--card);text-decoration:none!important;color:var(--tx);transition:.15s}
.chip:hover{border-color:var(--acc)}.chip b{color:var(--acc);font-size:13px}.chip span{font-size:13px;color:var(--mut)}
.list a{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--tx);text-decoration:none!important;align-items:center}.list a:hover{background:var(--card2)}
.list a b{color:var(--acc);min-width:44px}

/* ferramentas */
.flash{min-height:230px;display:grid;place-items:center;text-align:center;padding:30px;border-radius:20px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line2);cursor:pointer}
.flash .q{font-size:24px;font-weight:750;letter-spacing:-.01em}.flash .a{font-size:26px;font-weight:800;color:var(--acc2)}.flash .ex{margin-top:10px;color:var(--mut);font-style:italic}
.tm{font-size:64px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#fw{position:fixed;right:18px;bottom:18px;z-index:60;display:none;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line2);box-shadow:var(--sh)}
#fw.on{display:flex}#fw b{font-variant-numeric:tabular-nums;font-size:18px}#fw small{color:var(--mut);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* registros / progresso */
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t th{text-align:left;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line2)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.stat{padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line)}.stat b{display:block;font-size:28px;letter-spacing:-.02em}.stat span{color:var(--mut);font-size:13px}
.wbar{display:grid;grid-template-columns:110px 1fr 46px;gap:12px;align-items:center;font-size:13px;margin:8px 0}
.empty{padding:34px;text-align:center;color:var(--mut)}
.hl{background:rgba(255,189,89,.28);border-radius:4px;padding:0 2px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line2);padding:11px 18px;border-radius:13px;box-shadow:var(--sh);opacity:0;transition:.25s;z-index:99;pointer-events:none;font-size:14px}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.scrim{display:none}

@media(max-width:980px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .sidebar{transform:translateX(-100%);transition:.25s;width:min(86vw,300px)}.sidebar.open{transform:none;box-shadow:var(--sh)}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  .main{margin-left:0}.only-m{display:grid}.top{padding:12px 16px}#view{padding:18px 16px calc(var(--tab) + 40px)}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:38;height:var(--tab);padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:650;color:var(--dim);text-decoration:none}
  .tabbar a.on{color:var(--acc)}
  .hero{position:relative;flex-direction:column;align-items:flex-start;padding:20px}.hero h2{font-size:21px;padding-right:64px}.hero .eyebrow{padding-right:64px}.hero .ring{position:absolute;top:16px;right:14px;transform:scale(.56);transform-origin:top right}
  .task{padding:12px}.min.mo{display:none}.mi{display:inline-block;margin-top:8px}.pgtitle{font-size:22px}
  #fw{bottom:calc(var(--tab) + 12px)}.tm{font-size:52px}.wbar{grid-template-columns:80px 1fr 40px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

</style>
</head>

<script id="plan-data" type="application/json">{"pages":[{"n":1,"t":"Plano Mestre v2 — Inglês (TOEIC 850+) e Francês (C1)","b":"**Versão 2 — reconstruída em 24/09/2026 a partir do plano de 400 páginas anterior.** Mantém o formato extenso e preciso que você pediu, com o calendário reindexado para hoje.\n\n| Item | Definição |\n|---|---|\n| Prova | TOEIC Listening & Reading — **sexta-feira, 29/01/2027** |\n| Meta | **850+** (exigência real). Ponto de partida: 615 (Listening 355 · Reading 260, relatório de 26/03/2026) |\n| Francês | C1 até **agosto/2027** (DALF C1) — manutenção reforçada agora; carga cheia após 29/01 (Anexo C) |\n| Calendário | Semana 0: 25–27/09 · Semana 1: 28/09 → Semana 18: 25–29/01 |\n| Simulados | **Só material oficial.** Primeiro em **18/10** (não há teste completo antes de outubro) |\n| Estrutura | 400 páginas: Sistema (1–10), Grammar Map G01–G42 (11–52), TOEIC Map T01–T35 (53–87), Vocabulário (88–102), Pronúncia (103–117), Listening (118–127), Reading (128–137), Francês (138–152), Recursos (153–162), Anexos (163–182), Calendário dia a dia (183–400) |\n\n**O que mudou em relação ao plano antigo (resumo):**\n1. Calendário reindexado: hoje é 24/09, a Semana 1 do plano antigo já passou.\n2. Gramática: os 42 tópicos, agora com exercícios + gabarito + correção de erros por tópico (você quer revisar tudo do zero).\n3. Vocabulário: 20 chunks/semana (340 no total), não 4/semana.\n4. Leitura: 2 textos/semana com links reais (British Council), em ordem B1 → B2.\n5. TOEIC: só Sample Test e TOEIC Test App da ETS; primeiro simulado em 18/10; diagnóstico por Part nas sextas e sábados anteriores.\n6. Meta diária: 1 h ativa (bloco principal) + 25 min de micro-blocos; passivo à parte.\n7. Natal/Ano-Novo sem contradição: dias com “0 obrigatório”.\n8. Francês: 75 min na quinta + 10 min de shadowing FR + plano C1 fev–ago.","d":null,"k":"ref"},{"n":2,"t":"Como usar este documento (regra de ouro)","b":"**Regra de ouro:** abra a página do dia, faça o que está escrito, na ordem, e feche. Você não decide nada: os links, os chunks, os exercícios e os minutos já estão prontos.\n\n**Cada dia útil tem 2 páginas:** (1) *Plano operacional* — cronograma, micro-blocos (Anki, shadowing, fala), ponte com aulas e passivo; (2) *Guia detalhado* — o bloco principal com o conteúdo exato. Fim de semana: 1 página.\n\n**Como marcar:** ao terminar cada bloco, marque `[x]` no seu arquivo. Blocos não feitos vão para a lista “Recuperação” (p. 6). Nunca acumule mais de 2 blocos atrasados.\n\n**Gabaritos:** ficam no fim de cada página, depois de uma linha “GABARITO”. Não olhe antes de tentar.\n\n**Regra do material oficial:** questões no formato TOEIC vêm só do Sample Test da ETS e do TOEIC Test App (pp. 153–154). Exercícios de gramática deste documento são autorais e **não** são questões TOEIC.\n\n**Legenda das causas de erro (T32):** G gramática · V vocabulário/colocação · P paráfrase · I inferência · A atenção · T tempo · S estratégia · L detalhe de áudio.","d":null,"k":"ref"},{"n":3,"t":"Diagnóstico e meta 850","b":"**Ponto de partida (relatório de 26/03/2026):** Listening 355 · Reading 260 · total 615. Meta: ~425 + ~425.\n\n| Seção | Hoje | Meta | Distância | Nível CEFR de referência ETS |\n|---|---|---|---|---|\n| Listening | 355 | ~425 | +70 | B1 (275) → B2 (400) |\n| Reading | 260 | ~425 | +165 | A2 (115) → B1 (275) → B2 (385) |\n\n**Leitura honesta dos números:**\n- O maior salto está no **Reading (+165)**, e você já identificou a causa: gramática. Por isso a gramática G01–G42 vem em primeiro lugar e o Reading é o foco das sextas.\n- O erro de medição do TOEIC é ~25 pontos por seção; entre duas provas, ~35. Não conclua nada de variações pequenas.\n- Sem um teste completo até 18/10, o plano usa **diagnóstico por Part** (sextas: Reading; sábados: Listening) para mapear o problema antes do primeiro simulado.\n- Existe risco real de 850 em 17 semanas úteis partindo de 615. O plano maximiza a chance, mas **não garante**. Regras de decisão e contingência: Anexo D (pp. 177–178).\n\n**Regra de coerência:** o que entra no plano deve atacar uma causa de erro medida (T32), não uma suposição.","d":null,"k":"ref"},{"n":4,"t":"Arquitetura semanal — minutos exatos","b":"| Dia | Micro (25') | Bloco principal | Total ativo |\n|---|---|---|---|\n| Seg | Anki 10 · Shadowing 10 · Fala 5 | Pré-aula 15 + **Aula P1 (60)** + Pós-aula 15 | 115' (aula inclusa) |\n| Ter | Anki 10 · Shadowing 10 · Fala 5 | **Gramática A (35)** + **Leitura 1 (25)** | 85' |\n| Qua | Anki 10 · Shadowing 10 · Fala 5 | Aquecimento 15 + **Aula P2 (50)** + Pós-aula 10 | 100' (aula inclusa) |\n| Qui | Anki 10 · Shadowing **FR** 10 · Fala 5 | **Francês profundo (75)** | 100' |\n| Sex | Anki 10 · Shadowing 10 · Fala 5 | **TOEIC Reading oficial (60)** | 85' |\n| Sáb | — | Gramática B (30) + **Listening oficial (25)** | 55' |\n| Dom | — | Gramática C (20) + Leitura 2 (20) + Reset (15) | 55' |\n\n**Total semanal:** ~595 min ≈ 9,9 h, incluindo 110 min de aula. Estudo autônomo: ~8 h.\n\n**Sobre a sua meta de 1 h/dia:** o **bloco principal** de cada dia útil é a sua “1 h ativa” (Ter 60 · Qui 75 · Sex 60; Seg/Qua = aula + preparo). Os **micro-blocos de 25 min** são a novidade: 25 min extras distribuídos (Anki, shadowing, fala) que trazem recorrência. O **passivo** (podcast, TED, série) fica fora da conta.\n\n**Mínimo de sobrevivência (dia difícil):** Anki 10 + bloco principal reduzido à metade. Ver p. 6.","d":null,"k":"ref"},{"n":5,"t":"Micro-blocos (25 min) — instruções exatas","b":"**1. Anki — 10 min (relógio na mão).**\n- Deck **Legacy** (cards antigos): revisões vencidas. Deck **Active**: chunks novos do plano.\n- Divisão por fase: Fase 1 → 7' Legacy + 3' Active · Fase 2 → 6'/4' · Fase 3 → 5'/5' · Fase 4 → 4'/6' · Fase 5 → 3'/7'.\n- **4 chunks novos por dia útil** (20 por semana). Cada dia mostra os 4 chunks exatos. Não crie cards durante o bloco.\n- Terminou o tempo? Pare. Pendências ficam para amanhã.\n\n**2. Shadowing — 10 min.** Trecho de ~30 s do áudio da semana (link no dia). Sequência: Seg ouvir 2× e marcar 3 trechos difíceis · Ter com transcript, ler junto 2× · Qua shadowing 3× · Qui **francês** (RFI/TV5, 30 s) · Sex gravar 1× e comparar.\n\n**3. Fala — 5 min.** Grave 60–90 s respondendo à pergunta do dia usando 2 dos chunks novos. Ouça 1× e corrija 1 frase. Quem corrige: você (ou a professora, quando a gravação for relevante).\n\n**Ordem sugerida:** manhã ou qualquer janela. O bloco principal fica para o fim do dia (ou horário fixo que você escolher).","d":null,"k":"ref"},{"n":6,"t":"Versão PADRÃO × MÍNIMA e recuperação","b":"| Situação | O que fazer |\n|---|---|\n| Dia normal | Micro 25' + bloco principal |\n| Dia difícil (pouco tempo) | Anki 10' + **metade** do bloco principal (o resto vai para a recuperação) |\n| Dia perdido | Não “dobre” no dia seguinte. Anote em Recuperação e retome amanhã |\n| 2 blocos atrasados acumulados | Suspenda Leitura 2 (dom) até zerar |\n| Semana de prova/simulado | Sem novos conteúdos na véspera; foque em sono |\n\n**Lista de recuperação (copie para seu arquivo):** data · bloco perdido · prioridade (alta se for Gramática/TOEIC Reading; baixa se for passivo) · feito?\n\n**Regra:** prioridade decrescente → TOEIC Reading (sexta) > Gramática (ter/sáb) > Aulas > Anki > Leitura > Shadowing > Fala.","d":null,"k":"ref"},{"n":7,"t":"Fases e marcos (datas)","b":"| Fase | Período | Objetivo | Marco |\n|---|---|---|---|\n| 1 — Fundação e reativação | 25/09 → 11/10 | Reativar hábito, revisar G01–G12, mapear erros por Part | Diagnóstico Reading A/B e Listening (Parts 2–3) |\n| 2 — Reading recovery e mecânica TOEIC | 12/10 → 08/11 | Word forms/tempos verbais, primeiras estratégias de Part 5–7 | **Simulado 1 (18/10)** |\n| 3 — Integração e velocidade | 09/11 → 13/12 | Ritmo por Part, Part 7 múltipla | **Simulado 2 (15/11)** · **Simulado 3 (13/12)** |\n| 4 — Transição de prova (festas) | 14/12 → 03/01 | Manter contato, fechar G37–G40, sem culpa | Natal, Ano-Novo: 0 obrigatório |\n| 5 — Performance | 04/01 → 29/01 | Reparos finais, timing, taper | **Simulado 4 (10/01)** · Reading final (17/01) · **PROVA 29/01** |\n\n**Peso do treino TOEIC vs. inglês geral:** Fase 1 ≈ 25% · Fase 2 ≈ 35% · Fase 3 ≈ 45% · Fase 4 ≈ 55% (leve) · Fase 5 ≈ 70%.","d":null,"k":"ref"},{"n":8,"t":"Integração com aulas antigas (Class Log e ponte)","b":"Você pediu que cada dia ligue com o que já foi estudado. O mecanismo:\n\n1. **Class Log** (modelo na p. 157): após cada aula (Seg/Qua), registre em 3 min: data · unidade/tema · 3 erros · 3 chunks · 1 dúvida.\n2. **Ponte diária:** a página de cada dia diz **qual aula reabrir por data** (ex.: “abra o Class Log de 21/09”): ontem (Ter), 1 semana atrás (Seg/Qua), 4 semanas atrás (Dom).\n3. **Aulas anteriores ao plano** (antes de 14/09): use o caderno/Keynote mais recente; a página do dia marca “aula anterior ao plano”.\n4. **Tema da semana ↔ Keynote:** cada semana tem um tema (Money, Success, Marketing…). Se a professora já estiver em outra unidade, siga a unidade real e use o vocabulário da semana como trilha TOEIC paralela.\n5. **Erros das aulas viram cards:** máximo 3 por aula (regra dos 3).","d":null,"k":"ref"},{"n":9,"t":"Métricas e regras de decisão","b":"**Métricas semanais (Scoreboard, p. 161):** (1) acerto por Part; (2) tempo por Part; (3) nº de erros por causa (T32); (4) % de blocos feitos; (5) minutos de passivo (opcional).\n\n**Regras de decisão (resumo; texto completo no Anexo D):**\n- Variação < 35–50 pontos entre simulados = ruído; não mude o plano.\n- Se Reading < 330 no Simulado 1 → a sexta passa a 75 min e a gramática ganha 1 bloco extra semanal.\n- Se Listening < 380 no Simulado 1 → o sábado sobe para 40 min (Parts 2–3 primeiro).\n- Se Simulado 3 < 760 → avaliar segunda data de prova (fev/mar) como rede de segurança.\n- Nunca troque a fonte oficial por questões geradas por IA.","d":null,"k":"ref"},{"n":10,"t":"Mapa do documento (índice de páginas)","b":"| Páginas | Conteúdo |\n|---|---|\n| 1–10 | Sistema |\n| 11–52 | Grammar Map G01–G42 |\n| 53–87 | TOEIC Map T01–T35 |\n| 88–102 | Vocabulário V01–V15 (V06–V14: glossários por domínio) |\n| 103–117 | Pronúncia P01–P15 |\n| 118–127 | Listening L01–L10 |\n| 128–137 | Reading R01–R10 |\n| 138–152 | Francês F01–F15 |\n| 153–162 | Recursos oficiais, templates, Anki, scoreboard, prompts |\n| 163–168 | Anexo A — Anki CSV (340 chunks) |\n| 169–170 | Anexo B — Banco de perguntas de fala |\n| 171–176 | Anexo C — Roteiro de francês fev→ago/2027 |\n| 177–178 | Anexo D — Regras de decisão e contingência |\n| 179–180 | Anexo E — Checklist Semana 0 e verificação de links |\n| 181–182 | Anexo F — Expressões C1 em francês (72) |\n| 183–400 | Calendário: 25/09/2026 → 29/01/2027 (218 páginas) |","d":null,"k":"ref"},{"n":11,"t":"G01 — Sentence architecture: subject, verb, object/complement","b":"**Quando você estuda:** Ter 29/09 (estudo+exercício A)\n**Onde aprofundar (British Council):** procure **“Sentence structure / Word order”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Toda oração precisa de sujeito + verbo. Em inglês o sujeito NÃO pode ser omitido: 'Is important' ✗ → 'It is important' ✓.\n- Ordem básica: S + V + O (She sends reports) · S + V + complemento (He is tired) · S + V + O + lugar/tempo (We met clients on Monday).\n- Verbo transitivo pede objeto (make a decision); intransitivo não (arrive, happen, exist); de ligação (be, become, seem) pede adjetivo/substantivo.\n- Advérbio de frequência vem ANTES do verbo principal e DEPOIS de be: She always checks emails / She is always late.\n\n### Interferência do português (onde você costuma errar)\n- Em português o sujeito some ('Chegou ontem'). Em inglês: 'It arrived yesterday.'\n- 'Tem/Existe' = there is/there are: 'There are three meetings today' (nunca 'Have three meetings').\n\n### Como cai no TOEIC\n- Part 5/6: identificar o que falta (sujeito, verbo ou objeto) elimina 2 das 4 alternativas em segundos.\n- Sujeito longo separado do verbo: 'The list of new products IS ready' (o verbo concorda com 'list').\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":12,"t":"G02 — Be, have e do como verbos e auxiliares","b":"**Quando você estuda:** Sáb 03/10 (exercício B)\n**Onde aprofundar (British Council):** procure **“Verb be / have / do”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- be = ser/estar/ficar (I am a student · The office is closed). Também é auxiliar do contínuo (is working) e da passiva (was sent).\n- have = ter (lexical: have a meeting, have lunch) e auxiliar do perfect (has finished).\n- do/does/did = auxiliar de perguntas e negativas: 'Does she work here?' · 'He doesn't work here.' Depois de do/does/did o verbo fica na forma base.\n- Nunca combine do com be: 'Are you ready?' (não 'Do you be ready?').\n\n### Interferência do português (onde você costuma errar)\n- Idade e sensações usam BE: 'I am 25', 'I am hungry/hot' (não 'have').\n- 'Tenho uma reunião' = 'I have a meeting' (have lexical) — mas 'Estou em uma reunião' = 'I am in a meeting'.\n\n### Como cai no TOEIC\n- Part 5: escolher entre is/has/does antes de um verbo: 'Ms. Kim HAS worked here since 2019'.\n- Auxiliar + forma base: 'does not REQUIRE', nunca 'does not requires'.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":13,"t":"G03 — Present Simple","b":"**Quando você estuda:** Dom/Sáb 04/10 (revisão C)\n**Onde aprofundar (British Council):** procure **“Present simple”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Usos: rotinas, fatos, horários fixos (The train leaves at 7).\n- 3ª pessoa do singular leva -s/-es: works, watches, studies, has, goes.\n- Negativa/pergunta: do/does + base ('She doesn't work' · 'Does she work?').\n- Advérbios: always, usually, often, sometimes, rarely, never — antes do verbo, depois de be.\n\n### Interferência do português (onde você costuma errar)\n- O erro mais comum de falantes de português: esquecer o -s ('She work'). Treine falando em voz alta.\n- 'Study→studies', 'have→has', 'go→goes' são irregularidades de escrita, não de pronúncia.\n\n### Como cai no TOEIC\n- Sujeito singular ou 'each/every/one of' → verbo com -s: 'Each employee RECEIVES a badge.'\n- Marcadores every day/usually/on Mondays → Present Simple.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":14,"t":"G04 — Present Continuous","b":"**Quando você estuda:** Ter 06/10 (estudo+exercício A)\n**Onde aprofundar (British Council):** procure **“Present continuous”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- be + verbo-ing. Usos: ação agora (It is raining), situação temporária (I'm working from home this week), arranjo futuro combinado (We're meeting on Friday).\n- Ortografia: run→running, write→writing, lie→lying, plan→planning.\n- Verbos de estado (know, want, need, like, love, understand) normalmente NÃO usam -ing.\n\n### Interferência do português (onde você costuma errar)\n- Português usa 'estou fazendo' de forma mais ampla; em inglês, duração longa usa Present Perfect ('I've been working here for two years').\n- 'Estou entendendo' → 'I understand' (não 'I am understanding').\n\n### Como cai no TOEIC\n- Part 1 (fotos): 'A woman IS HOLDING a folder' — ação em curso na imagem.\n- Part 5: now/currently/at the moment + be + -ing.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":15,"t":"G05 — Present Simple x Present Continuous","b":"**Quando você estuda:** Sáb 10/10 (exercício B)\n**Onde aprofundar (British Council):** procure **“Present simple and present continuous”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Present Simple: hábitos e fatos. Present Continuous: agora/temporário.\n- State verbs (know, want, need, like, love, believe, understand, belong, own, prefer) quase nunca usam -ing.\n- Alguns verbos mudam de sentido: 'I think it's good' (opinião, PS) × 'I'm thinking about it' (processo, PC); 'have lunch' pode ser contínuo.\n\n### Interferência do português (onde você costuma errar)\n- 'Estou sabendo/entendendo' não existem: 'I know', 'I understand'.\n\n### Como cai no TOEIC\n- Marcadores: usually/every day → PS; now/currently/this week/at the moment → PC.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":16,"t":"G06 — Questions e negatives no presente","b":"**Quando você estuda:** Dom/Sáb 11/10 (revisão C)\n**Onde aprofundar (British Council):** procure **“Questions / Negatives”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Com be: inverta sujeito e verbo (Is she ready?). Com outros verbos: do/does + sujeito + base (Where does he work?).\n- Pergunta sobre o SUJEITO não usa do/does: 'Who works here?' · 'What happened?'\n- Negativas: am/is/are + not · do/does + not + base.\n- Wh- + auxiliar + sujeito + verbo: How often do you meet? · What time does it start?\n\n### Interferência do português (onde você costuma errar)\n- 'Onde ele trabalha?' → 'Where DOES he work?' (não 'Where he works?').\n- 'Quem trabalha aqui?' → 'Who works here?' (sem does).\n\n### Como cai no TOEIC\n- Part 2: o início da pergunta (Do/Does/Are/Where/Who) define a resposta possível — reconheça em <1 segundo.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":17,"t":"G07 — Past Simple","b":"**Quando você estuda:** Ter 13/10 (estudo+exercício A)\n**Onde aprofundar (British Council):** procure **“Past simple”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Ação concluída em tempo terminado: yesterday, last week, in 2019, two days ago.\n- Regulares: -ed (worked, studied, stopped). Irregulares que você precisa de cor: go–went, have–had, buy–bought, send–sent, meet–met, take–took, make–made, see–saw, begin–began, write–wrote, give–gave.\n- Negativa/pergunta: did + base: 'Did you send it?' · 'I didn't send it'.\n\n### Interferência do português (onde você costuma errar)\n- 'Did you went?' ✗ → 'Did you go?': depois de did o verbo volta à base.\n\n### Como cai no TOEIC\n- Part 5: yesterday/ago/last + verbo → passado simples, NÃO present perfect.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":18,"t":"G08 — Past Continuous","b":"**Quando você estuda:** Sáb 17/10 (exercício B)\n**Onde aprofundar (British Council):** procure **“Past continuous”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- was/were + -ing. Uso 1: ação em andamento em um momento do passado ('At nine I was writing a report').\n- Uso 2: ação longa interrompida por outra curta ('I was leaving when the phone rang').\n- Serve de pano de fundo em narrativas (It was raining and people were waiting...).\n\n### Interferência do português (onde você costuma errar)\n- O imperfeito do português cobre tudo ('eu trabalhava'). Em inglês: hábito → used to/PS; ação em progresso → PC.\n\n### Como cai no TOEIC\n- when/while: 'While he WAS WAITING, the call came.'\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":19,"t":"G09 — Past Simple x Past Continuous","b":"**Quando você estuda:** Dom/Sáb 17/10 (revisão C)\n**Onde aprofundar (British Council):** procure **“Past simple and past continuous”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- PS = evento concluído (a ação curta); PC = pano de fundo/em progresso (a ação longa).\n- while + PC (ação longa); when + PS (ação curta que interrompe): 'While I was checking my mail, the boss called.'\n- Ações sucessivas usam só PS: 'I opened the file, read the note and replied.'\n\n### Interferência do português (onde você costuma errar)\n- Não traduza 'enquanto' sempre por PC: 'When I arrived, he left' (sucessivo) ≠ 'When I arrived, he was leaving'.\n\n### Como cai no TOEIC\n- Escolha do tempo por marcador: at that moment/while → PC; suddenly/then → PS.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":20,"t":"G10 — Used to e hábitos passados","b":"**Quando você estuda:** Sáb 09/01 (exercício B)\n**Onde aprofundar (British Council):** procure **“Used to / would”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- used to + base = hábito/estado que não existe mais: 'I used to work in sales.' Negativa/pergunta: didn't use to / Did you use to...?\n- would + base também expressa hábito passado (não estados): 'We would meet every Friday.'\n- be/get used to + -ing = estar/ficar acostumado: 'I'm used to working late.'\n- 'be used to + base' = ser usado para: 'This tool is used to measure heat.'\n\n### Interferência do português (onde você costuma errar)\n- Não confunda 'used to work' (antes) com 'am used to working' (estou acostumado).\n\n### Como cai no TOEIC\n- Raro em Part 5, mas 'be used to + gerúndio' e 'be used to + base' aparecem como armadilha.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":21,"t":"G11 — Present Perfect: forma e usos","b":"**Quando você estuda:** Sáb 24/10 (exercício B)\n**Onde aprofundar (British Council):** procure **“Present perfect simple”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- have/has + particípio. Usos: (1) experiência sem data (I have visited Berlin); (2) resultado agora (She has lost her badge); (3) período que continua (We have worked here since 2020).\n- Particípios irregulares essenciais: been, done, gone, seen, written, taken, given, made, sent, met, bought.\n- Marcadores: since, for, already, yet, just, recently, so far, ever, never.\n\n### Interferência do português (onde você costuma errar)\n- 'Eu moro aqui há dois anos' → 'I HAVE LIVED here for two years' (não 'I live here for two years').\n\n### Como cai no TOEIC\n- Part 5: for/since + duração → present perfect; ago/yesterday → passado simples.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":22,"t":"G12 — Present Perfect x Past Simple","b":"**Quando você estuda:** Dom/Sáb 25/10 (revisão C)\n**Onde aprofundar (British Council):** procure **“Present perfect and past simple”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Past Simple = momento terminado e datado (yesterday, in 2020, last week, ago). Present Perfect = ligação com o presente / tempo não terminado (today, this week, so far, ever).\n- Se a frase tem data/hora específica → Past Simple. 'When did you...?' pede Past Simple.\n- 'Have you ever...?' pergunta experiência; a resposta detalhada usa Past Simple.\n\n### Interferência do português (onde você costuma errar)\n- Português usa pretérito perfeito para ambos. Em inglês a pergunta 'Quando?' exige PS.\n\n### Como cai no TOEIC\n- Armadilha clássica: 'The manager (has left / left) at noon' → 'at noon' fixa o passado: left.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":23,"t":"G13 — Since, for, already, yet, just","b":"**Quando você estuda:** Ter 27/10 (estudo+exercício A)\n**Onde aprofundar (British Council):** procure **“Present perfect: since / for / already / yet”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- since + ponto no tempo (since 2019, since Monday); for + duração (for three years).\n- already = já (afirmativa): 'We have already sent it.'; yet = ainda (negativa e pergunta, fim da frase): 'Have you finished yet?'; just = acabou de.\n- Posição: have already/just + particípio; yet no fim.\n\n### Interferência do português (onde você costuma errar)\n- 'Há dois anos' → 'for two years' (nunca 'since two years').\n\n### Como cai no TOEIC\n- Part 5 pede since/for e already/yet com frequência — decore o par de perguntas: 'ponto ou duração?'\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":24,"t":"G14 — Present Perfect Continuous","b":"**Quando você estuda:** Sáb 31/10 (exercício B)\n**Onde aprofundar (British Council):** procure **“Present perfect continuous”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- have/has been + -ing: ação que começou no passado e continua (ou acabou de parar com resultado visível), com ênfase na duração.\n- 'How long have you been working here?' · 'You look tired. Have you been running?'\n- Verbos de estado usam Present Perfect simples: 'I have known him for years.'\n\n### Interferência do português (onde você costuma errar)\n- 'Há quanto tempo você espera?' → 'How long have you been waiting?'\n\n### Como cai no TOEIC\n- Se aparece 'for/since' + ação repetida ou contínua → PPC ou PP; se resultado/quantidade ('three reports') → PP simples.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":25,"t":"G15 — Future: will, going to, present continuous","b":"**Quando você estuda:** Dom/Sáb 01/11 (revisão C)\n**Onde aprofundar (British Council):** procure **“Future forms”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- will = decisão na hora, previsão, promessa: 'I'll send it now.'\n- be going to = plano/intenção ou evidência: 'We're going to launch in May.' · 'Look at those clouds — it's going to rain.'\n- Present Continuous = arranjo combinado: 'I'm meeting Mr. Lee at three.'\n- Formais/agenda: be scheduled to, be due to, be about to.\n\n### Interferência do português (onde você costuma errar)\n- 'Farei' não é sempre 'will': planos já decididos usam going to.\n\n### Como cai no TOEIC\n- Part 5/6: will + base (nunca 'will to', nunca 'will + -s').\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":26,"t":"G16 — Future time clauses","b":"**Quando você estuda:** Ter 03/11 (estudo+exercício A)\n**Onde aprofundar (British Council):** procure **“Future time clauses”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Depois de when, as soon as, before, after, until, once, by the time o verbo fica no PRESENTE (simples ou perfect), mesmo com sentido de futuro: 'I'll call you when I arrive.'\n- Presente perfeito destaca a conclusão: 'I'll call as soon as I have finished.'\n- Nunca use will dentro da oração de tempo.\n\n### Interferência do português (onde você costuma errar)\n- O subjuntivo futuro do português ('quando eu chegar') vira presente simples em inglês.\n\n### Como cai no TOEIC\n- Part 5/6: 'Once the payment (is received / will be received), we will ship.' → is received.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":27,"t":"G17 — Articles: a/an, the e zero article","b":"**Quando você estuda:** Sáb 07/11 (exercício B)\n**Onde aprofundar (British Council):** procure **“Articles”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- a/an = um qualquer / primeira menção ('I need a laptop'); the = específico, conhecido ou único ('the laptop on my desk', 'the CEO').\n- Sem artigo: plurais e incontáveis em sentido geral (Customers like discounts), meses, idiomas, refeições, a maioria de cidades/países.\n- a antes de SOM de consoante (a university), an antes de SOM de vogal (an hour).\n- Profissão: 'She is an engineer.' Superlativo: 'the best'.\n\n### Interferência do português (onde você costuma errar)\n- 'Eu gosto da música' (geral) → 'I like music' (sem artigo).\n- Profissões exigem artigo em inglês: 'Sou engenheiro' → 'I am an engineer'.\n\n### Como cai no TOEIC\n- Part 5: a/an/the antes de substantivo contável singular — se falta artigo, pergunte 'é específico?'\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":28,"t":"G18 — Countable x uncountable nouns","b":"**Quando você estuda:** Dom/Sáb 08/11 (revisão C)\n**Onde aprofundar (British Council):** procure **“Countable and uncountable nouns”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Incontáveis comuns: information, advice, equipment, furniture, luggage, news, money, traffic, work, research, feedback, software. Sem plural, sem a/an, verbo no singular.\n- Use some/any/much/a lot of/a piece of com incontáveis: 'a piece of advice', 'a lot of information'.\n- Contáveis: a report, two reports, many reports.\n\n### Interferência do português (onde você costuma errar)\n- Português usa plural ('informações', 'conselhos', 'equipamentos'); inglês NÃO: 'information', 'advice', 'equipment'.\n\n### Como cai no TOEIC\n- Vocabulário TOEIC de alta frequência: equipment, information, feedback, staff, software, luggage, furniture.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":29,"t":"G19 — Quantifiers: much, many, few, little, some, any","b":"**Quando você estuda:** Ter 10/11 (estudo+exercício A)\n**Onde aprofundar (British Council):** procure **“Quantifiers”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- many + contável plural; much + incontável (negativa/pergunta); a lot of serve para ambos em afirmativas.\n- a few/a little = alguns/um pouco (positivo); few/little = poucos/quase nenhum (negativo).\n- some (afirmativa, ofertas) · any (negativa, pergunta): 'Do you have any questions?'\n\n### Interferência do português (onde você costuma errar)\n- 'Tenho poucos amigos' (sentindo falta) = 'I have few friends'; 'alguns amigos' = 'a few friends'.\n\n### Como cai no TOEIC\n- Part 5: 'How (much/many) time' e 'too many/too much' — verifique se o substantivo é contável.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":30,"t":"G20 — Determiners e demonstratives","b":"**Quando você estuda:** Sáb 14/11 (exercício B)\n**Onde aprofundar (British Council):** procure **“Determiners / this, that, these, those”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- this/these = perto; that/those = longe. Concordância: this file / these files.\n- every/each + singular (Every customer is welcome). all/most/some + plural. both = os dois; either/neither = um dos dois / nenhum.\n- another + singular (another option); other + plural (other options); the other = o restante/o outro específico.\n\n### Interferência do português (onde você costuma errar)\n- 'Cada um dos funcionários' → 'Each of the employees HAS' (verbo no singular).\n\n### Como cai no TOEIC\n- Part 5: each/every + singular; 'Each of the + plural + verbo singular'.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":31,"t":"G21 — Adjectives: posição e ordem","b":"**Quando você estuda:** Dom/Sáb 14/11 (revisão C)\n**Onde aprofundar (British Council):** procure **“Adjectives”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Adjetivo vem antes do substantivo e depois de be/linking verbs; não tem plural: 'two new employees'.\n- Ordem típica: opinião → tamanho → idade → forma → cor → origem → material → substantivo. Use no máximo 2–3.\n- -ed = sentimento de quem sente (bored, interested); -ing = o que causa (boring, interesting).\n\n### Interferência do português (onde você costuma errar)\n- Português coloca o adjetivo depois ('um relatório claro'); inglês antes: 'a clear report'.\n\n### Como cai no TOEIC\n- Part 5: escolha -ed × -ing pelo contexto ('The results were SURPRISING' / 'I was SURPRISED').\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":32,"t":"G22 — Adverbs e adjective x adverb","b":"**Quando você estuda:** Ter 17/11 (estudo+exercício A)\n**Onde aprofundar (British Council):** procure **“Adverbs”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Adjetivo descreve substantivo; advérbio descreve verbo, adjetivo ou outro advérbio: 'She speaks clearly.'\n- Formação: adjetivo + -ly (quick→quickly, careful→carefully). Irregulares: good→well, fast→fast, hard→hard (hardly = quase não), late→late (lately = recentemente).\n- Depois de be/seem/look/feel/sound use ADJETIVO: 'The plan looks good.'\n- Advérbio antes de adjetivo/particípio: highly recommended, newly hired, carefully prepared.\n\n### Interferência do português (onde você costuma errar)\n- 'Ela fala bem' → 'She speaks WELL' (não 'good').\n- 'Hardly' NÃO significa 'com força': é 'quase não'.\n\n### Como cai no TOEIC\n- Word class em Part 5: se a lacuna está antes de um particípio/adjetivo e depois de artigo/verbo → advérbio.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":33,"t":"G23 — Comparatives e superlatives","b":"**Quando você estuda:** Sáb 21/11 (exercício B)\n**Onde aprofundar (British Council):** procure **“Comparatives and superlatives”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Adjetivos curtos: -er/-est (cheaper, the cheapest). Longos: more/most + adjetivo (more expensive, the most expensive).\n- Irregulares: good–better–best, bad–worse–worst, far–farther/further–farthest/furthest.\n- Estruturas: as + adj + as · than · the + superlativo (+ in/of) · the + comparativo, the + comparativo (The sooner, the better).\n\n### Interferência do português (onde você costuma errar)\n- Nunca duplique: 'more taller' ✗ → 'taller'.\n\n### Como cai no TOEIC\n- Part 5/7: 'the most (efficient)', 'more (efficiently) than', 'as (soon) as possible'.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":34,"t":"G24 — Modals: ability, permission, advice","b":"**Quando você estuda:** Dom/Sáb 22/11 (revisão C)\n**Onde aprofundar (British Council):** procure **“Modal verbs: can / could / should”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- can/could/be able to = habilidade; can/could/may = permissão ('May I sit here?'); should/ought to/had better = conselho.\n- Modais + verbo BASE, sem -s, sem 'to' (exceto ought to): 'She can speak...'.\n- Negativas: can't/cannot, couldn't, shouldn't. Pergunta: inversão (Can you help?).\n\n### Interferência do português (onde você costuma errar)\n- 'Ele pode falar' → 'He can speak' (sem 'to', sem -s).\n\n### Como cai no TOEIC\n- Part 2/3: pedidos e sugestões 'Could you...?', 'Should we...?', 'Why don't we...?' — responda pelo sentido.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":35,"t":"G25 — Modals: obligation e necessity","b":"**Quando você estuda:** Ter 24/11 (estudo+exercício A)\n**Onde aprofundar (British Council):** procure **“Modal verbs: must / have to”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- must = obrigação forte/interna; have to = obrigação externa (regra); need to = necessário.\n- mustn't = PROIBIDO; don't have to = NÃO é necessário; needn't = não precisa.\n- Passado: had to (must não tem passado).\n\n### Interferência do português (onde você costuma errar)\n- 'Não precisa' ≠ 'proibido': 'You don't have to come' (opcional) × 'You mustn't park here' (proibido).\n\n### Como cai no TOEIC\n- Part 5/7: avisos e regulamentos: 'Employees must wear...', 'Visitors are required to...'\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":36,"t":"G26 — Modals: possibility e deduction","b":"**Quando você estuda:** Sáb 28/11 (exercício B)\n**Onde aprofundar (British Council):** procure **“Modal verbs: might / could / must / can't”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- may/might/could = possível (talvez); must = quase certo ('He must be tired'); can't = impossível/improvável ('That can't be right').\n- No passado: must have + particípio, might have, can't have: 'He must have forgotten.'\n- Negativa de possibilidade: might not (não 'mustn't').\n\n### Interferência do português (onde você costuma errar)\n- 'Deve ser' (dedução) → 'must be'; 'não pode ser' → 'can't be' (não 'mustn't be').\n\n### Como cai no TOEIC\n- Part 3/4: inferência — 'He must be the new manager' pede evidência no áudio, não só uma palavra.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":37,"t":"G27 — Gerunds e infinitives","b":"**Quando você estuda:** Dom/Sáb 29/11 (revisão C)\n**Onde aprofundar (British Council):** procure **“Gerunds and infinitives”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- + gerúndio: enjoy, avoid, finish, consider, suggest, keep, mind, admit, postpone, practice, deny.\n- + infinitivo: want, need, decide, plan, hope, agree, refuse, expect, manage, afford, learn, promise.\n- Preposição + gerúndio: interested in working, look forward to meeting, be used to working, in addition to working.\n- stop doing (parar de fazer) × stop to do (parar para fazer); remember/forget doing × to do.\n\n### Interferência do português (onde você costuma errar)\n- 'Estou ansioso para te ver' → 'I look forward to SEEING you' (to é preposição).\n\n### Como cai no TOEIC\n- Part 5: 'The firm plans (to expand)', 'suggested (extending)', 'is committed to (improving)'.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":38,"t":"G28 — Verb patterns e complementos","b":"**Quando você estuda:** Ter 01/12 (estudo+exercício A)\n**Onde aprofundar (British Council):** procure **“Verb patterns”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- verbo + objeto + to: want/ask/tell/allow/expect/remind/advise someone TO do.\n- make/let + objeto + base (sem to): 'She let me leave.'\n- say/think/believe/suggest + (that) + oração.\n- give/send/show + pessoa + coisa OU coisa + to + pessoa. explain/suggest/describe NÃO aceitam pessoa direta: 'explain the plan TO me'.\n\n### Interferência do português (onde você costuma errar)\n- 'Ele me explicou' ✗ 'explained me' → 'explained it to me'.\n\n### Como cai no TOEIC\n- Part 5: 'allowed employees TO work', 'enabled us TO reduce', 'requires visitors TO sign in'.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":39,"t":"G29 — Passive voice: base","b":"**Quando você estuda:** Sáb 05/12 (exercício B)\n**Onde aprofundar (British Council):** procure **“Passive voice”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- be + particípio: 'The report was sent yesterday.' Use quando o agente é desconhecido/irrelevante ou o foco é a ação.\n- Tempos: is done, was done, will be done, has been done, is being done, must be done.\n- by + agente é opcional. Só verbos transitivos: 'was happened' ✗ (happen é intransitivo).\n\n### Interferência do português (onde você costuma errar)\n- 'Foi enviado' → 'was sent'; 'Vende-se' → 'is sold'/'for sale'.\n\n### Como cai no TOEIC\n- Part 5: se depois da lacuna há objeto → voz ativa; se não há e o sujeito recebe a ação → passiva.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":40,"t":"G30 — Passive voice: advanced e reporting","b":"**Quando você estuda:** Dom/Sáb 06/12 (revisão C)\n**Onde aprofundar (British Council):** procure **“Passive voice: advanced”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Passiva com modais: must be signed, can be found, should be reviewed.\n- Verbos com 2 objetos: 'I was given a badge.' (pessoa como sujeito é mais natural).\n- Reporting: It is said/believed/expected that... · He is said to be...\n- have/get + objeto + particípio = mandar fazer: 'We had the printer repaired.'\n\n### Interferência do português (onde você costuma errar)\n- Português usa 'se' ('Diz-se que...'); inglês: 'It is said that...' / 'He is said to...'.\n\n### Como cai no TOEIC\n- Part 5/6: 'be expected to', 'be required to', 'be scheduled to', 'must be submitted by...'.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":41,"t":"G31 — Relative clauses: defining","b":"**Quando você estuda:** Ter 08/12 (estudo+exercício A)\n**Onde aprofundar (British Council):** procure **“Relative clauses: defining”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- who (pessoas) · which (coisas) · that (pessoas/coisas) · whose (posse) · where (lugar) · when (tempo).\n- Sem vírgulas: informação essencial: 'The man who called is here.'\n- Pronome objeto pode ser omitido: 'The report (that) I wrote is ready.'\n- Preposição no fim: 'the company (that) I work for' ou formal 'the company for which I work'.\n\n### Interferência do português (onde você costuma errar)\n- Não use 'what' como relativo: 'the report THAT I wrote' (não 'what').\n\n### Como cai no TOEIC\n- Part 5/6: escolher who/which/whose/where — identifique o antecedente (pessoa? coisa? posse?).\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":42,"t":"G32 — Relative clauses: non-defining","b":"**Quando você estuda:** Sáb 12/12 (exercício B)\n**Onde aprofundar (British Council):** procure **“Relative clauses: non-defining”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Entre vírgulas, informação extra (pode sair sem quebrar a frase): 'Mr. Lee, who runs the team, is away.'\n- which pode se referir à oração inteira: 'The train was late, which annoyed everyone.'\n- Não use that e não omita o pronome.\n\n### Interferência do português (onde você costuma errar)\n- Português usa 'que' para tudo; em inglês a vírgula e who/which são obrigatórios nas não-restritivas.\n\n### Como cai no TOEIC\n- Part 5/6/7: a informação entre vírgulas costuma ser distrator — ache o verbo principal fora das vírgulas.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":43,"t":"G33 — Conditionals 0 e 1","b":"**Quando você estuda:** Dom/Sáb 12/12 (revisão C)\n**Onde aprofundar (British Council):** procure **“Conditionals: zero and first”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Zero: If + presente, presente (fatos): 'If you heat ice, it melts.'\n- First: If + presente, will + base (possibilidade real): 'If it rains, we'll cancel.'\n- unless = if not. Nunca use will na cláusula if. Também: imperativo/modal no resultado ('If you need help, call me.').\n\n### Interferência do português (onde você costuma errar)\n- Português usa futuro do subjuntivo ('se chover'); inglês: presente ('if it rains').\n\n### Como cai no TOEIC\n- Part 5: 'If the shipment (arrives / will arrive) late, we will...' → arrives.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":44,"t":"G34 — Second conditional","b":"**Quando você estuda:** Ter 15/12 (estudo+exercício A)\n**Onde aprofundar (British Council):** procure **“Second conditional”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- If + past simple, would + base: situação irreal/improvável no presente ou futuro: 'If I had more time, I would study more.'\n- Use 'were' para todas as pessoas em registro formal: 'If I were you, I'd ...'.\n- Pergunta: 'What would you do if you won?' could/might podem substituir would.\n\n### Interferência do português (onde você costuma errar)\n- Não use 'would' na cláusula if: 'If I HAD time' (não 'If I would have time').\n\n### Como cai no TOEIC\n- Part 5/6: 'If the company (had / would have) more staff, it (would expand / expands)'.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":45,"t":"G35 — Third e mixed conditionals","b":"**Quando você estuda:** Sáb 19/12 (exercício B)\n**Onde aprofundar (British Council):** procure **“Third and mixed conditionals”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Third: If + past perfect, would have + particípio: passado irreal — 'If I had left earlier, I wouldn't have missed the train.'\n- Mixed (passado → presente): 'If I had studied, I would have a better job now.'\n- Mixed (presente → passado): 'If she were careful, she wouldn't have made that mistake.'\n\n### Interferência do português (onde você costuma errar)\n- 'Se eu tivesse sabido, teria ligado' → 'If I HAD KNOWN, I WOULD HAVE CALLED'.\n\n### Como cai no TOEIC\n- Part 5/6: 'Had we known...' (inversão formal) = 'If we had known...'.\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":46,"t":"G36 — Reported speech","b":"**Quando você estuda:** Dom/Sáb 20/12 (revisão C)\n**Onde aprofundar (British Council):** procure **“Reported speech”** em https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2 (nível B1–B2) ou https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2 (A1–A2); referência geral: https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference.\n\n### Regra\n- Recuo de tempo: present → past (work → worked); will → would; can → could; present perfect → past perfect.\n- Marcadores: today → that day; tomorrow → the next day; here → there; this → that.\n- say (that) / tell someone (that). Perguntas: asked IF/whether + ordem afirmativa. Ordens: told/asked + pessoa + (not) to.\n\n### Interferência do português (onde você costuma errar)\n- 'Ele disse que ia' → 'He said he WOULD'; 'perguntou se' → 'asked if'.\n\n### Como cai no TOEIC\n- Part 3/4 (áudio): a fala reportada aparece nas perguntas: 'What does the woman say she will do?'\n\n### Como estudar este tópico\n1. Leia esta página em voz alta (5 min). 2. Resolva o **exercício A** (6 itens) no dia marcado; 3. Corrija os erros e escreva 1 regra por erro no Error Log (p. 158). 4. No sábado, **exercício B** (4 correções) + 2 frases de produção. 5. No domingo, refaça só os itens que errou.","d":null,"k":"ref"},{"n":47,"t":"G37 — Indirect questions","b":"**Quando você estuda:** Ter 22/12 (estudo+exercício A)\n**Onde aprofundar (British Council):** procu
